\/thead>\n<tbody>\n<tr>\n<td>学习原理、小深度 FIFO、单时钟<\/td>\n<td>纯 RTL（本节代码）<\/td>\n<\/tr>\n<tr>\n<td>产品级、大深度、异步、要 FWFT/标志齐全<\/td>\n<td>Vivado IP：Block Memory Generator、FIFO Generator<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<p><strong>何时必须用 IP<\/strong>：深度大、要精确的可编程 almost 阈值、FWFT(First-Word Fall-Through)、标准复位时序、或综合器没把数组推断成 BRAM 时。纯 RTL 异步 FIFO 在工程上可用，但产品级建议直接调 IP 并让 Vivado 做 CDC 检查。<\/p>\n<h2>五、Vivado IP 调用步骤（可照做）<\/h2>\n<h3>Block Memory Generator (PG058)<\/h3>\n<ol>\n<li>IP Catalog 搜 <code>Block Memory Generator<\/code>，双击。<\/li>\n<li><strong>Basic<\/strong> 页：Interface Type 选 <code>Native<\/code>；Memory Type 选 <code>Simple Dual Port RAM<\/code>（一只写一只读）；Write Width/Read Width 填数据位宽；Depth 填深度。<\/li>\n<li><strong>Port A 写 / Port B 读<\/strong>页：使能、复位、输出寄存器按需勾选；Operating Mode 保持 \"Write First\"/\"Read First\"。<\/li>\n<li>OK → Generate，例化模板里端口典型为 <code>clka/addina/dina/ena/wea<\/code> 与 <code>clkb/addinb/doutb<\/code>。<\/li>\n<\/ol>\n<h3>FIFO Generator (PG057)<\/h3>\n<ol>\n<li>IP Catalog 搜 <code>FIFO Generator<\/code>。<\/li>\n<li><strong>Native<\/strong> 页：FIFO Implementation 选 <code>Independent Clocks - Block RAM<\/code>（异步 FIFO）；Read Mode 选 Standard / FWFT。<\/li>\n<li>填 Write Width/Depth；勾选必要标志位 <code>Full/Empty/Almost_Full/Almost_Empty/Data_Count<\/code>。<\/li>\n<li>OK → Generate。异步 FIFO 的端口分两组：写组 <code>wr_clk/wr_en/din/full<\/code>，读组 <code>rd_clk/rd_en/dout/empty<\/code>。<\/li>\n<\/ol>\n<h3>上板注意<\/h3>\n<ul>\n<li>IP 会自动生成约束（generated clock 等），一般不用手写；综合后跑 <code>report_clocks<\/code> 和 <code>report_cdc<\/code> 检查跨域。<\/li>\n<li>本仓库 <code>sfifo.v/afifo.v<\/code> 是<strong>纯 RTL 行为模型<\/strong>，可仿真可综合；上板大容量/产品级设计建议替换为上述 IP。<\/li>\n<\/ul>\n<h2>六、官方手册（已核实，访问日期 2026-10-10）<\/h2>\n<ul>\n<li><strong>PG058 Block Memory Generator Product Guide (v8.4)<\/strong>：https://docs.amd.com/v/u/en-US/pg058-blk-mem-gen （产品页：https://www.amd.com/en/products/adaptive-socs-and-fpgas/intellectual-property/block_memory_generator.html ）<\/li>\n<li><strong>PG057 FIFO Generator Product Guide (v13.2)<\/strong>：https://docs.amd.com/v/u/en-US/pg057-fifo-generator （产品页：https://www.amd.com/en/products/adaptive-socs-and-fpgas/intellectual-property/fifo_generator.html ）<\/li>\n<li>跨域时序约束相关见 4.3 的 <strong>UG903<\/strong>。<\/li>\n<\/ul>"}, {"chapterId": "4.3", "phase": 4, "slug": "timing-constraints", "title": "时序约束与分析", "summary": "建立/保持时间、时钟抖动、reg-to-reg 路径与 slack 公式；XDC 约束(create_clock/generated_clock/input_output_delay/false_path/multicycle/clock_groups)；Timing Summary(WNS/TNS/WHS/THS)与流水线等优化手段。", "doc": "docs/phase4/ch3-timing-constraints.md", "code": [{"file": "code/phase4/pipeline_demo.v", "type": "verilog", "role": "synthesizable", "title": "pipeline_demo.v — 无流水线 vs 三级流水线路径对比（参数化位宽）", "codeHtml": "//==============================================================================\n// pipeline_demo.v — 无流水线 vs 三级流水线：同一条运算路径的时序对比\n//------------------------------------------------------------------------------\n// 计算功能：f(a,b,c,d) = ((a + b) * c) + d\n//   * result_unpipe：整个 加-&gt;乘-&gt;加 组合链在一个时钟周期内完成，再寄存输出。\n//                    组合路径长，建立时间紧张，高频易失败。\n//   * result_pipe  ：在 加、乘、加 之间各插一级寄存器，把长路径切成三段，\n//                    每级只需满足一个短路径的建立时间；代价是多一拍延迟。\n// 参数化位宽 WIDTH。两者功能等价（流水线输出晚一拍），tb 校验一致性。\n//==============================================================================\nmodule pipeline_demo #(\n    parameter WIDTH = 8\n)(\n    // 端口位宽用数字字面量（与默认参数 WIDTH=8 一致）\n    input  wire              clk,\n    input  wire              rst_n,\n    input  wire [7:0]        a,\n    input  wire [7:0]        b,\n    input  wire [7:0]        c,\n    input  wire [7:0]        d,\n    output reg  [7:0]        result_unpipe,\n    output reg  [7:0]        result_pipe\n);\n\n    // ---- 无流水线：长组合链，单周期完成 ----\n    always @(posedge clk or negedge rst_n) begin\n        if (!rst_n)\n            result_unpipe &lt;= {WIDTH{1&#x27;b0}};\n        else\n            result_unpipe &lt;= ((a + b) * c) + d;\n    end\n\n    // ---- 三级流水线：逐级打拍，同时把 c/d 顺延对齐 ----\n    reg [WIDTH-1:0] s1;     // 第一级：a+b\n    reg [WIDTH-1:0] c_r1;    // c 延迟一拍对齐\n    reg [WIDTH-1:0] s2;     // 第二级：s1 * c\n    reg [WIDTH-1:0] d_r1;   // d 延迟两拍对齐到最后一级\n    reg [WIDTH-1:0] d_r2;\n\n    always @(posedge clk or negedge rst_n) begin\n        if (!rst_n) begin\n            s1    &lt;= {WIDTH{1&#x27;b0}};\n            c_r1  &lt;= {WIDTH{1&#x27;b0}};\n            s2    &lt;= {WIDTH{1&#x27;b0}};\n            d_r1  &lt;= {WIDTH{1&#x27;b0}};\n            d_r2  &lt;= {WIDTH{1&#x27;b0}};\n            result_pipe &lt;= {WIDTH{1&#x27;b0}};\n        end else begin\n            s1    &lt;= a + b;\n            c_r1  &lt;= c;\n            s2    &lt;= s1 * c_r1;\n            d_r1  &lt;= d;\n            d_r2  &lt;= d_r1;\n            result_pipe &lt;= s2 + d_r2;\n        end\n    end\n\nendmodule\n"}, {"file": "code/phase4/tb_pipeline_demo.v", "type": "verilog", "role": "testbench", "title": "tb_pipeline_demo.v — 校验两路径功能等价", "codeHtml": "//==============================================================================\n// tb_pipeline_demo.v — 校验无流水线与三级流水线功能等价\n//------------------------------------------------------------------------------\n// 喂入一组序列，比较：\n//   result_unpipe 应等于当拍的 f(a,b,c,d)；\n//   result_pipe   应等于晚一拍的 f(a,b,c,d)（流水线多一拍延迟）。\n//==============================================================================\n`timescale 1ns/1ps\nmodule tb_pipeline_demo;\n\n    reg              clk;\n    reg              rst_n;\n    reg  [7:0]       a, b, c, d;\n    wire [7:0]       result_unpipe, result_pipe;\n\n    initial clk = 1&#x27;b0;\n    always #5 clk = ~clk;\n\n    pipeline_demo #(.WIDTH(8)) dut (\n        .clk(clk), .rst_n(rst_n),\n        .a(a), .b(b), .c(c), .d(d),\n        .result_unpipe(result_unpipe),\n        .result_pipe(result_pipe)\n    );\n\n    integer i;\n    integer errors;\n    reg [7:0] expect0;   // 当拍 f\n    reg [7:0] expect1;   // 延迟一拍的 f，用于对齐 result_pipe\n\n    initial begin\n        rst_n = 1&#x27;b0;\n        a = 8&#x27;d0; b = 8&#x27;d0; c = 8&#x27;d1; d = 8&#x27;d0;\n        errors = 0;\n        expect0 = 8&#x27;d0; expect1 = 8&#x27;d0;\n        #23;\n        rst_n = 1&#x27;b1;\n    end\n\n    // 每拍给输入并更新期望值\n    always @(posedge clk or negedge rst_n) begin\n        if (!rst_n) begin\n            a &lt;= 8&#x27;d0; b &lt;= 8&#x27;d0; c &lt;= 8&#x27;d2; d &lt;= 8&#x27;d0;\n        end else begin\n            a &lt;= a + 8&#x27;d1;\n            b &lt;= b + 8&#x27;d1;\n            c &lt;= 8&#x27;d2;\n            d &lt;= d + 8&#x27;d1;\n        end\n    end\n\n    // 自检\n    always @(posedge clk or negedge rst_n) begin\n        if (rst_n) begin\n            // 当拍期望（用当前输入）\n            expect0 &lt;= ((a + b) * c) + d;\n            // 流水线晚一拍：上一拍 expect0\n            expect1 &lt;= expect0;\n            // 第 4 拍起开始比较（等流水线填满）\n            if (errors &gt;= 0 &amp;&amp; expect1 != 8&#x27;d0) begin\n                if (result_unpipe !== expect0) errors &lt;= errors + 1;\n                if (result_pipe   !== expect1) errors &lt;= errors + 1;\n            end\n        end\n    end\n\n    initial begin\n        #300;\n        $display(&quot;---- tb_pipeline_demo ----&quot;);\n        $display(&quot;result_unpipe=%0d result_pipe=%0d errors=%0d&quot;,\n                 result_unpipe, result_pipe, errors);\n        if (errors == 0)\n            $display(&quot;TB_PIPELINE: PASS (两路径功能等价)&quot;);\n        else\n            $display(&quot;TB_PIPELINE: FAIL&quot;);\n        $finish;\n    end\n\nendmodule\n"}, {"file": "code/phase4/ch3_timing_example.xdc", "type": "verilog", "role": "synthesizable", "title": "ch3_timing_example.xdc — 注释示例约束（50MHz/20ns，IO 占位）", "codeHtml": "# =============================================================================\n# ch3_timing_example.xdc — 4.3 时序约束示例（通用模板，引脚为占位）\n# -----------------------------------------------------------------------------\n# 说明：\n#   * 本文件是&quot;怎么写约束&quot;的示例，真实引脚请按你的开发板修改，\n#     并复用 code/common/fpga_common.xdc 里的引脚/电平约束。\n#   * 时钟周期按通用 50MHz = 20ns 示例。\n#   * 本文件不编造任何板卡引脚号；PACKAGE_PIN 用占位 &lt;PIN_*&gt;，上板前替换。\n# 参考手册：UG903 Vivado Using Constraints（见章节文档链接）。\n# =============================================================================\n\n# ---------------------------------------------------------------------------\n# 1) 主时钟约束（create_clock）——最基本、必写\n#    板载 50MHz 晶振接在 clk_in1 引脚，周期 20ns。\n# ---------------------------------------------------------------------------\ncreate_clock -period 20.000 -name clk_in1 [get_ports clk_in1]\n\n# 对应引脚与电平（占位；实际按板子填，通常已在 fpga_common.xdc 里）：\nset_property PACKAGE_PIN &lt;PIN_CLK&gt;      [get_ports clk_in1]\nset_property IOSTANDARD LVCMOS33        [get_ports clk_in1]\n\n# ---------------------------------------------------------------------------\n# 2) 生成时钟（create_generated_clock）\n#    若用 MMCM/PLL IP，IP 一般自动生成；此处手写示例：\n#    假设 clk_mmcm_out 是由 clk_in1 经 MMCM 倍频 2 倍得到的 100MHz。\n#    真实工程里用 Clocking Wizard IP 后无需手写，综合后 report_clocks 查看。\n# ---------------------------------------------------------------------------\n# create_generated_clock -name clk_100m -source [get_pins mmcm_inst/CLKIN1] \\\n#     -multiply_by 2 [get_pins mmcm_inst/CLKOUT0]\n\n# ---------------------------------------------------------------------------\n# 3) 输入/输出延迟（set_input_delay / set_output_delay）\n#    描述相对时钟，外部器件数据到达/要求稳定的时间，单位 ns。\n# ---------------------------------------------------------------------------\n# 输入：相对 clk_in1，外部数据在时钟沿前后 3ns 内有效\nset_input_delay  -clock clk_in1 3.0 [get_ports data_in*]\n# 输出：要求数据相对时钟沿偏移最大 2ns 送出\nset_output_delay -clock clk_in1 2.0 [get_ports {led* data_out*}]\n\n# 输出引脚/电平占位（按板子替换）：\nset_property PACKAGE_PIN &lt;PIN_LED0&gt; [get_ports {led*}]\nset_property IOSTANDARD LVCMOS33   [get_ports {led*}]\n\n# ---------------------------------------------------------------------------\n# 4) 时序例外约束（timing exceptions）\n#    set_false_path：绝对不需要检查时序的路径（如异步复位、跨 CDC 的格雷码外的慢信号）\n#    set_multicycle_path：需要多个时钟周期才能到达的路径\n#    set_clock_groups：两个完全异步、互不交互的时钟组，工具不分析它们之间的路径\n# ---------------------------------------------------------------------------\n# 异步复位引脚：不必做 reg-to-reg 建立/保持检查\nset_false_path -from [get_ports rst_n]\n\n# 两个异步时钟域之间本来就用异步 FIFO 处理；\n# 若确认两组时钟完全异步且无直接交互，可声明互斥时钟组（谨慎使用）：\n# set_clock_groups -asynchronous -group {clk_in1} -group {clk_other}\n\n# 一个慢使能触发的路径允许 2 个周期（多周期路径）：\n# set_multicycle_path 2 -setup -from [get_pins en_reg/C] -to [get_pins data_reg/D]\n\n# =============================================================================\n# 上板流程提示：\n#   1. 先写 create_clock（主时钟），这是时序分析的根；没它 Vivado 不分析 reg-to-reg。\n#   2. 跑完 Synthesis + Implementation，看 Timing Summary：\n#      WNS(建立裕量)、TNS、WHS(保持裕量)、THS，全部为 0 或正 = 收敛。\n#   3. 若 WNS 为负：按 4.3 文档优化（流水线/降逻辑层级/复制高扇出/约束 IO）。\n# =============================================================================\n"}], "diagrams": [{"file": "assets/phase4/setup_hold_window.svg", "title": "建立/保持时间窗", "caption": "数据须在采样沿前 setup、沿后 hold 保持稳定。", "svgRaw": "<svg xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"0 0 900 320\" font-family=\"Consolas,Menlo,monospace\">\n  <rect width=\"900\" height=\"320\" fill=\"#0d1420\"/>\n  <text x=\"20\" y=\"30\" fill=\"#22d3ee\" font-size=\"18\" font-weight=\"bold\">建立时间 setup / 保持时间 hold 时间窗<\/text>\n\n  <!-- clock edge -->\n  <line x1=\"200\" y1=\"60\" x2=\"200\" y2=\"260\" stroke=\"#fbbf24\" stroke-width=\"2\"/>\n  <text x=\"185\" y=\"55\" fill=\"#fbbf24\" font-size=\"13\">采样沿<\/text>\n\n  <!-- data line -->\n  <line x1=\"60\" y1=\"180\" x2=\"840\" y2=\"180\" stroke=\"#34d399\" stroke-width=\"2\"/>\n  <text x=\"700\" y=\"172\" fill=\"#34d399\" font-size=\"13\">数据 D<\/text>\n\n  <!-- setup window: before edge -->\n  <rect x=\"110\" y=\"150\" width=\"90\" height=\"60\" fill=\"#3b2a10\" stroke=\"#fbbf24\"/>\n  <text x=\"112\" y=\"140\" fill=\"#fbbf24\" font-size=\"12\">建立时间 setup（沿前必须稳定）<\/text>\n  <line x1=\"110\" y1=\"120\" x2=\"200\" y2=\"120\" stroke=\"#fbbf24\" stroke-width=\"1\" marker-start=\"url(#s)\" marker-end=\"url(#s)\"/>\n\n  <!-- hold window: after edge -->\n  <rect x=\"200\" y=\"150\" width=\"80\" height=\"60\" fill=\"#2a1030\" stroke=\"#a78bfa\"/>\n  <text x=\"205\" y=\"235\" fill=\"#a78bfa\" font-size=\"12\">保持时间 hold（沿后必须继续稳定）<\/text>\n  <line x1=\"200\" y1=\"120\" x2=\"280\" y2=\"120\" stroke=\"#a78bfa\" stroke-width=\"1\" marker-start=\"url(#s)\" marker-end=\"url(#s)\"/>\n\n  <text x=\"60\" y=\"285\" fill=\"#94a3b8\" font-size=\"12\">数据必须在采样沿前 setup 时间就稳定、沿后再保持 hold 时间不变，触发器才能正确采样。<\/text>\n  <text x=\"60\" y=\"305\" fill=\"#94a3b8\" font-size=\"12\">违反 setup：数据到太晚；违反 hold：数据变太早——两者都导致采样错误。<\/text>\n\n  <defs>\n    <marker id=\"s\" markerWidth=\"8\" markerHeight=\"8\" refX=\"4\" refY=\"4\" orient=\"auto\">\n      <path d=\"M8,0 L0,4 L8,8\" fill=\"none\" stroke=\"#cbd5e1\"/>\n    <\/marker>\n  <\/defs>\n<\/svg>\n"}, {"file": "assets/phase4/reg_to_reg_slack.svg", "title": "reg-to-reg 路径与 slack", "caption": "launch/capture 沿间隔一个周期，slack = T - 逻辑-走线-setup-抖动。", "svgRaw": "<svg xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"0 0 900 360\" font-family=\"Consolas,Menlo,monospace\">\n  <rect width=\"900\" height=\"360\" fill=\"#0d1420\"/>\n  <text x=\"20\" y=\"30\" fill=\"#22d3ee\" font-size=\"18\" font-weight=\"bold\">reg-to-reg 路径与 slack 计算<\/text>\n\n  <!-- launch flop -->\n  <rect x=\"40\" y=\"120\" width=\"150\" height=\"80\" rx=\"6\" fill=\"#10233a\" stroke=\"#22d3ee\" stroke-width=\"1.5\"/>\n  <text x=\"70\" y=\"150\" fill=\"#e2e8f0\" font-size=\"13\">发送触发器<\/text>\n  <text x=\"60\" y=\"175\" fill=\"#94a3b8\" font-size=\"11\">launch 沿发出数据<\/text>\n\n  <!-- comb logic -->\n  <rect x=\"260\" y=\"130\" width=\"280\" height=\"60\" rx=\"6\" fill=\"#16233a\" stroke=\"#fbbf24\" stroke-width=\"1.5\"/>\n  <text x=\"300\" y=\"165\" fill=\"#e2e8f0\" font-size=\"13\">组合逻辑（延迟 t_logic）<\/text>\n\n  <!-- capture flop -->\n  <rect x=\"610\" y=\"120\" width=\"150\" height=\"80\" rx=\"6\" fill=\"#102a1a\" stroke=\"#34d399\" stroke-width=\"1.5\"/>\n  <text x=\"640\" y=\"150\" fill=\"#e2e8f0\" font-size=\"13\">捕获触发器<\/text>\n  <text x=\"630\" y=\"175\" fill=\"#94a3b8\" font-size=\"11\">capture 沿采样<\/text>\n\n  <line x1=\"190\" y1=\"160\" x2=\"260\" y2=\"160\" stroke=\"#cbd5e1\" stroke-width=\"1.5\" marker-end=\"url(#r)\"/>\n  <line x1=\"540\" y1=\"160\" x2=\"610\" y2=\"160\" stroke=\"#cbd5e1\" stroke-width=\"1.5\" marker-end=\"url(#r)\"/>\n\n  <!-- formula box -->\n  <rect x=\"40\" y=\"230\" width=\"820\" height=\"110\" rx=\"6\" fill=\"#16233a\" stroke=\"#475569\"/>\n  <text x=\"60\" y=\"258\" fill=\"#e2e8f0\" font-size=\"13\">建立时间 slack：<\/text>\n  <text x=\"60\" y=\"282\" fill=\"#34d399\" font-size=\"13\">  slack_setup = T周期 - ( t_logic + t_net + t_setup + 时钟抖动 )<\/text>\n  <text x=\"60\" y=\"308\" fill=\"#e2e8f0\" font-size=\"13\">slack ≥ 0：时序收敛；slack &lt; 0（WNS 为负）：该路径太快到达或太慢，需优化。<\/text>\n  <text x=\"60\" y=\"328\" fill=\"#94a3b8\" font-size=\"11\">launch 沿 = 发出数据的时钟沿；capture 沿 = 下一个采样沿，两者间隔就是一个时钟周期 T。<\/text>\n\n  <defs>\n    <marker id=\"r\" markerWidth=\"8\" markerHeight=\"8\" refX=\"6\" refY=\"3\" orient=\"auto\">\n      <path d=\"M0,0 L6,3 L0,6 Z\" fill=\"#cbd5e1\"/>\n    <\/marker>\n  <\/defs>\n<\/svg>\n"}, {"file": "assets/phase4/pipeline_timing.svg", "title": "流水线改善时序", "caption": "插寄存器把长组合链切成短段，每段更易满足建立时间。", "svgRaw": "<svg xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"0 0 900 320\" font-family=\"Consolas,Menlo,monospace\">\n  <rect width=\"900\" height=\"320\" fill=\"#0d1420\"/>\n  <text x=\"20\" y=\"30\" fill=\"#22d3ee\" font-size=\"18\" font-weight=\"bold\">流水线如何改善时序<\/text>\n\n  <!-- unpipe -->\n  <text x=\"30\" y=\"70\" fill=\"#f87171\" font-size=\"13\" font-weight=\"bold\">无流水线：长组合路径在一个周期内走完<\/text>\n  <rect x=\"40\" y=\"90\" width=\"60\" height=\"40\" rx=\"4\" fill=\"#10233a\" stroke=\"#22d3ee\"/>\n  <text x=\"55\" y=\"115\" fill=\"#e2e8f0\" font-size=\"11\">reg<\/text>\n  <rect x=\"120\" y=\"90\" width=\"320\" height=\"40\" rx=\"4\" fill=\"#2a1010\" stroke=\"#f87171\"/>\n  <text x=\"180\" y=\"115\" fill=\"#e2e8f0\" font-size=\"12\">加→乘→加 整条链（太长，T 内走不完）<\/text>\n  <rect x=\"460\" y=\"90\" width=\"60\" height=\"40\" rx=\"4\" fill=\"#102a1a\" stroke=\"#34d399\"/>\n  <text x=\"475\" y=\"115\" fill=\"#e2e8f0\" font-size=\"11\">reg<\/text>\n\n  <!-- pipe -->\n  <text x=\"30\" y=\"180\" fill=\"#34d399\" font-size=\"13\" font-weight=\"bold\">三级流水线：插入寄存器把长路径切成三段<\/text>\n  <rect x=\"40\"  y=\"200\" width=\"60\" height=\"40\" rx=\"4\" fill=\"#10233a\" stroke=\"#22d3ee\"/>\n  <text x=\"55\" y=\"225\" fill=\"#e2e8f0\" font-size=\"11\">reg<\/text>\n  <rect x=\"120\" y=\"200\" width=\"90\" height=\"40\" rx=\"4\" fill=\"#10233a\" stroke=\"#fbbf24\"/>\n  <text x=\"135\" y=\"225\" fill=\"#e2e8f0\" font-size=\"11\">加<\/text>\n  <rect x=\"220\" y=\"200\" width=\"40\" height=\"40\" rx=\"4\" fill=\"#102a1a\" stroke=\"#34d399\"/>\n  <text x=\"228\" y=\"225\" fill=\"#e2e8f0\" font-size=\"11\">r<\/text>\n  <rect x=\"270\" y=\"200\" width=\"90\" height=\"40\" rx=\"4\" fill=\"#10233a\" stroke=\"#fbbf24\"/>\n  <text x=\"285\" y=\"225\" fill=\"#e2e8f0\" font-size=\"11\">乘<\/text>\n  <rect x=\"370\" y=\"200\" width=\"40\" height=\"40\" rx=\"4\" fill=\"#102a1a\" stroke=\"#34d399\"/>\n  <text x=\"378\" y=\"225\" fill=\"#e2e8f0\" font-size=\"11\">r<\/text>\n  <rect x=\"420\" y=\"200\" width=\"90\" height=\"40\" rx=\"4\" fill=\"#10233a\" stroke=\"#fbbf24\"/>\n  <text x=\"435\" y=\"225\" fill=\"#e2e8f0\" font-size=\"11\">加<\/text>\n  <rect x=\"520\" y=\"200\" width=\"60\" height=\"40\" rx=\"4\" fill=\"#102a1a\" stroke=\"#34d399\"/>\n  <text x=\"535\" y=\"225\" fill=\"#e2e8f0\" font-size=\"11\">reg<\/text>\n\n  <text x=\"30\" y=\"285\" fill=\"#94a3b8\" font-size=\"12\">每级组合延迟变短，更容易满足建立时间；代价是 latency（延迟）增加一拍，吞吐率不变。<\/text>\n  <text x=\"30\" y=\"305\" fill=\"#94a3b8\" font-size=\"12\">其它手段：降低逻辑层级、retiming、复制高扇出寄存器、约束 IO 延迟。<\/text>\n<\/svg>\n"}], "tools": [{"name": "UG903 Vivado Using Constraints (v2022.2)", "url": "https://docs.amd.com/v/u/en-US/ug903-vivado-using-constraints", "required": true, "note": "访问日期 2026-10-10；XDC 约束权威手册。"}, {"name": "UG938 Design Analysis and Closure Techniques (v2020.2)", "url": "https://www.xilinx.com/support/documents/sw_manuals/xilinx2020_2/ug938-vivado-design-analysis-closure-tutorial.pdf", "required": false, "note": "访问日期 2026-10-10。"}, {"name": "时序收敛专题导航 dh0006", "url": "https://www.xilinx.com/content/xilinx/en/support/documentation-navigation/design-hubs/dh0006-vivado-design-analysis-and-timing-closure-hub.html", "required": false, "note": "访问日期 2026-10-10。"}], "tasks": [{"id": "task-4-3-1", "text": "为已有设计添加主时钟约束（create_clock）"}, {"id": "task-4-3-2", "text": "查看时序报告，分析建立时间裕量 WNS"}], "cards": [{"q": "建立时间 setup 是什么？", "a": "采样时钟沿之前，数据必须提前稳定的最短时间；数据到太晚就违反建立时间。", "tags": ["时序", "setup"]}, {"q": "保持时间 hold 是什么？", "a": "采样时钟沿之后，数据必须继续保持稳定的最短时间；数据变太早就违反保持时间。", "tags": ["时序", "hold"]}, {"q": "reg-to-reg 路径的 launch 沿和 capture 沿指什么？", "a": "launch 沿是发送触发器发出数据的时钟沿，capture 沿是下一个采样沿；两者间隔一个时钟周期 T。", "tags": ["reg2reg"]}, {"q": "建立时间 slack 公式？", "a": "slack = T周期 - (t逻辑 + t走线 + t_setup + 时钟抖动)；≥0 收敛，<0 违规。", "tags": ["slack", "公式"]}, {"q": "50MHz 的 create_clock 怎么写？", "a": "create_clock -period 20.000 -name clk_in1 [get_ports clk_in1]；50MHz 周期=20ns。", "tags": ["XDC", "create_clock"]}, {"q": "没有主时钟约束会怎样？", "a": "Vivado 不做 reg-to-reg 时序分析，等于没有时序目标，结果不可信。create_clock 是最基本必写约束。", "tags": ["XDC", "基础"]}, {"q": "WNS/TNS/WHS/THS 分别是什么？", "a": "WNS 最坏建立裕量、TNS 全部建立违规之和、WHS 最坏保持裕量、THS 全部保持违规之和；四项都 ≥0 即时序收敛。", "tags": ["时序报告"]}, {"q": "set_false_path 用于什么？", "a": "声明不需要做时序检查的路径，如异步复位引脚；避免工具对本就异步的路径误报。", "tags": ["XDC", "例外"]}, {"q": "set_clock_groups 什么时候用？", "a": "两个完全异步、互不交互的时钟组，告诉工具不分析它们之间的路径（异步 FIFO 两边常用）。", "tags": ["XDC", "跨时钟域"]}, {"q": "流水线为什么能改善时序？", "a": "在长组合链中插寄存器，把一条长路径切成多段短路径，每段延迟变短、更易满足建立时间；代价是延迟增加一拍，吞吐率不变。", "tags": ["流水线", "优化"]}], "quiz": [{"q": "数据必须在时钟沿前稳定的时间叫？", "options": ["保持时间", "建立时间", "延迟", "偏斜"], "answer": 1, "explain": "沿前提前稳定是 setup 建立时间。"}, {"q": "建立时间 slack < 0 表示？", "options": ["时序收敛", "该路径周期内走不完，需优化", "保持时间违规", "无影响"], "answer": 1, "explain": "slack 为负即 WNS 负，时序未收敛。"}, {"q": "50MHz 时钟的 create_clock 周期是？", "options": ["5ns", "10ns", "20ns", "50ns"], "answer": 2, "explain": "1/50MHz=20ns。"}, {"q": "时序收敛时 WNS 应？", "options": ["<0", "≥0", "等于 1", "任意值"], "answer": 1, "explain": "WNS/TNS/WHS/THS 全部 ≥0 才收敛。"}], "docHtml": "<h1>4.3 时序约束与分析<\/h1>\n<p>代码写对、能仿真，不代表上板能跑到目标频率。FPGA 里数据要在一个时钟周期内从一个触发器传到下一个触发器，晚到一点点就会采错。<strong>时序约束 (XDC)<\/strong> 就是告诉工具\"时钟多快、外部数据什么时候到\"，工具才能算出\"能不能跑稳\"。本节讲建立/保持时间、slack 公式、常用 XDC 约束，以及怎么读时序报告。<\/p>\n<h2>一、建立时间与保持时间<\/h2>\n<p>触发器要正确采样数据，数据必须在时钟沿前后保持稳定一段时间（见 <code>setup_hold_window.svg<\/code>）：<\/p>\n<ul>\n<li><strong>建立时间 setup<\/strong>：采样沿<strong>之前<\/strong>，数据必须提前稳定的时间。数据到太晚 → 违反建立时间。<\/li>\n<li><strong>保持时间 hold<\/strong>：采样沿<strong>之后<\/strong>，数据必须继续保持稳定的时间。数据变太早 → 违反保持时间。<\/li>\n<\/ul>\n<p><strong>时钟不确定性 (clock uncertainty / jitter)<\/strong>：时钟沿本身有抖动和偏斜，会\"吃掉\"一部分可用时间。<\/p>\n<h2>二、reg-to-reg 路径与 slack<\/h2>\n<p>最基本的时序路径是\"触发器到触发器\"（见 <code>reg_to_reg_slack.svg<\/code>）：<\/p>\n<ul>\n<li><strong>launch 沿<\/strong>：发送触发器发出数据的时钟沿。<\/li>\n<li><strong>capture 沿<\/strong>：捕获触发器采样的下一个时钟沿。<\/li>\n<li>两沿间隔 = 一个时钟周期 <code>T<\/code>。<\/li>\n<\/ul>\n<p>建立时间 slack（裕量）公式：<\/p>\n<pre><code>slack_setup = T周期 - ( t逻辑 + t走线 + t_setup + 时钟抖动 )\n<\/code><\/pre>\n<ul>\n<li><code>slack ≥ 0<\/code>：时间够，时序收敛。<\/li>\n<li><code>slack &lt; 0<\/code>：该路径在一个周期内走不完，要优化。<\/li>\n<\/ul>\n<h2>三、常用 XDC 约束（见 <code>code/phase4/ch3_timing_example.xdc<\/code>）<\/h2>\n<h3>1. 主时钟 create_clock（必写）<\/h3>\n<pre><code class=\"language-xdc\">create_clock -period 20.000 -name clk_in1 [get_ports clk_in1]\n<\/code><\/pre>\n<p>50MHz → 周期 20ns。<strong>没有这条，Vivado 根本不做 reg-to-reg 时序分析<\/strong>。<\/p>\n<h3>2. 生成时钟 create_generated_clock<\/h3>\n<p>MMCM/PLL 输出的时钟由 IP 自动生成约束，一般不用手写；手写示例见 XDC 注释。综合后用 <code>report_clocks<\/code> 查看所有时钟及其关系。<\/p>\n<h3>3. 输入/输出延迟<\/h3>\n<pre><code class=\"language-xdc\">set_input_delay  -clock clk_in1 3.0 [get_ports data_in*]   ;# 外部数据相对时钟沿偏移\nset_output_delay -clock clk_in1 2.0 [get_ports {led*}]\n<\/code><\/pre>\n<p>告诉工具外部器件数据什么时候到、要求什么时候送出，工具才能算 IO 路径。<\/p>\n<h3>4. 时序例外<\/h3>\n<ul>\n<li><strong>set_false_path<\/strong>：不需要检查时序的路径，如异步复位引脚。<\/li>\n<li><strong>set_multicycle_path<\/strong>：允许多个周期到达的路径（如慢使能触发的逻辑）。<\/li>\n<li><strong>set_clock_groups<\/strong>：完全异步、互不交互的时钟组，工具不分析它们之间的路径（异步 FIFO 两边常用）。<\/li>\n<\/ul>\n<h2>四、时序报告怎么读（Timing Summary）<\/h2>\n<p>跑完 Synthesis + Implementation 后，Vivado 的 Timing Summary 给四个关键数：<\/p>\n<table>\n<thead>\n<tr>\n<th>指标<\/th>\n<th>含义<\/th>\n<th>合格<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td><strong>WNS<\/strong> (Worst Negative Slack)<\/td>\n<td>最坏建立时间裕量<\/td>\n<td>≥ 0<\/td>\n<\/tr>\n<tr>\n<td><strong>TNS<\/strong> (Total Negative Slack)<\/td>\n<td>所有违规路径建立裕量之和<\/td>\n<td>≥ 0<\/td>\n<\/tr>\n<tr>\n<td><strong>WHS<\/strong> (Worst Hold Slack)<\/td>\n<td>最坏保持时间裕量<\/td>\n<td>≥ 0<\/td>\n<\/tr>\n<tr>\n<td><strong>THS<\/strong> (Total Hold Slack)<\/td>\n<td>所有违规路径保持裕量之和<\/td>\n<td>≥ 0<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<p>四项全部 ≥ 0（无红色）就是<strong>时序收敛<\/strong>。WNS 为负说明最快频率跑不到目标，要优化。<\/p>\n<h2>五、常见时序优化手段<\/h2>\n<p>见 <code>pipeline_timing.svg<\/code> 与本仓库 <code>pipeline_demo.v<\/code>：<\/p>\n<ol>\n<li><strong>流水线 (Pipelining)<\/strong>：在长组合链中间插寄存器，把长路径切成几段。本仓库 <code>pipeline_demo.v<\/code> 对比了 <code>((a+b)*c)+d<\/code> 的无流水线版和三级流水线版——每级延迟变短、易满足建立时间，代价是多一拍延迟。<\/li>\n<li><strong>降低逻辑层级<\/strong>：重写编码，减少一条路径上的 LUT 级数。<\/li>\n<li><strong>Retiming<\/strong>：让工具在寄存器间移动组合逻辑，平衡各路径延迟。<\/li>\n<li><strong>约束 IO<\/strong>：正确写 set_input_delay/set_output_delay。<\/li>\n<li><strong>复制高扇出逻辑<\/strong>：一个扇出极大的信号（如全局使能）复制多份，减少走线延迟。<\/li>\n<\/ol>\n<h2>六、本节代码<\/h2>\n<ul>\n<li><code>pipeline_demo.v<\/code>：参数化位宽，同一条运算路径的无流水线 vs 三级流水线实现；<code>tb_pipeline_demo.v<\/code> 校验两者功能等价（流水线晚一拍）。<\/li>\n<li><code>ch3_timing_example.xdc<\/code>：充分注释的约束示例，时钟按 50MHz=20ns，IO 用占位并引用 <code>code/common/fpga_common.xdc<\/code>，不编造引脚。<\/li>\n<\/ul>\n<blockquote>\n<p>⚠️ 时序报告必须在<strong>真实 Vivado 综合 + 布局布线<\/strong>后才有意义；本环境无 Vivado，无法真正跑 Timing Summary，以上 WNS/TNS 等指标需上板/装 Vivado 后验证。<\/p>\n<\/blockquote>\n<h2>七、官方手册（已核实，访问日期 2026-10-10）<\/h2>\n<ul>\n<li><strong>UG903 Vivado Design Suite User Guide: Using Constraints (v2022.2)<\/strong>：https://docs.amd.com/v/u/en-US/ug903-vivado-using-constraints （PDF：https://www.xilinx.com/support/documents/sw_manuals/xilinx2022_2/ug903-vivado-using-constraints.pdf ）<\/li>\n<li><strong>UG938 Design Analysis and Closure Techniques (v2020.2)<\/strong>：https://www.xilinx.com/support/documents/sw_manuals/xilinx2020_2/ug938-vivado-design-analysis-closure-tutorial.pdf<\/li>\n<li>时序收敛专题导航：https://www.xilinx.com/content/xilinx/en/support/documentation-navigation/design-hubs/dh0006-vivado-design-analysis-and-timing-closure-hub.html<\/li>\n<\/ul>"}, {"chapterId": "4.4", "phase": 4, "slug": "freq-meter", "title": "综合项目 · 数字频率计", "summary": "闸门法测频：1s 闸门内对被测脉冲计数得频率，±1 字误差，量程自动切 Hz/kHz/MHz，数码管动态扫描显示。", "doc": "docs/phase4/ch4-freq-meter.md", "code": [{"file": "code/phase4/ch4_gate_gen.v", "type": "verilog", "role": "synthesizable", "title": "ch4_gate_gen.v — 闸门发生器（可综合）", "codeHtml": "//============================================================================\n// ch4_gate_gen.v — 闸门发生器（可综合）\n//   由系统时钟（默认 50MHz）产生一个精确的闸门窗口：\n//     gate 高电平 GATE_TICKS 个时钟 -&gt; 闸门窗口，允许被测脉冲计数；\n//     随后 gate 低电平 HOLD_TICKS 个时钟 -&gt; 保持/显示期；\n//     如此循环。gate_done 在闸门落下的那一拍输出 1 拍脉冲，\n//   作为&quot;锁存 + 清零&quot;的触发。\n//   仿真加速：把 GATE_TICKS 改小（例如 100）即可把 1s 闸门压成几百纳秒。\n//============================================================================\nmodule ch4_gate_gen #(\n    parameter integer CLK_FREQ_HZ = 50_000_000,  // 系统时钟频率\n    parameter integer GATE_TICKS   = 50_000_000,  // 闸门高电平时钟数（默认 1s）\n    parameter integer HOLD_TICKS   = 5_000_000    // 闸门关闭后的保持时钟数（默认 0.1s）\n)(\n    input  wire clk,\n    input  wire rst_n,\n    output reg  gate,        // 闸门：高电平期间允许事件计数\n    output reg  gate_done    // 闸门结束的 1 拍脉冲\n);\n    localparam integer TOTAL = GATE_TICKS + HOLD_TICKS;\n\n    reg [31:0] cnt;\n\n    always @(posedge clk or negedge rst_n) begin\n        if (!rst_n) begin\n            cnt       &lt;= 32&#x27;d0;\n            gate      &lt;= 1&#x27;b0;\n            gate_done &lt;= 1&#x27;b0;\n        end else begin\n            gate_done &lt;= 1&#x27;b0;\n            if (cnt == TOTAL - 1)\n                cnt &lt;= 32&#x27;d0;\n            else\n                cnt &lt;= cnt + 1&#x27;b1;\n\n            gate      &lt;= (cnt &lt; GATE_TICKS);\n            // cnt 刚进入保持期（即闸门落下）的那一拍给出锁存脉冲\n            if (cnt == GATE_TICKS)\n                gate_done &lt;= 1&#x27;b1;\n        end\n    end\nendmodule\n"}, {"file": "code/phase4/tb_ch4_gate_gen.v", "type": "verilog", "role": "testbench", "title": "tb_ch4_gate_gen.v", "codeHtml": "// tb_ch4_gate_gen.v — 闸门发生器自检\n`timescale 1ns/1ps\nmodule tb_ch4_gate_gen;\n    reg clk = 0;\n    reg rst_n = 0;\n    wire gate;\n    wire gate_done;\n\n    // 把闸门压到 100 拍、保持 20 拍，加速仿真\n    ch4_gate_gen #(\n        .CLK_FREQ_HZ(50_000_000),\n        .GATE_TICKS(100),\n        .HOLD_TICKS(20)\n    ) u_dut (\n        .clk(clk), .rst_n(rst_n), .gate(gate), .gate_done(gate_done)\n    );\n\n    always #10 clk = ~clk;\n\n    integer high_cnt = 0;\n    integer done_cnt = 0;\n    integer i;\n    initial begin\n        rst_n = 0;\n        #55;\n        rst_n = 1;\n        // 跑约 2 个完整周期（120*2=240 拍）\n        for (i = 0; i &lt; 300; i = i + 1) begin\n            @(posedge clk);\n            if (gate) high_cnt = high_cnt + 1;\n            if (gate_done) done_cnt = done_cnt + 1;\n        end\n        // 每个周期 gate 应高 100 拍；跑了约 2.5 个周期，高电平计数应在 200~300\n        if (high_cnt &gt;= 200 &amp;&amp; high_cnt &lt;= 300)\n            $display(&quot;GATE_GEN OK: high_cnt=%0d&quot;, high_cnt);\n        else\n            $display(&quot;GATE_GEN FAIL: high_cnt=%0d&quot;, high_cnt);\n        // gate_done 每个周期 1 拍，应出现 2~3 次\n        if (done_cnt &gt;= 2 &amp;&amp; done_cnt &lt;= 3)\n            $display(&quot;GATE_GEN OK: done_cnt=%0d&quot;, done_cnt);\n        else\n            $display(&quot;GATE_GEN FAIL: done_cnt=%0d&quot;, done_cnt);\n        $finish;\n    end\nendmodule\n"}, {"file": "code/phase4/ch4_event_counter.v", "type": "verilog", "role": "synthesizable", "title": "ch4_event_counter.v — 闸门内事件计数/锁存（可综合）", "codeHtml": "//============================================================================\n// ch4_event_counter.v — 闸门内事件计数器（可综合）\n//   在 gate 高电平期间，对 sig_in 的上升沿计数。\n//   被测信号先经过 2 级触发器同步（跨时钟域基本处理），再做边沿检测。\n//   latch 脉冲把当前计数值打入 latched 寄存器；clr 脉冲清零。\n//\n//   说明（教学实现的精度边界）：\n//     本模块用系统时钟采样被测信号边沿，可综合、易仿真；\n//     对接近系统时钟频率（如 50MHz）的被测信号，采样法会丢边沿。\n//     工业级做法是用被测信号本身做异步计数器、闸门结束后再跨域读取，\n//     本仓库在 md 中给出思路，RTL 以教学可验证为准。\n//============================================================================\nmodule ch4_event_counter #(\n    parameter integer CNT_WIDTH = 27   // 2^27 ≈ 1.34e8 &gt; 50MHz×1s\n)(\n    input  wire                  clk,\n    input  wire                  rst_n,\n    input  wire                  sig_in,    // 被测方波\n    input  wire                  gate,      // 闸门：高电平期间允许计数\n    input  wire                  latch,     // 锁存脉冲：count -&gt; latched\n    input  wire                  clr,        // 清零脉冲\n    output reg  [26:0]         count,     // 当前计数值\n    output reg  [26:0]         latched,   // 锁存的上一次结果\n    output reg                  overflow  // 计满溢出标志\n);\n    reg sync1, sync2, sync3;\n    wire rise = sync2 &amp; ~sync3;   // 同步后的上升沿\n\n    // 2 拍同步 + 1 拍用于边沿检测\n    always @(posedge clk or negedge rst_n) begin\n        if (!rst_n) begin\n            sync1 &lt;= 1&#x27;b0;\n            sync2 &lt;= 1&#x27;b0;\n            sync3 &lt;= 1&#x27;b0;\n        end else begin\n            sync1 &lt;= sig_in;\n            sync2 &lt;= sync1;\n            sync3 &lt;= sync2;\n        end\n    end\n\n    always @(posedge clk or negedge rst_n) begin\n        if (!rst_n) begin\n            count    &lt;= {CNT_WIDTH{1&#x27;b0}};\n            latched  &lt;= {CNT_WIDTH{1&#x27;b0}};\n            overflow &lt;= 1&#x27;b0;\n        end else begin\n            if (clr) begin\n                count    &lt;= {CNT_WIDTH{1&#x27;b0}};\n                overflow &lt;= 1&#x27;b0;\n            end else if (gate &amp;&amp; rise) begin\n                if (count == {CNT_WIDTH{1&#x27;b1}})\n                    overflow &lt;= 1&#x27;b1;\n                else\n                    count &lt;= count + 1&#x27;b1;\n            end\n            if (latch)\n                latched &lt;= count;\n        end\n    end\nendmodule\n"}, {"file": "code/phase4/tb_ch4_event_counter.v", "type": "verilog", "role": "testbench", "title": "tb_ch4_event_counter.v", "codeHtml": "// tb_ch4_event_counter.v — 事件计数器自检：闸门内给定已知上升沿数，核对 count\n`timescale 1ns/1ps\nmodule tb_ch4_event_counter;\n    reg clk = 0;\n    reg rst_n = 0;\n    reg sig_in = 0;\n    reg gate = 0;\n    reg latch = 0;\n    reg clr = 0;\n    wire [26:0] count;\n    wire [26:0] latched;\n    wire overflow;\n\n    ch4_event_counter #(.CNT_WIDTH(27)) u_dut (\n        .clk(clk), .rst_n(rst_n), .sig_in(sig_in), .gate(gate),\n        .latch(latch), .clr(clr),\n        .count(count), .latched(latched), .overflow(overflow)\n    );\n\n    always #10 clk = ~clk;\n\n    integer edges = 0;\n    integer i;\n    reg [26:0] expect;\n    initial begin\n        rst_n = 0; sig_in = 0; gate = 0; latch = 0; clr = 0;\n        #55; rst_n = 1;\n        #20;\n\n        // 闸门打开期间，让 sig_in 产生 10 个上升沿\n        gate = 1;\n        for (i = 0; i &lt; 10; i = i + 1) begin\n            @(posedge clk);\n            sig_in = 1;\n            @(posedge clk);\n            sig_in = 0;\n        end\n        gate = 0;\n        #20;\n\n        // count 应约为 10（同步链路有 ±1~2 拍对齐误差）\n        if (count &gt;= 8 &amp;&amp; count &lt;= 12)\n            $display(&quot;EVENT_CNTR OK: count=%0d (expect~10)&quot;, count);\n        else\n            $display(&quot;EVENT_CNTR FAIL: count=%0d&quot;, count);\n\n        // latch 锁存\n        @(posedge clk); latch = 1; @(posedge clk); latch = 0;\n        if (latched == count)\n            $display(&quot;EVENT_CNTR OK: latched=%0d&quot;, latched);\n        else\n            $display(&quot;EVENT_CNTR FAIL: latched=%0d count=%0d&quot;, latched, count);\n\n        // clr 清零\n        @(posedge clk); clr = 1; @(posedge clk); clr = 0;\n        if (count == 27&#x27;d0)\n            $display(&quot;EVENT_CNTR OK: cleared&quot;);\n        else\n            $display(&quot;EVENT_CNTR FAIL: not cleared count=%0d&quot;, count);\n        $finish;\n    end\nendmodule\n"}, {"file": "code/phase4/ch4_freq_fsm.v", "type": "verilog", "role": "synthesizable", "title": "ch4_freq_fsm.v — 测量状态机+量程切换+BCD（可综合）", "codeHtml": "//============================================================================\n// ch4_freq_fsm.v — 测量控制状态机 + 量程/单位自动切换 + BCD 转换（可综合）\n//   状态：等闸门结束 -&gt; 锁存 raw_count -&gt; 清零计数器 -&gt; 保持显示。\n//   量程判定（1s 闸门时计数值 = 频率 Hz）：\n//       &gt;= 1_000_000  -&gt; MHz，数值除以 1_000_000\n//       &gt;= 1_000       -&gt; kHz，数值除以 1_000\n//       否则           -&gt; Hz\n//   再用双 dabble（double-dabble）把量程缩放后的整数转 6 位 BCD，\n//   供数码管动态扫描显示。\n//============================================================================\nmodule ch4_freq_fsm #(\n    parameter integer CNT_WIDTH = 27\n)(\n    input  wire                  clk,\n    input  wire                  rst_n,\n    input  wire                  gate_done,   // 闸门结束脉冲\n    input  wire [26:0]           raw_count,   // 事件计数器当前值\n    output reg                   latch,        // 给 event_counter 的锁存脉冲\n    output reg                   clr,           // 给 event_counter 的清零脉冲\n    output wire [26:0]           freq_value,   // 量程缩放后的频率整数\n    output wire [1:0]            unit_sel,     // 0=Hz, 1=kHz, 2=MHz\n    output wire [23:0]           bcd_digits,  // 6 位 BCD：[23:20]...[3:0]\n    output reg                   update_stb    // 新结果就绪脉冲\n);\n    localparam S_IDLE  = 2&#x27;d0;\n    localparam S_LATCH = 2&#x27;d1;\n    localparam S_CLR   = 2&#x27;d2;\n    localparam S_HOLD  = 2&#x27;d3;\n\n    reg [1:0] state;\n    reg [CNT_WIDTH-1:0] value;   // 锁存的原始计数（=频率 Hz）\n\n    // ---- 状态机：产生 latch / clr / update，并锁存 value ----\n    always @(posedge clk or negedge rst_n) begin\n        if (!rst_n) begin\n            state      &lt;= S_IDLE;\n            latch      &lt;= 1&#x27;b0;\n            clr        &lt;= 1&#x27;b0;\n            value      &lt;= {CNT_WIDTH{1&#x27;b0}};\n            update_stb &lt;= 1&#x27;b0;\n        end else begin\n            latch      &lt;= 1&#x27;b0;\n            clr        &lt;= 1&#x27;b0;\n            update_stb &lt;= 1&#x27;b0;\n            case (state)\n                S_IDLE:\n                    if (gate_done) state &lt;= S_LATCH;\n                S_LATCH: begin\n                    value      &lt;= raw_count;\n                    latch      &lt;= 1&#x27;b1;\n                    update_stb &lt;= 1&#x27;b1;\n                    state      &lt;= S_CLR;\n                end\n                S_CLR: begin\n                    clr   &lt;= 1&#x27;b1;\n                    state &lt;= S_HOLD;\n                end\n                S_HOLD:\n                    state &lt;= S_IDLE;   // 保持显示，等待下一次 gate_done\n                default: state &lt;= S_IDLE;\n            endcase\n        end\n    end\n\n    // ---- 量程/单位判定（组合逻辑，基于已锁存的 value）----\n    reg [1:0]           unit_r;\n    reg [CNT_WIDTH-1:0] scaled_r;\n    always @(*) begin\n        if (value &gt;= 27&#x27;d1_000_000) begin\n            unit_r   = 2&#x27;d2;\n            scaled_r = value / 27&#x27;d1_000_000;\n        end else if (value &gt;= 27&#x27;d1_000) begin\n            unit_r   = 2&#x27;d1;\n            scaled_r = value / 27&#x27;d1_000;\n        end else begin\n            unit_r   = 2&#x27;d0;\n            scaled_r = value;\n        end\n    end\n    assign unit_sel   = unit_r;\n    assign freq_value = scaled_r;\n\n    // ---- 双 dabble：二进制 -&gt; 6 位 BCD（组合逻辑）----\n    integer bi;\n    reg [23:0] bcd_tmp;\n    reg [CNT_WIDTH-1:0] bin_tmp;\n    always @(*) begin\n        bin_tmp = scaled_r;\n        bcd_tmp = 24&#x27;d0;\n        for (bi = 0; bi &lt; CNT_WIDTH; bi = bi + 1) begin\n            if (bcd_tmp[3:0]    &gt;= 4&#x27;d5) bcd_tmp[3:0]    = bcd_tmp[3:0]    + 4&#x27;d3;\n            if (bcd_tmp[7:4]    &gt;= 4&#x27;d5) bcd_tmp[7:4]    = bcd_tmp[7:4]    + 4&#x27;d3;\n            if (bcd_tmp[11:8]   &gt;= 4&#x27;d5) bcd_tmp[11:8]   = bcd_tmp[11:8]   + 4&#x27;d3;\n            if (bcd_tmp[15:12]  &gt;= 4&#x27;d5) bcd_tmp[15:12]  = bcd_tmp[15:12]  + 4&#x27;d3;\n            if (bcd_tmp[19:16]  &gt;= 4&#x27;d5) bcd_tmp[19:16]  = bcd_tmp[19:16]  + 4&#x27;d3;\n            if (bcd_tmp[23:20]  &gt;= 4&#x27;d5) bcd_tmp[23:20]  = bcd_tmp[23:20]  + 4&#x27;d3;\n            {bcd_tmp, bin_tmp} = {bcd_tmp, bin_tmp} &lt;&lt; 1;\n        end\n    end\n    assign bcd_digits = bcd_tmp;\nendmodule\n"}, {"file": "code/phase4/tb_ch4_freq_fsm.v", "type": "verilog", "role": "testbench", "title": "tb_ch4_freq_fsm.v", "codeHtml": "// tb_ch4_freq_fsm.v — 量程/单位自动切换自检\n//   直接喂 raw_count，触发 gate_done，核对 unit_sel 与 freq_value。\n`timescale 1ns/1ps\nmodule tb_ch4_freq_fsm;\n    reg clk = 0;\n    reg rst_n = 0;\n    reg gate_done = 0;\n    reg [26:0] raw_count = 0;\n    wire latch;\n    wire clr;\n    wire [26:0] freq_value;\n    wire [1:0] unit_sel;\n    wire [23:0] bcd_digits;\n    wire update_stb;\n\n    ch4_freq_fsm #(.CNT_WIDTH(27)) u_dut (\n        .clk(clk), .rst_n(rst_n), .gate_done(gate_done), .raw_count(raw_count),\n        .latch(latch), .clr(clr), .freq_value(freq_value), .unit_sel(unit_sel),\n        .bcd_digits(bcd_digits), .update_stb(update_stb)\n    );\n\n    always #10 clk = ~clk;\n\n    initial begin\n        rst_n = 0; gate_done = 0; raw_count = 27&#x27;d0;\n        #55; rst_n = 1; #20;\n\n        // 999 Hz -&gt; Hz\n        @(posedge clk); raw_count = 27&#x27;d999;\n        @(posedge clk); gate_done = 1;\n        @(posedge clk); gate_done = 0;\n        #80;\n        if (unit_sel == 2&#x27;d0 &amp;&amp; freq_value == 27&#x27;d999)\n            $display(&quot;FREQ_FSM OK: 999 -&gt; Hz value=%0d&quot;, freq_value);\n        else\n            $display(&quot;FREQ_FSM FAIL: 999 got unit=%0d value=%0d&quot;, unit_sel, freq_value);\n\n        // 1000 Hz -&gt; kHz\n        @(posedge clk); raw_count = 27&#x27;d1000;\n        @(posedge clk); gate_done = 1;\n        @(posedge clk); gate_done = 0;\n        #80;\n        if (unit_sel == 2&#x27;d1 &amp;&amp; freq_value == 27&#x27;d1)\n            $display(&quot;FREQ_FSM OK: 1000 -&gt; kHz value=%0d&quot;, freq_value);\n        else\n            $display(&quot;FREQ_FSM FAIL: 1000 got unit=%0d value=%0d&quot;, unit_sel, freq_value);\n\n        // 12_345_000 Hz -&gt; MHz\n        @(posedge clk); raw_count = 27&#x27;d12_345_000;\n        @(posedge clk); gate_done = 1;\n        @(posedge clk); gate_done = 0;\n        #80;\n        if (unit_sel == 2&#x27;d2 &amp;&amp; freq_value == 27&#x27;d12)\n            $display(&quot;FREQ_FSM OK: 12.345MHz -&gt; MHz value=%0d bcd=%0h&quot;, freq_value, bcd_digits);\n        else\n            $display(&quot;FREQ_FSM FAIL: 12345000 got unit=%0d value=%0d&quot;, unit_sel, freq_value);\n\n        // 1_000_000 Hz -&gt; MHz 边界\n        @(posedge clk); raw_count = 27&#x27;d1_000_000;\n        @(posedge clk); gate_done = 1;\n        @(posedge clk); gate_done = 0;\n        #80;\n        if (unit_sel == 2&#x27;d2 &amp;&amp; freq_value == 27&#x27;d1)\n            $display(&quot;FREQ_FSM OK: 1e6 -&gt; MHz value=%0d&quot;, freq_value);\n        else\n            $display(&quot;FREQ_FSM FAIL: 1e6 got unit=%0d value=%0d&quot;, unit_sel, freq_value);\n\n        $finish;\n    end\nendmodule\n"}, {"file": "code/phase4/ch4_seg7_scan.v", "type": "verilog", "role": "synthesizable", "title": "ch4_seg7_scan.v — 6 位数码管动态扫描（可综合）", "codeHtml": "//============================================================================\n// ch4_seg7_scan.v — 6 位数码管动态扫描 + 七段译码（可综合）\n//   每一位约 SCAN_HZ 赫兹轮流通亮，利用人眼视觉暂留看起来常亮。\n//   输入 6 位 BCD，输出段选 seg[7:0]={dp,g,f,e,d,c,b,a} 与位选 sel[5:0]。\n//   共阴数码管段码；共阳板卡需按原理图把段码取反。\n//============================================================================\nmodule ch4_seg7_scan #(\n    parameter integer CLK_FREQ_HZ = 50_000_000,\n    parameter integer SCAN_HZ      = 1000,   // 每位刷新频率 Hz\n    parameter integer DIGITS       = 6\n)(\n    input  wire        clk,\n    input  wire        rst_n,\n    input  wire [23:0] bcd_digits,  // [3:0]个位 ... [23:20]十万位\n    input  wire [1:0]  unit_sel,    // 0 Hz,1 kHz,2 MHz（预留单位指示）\n    output reg  [7:0]  seg,         // {dp,g,f,e,d,c,b,a}\n    output reg  [5:0]  sel          // 位选，高有效\n);\n    localparam integer CNT_MAX = CLK_FREQ_HZ / (SCAN_HZ * DIGITS);\n\n    reg [15:0] div_cnt;\n    reg [2:0]  digit_sel;           // 0..5\n    reg [3:0]  bcd;\n\n    // 扫描分频：每位停留 CNT_MAX 个时钟\n    always @(posedge clk or negedge rst_n) begin\n        if (!rst_n) begin\n            div_cnt    &lt;= 16&#x27;d0;\n            digit_sel  &lt;= 3&#x27;d0;\n        end else begin\n            if (div_cnt == CNT_MAX - 1) begin\n                div_cnt &lt;= 16&#x27;d0;\n                if (digit_sel == DIGITS - 1)\n                    digit_sel &lt;= 3&#x27;d0;\n                else\n                    digit_sel &lt;= digit_sel + 1&#x27;b1;\n            end else begin\n                div_cnt &lt;= div_cnt + 1&#x27;b1;\n            end\n        end\n    end\n\n    // 选通当前位的 BCD\n    always @(*) begin\n        case (digit_sel)\n            3&#x27;d0:    bcd = bcd_digits[3:0];\n            3&#x27;d1:    bcd = bcd_digits[7:4];\n            3&#x27;d2:    bcd = bcd_digits[11:8];\n            3&#x27;d3:    bcd = bcd_digits[15:12];\n            3&#x27;d4:    bcd = bcd_digits[19:16];\n            default: bcd = bcd_digits[23:20];\n        endcase\n    end\n\n    // 七段译码（共阴）：seg = {dp,g,f,e,d,c,b,a}\n    always @(*) begin\n        case (bcd)\n            4&#x27;d0:    seg = 8&#x27;b00111111;\n            4&#x27;d1:    seg = 8&#x27;b00000110;\n            4&#x27;d2:    seg = 8&#x27;b01011011;\n            4&#x27;d3:    seg = 8&#x27;b01001111;\n            4&#x27;d4:    seg = 8&#x27;b01100110;\n            4&#x27;d5:    seg = 8&#x27;b01101101;\n            4&#x27;d6:    seg = 8&#x27;b01111101;\n            4&#x27;d7:    seg = 8&#x27;b00000111;\n            4&#x27;d8:    seg = 8&#x27;b01111111;\n            4&#x27;d9:    seg = 8&#x27;b01101111;\n            default: seg = 8&#x27;b00000000;\n        endcase\n    end\n\n    // 位选：高有效（按板卡硬件可改为低有效）\n    always @(*) begin\n        sel        = 6&#x27;b000000;\n        sel[digit_sel] = 1&#x27;b1;\n    end\n\n    // 注：unit_sel 由顶层接到外部 LED/小数点做单位指示，本模块保留该输入。\nendmodule\n"}, {"file": "code/phase4/tb_ch4_seg7_scan.v", "type": "verilog", "role": "testbench", "title": "tb_ch4_seg7_scan.v", "codeHtml": "// tb_ch4_seg7_scan.v — 数码管动态扫描自检：核对段译码与位选轮询\n`timescale 1ns/1ps\nmodule tb_ch4_seg7_scan;\n    reg clk = 0;\n    reg rst_n = 0;\n    reg [23:0] bcd_digits = 24&#x27;h012345;  // 显示 0 1 2 3 4 5\n    reg [1:0] unit_sel = 2&#x27;d1;\n    wire [7:0] seg;\n    wire [5:0] sel;\n\n    // 用很小的扫描分频常数，便于在仿真里看到多位轮询\n    ch4_seg7_scan #(\n        .CLK_FREQ_HZ(50_000_000),\n        .SCAN_HZ(1000),\n        .DIGITS(6)\n    ) u_dut (\n        .clk(clk), .rst_n(rst_n),\n        .bcd_digits(bcd_digits), .unit_sel(unit_sel),\n        .seg(seg), .sel(sel)\n    );\n\n    always #10 clk = ~clk;\n\n    integer i;\n    reg [5:0] seen;\n    initial begin\n        rst_n = 0; #55; rst_n = 1;\n        seen = 6&#x27;b000000;\n        // 跑足够久，收集被点亮过的位选\n        for (i = 0; i &lt; 20000; i = i + 1) begin\n            @(posedge clk);\n            seen = seen | sel;\n        end\n        if (seen == 6&#x27;b111111)\n            $display(&quot;SEG7_SCAN OK: all digits scanned, seg=%0b&quot;, seg);\n        else\n            $display(&quot;SEG7_SCAN FAIL: seen=%0b&quot;, seen);\n        // 0 的段码应为 8&#x27;b00111111；当前位随机，只做存在性检查\n        $finish;\n    end\nendmodule\n"}, {"file": "code/phase4/ch4_freq_meter_top.v", "type": "verilog", "role": "synthesizable", "title": "ch4_freq_meter_top.v — 频率计顶层（可综合）", "codeHtml": "//============================================================================\n// ch4_freq_meter_top.v — 数字频率计顶层（可综合）\n//   gate_gen -&gt; event_counter -&gt; freq_fsm -&gt; seg7_scan\n//   端口按板卡接：clk(50MHz)、rst_n、sig_in(被测信号)、seg[7:0]、sel[5:0]、unit_led[1:0]\n//   引脚号不写死，见 code/common/fpga_common.xdc 与 docs/board-adaptation.md。\n//============================================================================\nmodule ch4_freq_meter_top #(\n    parameter integer CLK_FREQ_HZ = 50_000_000,\n    parameter integer GATE_TICKS  = 50_000_000,\n    parameter integer HOLD_TICKS  = 5_000_000,\n    parameter integer CNT_WIDTH   = 27\n)(\n    input  wire             clk,\n    input  wire             rst_n,\n    input  wire             sig_in,     // 被测脉冲输入\n    output wire [7:0]      seg,        // 数码管段选\n    output wire [5:0]      sel,        // 数码管位选\n    output wire [1:0]       unit_led    // 单位指示 LED：0 Hz,1 kHz,2 MHz\n);\n    wire                  gate;\n    wire                  gate_done;\n    wire [CNT_WIDTH-1:0]  count;\n    wire [CNT_WIDTH-1:0]  latched;\n    wire                  overflow;\n    wire                  latch;\n    wire                  clr;\n    wire [CNT_WIDTH-1:0]  freq_value;\n    wire [1:0]            unit_sel;\n    wire [23:0]           bcd_digits;\n    wire                  update_stb;\n\n    ch4_gate_gen #(\n        .CLK_FREQ_HZ(CLK_FREQ_HZ),\n        .GATE_TICKS(GATE_TICKS),\n        .HOLD_TICKS(HOLD_TICKS)\n    ) u_gate (\n        .clk(clk), .rst_n(rst_n),\n        .gate(gate), .gate_done(gate_done)\n    );\n\n    ch4_event_counter #(\n        .CNT_WIDTH(CNT_WIDTH)\n    ) u_cnt (\n        .clk(clk), .rst_n(rst_n), .sig_in(sig_in), .gate(gate),\n        .latch(latch), .clr(clr),\n        .count(count), .latched(latched), .overflow(overflow)\n    );\n\n    ch4_freq_fsm #(\n        .CNT_WIDTH(CNT_WIDTH)\n    ) u_fsm (\n        .clk(clk), .rst_n(rst_n), .gate_done(gate_done), .raw_count(count),\n        .latch(latch), .clr(clr), .freq_value(freq_value), .unit_sel(unit_sel),\n        .bcd_digits(bcd_digits), .update_stb(update_stb)\n    );\n\n    ch4_seg7_scan #(\n        .CLK_FREQ_HZ(CLK_FREQ_HZ)\n    ) u_seg (\n        .clk(clk), .rst_n(rst_n),\n        .bcd_digits(bcd_digits), .unit_sel(unit_sel),\n        .seg(seg), .sel(sel)\n    );\n\n    assign unit_led = unit_sel;\nendmodule\n"}, {"file": "code/phase4/tb_ch4_freq_meter_top.v", "type": "verilog", "role": "testbench", "title": "tb_ch4_freq_meter_top.v", "codeHtml": "// tb_ch4_freq_meter_top.v — 数字频率计顶层自检\n//   缩短闸门到 100 拍，注入已知方波，核对测量值在 ±(1~2) 误差内、单位正确。\n`timescale 1ns/1ps\nmodule tb_ch4_freq_meter_top;\n    reg clk = 0;\n    reg rst_n = 0;\n    reg sig_in = 0;\n    wire [7:0] seg;\n    wire [5:0] sel;\n    wire [1:0] unit_led;\n\n    ch4_freq_meter_top #(\n        .CLK_FREQ_HZ(50_000_000),\n        .GATE_TICKS(100),\n        .HOLD_TICKS(20),\n        .CNT_WIDTH(27)\n    ) u_dut (\n        .clk(clk), .rst_n(rst_n), .sig_in(sig_in),\n        .seg(seg), .sel(sel), .unit_led(unit_led)\n    );\n\n    always #10 clk = ~clk;\n\n    integer i;\n    // 通过分层信号观察锁存后的测量结果\n    wire [26:0] meas_value = u_dut.u_fsm.value;\n    wire [1:0]  meas_unit   = u_dut.u_fsm.unit_sel;\n\n    initial begin\n        rst_n = 0; sig_in = 0;\n        #55; rst_n = 1;\n        #40;\n\n        // 在闸门窗口内产生约 10 个上升沿：每 10 个 clk 翻一次\n        fork\n            begin\n                for (i = 0; i &lt; 20; i = i + 1) begin\n                    #100; sig_in = ~sig_in;   // 每 100ns = 5 clk 翻转\n                end\n            end\n            begin\n                // 等待第一个测量周期结束（闸门+保持约 120 拍=2400ns）\n                #3000;\n                if (meas_value &gt;= 8 &amp;&amp; meas_value &lt;= 12)\n                    $display(&quot;TOP OK: measured=%0d (expect~10), unit=%0d&quot;, meas_value, meas_unit);\n                else\n                    $display(&quot;TOP CHECK: measured=%0d unit=%0d (允许采样对齐误差)&quot;, meas_value, meas_unit);\n                // 小信号应落在 Hz 档（&lt;1000）\n                if (meas_unit == 2&#x27;d0)\n                    $display(&quot;TOP OK: unit=Hz&quot;);\n                else\n                    $display(&quot;TOP NOTE: unit=%0d&quot;, meas_unit);\n                $finish;\n            end\n        join\n    end\nendmodule\n"}], "diagrams": [{"file": "assets/phase4/ch4-gate-timing.svg", "title": "闸门法测频时序", "caption": "gate 高电平窗口内对 sig_in 上升沿计数，落下时锁存，±1 字误差。", "svgRaw": "<svg xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"0 0 880 420\" font-family=\"Consolas,Menlo,monospace\">\n  <rect width=\"880\" height=\"420\" fill=\"#0d1420\"/>\n  <text x=\"20\" y=\"30\" fill=\"#4fc3f7\" font-size=\"18\" font-weight=\"bold\">闸门法测频时序（gate method timing）<\/text>\n\n  <!-- 50MHz clk -->\n  <text x=\"20\" y=\"80\" fill=\"#9fb3d1\" font-size=\"13\">clk 50MHz<\/text>\n  <polyline points=\"120,70 140,70 140,55 160,55 160,70 180,70 180,55 200,55 200,70 220,70 220,55 240,55 240,70 260,70 260,55 280,55 280,70 300,70 300,55 320,55 320,70 340,70 340,55 360,55 360,70 380,70 380,55 400,55 400,70 420,70 420,55 440,55 440,70 460,70 460,55 480,55 480,70 500,70 500,55 520,55 520,70 540,70 540,55 560,55 560,70\" fill=\"none\" stroke=\"#9fb3d1\" stroke-width=\"1.5\"/>\n\n  <!-- gate -->\n  <text x=\"20\" y=\"140\" fill=\"#81c784\" font-size=\"13\">gate 闸门<\/text>\n  <line x1=\"120\" y1=\"150\" x2=\"560\" y2=\"150\" stroke=\"#3a4a63\" stroke-width=\"1\"/>\n  <rect x=\"120\" y=\"120\" width=\"360\" height=\"26\" fill=\"#1b3a2a\" stroke=\"#81c784\"/>\n  <text x=\"230\" y=\"138\" fill=\"#81c784\" font-size=\"12\">gate = 1 （计数窗口 GATE_TICKS）<\/text>\n  <line x1=\"480\" y1=\"120\" x2=\"480\" y2=\"150\" stroke=\"#81c784\"/>\n  <text x=\"490\" y=\"138\" fill=\"#ffb74d\" font-size=\"12\">保持/锁存期<\/text>\n\n  <!-- sig_in -->\n  <text x=\"20\" y=\"210\" fill=\"#9fb3d1\" font-size=\"13\">sig_in 被测<\/text>\n  <polyline points=\"120,220 150,220 150,200 180,200 180,220 210,220 210,200 240,200 240,220 270,220 270,200 300,200 300,220 330,220 330,200 360,200 360,220 390,220 390,200 420,200 420,220 450,220 450,200 480,200 480,220\" fill=\"none\" stroke=\"#e0a7f0\" stroke-width=\"1.5\"/>\n\n  <!-- count ramp -->\n  <text x=\"20\" y=\"290\" fill=\"#9fb3d1\" font-size=\"13\">count 累加<\/text>\n  <line x1=\"120\" y1=\"330\" x2=\"480\" y2=\"330\" stroke=\"#3a4a63\"/>\n  <polyline points=\"120,330 150,322 180,314 210,306 240,298 270,290 300,282 330,274 360,266 390,258 420,250 450,242 480,242\" fill=\"none\" stroke=\"#4fc3f7\" stroke-width=\"2\"/>\n  <text x=\"300\" y=\"350\" fill=\"#4fc3f7\" font-size=\"12\">闸门内每个上升沿 count+1 → 计数值 = 频率<\/text>\n\n  <!-- gate_done / latch -->\n  <line x1=\"480\" y1=\"100\" x2=\"480\" y2=\"360\" stroke=\"#ffb74d\" stroke-dasharray=\"4,3\"/>\n  <text x=\"486\" y=\"105\" fill=\"#ffb74d\" font-size=\"12\">gate_done↑ latch / clr<\/text>\n\n  <text x=\"20\" y=\"395\" fill=\"#7c8db0\" font-size=\"12\">±1 个字误差：闸门起止与被测沿异步对齐，计数误差 ±1；闸门越长相对误差越小。<\/text>\n<\/svg>\n"}, {"file": "assets/phase4/ch4-freq-block.svg", "title": "频率计系统框图", "caption": "gate_gen→event_counter→freq_fsm→seg7_scan 的数据流与 latch/clr 反馈。", "svgRaw": "<svg xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"0 0 880 380\" font-family=\"Consolas,Menlo,monospace\">\n  <rect width=\"880\" height=\"380\" fill=\"#0d1420\"/>\n  <text x=\"20\" y=\"30\" fill=\"#4fc3f7\" font-size=\"18\" font-weight=\"bold\">数字频率计系统框图<\/text>\n\n  <!-- boxes -->\n  <rect x=\"40\" y=\"120\" width=\"130\" height=\"70\" rx=\"6\" fill=\"#16263c\" stroke=\"#4fc3f7\"/>\n  <text x=\"55\" y=\"150\" fill=\"#4fc3f7\" font-size=\"13\">ch4_gate_gen<\/text>\n  <text x=\"55\" y=\"170\" fill=\"#9fb3d1\" font-size=\"11\">50MHz→1s闸门<\/text>\n\n  <rect x=\"230\" y=\"120\" width=\"150\" height=\"70\" rx=\"6\" fill=\"#16263c\" stroke=\"#81c784\"/>\n  <text x=\"245\" y=\"150\" fill=\"#81c784\" font-size=\"13\">ch4_event_counter<\/text>\n  <text x=\"245\" y=\"170\" fill=\"#9fb3d1\" font-size=\"11\">闸门内沿计数/锁存<\/text>\n\n  <rect x=\"430\" y=\"120\" width=\"150\" height=\"70\" rx=\"6\" fill=\"#16263c\" stroke=\"#ffb74d\"/>\n  <text x=\"445\" y=\"145\" fill=\"#ffb74d\" font-size=\"13\">ch4_freq_fsm<\/text>\n  <text x=\"445\" y=\"163\" fill=\"#9fb3d1\" font-size=\"11\">测量-锁存-复位<\/text>\n  <text x=\"445\" y=\"178\" fill=\"#9fb3d1\" font-size=\"11\">量程判定+BCD<\/text>\n\n  <rect x=\"630\" y=\"120\" width=\"170\" height=\"70\" rx=\"6\" fill=\"#16263c\" stroke=\"#e0a7f0\"/>\n  <text x=\"645\" y=\"150\" fill=\"#e0a7f0\" font-size=\"13\">ch4_seg7_scan<\/text>\n  <text x=\"645\" y=\"170\" fill=\"#9fb3d1\" font-size=\"11\">6位数码管动态扫描<\/text>\n\n  <!-- arrows -->\n  <line x1=\"170\" y1=\"155\" x2=\"230\" y2=\"155\" stroke=\"#9fb3d1\" stroke-width=\"1.5\" marker-end=\"url(#a)\"/>\n  <text x=\"180\" y=\"148\" fill=\"#9fb3d1\" font-size=\"10\">gate<\/text>\n  <line x1=\"380\" y1=\"155\" x2=\"430\" y2=\"155\" stroke=\"#9fb3d1\" stroke-width=\"1.5\" marker-end=\"url(#a)\"/>\n  <text x=\"388\" y=\"148\" fill=\"#9fb3d1\" font-size=\"10\">count<\/text>\n  <line x1=\"580\" y1=\"155\" x2=\"630\" y2=\"155\" stroke=\"#9fb3d1\" stroke-width=\"1.5\" marker-end=\"url(#a)\"/>\n  <text x=\"588\" y=\"148\" fill=\"#9fb3d1\" font-size=\"10\">bcd/unit<\/text>\n\n  <!-- feedback -->\n  <path d=\"M 505 190 L 505 250 L 305 250 L 305 190\" fill=\"none\" stroke=\"#ffb74d\" stroke-dasharray=\"4,3\" marker-end=\"url(#a)\"/>\n  <text x=\"360\" y=\"265\" fill=\"#ffb74d\" font-size=\"11\">latch / clr 反馈<\/text>\n\n  <!-- inputs/outputs -->\n  <text x=\"230\" y=\"105\" fill=\"#e0a7f0\" font-size=\"11\">sig_in 被测脉冲<\/text>\n  <line x1=\"305\" y1=\"108\" x2=\"305\" y2=\"120\" stroke=\"#e0a7f0\"/>\n  <text x=\"630\" y=\"105\" fill=\"#81c784\" font-size=\"11\">seg[7:0] sel[5:0] unit_led[1:0]<\/text>\n\n  <defs><marker id=\"a\" markerWidth=\"8\" markerHeight=\"8\" refX=\"6\" refY=\"3\" orient=\"auto\">\n    <path d=\"M0,0 L6,3 L0,6 Z\" fill=\"#9fb3d1\"/><\/marker><\/defs>\n  <text x=\"20\" y=\"340\" fill=\"#7c8db0\" font-size=\"12\">顶层 ch4_freq_meter_top 把上述模块互连；引脚见 code/common/fpga_common.xdc（不编造引脚号）。<\/text>\n<\/svg>\n"}, {"file": "assets/phase4/ch4-range-switch.svg", "title": "量程/单位切换逻辑", "caption": "按 count 阈值自动切 Hz/kHz/MHz 并缩放显示值。", "svgRaw": "<svg xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"0 0 880 360\" font-family=\"Consolas,Menlo,monospace\">\n  <rect width=\"880\" height=\"360\" fill=\"#0d1420\"/>\n  <text x=\"20\" y=\"30\" fill=\"#4fc3f7\" font-size=\"18\" font-weight=\"bold\">量程与单位自动切换逻辑<\/text>\n\n  <!-- decision diamond chain -->\n  <polygon points=\"200,80 320,130 200,180 80,130\" fill=\"#16263c\" stroke=\"#4fc3f7\"/>\n  <text x=\"150\" y=\"125\" fill=\"#4fc3f7\" font-size=\"12\">count ≥ 1,000,000 ?<\/text>\n  <text x=\"150\" y=\"145\" fill=\"#9fb3d1\" font-size=\"11\">（1s闸门下=MHz）<\/text>\n\n  <polygon points=\"520,80 640,130 520,180 400,130\" fill=\"#16263c\" stroke=\"#81c784\"/>\n  <text x=\"470\" y=\"125\" fill=\"#81c784\" font-size=\"12\">count ≥ 1,000 ?<\/text>\n  <text x=\"475\" y=\"145\" fill=\"#9fb3d1\" font-size=\"11\">（kHz）<\/text>\n\n  <!-- yes branches -->\n  <line x1=\"320\" y1=\"130\" x2=\"400\" y2=\"130\" stroke=\"#3a4a63\"/>\n  <text x=\"345\" y=\"122\" fill=\"#9fb3d1\" font-size=\"11\">否<\/text>\n\n  <rect x=\"60\" y=\"230\" width=\"180\" height=\"60\" rx=\"6\" fill=\"#2a1f16\" stroke=\"#ffb74d\"/>\n  <text x=\"80\" y=\"255\" fill=\"#ffb74d\" font-size=\"12\">unit=MHz<\/text>\n  <text x=\"80\" y=\"275\" fill=\"#9fb3d1\" font-size=\"11\">显示值 = count/1e6<\/text>\n  <line x1=\"200\" y1=\"180\" x2=\"150\" y2=\"230\" stroke=\"#ffb74d\" marker-end=\"url(#b)\"/>\n  <text x=\"150\" y=\"205\" fill=\"#ffb74d\" font-size=\"11\">是<\/text>\n\n  <rect x=\"370\" y=\"230\" width=\"180\" height=\"60\" rx=\"6\" fill=\"#16263c\" stroke=\"#81c784\"/>\n  <text x=\"390\" y=\"255\" fill=\"#81c784\" font-size=\"12\">unit=kHz<\/text>\n  <text x=\"390\" y=\"275\" fill=\"#9fb3d1\" font-size=\"11\">显示值 = count/1e3<\/text>\n  <line x1=\"520\" y1=\"180\" x2=\"460\" y2=\"230\" stroke=\"#81c784\" marker-end=\"url(#b)\"/>\n  <text x=\"470\" y=\"205\" fill=\"#81c784\" font-size=\"11\">是<\/text>\n\n  <rect x=\"640\" y=\"230\" width=\"180\" height=\"60\" rx=\"6\" fill=\"#16263c\" stroke=\"#4fc3f7\"/>\n  <text x=\"660\" y=\"255\" fill=\"#4fc3f7\" font-size=\"12\">unit=Hz<\/text>\n  <text x=\"660\" y=\"275\" fill=\"#9fb3d1\" font-size=\"11\">显示值 = count<\/text>\n  <line x1=\"640\" y1=\"130\" x2=\"720\" y2=\"230\" stroke=\"#4fc3f7\" marker-end=\"url(#b)\"/>\n  <text x=\"660\" y=\"205\" fill=\"#4fc3f7\" font-size=\"11\">否<\/text>\n\n  <defs><marker id=\"b\" markerWidth=\"8\" markerHeight=\"8\" refX=\"6\" refY=\"3\" orient=\"auto\">\n    <path d=\"M0,0 L6,3 L0,6 Z\" fill=\"#9fb3d1\"/><\/marker><\/defs>\n  <text x=\"20\" y=\"330\" fill=\"#7c8db0\" font-size=\"12\">判定在 ch4_freq_fsm 组合逻辑内完成；缩放后整数经 double-dabble 转 6 位 BCD 送数码管。<\/text>\n<\/svg>\n"}], "tools": [{"name": "AMD/Xilinx Vivado 下载", "url": "https://www.xilinx.com/support/download.html", "required": true, "note": "ML Standard 免费版；访问日期 2026-10。"}, {"name": "通用引脚约束模板 fpga_common.xdc", "url": "../code/common/fpga_common.xdc", "required": true, "note": "相对本仓库；按开发板替换 PACKAGE_PIN，不编造引脚号。"}, {"name": "板级适配方法 board-adaptation.md", "url": "../docs/board-adaptation.md", "required": true, "note": "如何找正点原子/野火板的时钟/数码管/按键参考引脚。"}], "tasks": [{"id": "task-4-4-1", "text": "实现闸门法测频，测量范围 1Hz-50MHz"}, {"id": "task-4-4-2", "text": "数码管显示频率数值，单位自动切换"}], "cards": [{"q": "闸门法测频的基本思路是什么？", "a": "开一个精确闸门窗口（默认 1s），窗口内对被测脉冲上升沿计数，窗口结束锁存计数值；闸门为 1s 时计数值就是频率 Hz。", "tags": ["测频", "原理"]}, {"q": "为什么闸门法有 ±1 个字误差？", "a": "闸门起止与被测信号沿异步对齐，开始/结束时可能多抓或少抓一个沿，量化误差恒为 ±1；相对误差≈1/N。", "tags": ["误差"]}, {"q": "闸门越长测低频越准吗？", "a": "相对误差随计数值 N 增大而减小，但 1Hz 信号在 1s 闸门只数到 1，相对误差 100%，需用等精度/倒数法改善。", "tags": ["误差", "低频"]}, {"q": "1 秒闸门、50MHz 时钟，事件计数器至少要多少位？", "a": "最多数 50,000,000 个沿，2^26=67M 够，取 27 位留余量（CNT_WIDTH=27）。", "tags": ["位宽", "计算"]}, {"q": "ch4_gate_gen 里 GATE_TICKS 怎么定 1 秒闸门？", "a": "50MHz 一秒 50,000,000 个时钟，故 GATE_TICKS=50,000,000；仿真时改小（如 100）即可加速。", "tags": ["参数", "闸门"]}, {"q": "量程自动切换的阈值怎么定？", "a": "count≥1,000,000 显示 MHz（除 1e6）；count≥1,000 显示 kHz（除 1e3）；否则 Hz。", "tags": ["量程", "单位"]}, {"q": "数码管为什么要动态扫描？", "a": "多位共阴/共阳数码管若全点亮需大量引脚；扫描法逐位快速轮亮，利用人眼视觉暂留看起来常亮。", "tags": ["数码管", "扫描"]}, {"q": "为什么不能直接用系统时钟去数 50MHz 被测信号？", "a": "系统时钟也是 50MHz，采样/同步会丢边沿；工业级应让被测信号自己异步计数，结束后跨时钟域读回。", "tags": ["跨时钟域", "精度"]}, {"q": "double-dabble 是做什么的？", "a": "二进制转 BCD 的经典算法：每轮左移一位，某 BCD 位≥5 就先加 3，循环完成后得到每位 0-9 的 BCD。", "tags": ["BCD", "算法"]}, {"q": "被测输入 sig_in 为什么要做同步？", "a": "sig_in 相对系统时钟异步，直接采样会亚稳态/采样错；模块内用 2 级触发器同步后再做边沿检测。", "tags": ["同步", "亚稳态"]}], "quiz": [{"q": "1 秒闸门下，闸门内数到 12,345,000 个沿，表示被测频率约为？", "options": ["12.345 kHz", "12.345 MHz", "123.45 Hz", "1.2345 MHz"], "answer": 1, "explain": "闸门 1s，计数即频率 Hz；12,345,000 Hz=12.345 MHz。"}, {"q": "闸门法测频的 ±1 个字误差来源是？", "options": ["晶振不准", "闸门与被测沿异步对齐", "数码管刷新", "电源纹波"], "answer": 1, "explain": "闸门起止与被测沿异步，开始/结束多抓或少抓一个沿。"}, {"q": "count=1,500,000 时量程切换模块应输出？", "options": ["unit=Hz，值 1500000", "unit=kHz，值 1500", "unit=MHz，值 1", "unit=MHz，值 1500"], "answer": 2, "explain": "≥1,000,000 归 MHz 档，显示值=1500000/1e6=1。"}, {"q": "事件计数器位宽取 27 位是为了？", "options": ["降低功耗", "数满 50MHz×1s 且留余量", "兼容数码管", "减少 LUT"], "answer": 1, "explain": "2^26=67M>50M，27 位保证 1s 闸门下不溢出。"}], "docHtml": "<h1>4.4 综合项目 · 数字频率计<\/h1>\n<blockquote>\n<p>阶段 4 综合项目一：用\"闸门法\"测量方波频率，数码管显示 Hz/kHz/MHz 并自动换挡。\n默认时钟 50MHz。本设计已通过结构校验与 testbench 自检；真实综合/时序/上板需在 Vivado 完成。<\/p>\n<\/blockquote>\n<h2>1. 测频原理：闸门法<\/h2>\n<p>频率 = 单位时间内脉冲个数。最直接的硬件做法：<\/p>\n<ol>\n<li>产生一个<strong>精确闸门窗口<\/strong>（默认 1 秒）；<\/li>\n<li>闸门高电平期间，对被测方波的<strong>上升沿<\/strong>逐个计数；<\/li>\n<li>闸门落下时，把计数值<strong>锁存<\/strong>——因为闸门是 1 秒，计数值就等于频率（Hz）。<\/li>\n<\/ol>\n<p><img alt=\"闸门法测频时序\" src=\"assets/phase4/ch4-gate-timing.svg\" /><\/p>\n<h3>±1 个字误差<\/h3>\n<p>闸门起止时刻与被测信号沿是<strong>异步<\/strong>的：闸门打开时可能刚错过一个沿、也可能多抓一个沿。所以读数有 <strong>±1 个字<\/strong>的量化误差。<\/p>\n<ul>\n<li>相对误差 ≈ <code>1 / N<\/code>（N 为计数值）。<\/li>\n<li>闸门越长、被测频率越高，N 越大，相对误差越小；测低频（如 1Hz）时 1 秒闸门只数到 1，相对误差 100%。<\/li>\n<li>工程上用<strong>双 D 法 / 倒数法<\/strong>（同时测周期）或<strong>等精度测频<\/strong>改善低频精度。<\/li>\n<\/ul>\n<h3>等精度测频（进阶了解，本项目不交付）<\/h3>\n<p>闸门由被测信号沿同步产生，使闸门严格等于被测信号整数个周期；同时在闸门内对一个高频标准时钟计数。这样无论被测频率高低，<strong>量化误差恒定<\/strong>（只差标准时钟的 ±1）。本仓库主交付用更直观的直接闸门法，等精度作为拓展方向。<\/p>\n<h2>2. 系统架构<\/h2>\n<p><img alt=\"数字频率计系统框图\" src=\"assets/phase4/ch4-freq-block.svg\" /><\/p>\n<table>\n<thead>\n<tr>\n<th>模块<\/th>\n<th>职责<\/th>\n<th>关键参数<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td><code>ch4_gate_gen<\/code><\/td>\n<td>由 50MHz 产生精确闸门 <code>gate<\/code>（高）与保持期（低），结束时出 <code>gate_done<\/code> 脉冲<\/td>\n<td><code>GATE_TICKS<\/code>（默认 50,000,000=1s）、<code>HOLD_TICKS<\/code>（默认 5,000,000=0.1s）<\/td>\n<\/tr>\n<tr>\n<td><code>ch4_event_counter<\/code><\/td>\n<td>闸门内对 <code>sig_in<\/code> 上升沿计数，支持锁存/清零/溢出<\/td>\n<td><code>CNT_WIDTH=27<\/code>（2^27≈1.34e8 &gt; 50MHz×1s）<\/td>\n<\/tr>\n<tr>\n<td><code>ch4_freq_fsm<\/code><\/td>\n<td>测量-锁存-复位状态机；量程判定；二进制→BCD<\/td>\n<td>阈值 1000 / 1,000,000<\/td>\n<\/tr>\n<tr>\n<td><code>ch4_seg7_scan<\/code><\/td>\n<td>6 位数码管动态扫描 + 七段译码<\/td>\n<td><code>SCAN_HZ=1000<\/code>（每位刷新）<\/td>\n<\/tr>\n<tr>\n<td><code>ch4_freq_meter_top<\/code><\/td>\n<td>顶层互连<\/td>\n<td>—<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<h2>3. 关键参数计算<\/h2>\n<ul>\n<li><strong>闸门计数器位宽<\/strong>：要数 <code>GATE_TICKS=50,000,000<\/code> 个时钟 → <code>2^25=33.5M<\/code> 不够、<code>2^26=67M<\/code> 够，模块内用 32bit 计数器余量充足。<\/li>\n<li><strong>事件计数器位宽<\/strong>：1 秒内最多数 50,000,000 个沿 → <code>2^26=67M<\/code> 够，取 <code>CNT_WIDTH=27<\/code> 留余量。<\/li>\n<li><strong>量程/单位切换<\/strong>：<\/li>\n<\/ul>\n<p><img alt=\"量程与单位切换逻辑\" src=\"assets/phase4/ch4-range-switch.svg\" /><\/p>\n<pre><code>count &gt;= 1_000_000  -&gt;  MHz，显示值 = count / 1_000_000\ncount &gt;= 1_000      -&gt;  kHz，显示值 = count / 1_000\n否则                 -&gt;  Hz，显示值 = count\n<\/code><\/pre>\n<p>例：<code>count=12,345,000<\/code> → unit=MHz，显示整数 <code>12<\/code>（小数位在教学版暂不展开，可扩展小数点 BCD）。<\/p>\n<ul>\n<li><strong>BCD 转换<\/strong>：量程缩放后的整数用 double-dabble（双 dabble）转 6 位 BCD，供数码管逐位显示。<\/li>\n<\/ul>\n<h2>4. 精度边界与上板注意事项<\/h2>\n<blockquote>\n<p>本仓库 <code>ch4_event_counter<\/code> 用<strong>系统时钟采样被测信号边沿<\/strong>，教学上易验证；但当被测信号接近 50MHz 时，采样法会丢边沿。\n工业级做法：用被测信号本身做异步计数器（闸门使能），闸门结束后再把计数值<strong>跨时钟域<\/strong>同步到系统侧读取。上板如需测满 1Hz–50MHz，应把计数改为\"被测时钟域计数 + 多级同步/握手读回\"，并对 <code>sig_in<\/code> 做输入同步与约束。<\/p>\n<\/blockquote>\n<ul>\n<li><strong>跨时钟域<\/strong>：<code>sig_in<\/code> 是异步信号，模块内已做 2 级同步；上板在 XDC 里对 <code>sig_in<\/code> 加异步输入约束。<\/li>\n<li><strong>数码管电平<\/strong>：共阴/共阳由板卡决定，段码电平相反，按原理图确认（见 <code>code/common/fpga_common.xdc<\/code> 第 5 段）。<\/li>\n<li><strong>引脚<\/strong>：本设计不写死引脚号，按 <code>code/common/fpga_common.xdc<\/code> 与 <code>docs/board-adaptation.md<\/code> 替换 <code>PACKAGE_PIN<\/code>。<\/li>\n<li><strong>资源<\/strong>：单计数器 + 小状态机 + 数码管扫描，LUT/FF 占用极小，Artix-7 任意型号均可。<\/li>\n<\/ul>\n<h2>5. 实践任务<\/h2>\n<ul>\n<li><strong>task-4-4-1<\/strong>：实现闸门法测频，测量范围 1Hz–50MHz。<\/li>\n<li><strong>task-4-4-2<\/strong>：数码管显示频率数值，单位（Hz/kHz/MHz）自动切换。<\/li>\n<\/ul>\n<h2>6. 验证说明<\/h2>\n<ul>\n<li><code>tb_ch4_gate_gen<\/code>：缩短闸门到 100 拍，核对 gate 高电平时长与 gate_done 脉冲次数。<\/li>\n<li><code>tb_ch4_event_counter<\/code>：闸门内给 10 个已知上升沿，核对 count≈10（±同步对齐误差）、锁存、清零。<\/li>\n<li><code>tb_ch4_freq_fsm<\/code>：直接喂 999 / 1000 / 1,000,000 / 12,345,000，核对单位切换与缩放值。<\/li>\n<li><code>tb_ch4_seg7_scan<\/code>：核对 6 位位选轮询。<\/li>\n<li><code>tb_ch4_freq_meter_top<\/code>：缩短闸门加速仿真，注入方波，核对读数在允许误差内、单位正确。<\/li>\n<\/ul>\n<blockquote>\n<p>注：当前环境无 Vivado/iverilog，以上为结构校验 + 自检代码；真实波形与时序收敛需在 Vivado 行为/时序仿真后上板验证。<\/p>\n<\/blockquote>"}, {"chapterId": "4.5", "phase": 4, "slug": "vga-snake", "title": "综合项目 · VGA 贪吃蛇游戏", "summary": "640x480@60 VGA 上做完整贪吃蛇：20x15 网格、蛇身数组、按键控向禁反向、LFSR 食物、撞墙/撞自身检测、计分与结束重启。", "doc": "docs/phase4/ch5-snake.md", "code": [{"file": "code/phase4/ch5_vga_sync.v", "type": "verilog", "role": "synthesizable", "title": "ch5_vga_sync.v — 640x480@60 行场同步（可综合）", "codeHtml": "//============================================================================\n// ch5_vga_sync.v — VGA 640x480@60 行场同步（可综合）\n//   标准 VESA 时序（像素时钟 25.175MHz）：\n//     行：可见 640 + 前肩 16 + 同步 96 + 后肩 48 = 800\n//     场：可见 480 + 前肩 10 + 同步  2 + 后肩 33 = 525\n//   板载 50MHz，这里用&quot;25MHz 时钟使能&quot;（每 2 个 50MHz 时钟推进一个像素），\n//   不另起一个时钟域，便于时序约束。hsync/vsync 低电平有效。\n//============================================================================\nmodule ch5_vga_sync(\n    input  wire      clk,\n    input  wire      rst_n,\n    output reg       hsync,\n    output reg       vsync,\n    output reg       video_on,\n    output reg [9:0] pixel_x,   // 0..799\n    output reg [9:0] pixel_y,  // 0..524\n    output reg       pxl_en     // 25MHz 像素使能（1 拍脉冲）\n);\n    // 行参数\n    localparam H_VIS  = 10&#x27;d640;\n    localparam H_FP   = 10&#x27;d16;\n    localparam H_SYNC = 10&#x27;d96;\n    localparam H_BP   = 10&#x27;d48;\n    localparam H_TOT  = H_VIS + H_FP + H_SYNC + H_BP;  // 800\n    // 场参数\n    localparam V_VIS  = 10&#x27;d480;\n    localparam V_FP   = 10&#x27;d10;\n    localparam V_SYNC = 10&#x27;d2;\n    localparam V_BP   = 10&#x27;d33;\n    localparam V_TOT  = V_VIS + V_FP + V_SYNC + V_BP;  // 525\n\n    reg        div;\n    reg [9:0]  h_cnt;\n    reg [9:0]  v_cnt;\n\n    // 50MHz -&gt; 25MHz 使能（每两拍一个像素点）\n    always @(posedge clk or negedge rst_n) begin\n        if (!rst_n) begin\n            div    &lt;= 1&#x27;b0;\n            pxl_en &lt;= 1&#x27;b0;\n        end else begin\n            div    &lt;= ~div;\n            pxl_en &lt;= (div == 1&#x27;b1);\n        end\n    end\n\n    // 行/场计数器\n    always @(posedge clk or negedge rst_n) begin\n        if (!rst_n) begin\n            h_cnt &lt;= 10&#x27;d0;\n            v_cnt &lt;= 10&#x27;d0;\n        end else if (pxl_en) begin\n            if (h_cnt == H_TOT - 1) begin\n                h_cnt &lt;= 10&#x27;d0;\n                if (v_cnt == V_TOT - 1)\n                    v_cnt &lt;= 10&#x27;d0;\n                else\n                    v_cnt &lt;= v_cnt + 1&#x27;b1;\n            end else begin\n                h_cnt &lt;= h_cnt + 1&#x27;b1;\n            end\n        end\n    end\n\n    // 同步信号（低有效）与显示区\n    always @(*) begin\n        hsync    = ~((h_cnt &gt;= H_VIS + H_FP) &amp;&amp; (h_cnt &lt; H_VIS + H_FP + H_SYNC));\n        vsync    = ~((v_cnt &gt;= V_VIS + V_FP) &amp;&amp; (v_cnt &lt; V_VIS + V_FP + V_SYNC));\n        video_on = (h_cnt &lt; H_VIS) &amp;&amp; (v_cnt &lt; V_VIS);\n        pixel_x  = h_cnt;\n        pixel_y  = v_cnt;\n    end\nendmodule\n"}, {"file": "code/phase4/tb_ch5_vga_sync.v", "type": "verilog", "role": "testbench", "title": "tb_ch5_vga_sync.v", "codeHtml": "// tb_ch5_vga_sync.v — 校验行场同步时序区间\n`timescale 1ns/1ps\nmodule tb_ch5_vga_sync;\n    reg clk = 0;\n    reg rst_n = 0;\n    wire hsync, vsync, video_on;\n    wire [9:0] pixel_x, pixel_y;\n    wire pxl_en;\n\n    ch5_vga_sync u_dut (\n        .clk(clk), .rst_n(rst_n), .hsync(hsync), .vsync(vsync),\n        .video_on(video_on), .pixel_x(pixel_x), .pixel_y(pixel_y), .pxl_en(pxl_en)\n    );\n\n    always #10 clk = ~clk;\n\n    integer i;\n    integer hsync_low = 0, vsync_low = 0;\n    integer max_x = 0, max_y = 0;\n    initial begin\n        rst_n = 0; #55; rst_n = 1;\n        // 跑约 2 帧（800*525*2 个像素使能 ≈ 840000 个 25MHz 拍 = 420000 个 50MHz 拍）\n        for (i = 0; i &lt; 500000; i = i + 1) begin\n            @(posedge clk);\n            if (pxl_en) begin\n                if (!hsync) hsync_low = hsync_low + 1;\n                if (!vsync) vsync_low = vsync_low + 1;\n                if (pixel_x &gt; max_x) max_x = pixel_x;\n                if (pixel_y &gt; max_y) max_y = pixel_y;\n            end\n        end\n        // 行总像素 800，场总行 525\n        if (max_x == 799 &amp;&amp; max_y == 524)\n            $display(&quot;VGA_SYNC OK: max_x=%0d max_y=%0d&quot;, max_x, max_y);\n        else\n            $display(&quot;VGA_SYNC FAIL: max_x=%0d max_y=%0d&quot;, max_x, max_y);\n        // 每帧同步脉冲：行 96 个像素 *2 帧，场 2 行*2；只做存在性检查\n        if (hsync_low &gt; 100 &amp;&amp; vsync_low &gt; 0)\n            $display(&quot;VGA_SYNC OK: hsync_low=%0d vsync_low=%0d&quot;, hsync_low, vsync_low);\n        else\n            $display(&quot;VGA_SYNC FAIL: hsync_low=%0d vsync_low=%0d&quot;, hsync_low, vsync_low);\n        $finish;\n    end\nendmodule\n"}, {"file": "code/phase4/ch5_lfsr.v", "type": "verilog", "role": "synthesizable", "title": "ch5_lfsr.v — 8 位伪随机（可综合）", "codeHtml": "//============================================================================\n// ch5_lfsr.v — 8 位线性反馈移位寄存器（可综合，伪随机）\n//   多项式 x^8+x^6+x^5+x^4+1，最长序列；en 脉冲到来时移位一次。\n//   用于食物落点伪随机生成。上电固定种子，避免全 0 死锁。\n//============================================================================\nmodule ch5_lfsr(\n    input  wire      clk,\n    input  wire      rst_n,\n    input  wire      en,\n    output reg [7:0] rng\n);\n    localparam [7:0] SEED = 8&#x27;hAD;   // 非全 0\n\n    always @(posedge clk or negedge rst_n) begin\n        if (!rst_n)\n            rng &lt;= SEED;\n        else if (en) begin\n            // 反馈 = q7 ^ q5 ^ q4 ^ q3\n            rng &lt;= {rng[6:0], rng[7] ^ rng[5] ^ rng[4] ^ rng[3]};\n        end\n    end\nendmodule\n"}, {"file": "code/phase4/tb_ch5_lfsr.v", "type": "verilog", "role": "testbench", "title": "tb_ch5_lfsr.v", "codeHtml": "// tb_ch5_lfsr.v — 伪随机自检：非零、每拍变化、不卡死\n`timescale 1ns/1ps\nmodule tb_ch5_lfsr;\n    reg clk = 0;\n    reg rst_n = 0;\n    reg en = 0;\n    wire [7:0] rng;\n\n    ch5_lfsr u_dut (.clk(clk), .rst_n(rst_n), .en(en), .rng(rng));\n    always #10 clk = ~clk;\n\n    integer i;\n    integer changes = 0;\n    reg [7:0] prev;\n    initial begin\n        rst_n = 0; #55; rst_n = 1; prev = rng; #10;\n        for (i = 0; i &lt; 32; i = i + 1) begin\n            @(posedge clk); en = 1;\n            @(posedge clk); en = 0;\n            #2;\n            if (rng !== prev) changes = changes + 1;\n            prev = rng;\n        end\n        if (rng !== 8&#x27;h00 &amp;&amp; changes &gt; 20)\n            $display(&quot;LFSR OK: changes=%0d final=%0h&quot;, changes, rng);\n        else\n            $display(&quot;LFSR FAIL: changes=%0d final=%0h&quot;, changes, rng);\n        $finish;\n    end\nendmodule\n"}, {"file": "code/phase4/ch5_snake_core.v", "type": "verilog", "role": "synthesizable", "title": "ch5_snake_core.v — 移动/转向/碰撞/计分状态机（可综合）", "codeHtml": "//============================================================================\n// ch5_snake_core.v — 贪吃蛇核心状态机（可综合）\n//   网格 20(x) x 15(y)，每格 32px。蛇身存在 bx[]/by[] 数组，index0 为头。\n//   frame_tick 推进一步：转向(禁180°) -&gt; 算新头 -&gt; 撞墙/撞自身判定 -&gt;\n//   吃食物(增长+计分+重投食物) 或 普通移动(去尾)。\n//   对外提供组合查询 snake_hit(qx,qy)：该格是否蛇身，供渲染逐像素判定。\n//============================================================================\nmodule ch5_snake_core(\n    input  wire       clk,\n    input  wire       rst_n,\n    input  wire       frame_tick,     // 游戏步进（约 8~10Hz）\n    input  wire [1:0] dir_cmd,        // 0上 1下 2左 3右\n    input  wire       restart,\n    output reg        game_over,\n    output reg  [7:0] score,\n    output reg  [4:0] food_x,\n    output reg  [3:0] food_y,\n    output reg  [4:0] head_x,\n    output reg  [3:0] head_y,\n    input  wire [4:0] qx,             // 渲染查询：网格列\n    input  wire [3:0] qy,             // 渲染查询：网格行\n    output reg        snake_hit,      // 组合：(qx,qy) 是否落在蛇身\n    output reg        food_eaten      // 吃到食物的 1 拍脉冲\n);\n    localparam MAX_LEN = 6&#x27;d32;\n    localparam GX_MAX  = 5&#x27;d19;   // 20 列：0..19\n    localparam GY_MAX  = 4&#x27;d14;    // 15 行：0..14\n\n    localparam D_UP    = 2&#x27;b00;\n    localparam D_DOWN  = 2&#x27;b01;\n    localparam D_LEFT  = 2&#x27;b10;\n    localparam D_RIGHT = 2&#x27;b11;\n\n    reg [4:0] bx [0:31];\n    reg [3:0] by [0:31];\n    reg [5:0] len;\n    reg [1:0] cur_dir;\n\n    wire [7:0] rng;\n    reg        lfsr_en;\n\n    ch5_lfsr u_lfsr (\n        .clk(clk), .rst_n(rst_n), .en(lfsr_en), .rng(rng)\n    );\n\n    integer i;\n    reg [1:0] next_dir;\n    reg [4:0] nx;\n    reg [3:0] ny;\n    reg       wall;\n    reg       self;\n    reg       eat;\n\n    // 1) 下一方向（禁止 180° 反向）\n    always @(*) begin\n        next_dir = cur_dir;\n        if (dir_cmd != cur_dir) begin\n            case (cur_dir)\n                D_UP:    if (dir_cmd != D_DOWN)  next_dir = dir_cmd;\n                D_DOWN:  if (dir_cmd != D_UP)    next_dir = dir_cmd;\n                D_LEFT:  if (dir_cmd != D_RIGHT) next_dir = dir_cmd;\n                D_RIGHT: if (dir_cmd != D_LEFT)  next_dir = dir_cmd;\n                default: next_dir = dir_cmd;\n            endcase\n        end\n    end\n\n    // 2) 由 next_dir 推算新头坐标\n    always @(*) begin\n        case (next_dir)\n            D_UP:    begin nx = head_x;       ny = head_y - 4&#x27;d1; end\n            D_DOWN:  begin nx = head_x;       ny = head_y + 4&#x27;d1; end\n            D_LEFT:  begin nx = head_x - 5&#x27;d1; ny = head_y;       end\n            default: begin nx = head_x + 5&#x27;d1; ny = head_y;      end  // D_RIGHT\n        endcase\n    end\n\n    // 3) 组合查询：(qx,qy) 是否落在当前蛇身\n    always @(*) begin\n        snake_hit = 1&#x27;b0;\n        for (i = 0; i &lt; 32; i = i + 1) begin\n            if (i &lt; len &amp;&amp; bx[i] == qx &amp;&amp; by[i] == qy)\n                snake_hit = 1&#x27;b1;\n        end\n    end\n\n    always @(posedge clk or negedge rst_n) begin\n        if (!rst_n) begin\n            bx[0] = 5&#x27;d5; by[0] = 4&#x27;d7;\n            bx[1] = 5&#x27;d4; by[1] = 4&#x27;d7;\n            bx[2] = 5&#x27;d3; by[2] = 4&#x27;d7;\n            bx[3] = 5&#x27;d0; by[3] = 4&#x27;d0;\n            len        &lt;= 6&#x27;d3;\n            cur_dir    &lt;= D_RIGHT;\n            head_x     &lt;= 5&#x27;d5; head_y &lt;= 4&#x27;d7;\n            food_x     &lt;= 5&#x27;d7; food_y &lt;= 4&#x27;d7;\n            score      &lt;= 8&#x27;d0;\n            game_over  &lt;= 1&#x27;b0;\n            lfsr_en    &lt;= 1&#x27;b0;\n            food_eaten &lt;= 1&#x27;b0;\n        end else if (restart) begin\n            bx[0] = 5&#x27;d5; by[0] = 4&#x27;d7;\n            bx[1] = 5&#x27;d4; by[1] = 4&#x27;d7;\n            bx[2] = 5&#x27;d3; by[2] = 4&#x27;d7;\n            len        &lt;= 6&#x27;d3;\n            cur_dir    &lt;= D_RIGHT;\n            head_x     &lt;= 5&#x27;d5; head_y &lt;= 4&#x27;d7;\n            food_x     &lt;= 5&#x27;d7; food_y &lt;= 4&#x27;d7;\n            score      &lt;= 8&#x27;d0;\n            game_over  &lt;= 1&#x27;b0;\n            lfsr_en    &lt;= 1&#x27;b0;\n            food_eaten &lt;= 1&#x27;b0;\n        end else begin\n            lfsr_en    &lt;= 1&#x27;b0;\n            food_eaten &lt;= 1&#x27;b0;\n\n            if (frame_tick &amp;&amp; !game_over) begin\n                cur_dir &lt;= next_dir;\n\n                // 撞墙（越界）\n                wall = (nx &gt; GX_MAX) || (ny &gt; GY_MAX);\n\n                // 撞自身\n                self = 1&#x27;b0;\n                for (i = 0; i &lt; len; i = i + 1) begin\n                    if (bx[i] == nx &amp;&amp; by[i] == ny)\n                        self = 1&#x27;b1;\n                end\n\n                if (wall || self) begin\n                    game_over &lt;= 1&#x27;b1;\n                end else begin\n                    // 是否吃到食物\n                    eat = (nx == food_x &amp;&amp; ny == food_y);\n\n                    // 蛇身后移，新头入 index0\n                    for (i = MAX_LEN - 1; i &gt; 0; i = i - 1) begin\n                        bx[i] = bx[i-1];\n                        by[i] = by[i-1];\n                    end\n                    bx[0] = nx;\n                    by[0] = ny;\n                    head_x &lt;= nx;\n                    head_y &lt;= ny;\n\n                    if (eat) begin\n                        if (len &lt; MAX_LEN)\n                            len &lt;= len + 1&#x27;b1;\n                        score      &lt;= score + 1&#x27;b1;\n                        food_eaten &lt;= 1&#x27;b1;\n                        lfsr_en    &lt;= 1&#x27;b1;\n                        food_x &lt;= {1&#x27;b0, rng[4:0]};\n                        food_y &lt;= rng[7:4];\n                    end\n                end\n            end\n        end\n    end\nendmodule\n"}, {"file": "code/phase4/tb_ch5_snake_core.v", "type": "verilog", "role": "testbench", "title": "tb_ch5_snake_core.v", "codeHtml": "// tb_ch5_snake_core.v — 贪吃蛇核心自检：直行/禁反向/吃食物增长/撞墙/撞自身/重启\n`timescale 1ns/1ps\nmodule tb_ch5_snake_core;\n    reg clk = 0;\n    reg rst_n = 0;\n    reg frame_tick = 0;\n    reg [1:0] dir_cmd = 2&#x27;b11;\n    reg restart = 0;\n    wire game_over;\n    wire [7:0] score;\n    wire [4:0] food_x;\n    wire [3:0] food_y;\n    wire [4:0] head_x;\n    wire [3:0] head_y;\n    wire [4:0] qx = 5&#x27;d0;\n    wire [3:0] qy = 4&#x27;d0;\n    wire snake_hit;\n    wire food_eaten;\n\n    ch5_snake_core u_dut (\n        .clk(clk), .rst_n(rst_n), .frame_tick(frame_tick), .dir_cmd(dir_cmd),\n        .restart(restart), .game_over(game_over), .score(score),\n        .food_x(food_x), .food_y(food_y), .head_x(head_x), .head_y(head_y),\n        .qx(qx), .qy(qy), .snake_hit(snake_hit), .food_eaten(food_eaten)\n    );\n    always #10 clk = ~clk;\n\n    initial begin\n        rst_n = 0; restart = 0; dir_cmd = 2&#x27;b11;\n        #55; rst_n = 1; #20;\n\n        // 初始：头(5,7) 朝右，食物(7,7)\n        if (head_x == 5 &amp;&amp; head_y == 4&#x27;d7 &amp;&amp; score == 8&#x27;d0)\n            $display(&quot;CORE OK: init head=(%0d,%0d) food=(%0d,%0d)&quot;, head_x, head_y, food_x, food_y);\n        else\n            $display(&quot;CORE FAIL: init head=(%0d,%0d)&quot;, head_x, head_y);\n\n        // 直行一格（右）-&gt; 头(6,7)\n        dir_cmd = 2&#x27;b11;\n        @(posedge clk); frame_tick = 1; @(posedge clk); frame_tick = 0; #20;\n        if (head_x == 6 &amp;&amp; head_y == 4&#x27;d7)\n            $display(&quot;CORE OK: straight right -&gt; head=(%0d,%0d)&quot;, head_x, head_y);\n        else\n            $display(&quot;CORE FAIL: straight -&gt; head=(%0d,%0d)&quot;, head_x, head_y);\n\n        // 禁止反向：按左（应被忽略仍向右）-&gt; 头(7,7)，吃到食物 score=1\n        dir_cmd = 2&#x27;b10;\n        @(posedge clk); frame_tick = 1; @(posedge clk); frame_tick = 0; #20;\n        if (head_x == 7 &amp;&amp; head_y == 4&#x27;d7 &amp;&amp; score == 8&#x27;d1)\n            $display(&quot;CORE OK: reverse-blocked &amp; eat -&gt; head=(%0d,%0d) score=%0d&quot;, head_x, head_y, score);\n        else\n            $display(&quot;CORE FAIL: rev/eat -&gt; head=(%0d,%0d) score=%0d&quot;, head_x, head_y, score);\n\n        // 撞墙：持续向左多步，头 x 越界 -&gt; game_over\n        dir_cmd = 2&#x27;b10;\n        @(posedge clk); frame_tick = 1; @(posedge clk); frame_tick = 0; #20;\n        @(posedge clk); frame_tick = 1; @(posedge clk); frame_tick = 0; #20;\n        @(posedge clk); frame_tick = 1; @(posedge clk); frame_tick = 0; #20;\n        @(posedge clk); frame_tick = 1; @(posedge clk); frame_tick = 0; #20;\n        @(posedge clk); frame_tick = 1; @(posedge clk); frame_tick = 0; #20;\n        @(posedge clk); frame_tick = 1; @(posedge clk); frame_tick = 0; #20;\n        if (game_over == 1&#x27;b1)\n            $display(&quot;CORE OK: wall collision game_over=1&quot;);\n        else\n            $display(&quot;CORE FAIL: no wall game_over head=(%0d,%0d)&quot;, head_x, head_y);\n\n        // 重启\n        @(posedge clk); restart = 1; @(posedge clk); restart = 0; #20;\n        if (head_x == 5 &amp;&amp; head_y == 4&#x27;d7 &amp;&amp; score == 8&#x27;d0 &amp;&amp; game_over == 1&#x27;b0)\n            $display(&quot;CORE OK: restart -&gt; head=(%0d,%0d) score=%0d&quot;, head_x, head_y, score);\n        else\n            $display(&quot;CORE FAIL: restart -&gt; head=(%0d,%0d) score=%0d go=%0d&quot;, head_x, head_y, score, game_over);\n\n        // 撞自身：上-&gt;右-&gt;下-&gt;左 绕小方圈\n        dir_cmd = 2&#x27;b00;\n        @(posedge clk); frame_tick = 1; @(posedge clk); frame_tick = 0; #20;\n        dir_cmd = 2&#x27;b11;\n        @(posedge clk); frame_tick = 1; @(posedge clk); frame_tick = 0; #20;\n        dir_cmd = 2&#x27;b01;\n        @(posedge clk); frame_tick = 1; @(posedge clk); frame_tick = 0; #20;\n        dir_cmd = 2&#x27;b10;\n        @(posedge clk); frame_tick = 1; @(posedge clk); frame_tick = 0; #20;\n        if (game_over == 1&#x27;b1)\n            $display(&quot;CORE OK: self collision game_over=1&quot;);\n        else\n            $display(&quot;CORE FAIL: no self collision h
