m.svg", "title": "发送状态机", "caption": "IDLE→START→DATA→STOP，由波特率 tick 驱动。", "svgRaw": "<svg xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"0 0 820 300\" font-family=\"system-ui,sans-serif\" font-size=\"12\">\n  <rect x=\"0\" y=\"0\" width=\"820\" height=\"300\" fill=\"#0d1420\"/>\n  <text x=\"410\" y=\"24\" fill=\"#7dd3fc\" text-anchor=\"middle\" font-size=\"15\" font-weight=\"bold\">UART 发送状态机（uart_tx FSM）<\/text>\n\n  <!-- states as rounded boxes -->\n  <g fill=\"#1e293b\" stroke=\"#22d3ee\" stroke-width=\"2\">\n    <rect x=\"60\"  y=\"120\" width=\"130\" height=\"60\" rx=\"10\"/>\n    <rect x=\"260\" y=\"120\" width=\"130\" height=\"60\" rx=\"10\"/>\n    <rect x=\"460\" y=\"120\" width=\"130\" height=\"60\" rx=\"10\"/>\n    <rect x=\"660\" y=\"120\" width=\"130\" height=\"60\" rx=\"10\"/>\n  <\/g>\n  <text x=\"125\" y=\"148\" fill=\"#e2e8f0\" text-anchor=\"middle\" font-weight=\"bold\">IDLE<\/text>\n  <text x=\"125\" y=\"166\" fill=\"#94a3b8\" text-anchor=\"middle\">tx_out=1, ready<\/text>\n  <text x=\"325\" y=\"148\" fill=\"#e2e8f0\" text-anchor=\"middle\" font-weight=\"bold\">START<\/text>\n  <text x=\"325\" y=\"166\" fill=\"#94a3b8\" text-anchor=\"middle\">拉低起始位<\/text>\n  <text x=\"525\" y=\"148\" fill=\"#e2e8f0\" text-anchor=\"middle\" font-weight=\"bold\">DATA<\/text>\n  <text x=\"525\" y=\"166\" fill=\"#94a3b8\" text-anchor=\"middle\">LSB 移出 8 位<\/text>\n  <text x=\"725\" y=\"148\" fill=\"#e2e8f0\" text-anchor=\"middle\" font-weight=\"bold\">STOP<\/text>\n  <text x=\"725\" y=\"166\" fill=\"#94a3b8\" text-anchor=\"middle\">拉高停止位<\/text>\n\n  <!-- arrows -->\n  <g stroke=\"#34d399\" stroke-width=\"2\" fill=\"none\" marker-end=\"url(#arr)\">\n    <line x1=\"190\" y1=\"150\" x2=\"258\" y2=\"150\"/>\n    <line x1=\"390\" y1=\"150\" x2=\"458\" y2=\"150\"/>\n    <line x1=\"590\" y1=\"150\" x2=\"658\" y2=\"150\"/>\n  <\/g>\n  <!-- return arrow STOP -> IDLE -->\n  <path d=\"M 725 180 C 725 250, 125 250, 125 182\" stroke=\"#34d399\" stroke-width=\"2\" fill=\"none\" marker-end=\"url(#arr)\"/>\n\n  <defs>\n    <marker id=\"arr\" markerWidth=\"10\" markerHeight=\"10\" refX=\"8\" refY=\"3\" orient=\"auto\">\n      <path d=\"M0,0 L8,3 L0,6 Z\" fill=\"#34d399\"/>\n    <\/marker>\n  <\/defs>\n\n  <!-- transition labels -->\n  <text x=\"224\" y=\"138\" fill=\"#fcd34d\" text-anchor=\"middle\" font-size=\"11\">tx_valid=1<\/text>\n  <text x=\"424\" y=\"138\" fill=\"#fcd34d\" text-anchor=\"middle\" font-size=\"11\">baud_tick<\/text>\n  <text x=\"624\" y=\"138\" fill=\"#fcd34d\" text-anchor=\"middle\" font-size=\"11\">bit_cnt=7<\/text>\n  <text x=\"410\" y=\"268\" fill=\"#fcd34d\" text-anchor=\"middle\" font-size=\"11\">baud_tick 后置 ready=1，回到空闲<\/text>\n\n  <text x=\"410\" y=\"290\" fill=\"#94a3b8\" text-anchor=\"middle\">接收端 uart_rx 为对称结构：检测下降沿 → 中点采样 8 位 → 校验停止位 → rx_valid 脉冲<\/text>\n<\/svg>\n"}], "tools": [{"name": "通用引脚约束模板 fpga_common.xdc", "url": "../code/common/fpga_common.xdc", "required": true, "note": "相对本仓库；USB-UART 的 TX/RX 与 FPGA 交叉连接。"}, {"name": "板级适配方法 board-adaptation.md", "url": "../docs/board-adaptation.md", "required": true, "note": "按开发板替换 UART 引脚号。"}], "tasks": [{"id": "task-3-1-1", "text": "实现 UART 发送模块，每秒发送一个字符"}, {"id": "task-3-1-2", "text": "实现 UART 接收模块"}, {"id": "task-3-1-3", "text": "实现串口回显：电脑发什么，FPGA 返回什么"}], "cards": [{"q": "UART 一帧 8N1 的结构是？", "a": "1 位起始位(低) + 8 数据位(LSB先出) + 1 停止位(高)，共 10 位；空闲电平为高。", "tags": ["UART", "帧格式"]}, {"q": "50MHz 系统时钟、波特率 115200，每位占多少个时钟？", "a": "BIT_DIV = 50,000,000/115,200 ≈ 434；即每位约 434 个系统时钟。", "tags": ["波特率", "分频"]}, {"q": "16 倍过采样的分频系数怎么算？", "a": "OV_DIV = 50,000,000/(115,200×16) ≈ 27；每 27 个时钟采一个样本点，16 个点覆盖一位。", "tags": ["过采样"]}, {"q": "为什么接收端要在每位中间采样而不是沿边？", "a": "跳变沿处电平不稳定、易受毛刺影响；在位中央采样距离两端跳变都最远，最可靠。", "tags": ["接收", "采样"]}, {"q": "为什么对 rx_in 要做两级寄存器同步？", "a": "外部异步信号可能违反触发器建立/保持时间，导致亚稳态；两级同步器把亚稳态风险降到可忽略。", "tags": ["亚稳态", "同步"]}, {"q": "多数表决（3 取 2）解决什么问题？", "a": "在采样点附近连续采 3 个样本取多数，能滤掉个别毛刺导致的误采样，提高抗干扰能力。", "tags": ["多数表决"]}, {"q": "UART 数据位是高位先出还是低位先出？", "a": "LSB 最低位先出。", "tags": ["UART", "位序"]}, {"q": "发送字节 0xA5，线上前几位电平顺序是？", "a": "0xA5=1010_0101，LSB 先出：1,0,1,0,0,1,0,1。", "tags": ["UART", "位序"]}, {"q": "frame_err 什么时候置位？", "a": "在停止位中点采样到低电平（应为高）时置位，表示帧格式错误。", "tags": ["帧错误"]}, {"q": "USB-UART 和 FPGA 的 TX/RX 怎么接？", "a": "交叉连接：FPGA_TX 接 USB-UART_RX，FPGA_RX 接 USB-UART_TX，共地。", "tags": ["接线"]}], "quiz": [{"q": "50MHz、波特率 115200，每位大约占多少个系统时钟？", "options": ["434", "27", "1152", "50000"], "answer": 0, "explain": "BIT_DIV=50,000,000/115,200≈434。"}, {"q": "UART 8N1 一帧共有多少位？", "options": ["8", "9", "10", "11"], "answer": 2, "explain": "1起始+8数据+1停止=10位。"}, {"q": "接收端 16 倍过采样 OV_DIV 约为？", "options": ["434", "27", "16", "270"], "answer": 1, "explain": "OV_DIV=50M/(115200×16)≈27。"}, {"q": "UART 数据位的发送顺序是？", "options": ["MSB 先出", "LSB 先出", "同时出", "随机"], "answer": 1, "explain": "UART 约定最低位 D0 最先发出。"}, {"q": "停止位中点采到低电平会导致？", "options": ["正常接收", "frame_err 帧错误", "自动重发", "波特率加倍"], "answer": 1, "explain": "停止位应为高，采到低说明帧错误。"}], "docHtml": "<h1>3.1 UART 串口通信<\/h1>\n<p>UART（Universal Asynchronous Receiver/Transmitter，通用异步收发）是 FPGA 最常用的\"和电脑对话\"接口：两根线（TX/RX）、没有共享时钟、靠双方约定好的<strong>波特率<\/strong>逐位收发。本仓库用它实现\"电脑发什么，FPGA 原样回什么\"的串口回显。<\/p>\n<h2>帧格式：8N1<\/h2>\n<p>UART 没有时钟线，收发双方事先约定每秒传多少位（波特率）。一帧数据的标准结构为：<\/p>\n<pre><code>空闲(高) | 起始位(0) | D0 D1 ... D7 | 停止位(1) | 空闲(高)\n<\/code><\/pre>\n<ul>\n<li><strong>空闲电平为高<\/strong>。发送方一拉低就表示\"一帧开始\"（起始位）。<\/li>\n<li><strong>8 个数据位<\/strong>，<strong>LSB（最低位）先出<\/strong>。<\/li>\n<li><strong>1 个停止位<\/strong>为高电平，给接收机一点恢复时间。<\/li>\n<li>\"8N1\" 含义：8 数据位、N（无）校验、1 停止位。可选的偶/奇校验位本仓库先不启用。<\/li>\n<\/ul>\n<p>例：发送字节 <code>0xA5 = 1010_0101<\/code>，线上依次出现的电平是 <code>1,0,1,0,0,1,0,1<\/code>（低位先）。<\/p>\n<h2>波特率与分频计算<\/h2>\n<p>波特率即每秒传输的位数。常用 <code>115200<\/code>。板载系统时钟 <code>50MHz<\/code>，要\"每隔多少个系统时钟发一位\"？<\/p>\n<pre><code>BIT_DIV = CLK_FREQ_HZ / BAUD_RATE\n        = 50,000,000 / 115,200\n        = 434.027...  → 整数取 434\n<\/code><\/pre>\n<p>即每位占 <code>434<\/code> 个系统时钟。实际波特率 = <code>50,000,000 / 434 ≈ 115,207<\/code>，与标称 115200 误差约 0.006%，远低于 UART 允许的 ±2%，完全可靠。<\/p>\n<p>接收端为了在<strong>每位正中间<\/strong>采样（避开跳变沿毛刺），用 <strong>16 倍过采样<\/strong>：<\/p>\n<pre><code>OV_DIV = CLK_FREQ_HZ / (BAUD_RATE × 16)\n       = 50,000,000 / (115,200 × 16)\n       = 27.1  → 取 27\n<\/code><\/pre>\n<p>每 <code>27<\/code> 个系统时钟产生一个采样点，16 个采样点正好覆盖一个位宽。检测到起始位下降沿后把相位计数器复位，让\"第 8 个采样点\"落在每位中央。<\/p>\n<h2>发送模块 uart_tx（移位发送 FSM）<\/h2>\n<p>发送端比较简单：一个四状态 FSM <code>IDLE → START → DATA → STOP<\/code>，配合一个\"每 BIT_DIV 个时钟打一拍\"的波特率 tick。<\/p>\n<ul>\n<li><code>IDLE<\/code>：<code>tx_out=1<\/code>，<code>tx_ready=1<\/code>；若 <code>tx_valid=1<\/code>，锁存 <code>tx_data<\/code> 进入 <code>START<\/code>。<\/li>\n<li><code>START<\/code>：拉低 <code>tx_out<\/code>，等一个 tick。<\/li>\n<li><code>DATA<\/code>：每次 tick 把 <code>shift[0]<\/code> 推到线上，右移一位，数满 8 位进入 <code>STOP<\/code>。<\/li>\n<li><code>STOP<\/code>：拉高一个 tick，回到 <code>IDLE<\/code> 并置 <code>tx_ready<\/code>。<\/li>\n<\/ul>\n<h2>接收模块 uart_rx（过采样 + 多数表决）<\/h2>\n<p>接收端要\"自己找位的中央\"，比发送端多三步：<\/p>\n<ol>\n<li><strong>输入同步<\/strong>：<code>rx_in<\/code> 经过两级寄存器再使用，防止外部异步信号造成触发器亚稳态。<\/li>\n<li><strong>下降沿检测<\/strong>：空闲为高，一旦同步后的 <code>rx_sync<\/code> 变低，认为是起始位，启动接收。<\/li>\n<li><strong>中点采样 + 多数表决<\/strong>：在每位中央附近连续采 3 个样本（<code>samp_sh[2:0]<\/code>），3 取 2 得到该位值，抗毛刺。停止位中点采到 0 则置 <code>frame_err<\/code>。<\/li>\n<\/ol>\n<p>收完 8 位后置 <code>rx_valid=1<\/code>（一个时钟周期脉冲），同时把字节放到 <code>rx_data<\/code>。<\/p>\n<h2>串口回显 uart_echo_top<\/h2>\n<p>把 rx 和 tx 拼起来：收到字节后锁存到 <code>echo_data<\/code>，拉高 <code>echo_req<\/code> 请求 tx 发送；tx 空闲（<code>tx_ready<\/code>）时把它发出去。这样电脑串口助手发一个字符，FPGA 就原样回一个字符。<\/p>\n<h2>上板提示<\/h2>\n<p>引脚分配见 <code>code/common/fpga_common.xdc<\/code>（相对本仓库）与 <code>docs/board-adaptation.md<\/code>。USB-UART 芯片（如 CH340/FT2232）的 TX/RX 要和 FPGA 的 RX/TX <strong>交叉连接<\/strong>。串口助手设为 <code>115200, 8N1, 无校验<\/code>。<\/p>\n<blockquote>\n<p>说明：本环境无 Vivado，代码经结构校验通过，但未真正综合与上板；时序与引脚上板需在 Vivado 中自行验证。<\/p>\n<\/blockquote>"}, {"chapterId": "3.2", "phase": 3, "slug": "spi-oled", "title": "SPI 协议与 OLED 驱动", "summary": "CPOL/CPHA 四种时序、SCLK 分频（50M/1M 时 HALF=25）、SSD1306 128x64 的命令/数据、初始化序列、显存页列映射与 8x16 字模显示。", "doc": "docs/phase3/ch2-spi-oled.md", "code": [{"file": "code/phase3/spi_master.v", "type": "verilog", "role": "synthesizable", "title": "spi_master.v — CPOL/CPHA 可配、SCLK 分频、片选", "codeHtml": "//==============================================================================\n// spi_master.v  —  可综合：SPI 主机（CPOL/CPHA 可配，MSB 先出）\n// 说明：\n//   - SCLK 由系统时钟分频：HALF = CLK/(2*SCLK_HZ)，sclk 每 HALF 个时钟翻转一次。\n//   - CPOL：sclk 空闲电平（0 或 1）。\n//   - CPHA=0（本仓库 OLED 使用）：数据在 sclk 空闲相位准备好(mosi)，\n//     在 sclk 有效相位中间采样 miso。\n//   - 片选 cs_n 传输期间拉低，结束拉高。\n// 例：50MHz、SCLK=1MHz -&gt; HALF=25，sclk 周期 50 个时钟 = 1us。\n//==============================================================================\n`default_nettype none\n\nmodule spi_master #(\n    parameter integer CLK_FREQ_HZ = 50_000_000,\n    parameter integer SCLK_HZ     = 1_000_000,\n    parameter         CPOL         = 1&#x27;b0,\n    parameter         CPHA        = 1&#x27;b0\n)(\n    input  wire       clk,\n    input  wire       rst_n,\n    input  wire [7:0] tx_data,    // 待发送字节\n    input  wire       tx_valid,   // 请求发送一字节\n    output wire       tx_ready,   // 空闲可接收新字节\n    output reg        sclk,\n    output reg        mosi,\n    input  wire       miso,\n    output reg  [7:0] rx_data,   // 收到的字节\n    output reg        cs_n\n);\n\n    localparam integer HALF = CLK_FREQ_HZ / (2 * SCLK_HZ);\n\n    localparam S_IDLE  = 0;\n    localparam S_LOAD  = 1;\n    localparam S_SETUP  = 2;   // sclk 空闲相位，mosi 保持稳定\n    localparam S_SAMPLE= 3;   // sclk 有效相位，采样 miso、移位\n    localparam S_DONE  = 4;\n\n    reg [2:0]  state;\n    reg [15:0] div_cnt;\n    reg [2:0]  bit_cnt;\n    reg [7:0]  shift;\n    reg        ready_q;\n\n    wire cpha_unused = CPHA;   // 保留参数接口；本实现面向 CPHA=0\n\n    always @(posedge clk or negedge rst_n) begin\n        if (!rst_n) begin\n            state   &lt;= S_IDLE;\n            div_cnt &lt;= 16&#x27;d0;\n            bit_cnt &lt;= 3&#x27;d0;\n            shift   &lt;= 8&#x27;d0;\n            sclk    &lt;= CPOL;\n            mosi    &lt;= 1&#x27;b0;\n            cs_n    &lt;= 1&#x27;b1;\n            rx_data &lt;= 8&#x27;d0;\n            ready_q &lt;= 1&#x27;b1;\n        end else begin\n            case (state)\n            S_IDLE: begin\n                sclk    &lt;= CPOL;\n                cs_n    &lt;= 1&#x27;b1;\n                ready_q &lt;= 1&#x27;b1;\n                if (tx_valid) begin\n                    shift   &lt;= tx_data;\n                    ready_q &lt;= 1&#x27;b0;\n                    state   &lt;= S_LOAD;\n                    div_cnt &lt;= 16&#x27;d0;\n                end\n            end\n            S_LOAD: begin\n                cs_n  &lt;= 1&#x27;b0;\n                sclk  &lt;= CPOL;\n                mosi  &lt;= shift[7];      // MSB 先出\n                bit_cnt &lt;= 3&#x27;d0;\n                div_cnt &lt;= 16&#x27;d0;\n                state &lt;= S_SETUP;\n            end\n            S_SETUP: begin\n                cs_n &lt;= 1&#x27;b0;\n                sclk &lt;= CPOL;           // 空闲相位：mosi 已稳定\n                if (div_cnt &gt;= HALF[15:0] - 1) begin\n                    div_cnt &lt;= 16&#x27;d0;\n                    state   &lt;= S_SAMPLE;\n                end else begin\n                    div_cnt &lt;= div_cnt + 1&#x27;b1;\n                end\n            end\n            S_SAMPLE: begin\n                cs_n &lt;= 1&#x27;b0;\n                sclk &lt;= ~CPOL;          // 有效相位\n                if (div_cnt &gt;= HALF[15:0] - 1) begin\n                    div_cnt &lt;= 16&#x27;d0;\n                    rx_data &lt;= {rx_data[6:0], miso};   // 采样 MISO\n                    shift   &lt;= {shift[6:0], 1&#x27;b0};\n                    mosi    &lt;= shift[6];               // 准备下一位\n                    bit_cnt &lt;= bit_cnt + 1&#x27;b1;\n                    if (bit_cnt == 3&#x27;d7) state &lt;= S_DONE;\n                    else                 state &lt;= S_SETUP;\n                end else begin\n                    div_cnt &lt;= div_cnt + 1&#x27;b1;\n                end\n            end\n            S_DONE: begin\n                cs_n    &lt;= 1&#x27;b1;\n                sclk    &lt;= CPOL;\n                ready_q &lt;= 1&#x27;b1;\n                state   &lt;= S_IDLE;\n            end\n            default: state &lt;= S_IDLE;\n            endcase\n        end\n    end\n\n    assign tx_ready = ready_q;\n\nendmodule\n\n`default_nettype wire\n"}, {"file": "code/phase3/tb_spi_master.v", "type": "verilog", "role": "testbench", "title": "tb_spi_master.v — 校验 CPOL0/CPHA0 下 MOSI 与 SCLK 沿关系", "codeHtml": "//==============================================================================\n// tb_spi_master.v  —  Testbench：SPI 主机自检\n// 1) CPOL=0/CPHA=0 下，cs_n 传输期间拉低；\n// 2) 一帧 sclk 应恰好产生 8 个有效脉冲；\n// 3) 在 sclk 上升沿采样 mosi，MSB 先出，重组应等于 0xA5。\n//==============================================================================\n`timescale 1ns/1ps\n`default_nettype none\n\nmodule tb_spi_master;\n\n    reg        clk = 1&#x27;b0;\n    reg        rst_n = 1&#x27;b0;\n    reg  [7:0] tx_data = 8&#x27;h00;\n    reg        tx_valid = 1&#x27;b0;\n    wire       tx_ready;\n    wire       sclk;\n    wire       mosi;\n    wire       miso;\n    wire [7:0] rx_data;\n    wire       cs_n;\n\n    integer    k, j;\n    reg [7:0]  sampled;\n    integer    rise_cnt;\n    integer    pass_cnt, fail_cnt;\n    reg        sclk_d;\n\n    always #10 clk = ~clk;   // 50MHz\n\n    assign miso = 1&#x27;b0;\n\n    spi_master #(\n        .CLK_FREQ_HZ(50_000_000),\n        .SCLK_HZ    (100_000),\n        .CPOL       (1&#x27;b0),\n        .CPHA       (1&#x27;b0)\n    ) u_dut (\n        .clk      (clk),\n        .rst_n    (rst_n),\n        .tx_data  (tx_data),\n        .tx_valid (tx_valid),\n        .tx_ready (tx_ready),\n        .sclk     (sclk),\n        .mosi     (mosi),\n        .miso     (miso),\n        .rx_data  (rx_data),\n        .cs_n     (cs_n)\n    );\n\n    // 记录 sclk 上升沿\n    always @(posedge clk) begin\n        sclk_d &lt;= sclk;\n    end\n    wire sclk_rise = (sclk === 1&#x27;b1 &amp;&amp; sclk_d === 1&#x27;b0);\n\n    initial begin\n        pass_cnt = 0; fail_cnt = 0;\n        rst_n = 1&#x27;b0;\n        for (k = 0; k &lt; 30; k = k + 1) @(posedge clk);\n        rst_n = 1&#x27;b1;\n        for (k = 0; k &lt; 30; k = k + 1) @(posedge clk);\n\n        // 发起发送 0xA5\n        @(posedge clk);\n        tx_data  = 8&#x27;hA5;\n        tx_valid = 1&#x27;b1;\n        @(posedge clk);\n        tx_valid = 1&#x27;b0;\n\n        // 监测整个传输：cs_n 应在低电平期间出现 8 个 sclk 上升沿，并在上升沿采样 mosi\n        sampled  = 8&#x27;h00;\n        rise_cnt = 0;\n        // 等到 cs_n 拉低\n        k = 0;\n        while (cs_n === 1&#x27;b1 &amp;&amp; k &lt; 20000) begin @(posedge clk); k = k + 1; end\n\n        // 在 cs_n=0 期间逐时钟监测\n        k = 0;\n        while (cs_n === 1&#x27;b0 &amp;&amp; k &lt; 200000) begin\n            @(posedge clk);\n            if (sclk_rise) begin\n                rise_cnt = rise_cnt + 1;\n                sampled  = {sampled[6:0], mosi};   // MSB 先入\n            end\n            k = k + 1;\n        end\n\n        $display(&quot;[CHK] rise_cnt=%0d sampled=8&#x27;h%0h&quot;, rise_cnt, sampled);\n        if (rise_cnt == 8) begin\n            pass_cnt = pass_cnt + 1;\n            $display(&quot;[CHK] 8 个 sclk 脉冲  OK&quot;);\n        end else begin\n            fail_cnt = fail_cnt + 1;\n            $display(&quot;[CHK] sclk 脉冲数=%0d (expect 8)  FAIL&quot;, rise_cnt);\n        end\n        if (sampled == 8&#x27;hA5) begin\n            pass_cnt = pass_cnt + 1;\n            $display(&quot;[CHK] MOSI 字节 = 8&#x27;hA5  OK&quot;);\n        end else begin\n            fail_cnt = fail_cnt + 1;\n            $display(&quot;[CHK] MOSI 字节 = 8&#x27;h%0h (expect A5)  FAIL&quot;, sampled);\n        end\n\n        $display(&quot;========================================&quot;);\n        $display(&quot;tb_spi_master: PASS=%0d FAIL=%0d&quot;, pass_cnt, fail_cnt);\n        $display(&quot;========================================&quot;);\n        #1000;\n        $finish;\n    end\n\nendmodule\n\n`default_nettype wire\n"}, {"file": "code/phase3/oled_ssd1306.v", "type": "verilog", "role": "synthesizable", "title": "oled_ssd1306.v — 初始化序列+定位+写字符+字模 ROM", "codeHtml": "//==============================================================================\n// oled_ssd1306.v  —  可综合：0.96&quot; 128x64 OLED（SSD1306，4 线 SPI）控制器\n// 对外引脚：cs_n / dc(0=命令,1=数据) / sclk / mosi(din)。\n// 流程：\n//   1) 上电跑初始化命令序列（充电泵开、分辨率、扫描方向、显示开）；\n//   2) 空闲时接收 char_wr，按&quot;页/列定位命令 + 8x16 字模数据&quot;写一个字符。\n// 字模 ROM：内置数字 0/1 的 8x16 示例字模（上页8列 + 下页8列），\n//           其余字符占位为 0，可按需扩展为完整 ASCII 字库。\n//==============================================================================\n`default_nettype none\n\nmodule oled_ssd1306 #(\n    parameter integer CLK_FREQ_HZ = 50_000_000,\n    parameter integer SCLK_HZ     = 1_000_000\n)(\n    input  wire       clk,\n    input  wire       rst_n,\n    // 写字符接口\n    input  wire [6:0] char_col,    // 列 0..127\n    input  wire [2:0] char_page,   // 页 0..7\n    input  wire [7:0] char_code,   // ASCII（实现 &#x27;0&#x27;-&#x27;9&#x27;）\n    input  wire       char_wr,     // 拉高一次：写一个字符\n    output wire       busy,\n    // OLED 物理引脚\n    output wire       oled_cs_n,\n    output reg        oled_dc,\n    output wire       oled_sclk,\n    output wire       oled_mosi\n);\n\n    // ---- 与 spi_master 的握手 ----\n    wire        spi_ready;\n    reg  [7:0]  spi_tx;\n    reg         spi_req;\n    wire [7:0]  spi_rx_unused;\n\n    spi_master #(\n        .CLK_FREQ_HZ(CLK_FREQ_HZ),\n        .SCLK_HZ    (SCLK_HZ),\n        .CPOL       (1&#x27;b0),\n        .CPHA       (1&#x27;b0)\n    ) u_spi (\n        .clk      (clk),\n        .rst_n    (rst_n),\n        .tx_data  (spi_tx),\n        .tx_valid (spi_req),\n        .tx_ready (spi_ready),\n        .sclk     (oled_sclk),\n        .mosi     (oled_mosi),\n        .miso     (1&#x27;b0),\n        .rx_data  (spi_rx_unused),\n        .cs_n     (oled_cs_n)\n    );\n\n    // ---- 状态定义 ----\n    localparam S_IDLE    = 0;\n    localparam S_TX_START = 1;  // 等 spi_ready，发起一次发送\n    localparam S_TX_WAIT = 2;  // 等本字节发完\n\n    reg [1:0]  state;\n    reg        mode;           // 0=初始化命令, 1=写字符\n    reg [5:0]  step;\n    reg [6:0]  cur_col;\n    reg [2:0]  cur_page;\n    reg [7:0]  glyph_idx;\n\n    localparam INIT_LEN = 25;\n    localparam CHAR_LEN = 20;\n\n    // 初始化命令序列（dc=0）\n    function [7:0] init_cmd;\n        input [5:0] idx;\n        begin\n            case (idx)\n            6&#x27;d0:  init_cmd = 8&#x27;hAE;  // display off\n            6&#x27;d1:  init_cmd = 8&#x27;hD5;  // clock div\n            6&#x27;d2:  init_cmd = 8&#x27;h80;\n            6&#x27;d3:  init_cmd = 8&#x27;hA8;  // multiplex 1/64\n            6&#x27;d4:  init_cmd = 8&#x27;h3F;\n            6&#x27;d5:  init_cmd = 8&#x27;hD3;  // display offset\n            6&#x27;d6:  init_cmd = 8&#x27;h00;\n            6&#x27;d7:  init_cmd = 8&#x27;h40;  // start line = 0\n            6&#x27;d8:  init_cmd = 8&#x27;h8D;  // charge pump\n            6&#x27;d9:  init_cmd = 8&#x27;h14;\n            6&#x27;d10: init_cmd = 8&#x27;h20;  // memory addressing mode\n            6&#x27;d11: init_cmd = 8&#x27;h00;\n            6&#x27;d12: init_cmd = 8&#x27;hA1;  // segment remap\n            6&#x27;d13: init_cmd = 8&#x27;hC8;  // com scan dir\n            6&#x27;d14: init_cmd = 8&#x27;hDA;  // com pins\n            6&#x27;d15: init_cmd = 8&#x27;h12;\n            6&#x27;d16: init_cmd = 8&#x27;h81;  // contrast\n            6&#x27;d17: init_cmd = 8&#x27;hCF;\n            6&#x27;d18: init_cmd = 8&#x27;hD9;  // pre-charge\n            6&#x27;d19: init_cmd = 8&#x27;hF1;\n            6&#x27;d20: init_cmd = 8&#x27;hDB;  // vcomh\n            6&#x27;d21: init_cmd = 8&#x27;h40;\n            6&#x27;d22: init_cmd = 8&#x27;hA4;  // resume to gddr\n            6&#x27;d23: init_cmd = 8&#x27;hA6;  // normal display\n            6&#x27;d24: init_cmd = 8&#x27;hAF;  // display on\n            default: init_cmd = 8&#x27;h00;\n            endcase\n        end\n    endfunction\n\n    // ---- 字模 ROM：数字 0/1 的 8x16（上页8列 + 下页8列），其余占位 ----\n    reg [7:0] font_rom [0:159];\n    integer   fi;\n    initial begin\n        font_rom[ 0]=8&#x27;h3C; font_rom[ 1]=8&#x27;h42; font_rom[ 2]=8&#x27;h81; font_rom[ 3]=8&#x27;h81;\n        font_rom[ 4]=8&#x27;h81; font_rom[ 5]=8&#x27;h81; font_rom[ 6]=8&#x27;h42; font_rom[ 7]=8&#x27;h3C;\n        font_rom[ 8]=8&#x27;h3C; font_rom[ 9]=8&#x27;h42; font_rom[10]=8&#x27;h81; font_rom[11]=8&#x27;h81;\n        font_rom[12]=8&#x27;h81; font_rom[13]=8&#x27;h81; font_rom[14]=8&#x27;h42; font_rom[15]=8&#x27;h3C;\n        font_rom[16]=8&#x27;h08; font_rom[17]=8&#x27;h18; font_rom[18]=8&#x27;h08; font_rom[19]=8&#x27;h08;\n        font_rom[20]=8&#x27;h08; font_rom[21]=8&#x27;h08; font_rom[22]=8&#x27;h08; font_rom[23]=8&#x27;h7F;\n        font_rom[24]=8&#x27;h08; font_rom[25]=8&#x27;h18; font_rom[26]=8&#x27;h08; font_rom[27]=8&#x27;h08;\n        font_rom[28]=8&#x27;h08; font_rom[29]=8&#x27;h08; font_rom[30]=8&#x27;h08; font_rom[31]=8&#x27;h7F;\n        for (fi = 32; fi &lt; 160; fi = fi + 1) font_rom[fi] = 8&#x27;h00;\n    end\n\n    // 字符编码 -&gt; 字模索引：&#x27;0&#x27;-&#x27;9&#x27; -&gt; 0..9\n    always @(*) begin\n        if (char_code &gt;= 8&#x27;h30 &amp;&amp; char_code &lt;= 8&#x27;h39)\n            glyph_idx = char_code - 8&#x27;h30;\n        else\n            glyph_idx = 8&#x27;d0;\n    end\n\n    // ---- 写字符时根据 step 计算要发的字节与 dc ----\n    // step 0..2: 定位命令；3..10: 上页8列数据；11: 下页命令；12..19: 下页8列数据\n    reg [7:0] char_byte;\n    reg       char_dc;\n    always @(*) begin\n        case (step)\n        6&#x27;d0:  begin char_byte = {4&#x27;h0, cur_col[3:0]};     char_dc = 1&#x27;b0; end\n        6&#x27;d1:  begin char_byte = {4&#x27;h1, cur_col[7:4]};     char_dc = 1&#x27;b0; end\n        6&#x27;d2:  begin char_byte = {4&#x27;hB, cur_page};         char_dc = 1&#x27;b0; end\n        6&#x27;d3,6&#x27;d4,6&#x27;d5,6&#x27;d6,6&#x27;d7,6&#x27;d8,6&#x27;d9,6&#x27;d10:\n               begin char_byte = font_rom[glyph_idx*16 + (step-3)]; char_dc = 1&#x27;b1; end\n        6&#x27;d11: begin char_byte = {4&#x27;hB, cur_page + 3&#x27;d1};  char_dc = 1&#x27;b0; end\n        6&#x27;d12,6&#x27;d13,6&#x27;d14,6&#x27;d15,6&#x27;d16,6&#x27;d17,6&#x27;d18,6&#x27;d19:\n               begin char_byte = font_rom[glyph_idx*16 + 8 + (step-12)]; char_dc = 1&#x27;b1; end\n        default: begin char_byte = 8&#x27;h00; char_dc = 1&#x27;b0; end\n        endcase\n    end\n\n    // 当前要发送的字节：初始化用 init_cmd，写字符用 char_byte\n    wire [7:0] cur_byte = mode ? char_byte : init_cmd(step);\n    wire       cur_dc   = mode ? char_dc   : 1&#x27;b0;\n\n    // ---- 主 FSM ----\n    reg init_done;\n    always @(posedge clk or negedge rst_n) begin\n        if (!rst_n) begin\n            state     &lt;= S_IDLE;\n            mode      &lt;= 1&#x27;b0;\n            step      &lt;= 6&#x27;d0;\n            spi_req   &lt;= 1&#x27;b0;\n            spi_tx    &lt;= 8&#x27;d0;\n            oled_dc  &lt;= 1&#x27;b0;\n            cur_col  &lt;= 7&#x27;d0;\n            cur_page &lt;= 3&#x27;d0;\n            init_done &lt;= 1&#x27;b0;\n        end else begin\n            case (state)\n            S_IDLE: begin\n                spi_req &lt;= 1&#x27;b0;\n                if (!init_done) begin\n                    // 初始化阶段：继续发命令\n                    state &lt;= S_TX_START;\n                end else if (char_wr) begin\n                    cur_col  &lt;= char_col;\n                    cur_page &lt;= char_page;\n                    step     &lt;= 6&#x27;d0;\n                    mode     &lt;= 1&#x27;b1;\n                    state    &lt;= S_TX_START;\n                end\n            end\n\n            S_TX_START: begin\n                spi_tx  &lt;= cur_byte;\n                oled_dc &lt;= cur_dc;\n                if (spi_ready) begin\n                    spi_req &lt;= 1&#x27;b1;\n                    state   &lt;= S_TX_WAIT;\n                end\n            end\n\n            S_TX_WAIT: begin\n                spi_req &lt;= 1&#x27;b0;\n                if (spi_ready) begin\n                    // 本字节发完，推进 step\n                    if (mode == 1&#x27;b0) begin\n                        if (step &lt; INIT_LEN - 1) begin\n                            step  &lt;= step + 1&#x27;b1;\n                            state &lt;= S_TX_START;\n                        end else begin\n                            init_done &lt;= 1&#x27;b1;   // 初始化全部发完\n                            step     &lt;= 6&#x27;d0;\n                            state    &lt;= S_IDLE;\n                        end\n                    end else begin\n                        if (step &lt; CHAR_LEN - 1) begin\n                            step  &lt;= step + 1&#x27;b1;\n                            state &lt;= S_TX_START;\n                        end else begin\n                            mode  &lt;= 1&#x27;b0;       // 写字符结束\n                            step  &lt;= 6&#x27;d0;\n                            state &lt;= S_IDLE;\n                        end\n                    end\n                end\n            end\n\n            default: state &lt;= S_IDLE;\n            endcase\n        end\n    end\n\n    assign busy = (state != S_IDLE) || !init_done;\n\nendmodule\n\n`default_nettype wire\n"}, {"file": "code/phase3/tb_oled_ssd1306.v", "type": "verilog", "role": "testbench", "title": "tb_oled_ssd1306.v — 校验首条初始化命令与写数据时序", "codeHtml": "//==============================================================================\n// tb_oled_ssd1306.v  —  Testbench：SSD1306 控制器自检\n// 1) 捕获初始化阶段第一个 SPI 字节：应为 dc=0 且数据=0xAE（display off）；\n// 2) 初始化结束后发 char_wr，校验写字符过程中出现 dc=1（数据）事务。\n// 注意：SCLK 在 tb 里降到 100kHz 以缩短仿真时间。\n//==============================================================================\n`timescale 1ns/1ps\n`default_nettype none\n\nmodule tb_oled_ssd1306;\n\n    reg        clk = 1&#x27;b0;\n    reg        rst_n = 1&#x27;b0;\n    reg  [6:0] char_col = 7&#x27;d0;\n    reg  [2:0] char_page = 3&#x27;d0;\n    reg  [7:0] char_code = 8&#x27;h30;\n    reg        char_wr = 1&#x27;b0;\n    wire       busy;\n    wire       oled_cs_n;\n    wire       oled_dc;\n    wire       oled_sclk;\n    wire       oled_mosi;\n\n    integer    k;\n    reg        sclk_d;\n    wire       sclk_rise = (oled_sclk === 1&#x27;b1 &amp;&amp; sclk_d === 1&#x27;b0);\n    reg [7:0]  byte_buf;\n    integer    bit_cnt;\n    reg        dc_seen_data;\n    integer    pass_cnt, fail_cnt;\n\n    always #10 clk = ~clk;\n\n    oled_ssd1306 #(\n        .CLK_FREQ_HZ(50_000_000),\n        .SCLK_HZ    (100_000)\n    ) u_dut (\n        .clk      (clk),\n        .rst_n    (rst_n),\n        .char_col (char_col),\n        .char_page(char_page),\n        .char_code(char_code),\n        .char_wr  (char_wr),\n        .busy     (busy),\n        .oled_cs_n(oled_cs_n),\n        .oled_dc  (oled_dc),\n        .oled_sclk(oled_sclk),\n        .oled_mosi(oled_mosi)\n    );\n\n    always @(posedge clk) sclk_d &lt;= oled_sclk;\n\n    initial begin\n        pass_cnt = 0; fail_cnt = 0;\n        dc_seen_data = 1&#x27;b0;\n        byte_buf = 8&#x27;h00;\n        bit_cnt = 0;\n\n        rst_n = 1&#x27;b0;\n        for (k = 0; k &lt; 30; k = k + 1) @(posedge clk);\n        rst_n = 1&#x27;b1;\n\n        // ---- 捕获第一个 SPI 字节 ----\n        // 等 cs_n 拉低\n        k = 0;\n        while (oled_cs_n === 1&#x27;b1 &amp;&amp; k &lt; 500000) begin @(posedge clk); k = k + 1; end\n        // 在 cs_n=0 期间收 8 个 sclk 上升沿\n        bit_cnt = 0;\n        byte_buf = 8&#x27;h00;\n        k = 0;\n        while (bit_cnt &lt; 8 &amp;&amp; k &lt; 500000) begin\n            @(posedge clk);\n            if (sclk_rise) begin\n                byte_buf = {byte_buf[6:0], oled_mosi};\n                bit_cnt = bit_cnt + 1;\n            end\n            k = k + 1;\n        end\n        $display(&quot;[CHK] first init byte = 8&#x27;h%0h, dc=%b&quot;, byte_buf, oled_dc);\n        if (byte_buf == 8&#x27;hAE &amp;&amp; oled_dc === 1&#x27;b0) begin\n            pass_cnt = pass_cnt + 1;\n            $display(&quot;[CHK] 首条命令 0xAE(display off), dc=0  OK&quot;);\n        end else begin\n            fail_cnt = fail_cnt + 1;\n            $display(&quot;[CHK] 首条命令应为 0xAE, dc=0, 实际 8&#x27;h%0h dc=%b  FAIL&quot;,\n                     byte_buf, oled_dc);\n        end\n\n        // ---- 等初始化完成（busy 变低）----\n        k = 0;\n        while (busy === 1&#x27;b1 &amp;&amp; k &lt; 5000000) begin @(posedge clk); k = k + 1; end\n        $display(&quot;[CHK] init done, busy=%b&quot;, busy);\n\n        // ---- 写一个字符，监测是否出现 dc=1 的数据字节 ----\n        char_col  = 7&#x27;d0;\n        char_page = 3&#x27;d0;\n        char_code = 8&#x27;h31;   // &#x27;1&#x27;\n        @(posedge clk);\n        char_wr = 1&#x27;b1;\n        @(posedge clk);\n        char_wr = 1&#x27;b0;\n\n        // 监测直到 busy 重新变低（写完）\n        k = 0;\n        dc_seen_data = 1&#x27;b0;\n        for (k = 0; k &lt; 5000000; k = k + 1) begin\n            @(posedge clk);\n            if (oled_cs_n === 1&#x27;b0 &amp;&amp; oled_dc === 1&#x27;b1) dc_seen_data = 1&#x27;b1;\n            if (busy === 1&#x27;b0 &amp;&amp; k &gt; 100) k = 5000000;   // 等价提前退出\n        end\n        if (dc_seen_data) begin\n            pass_cnt = pass_cnt + 1;\n            $display(&quot;[CHK] 写字符过程中出现 dc=1(数据)  OK&quot;);\n        end else begin\n            fail_cnt = fail_cnt + 1;\n            $display(&quot;[CHK] 写字符未出现 dc=1 数据事务  FAIL&quot;);\n        end\n\n        $display(&quot;========================================&quot;);\n        $display(&quot;tb_oled_ssd1306: PASS=%0d FAIL=%0d&quot;, pass_cnt, fail_cnt);\n        $display(&quot;========================================&quot;);\n        #1000;\n        $finish;\n    end\n\nendmodule\n\n`default_nettype wire\n"}, {"file": "code/phase3/oled_top.v", "type": "verilog", "role": "synthesizable", "title": "oled_top.v — 自动写字符顶层", "codeHtml": "//==============================================================================\n// oled_top.v  —  可综合：OLED 显示顶层\n//   上电初始化完成后，自动在 (col=0,page=0) 写 &#x27;0&#x27;、(col=8,page=0) 写 &#x27;1&#x27;。\n//   实际项目里把 char_col/char_page/char_code/char_wr 接到自己的内容生成逻辑。\n//==============================================================================\n`default_nettype none\n\nmodule oled_top #(\n    parameter integer CLK_FREQ_HZ = 50_000_000,\n    parameter integer SCLK_HZ     = 1_000_000\n)(\n    input  wire clk,\n    input  wire rst_n,\n    output wire oled_cs_n,\n    output wire oled_dc,\n    output wire oled_sclk,\n    output wire oled_mosi\n);\n\n    reg [6:0] char_col;\n    reg [2:0] char_page;\n    reg [7:0] char_code;\n    reg       char_wr;\n    wire      busy;\n\n    reg [1:0] idx;       // 已写了几个字符\n    reg [2:0] step;\n\n    oled_ssd1306 #(\n        .CLK_FREQ_HZ(CLK_FREQ_HZ),\n        .SCLK_HZ    (SCLK_HZ)\n    ) u_oled (\n        .clk      (clk),\n        .rst_n    (rst_n),\n        .char_col (char_col),\n        .char_page(char_page),\n        .char_code(char_code),\n        .char_wr  (char_wr),\n        .busy     (busy),\n        .oled_cs_n(oled_cs_n),\n        .oled_dc  (oled_dc),\n        .oled_sclk(oled_sclk),\n        .oled_mosi(oled_mosi)\n    );\n\n    // 极简写字序列：init 完成后依次写两个字符\n    always @(posedge clk or negedge rst_n) begin\n        if (!rst_n) begin\n            idx     &lt;= 2&#x27;d0;\n            step    &lt;= 3&#x27;d0;\n            char_wr &lt;= 1&#x27;b0;\n            char_col &lt;= 7&#x27;d0;\n            char_page &lt;= 3&#x27;d0;\n            char_code &lt;= 8&#x27;h30;\n        end else begin\n            case (step)\n            3&#x27;d0: begin                 // 等待初始化完成（busy 变低）\n                char_wr &lt;= 1&#x27;b0;\n                if (!busy) step &lt;= 3&#x27;d1;\n            end\n            3&#x27;d1: begin                 // 设定字符参数\n                char_col  &lt;= (idx == 2&#x27;d0) ? 7&#x27;d0  : 7&#x27;d8;\n                char_page &lt;= 3&#x27;d0;\n                char_code &lt;= 8&#x27;h30 + {6&#x27;d0, idx};   // &#x27;0&#x27;/&#x27;1&#x27;\n                char_wr   &lt;= 1&#x27;b1;\n                step      &lt;= 3&#x27;d2;\n            end\n            3&#x27;d2: begin                 // 保持写请求一拍\n                char_wr &lt;= 1&#x27;b0;\n                step    &lt;= 3&#x27;d3;\n            end\n            3&#x27;d3: begin                 // 等待本次写完\n                if (busy) step &lt;= 3&#x27;d4;\n            end\n            3&#x27;d4: begin                 // 写完，等待 busy 重新变低\n                if (!busy) begin\n                    if (idx &lt; 2&#x27;d1) begin\n                        idx  &lt;= idx + 1&#x27;b1;\n                        step &lt;= 3&#x27;d1;\n                    end else begin\n                        step &lt;= 3&#x27;d5;   // 完成，停留\n                    end\n                end\n            end\n            default: step &lt;= 3&#x27;d5;\n            endcase\n        end\n    end\n\nendmodule\n\n`default_nettype wire\n"}], "diagrams": [{"file": "assets/phase3/spi-modes.svg", "title": "SPI 四种 CPOL/CPHA 时序", "caption": "CPOL 定空闲电平，CPHA 定采样沿；SSD1306 用 Mode0/3。", "svgRaw": "<svg xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"0 0 820 320\" font-family=\"system-ui,sans-serif\" font-size=\"12\">\n  <rect x=\"0\" y=\"0\" width=\"820\" height=\"320\" fill=\"#0d1420\"/>\n  <text x=\"410\" y=\"22\" fill=\"#7dd3fc\" text-anchor=\"middle\" font-size=\"15\" font-weight=\"bold\">SPI 四种时序模式（CPOL/CPHA）与数据采样边沿<\/text>\n\n  <!-- Mode 0 -->\n  <text x=\"30\" y=\"60\" fill=\"#a5f3fc\">Mode0 CPOL=0 CPHA=0<\/text>\n  <polyline points=\"230,55 260,55 260,45 300,45 300,55 340,55 340,45 380,45 380,55 420,55 420,45 460,45 460,55 500,55\" fill=\"none\" stroke=\"#22d3ee\" stroke-width=\"2\"/>\n  <text x=\"510\" y=\"50\" fill=\"#94a3b8\">SCLK 空闲低，上升沿采样<\/text>\n\n  <!-- Mode 1 -->\n  <text x=\"30\" y=\"120\" fill=\"#a5f3fc\">Mode1 CPOL=0 CPHA=1<\/text>\n  <polyline points=\"230,115 260,115 260,105 300,105 300,115 340,115 340,105 380,105 380,115 420,115 420,105 460,105 460,115 500,115\" fill=\"none\" stroke=\"#22d3ee\" stroke-width=\"2\"/>\n  <text x=\"510\" y=\"110\" fill=\"#94a3b8\">SCLK 空闲低，下降沿采样<\/text>\n\n  <!-- Mode 2 -->\n  <text x=\"30\" y=\"180\" fill=\"#a5f3fc\">Mode2 CPOL=1 CPHA=0<\/text>\n  <polyline points=\"230,165 260,165 260,175 300,175 300,165 340,165 340,175 380,175 380,165 420,165 420,175 460,175 460,165 500,165\" fill=\"none\" stroke=\"#22d3ee\" stroke-width=\"2\"/>\n  <text x=\"510\" y=\"170\" fill=\"#94a3b8\">SCLK 空闲高，下降沿采样<\/text>\n\n  <!-- Mode 3 -->\n  <text x=\"30\" y=\"240\" fill=\"#a5f3fc\">Mode3 CPOL=1 CPHA=1<\/text>\n  <polyline points=\"230,225 260,225 260,235 300,235 300,225 340,225 340,235 380,235 380,225 420,225 420,235 460,235 460,225 500,225\" fill=\"none\" stroke=\"#22d3ee\" stroke-width=\"2\"/>\n  <text x=\"510\" y=\"230\" fill=\"#94a3b8\">SCLK 空闲高，上升沿采样<\/text>\n\n  <text x=\"410\" y=\"290\" fill=\"#fcd34d\" text-anchor=\"middle\">SSD1306 OLED 使用 Mode0/3：dc=0 发命令，dc=1 发显示数据；MSB 先出<\/text>\n<\/svg>\n"}, {"file": "assets/phase3/oled-init-flow.svg", "title": "SSD1306 初始化流程", "caption": "充电泵、重映射、对比度、开显示等关键命令顺序。", "svgRaw": "<svg xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"0 0 820 280\" font-family=\"system-ui,sans-serif\" font-size=\"12\">\n  <rect x=\"0\" y=\"0\" width=\"820\" height=\"280\" fill=\"#0d1420\"/>\n  <text x=\"410\" y=\"22\" fill=\"#7dd3fc\" text-anchor=\"middle\" font-size=\"15\" font-weight=\"bold\">SSD1306 上电初始化流程（dc=0 发命令）<\/text>\n\n  <g fill=\"#1e293b\" stroke=\"#34d399\" stroke-width=\"1.5\">\n    <rect x=\"40\"  y=\"60\" width=\"150\" height=\"50\" rx=\"8\"/>\n    <rect x=\"230\" y=\"60\" width=\"150\" height=\"50\" rx=\"8\"/>\n    <rect x=\"420\" y=\"60\" width=\"150\" height=\"50\" rx=\"8\"/>\n    <rect x=\"610\" y=\"60\" width=\"160\" height=\"50\" rx=\"8\"/>\n    <rect x=\"230\" y=\"160\" width=\"150\" height=\"50\" rx=\"8\"/>\n    <rect x=\"420\" y=\"160\" width=\"150\" height=\"50\" rx=\"8\"/>\n  <\/g>\n  <g fill=\"#e2e8f0\" text-anchor=\"middle\">\n    <text x=\"115\" y=\"82\">0xAE<\/text>\n    <text x=\"115\" y=\"99\" fill=\"#94a3b8\">显示关<\/text>\n    <text x=\"305\" y=\"82\">0x8D,0x14<\/text>\n    <text x=\"305\" y=\"99\" fill=\"#94a3b8\">开充电泵<\/text>\n    <text x=\"495\" y=\"82\">0xA1 / 0xC8<\/text>\n    <text x=\"495\" y=\"99\" fill=\"#94a3b8\">扫描方向重映射<\/text>\n    <text x=\"690\" y=\"82\">0x81,0xCF<\/text>\n    <text x=\"690\" y=\"99\" fill=\"#94a3b8\">设对比度<\/text>\n    <text x=\"305\" y=\"182\">0xA4 / 0xA6<\/text>\n    <text x=\"305\" y=\"199\" fill=\"#94a3b8\">恢复显存/正常显示<\/text>\n    <text x=\"495\" y=\"182\">0xAF<\/text>\n    <text x=\"495\" y=\"199\" fill=\"#94a3b8\">显示开<\/text>\n  <\/g>\n\n  <g stroke=\"#34d399\" stroke-width=\"1.5\" fill=\"none\" marker-end=\"url(#a2)\">\n    <line x1=\"190\" y1=\"85\" x2=\"228\" y2=\"85\"/>\n    <line x1=\"380\" y1=\"85\" x2=\"418\" y2=\"85\"/>\n    <line x1=\"570\" y1=\"85\" x2=\"608\" y2=\"85\"/>\n    <path d=\"M 690 110 L 690 140 L 305 140 L 305 158\"/>\n    <line x1=\"380\" y1=\"185\" x2=\"418\" y2=\"185\"/>\n  <\/g>\n  <defs>\n    <marker id=\"a2\" markerWidth=\"10\" markerHeight=\"10\" refX=\"8\" refY=\"3\" orient=\"auto\">\n      <path d=\"M0,0 L8,3 L0,6 Z\" fill=\"#34d399\"/>\n    <\/marker>\n  <\/defs>\n  <text x=\"410\" y=\"250\" fill=\"#fcd34d\" text-anchor=\"middle\">初始化完成后进入空闲；写字符 = 定位命令 + 8x16 字模数据(dc=1)<\/text>\n<\/svg>\n"}, {"file": "assets/phase3/oled-mapping.svg", "title": "显存页/列映射", "caption": "8 页 × 128 列；8x16 字符跨两页 8 列。", "svgRaw": "<svg xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"0 0 820 300\" font-family=\"system-ui,sans-serif\" font-size=\"12\">\n  <rect x=\"0\" y=\"0\" width=\"820\" height=\"300\" fill=\"#0d1420\"/>\n  <text x=\"410\" y=\"22\" fill=\"#7dd3fc\" text-anchor=\"middle\" font-size=\"15\" font-weight=\"bold\">SSD1306 显存映射：8 个页(Page) × 128 列，每页 8 行像素<\/text>\n\n  <!-- 8 pages -->\n  <g stroke=\"#22d3ee\" stroke-width=\"1.5\" fill=\"#1e293b\">\n    <rect x=\"60\"  y=\"50\" width=\"640\" height=\"22\"/>\n    <rect x=\"60\"  y=\"76\" width=\"640\" height=\"22\"/>\n    <rect x=\"60\"  y=\"102\" width=\"640\" height=\"22\"/>\n    <rect x=\"60\"  y=\"128\" width=\"640\" height=\"22\"/>\n    <rect x=\"60\"  y=\"154\" width=\"640\" height=\"22\"/>\n    <rect x=\"60\"  y=\"180\" width=\"640\" height=\"22\"/>\n    <rect x=\"60\"  y=\"206\" width=\"640\" height=\"22\"/>\n    <rect x=\"60\"  y=\"232\" width=\"640\" height=\"22\"/>\n  <\/g>\n  <g fill=\"#a5f3fc\">\n    <text x=\"30\" y=\"65\">Page0<\/text>\n    <text x=\"30\" y=\"91\">Page1<\/text>\n    <text x=\"30\" y=\"117\">Page2<\/text>\n    <text x=\"30\" y=\"143\">Page3<\/text>\n    <text x=\"30\" y=\"169\">Page4<\/text>\n    <text x=\"30\" y=\"195\">Page5<\/text>\n    <text x=\"30\" y=\"221\">Page6<\/text>\n    <text x=\"30\" y=\"247\">Page7<\/text>\n  <\/g>\n  <text x=\"380\" y=\"45\" fill=\"#94a3b8\" text-anchor=\"middle\">列地址 0 → 127（每写一字节，列自动 +1）<\/text>\n\n  <!-- char box example: Page0, col0..7, and Page1 for 8x16 -->\n  <rect x=\"60\" y=\"50\" width=\"50\" height=\"22\" fill=\"#f59e0b\" opacity=\"0.7\"/>\n  <rect x=\"60\" y=\"76\" width=\"50\" height=\"22\" fill=\"#f59e0b\" opacity=\"0.7\"/>\n  <text x=\"150\" y=\"65\" fill=\"#fcd34d\">一个 8x16 字符跨 Page0/Page1，列 0..7<\/text>\n\n  <text x=\"410\" y=\"280\" fill=\"#94a3b8\" text-anchor=\"middle\">定位命令：0x00|列低4位、0x10|列高4位、0xB0|页号；随后写 8 字节列数据<\/text>\n<\/svg>\n"}], "tools": [{"name": "SSD1306 产品页（Solomon Systech 官方）", "url": "https://www.solomon-systech.com/product/ssd1306/", "required": true, "note": "访问日期 2026-10-10；官方 datasheet 需向厂方索取。"}, {"name": "SSD1306 datasheet PDF（Mouser 托管）", "url": "https://www.mouser.com/datasheet/2/813/SSD1306-2490209.pdf", "required": false, "note": "访问日期 2026-10-10；命令集与显存定义以此为准。"}, {"name": "通用引脚约束模板 fpga_common.xdc", "url": "../code/common/fpga_common.xdc", "required": true, "note": "SCK/MOSI/DC/CS 引脚按开发板替换。"}], "tasks": [{"id": "task-3-2-1", "text": "实现 SPI 主机控制器"}, {"id": "task-3-2-2", "text": "驱动 0.96 寸 OLED 屏幕点亮"}, {"id": "task-3-2-3", "text": "在 OLED 上显示英文字符和数字"}], "cards": [{"q": "SPI 的四根线是？", "a": "SCLK(时钟)、MOSI(主出从入)、MISO(主入从出)、CS_n(片选，低有效)。", "tags": ["SPI"]}, {"q": "CPOL 和 CPHA 各决定什么？", "a": "CPOL 决定 SCLK 空闲电平(0低/1高)；CPHA 决定在第几个时钟沿采样数据。", "tags": ["SPI", "CPOL", "CPHA"]}, {"q": "Mode0（CPOL=0,CPHA=0）在哪个沿采样？", "a": "SCLK 空闲为低，数据在上升沿被采样；MOSI 在空闲相位就放好。", "tags": ["SPI", "Mode0"]}, {"q": "50MHz、SCLK=1MHz，HALF 分频系数是多少？", "a": "HALF=50,000,000/(2×1,000,000)=25，SCLK 每 25 个时钟翻转一次。", "tags": ["SPI", "分频"]}, {"q": "SPI 数据位序是 MSB 还是 LSB 先出？", "a": "SPI 默认 MSB（最高位）先出。", "tags": ["SPI", "位序"]}, {"q": "SSD1306 的 D/C 线有什么用？", "a": "D/C=0 表示后面字节是命令，D/C=1 表示是显示数据(写显存)。", "tags": ["SSD1306"]}, {"q": "SSD1306 显存是怎么组织的？", "a": "8 个页(Page0~7)，每页 128 列；每页一字节对应 8 行像素。", "tags": ["SSD1306", "显存"]}, {"q": "写一个 8x16 字符要占几个页？", "a": "跨 2 个页（上 8 行、下 8 行）× 8 列。", "tags": ["SSD1306", "字模"]}, {"q": "定位显存位置要发哪三条命令？", "a": "0x00|列低4位、0x10|列高4位、0xB0|页号。", "tags": ["SSD1306", "命令"]}, {"q": "SSD1306 为什么要开充电泵(0x8D,0x14)？", "a": "OLED 需要较高驱动电压，内部充电泵升压才能点亮像素。", "tags": ["SSD1306", "充电泵"]}], "quiz": [{"q": "SPI 的 CS_n 片选电平是？", "options": ["高有效", "低有效", "任意", "不需要"], "answer": 1, "explain": "CS_n 带下划线表示低电平有效，选中从机。"}, {"q": "CPOL=0 时 SCLK 空闲电平是？", "options": ["高", "低", "三态", "随机"], "answer": 1, "explain": "CPOL=0 空闲为低。"}, {"q": "SSD1306 的 D/C=1 表示当前字节是？", "options": ["命令", "显示数据", "地址", "空字节"], "answer": 1, "explain": "D/C=1 表示写入显存的显示数据。"}, {"q": "写一个 8x16 字符跨几个显存页？", "options": ["1", "2", "8", "16"], "answer": 1, "explain": "上 8 行一页、下 8 行一页，共两页。"}, {"q": "50MHz、目标 SCLK=1MHz，HALF=？", "options": ["50", "25", "100", "12"], "answer": 1, "explain": "HALF=50M/(2×1M)=25。"}], "docHtml": "<h1>3.2 SPI 协议与 OLED 驱动<\/h1>\n<p>SPI（Serial Peripheral Interface）是四线同步串行总线：SCLK（时钟）、MOSI（主出从入）、MISO（主入从出）、CS_n（片选，低有效）。它比 UART 快得多，常用来驱动 OLED、Flash、ADC 等。本节用它点亮一块 0.96 寸 128×64 的 SSD1306 OLED。<\/p>\n<h2>SPI 四种时序模式（CPOL/CPHA）<\/h2>\n<p>SPI 没有统一的\"哪个边沿采样\"，由两个参数决定：<\/p>\n<ul>\n<li><strong>CPOL（时钟极性）<\/strong>：SCLK 空闲电平。CPOL=0 时空闲为低，CPOL=1 时空闲为高。<\/li>\n<li><strong>CPHA（时钟相位）<\/strong>：在第几个时钟沿采样。CPHA=0 在第一个沿采样，CPHA=1 在第二个沿采样。<\/li>\n<\/ul>\n<p>组合出四种模式。常用的是 <strong>Mode 0（CPOL=0, CPHA=0）<\/strong>：SCLK 空闲为低，主机在空闲相位把数据放到 MOSI，在 SCLK <strong>上升沿<\/strong>采样从机数据。SSD1306 在 Mode 0/3 下都能工作，本仓库 <code>spi_master<\/code> 默认 Mode 0。<\/p>\n<p>SPI 是<strong>全双工<\/strong>的：每个 SCLK 周期主机发一位（MOSI）同时收一位（MISO），MSB 先出。<\/p>\n<h2>SCLK 分频<\/h2>\n<p>SCLK 频率由系统时钟分频：<\/p>\n<pre><code>HALF = CLK_FREQ_HZ / (2 × SCLK_HZ)\n<\/code><\/pre>\n<p>例：50MHz、SCLK=1MHz → <code>HALF = 25<\/code>，SCLK 每 25 个系统时钟翻转一次，周期 50 个时钟 = 1µs。OLED 对 SCLK 速度不敏感，工程上常取 1~10MHz。<\/p>\n<h2>SSD1306 OLED 基本操作<\/h2>\n<p>SSD1306 是 128×64 单色 OLED 驱动，内部有 1KB 显存（GDDRAM）。4 线 SPI 下多一根 <strong>D/C（数据/命令选择）<\/strong> 线：<\/p>\n<ul>\n<li><code>D/C=0<\/code>：后面的字节是<strong>命令<\/strong>（设坐标、充电泵、对比度等）。<\/li>\n<li><code>D/C=1<\/code>：后面的字节是<strong>显示数据<\/strong>（写进显存，点亮对应像素）。<\/li>\n<\/ul>\n<h3>显存映射<\/h3>\n<p>显存按 <strong>8 个页（Page 0~7）<\/strong> 组织，每页 128 列。每个页内一字节对应 8 行像素（bit0=最上行）。一个 <strong>8×16 字符<\/strong> 占两个页（上 8 行、下 8 行）× 8 列。<\/p>\n<p>定位一个位置要先发三条命令：<\/p>\n<pre><code>0x00 | 列低4位     ; 列起始地址低字节\n0x10 | 列高4位     ; 列起始地址高字节\n0xB0 | 页号        ; 页地址\n<\/code><\/pre>\n<p>之后连续写 8 字节数据，列地址自动加 1。<\/p>\n<h3>上电初始化序列<\/h3>\n<p>上电后必须先发一串命令 OLED 才会正常显示，关键有：<code>0xAE<\/code>(关显示) → <code>0x8D,0x14<\/code>(开内部充电泵) → <code>0xA1/0xC8<\/code>(段重映射/扫描方向) → <code>0x81,0xCF<\/code>(对比度) → <code>0xA4,0xA6<\/code>(正常显示) → <code>0xAF<\/code>(开显示)。本仓库 <code>oled_ssd1306.v<\/code> 把这串命令固化在状态机里，复位后自动发送。<\/p>\n<h2>代码结构<\/h2>\n<ul>\n<li><code>spi_master.v<\/code>：参数化 SCLK 分频、CPOL/CPHA、片选，MSB 先出，全双工移位。<\/li>\n<li><code>oled_ssd1306.v<\/code>：包一层 spi_master，自动跑初始化序列；对外提供 <code>char_col/char_page/char_code/char_wr<\/code> 写字符接口，内置数字 0/1 的 8×16 字模 ROM（可扩展为完整 ASCII）。<\/li>\n<li><code>oled_top.v<\/code>：顶层，初始化完成后自动写两个字符。<\/li>\n<\/ul>\n<blockquote>\n<p>SSD1306 数据手册见 Solomon Systech 官网产品页（访问日期 2026-10-10）；字模像素的精细微调需上板用 Vivado 下板观察。<\/p>\n<\/blockquote>"}, {"chapterId": "3.3", "phase": 3, "slug": "pwm-buzzer", "title": "PWM 与模拟输出", "summary": "PWM 占空比与平均电压、三角波呼吸灯包络、蜂鸣器音符分频，播放《小星星》。", "doc": "docs/phase3/ch3-pwm-buzzer.md", "code": [{"file": "code/phase3/pwm.v", "type": "verilog", "role": "synthesizable", "title": "pwm.v - 参数位宽 PWM 发生器", "codeHtml": "//==============================================================================\n// pwm.v  —  可综合：参数位宽 PWM 发生器（端口固定 8 位，内部参数化）\n//   cnt 自由计数 0 ~ 2^PWM_BITS-1；pwm_out = (cnt &lt; duty)。\n//   占空比 = duty / 2^PWM_BITS；周期 = 2^PWM_BITS 个系统时钟。\n//==============================================================================\n`default_nettype none\n\nmodule pwm #(\n    parameter integer PWM_BITS = 8\n)(\n    input  wire        clk,\n    input  wire        rst_n,\n    input  wire [7:0]  duty,    // 占空比 0..255\n    output reg         pwm_out\n);\n\n    reg [7:0] cnt;\n\n    always @(posedge clk or negedge rst_n) begin\n        if (!rst_n)\n            cnt &lt;= 8&#x27;d0;\n        else\n            cnt &lt;= cnt + 1&#x27;b1;\n    end\n\n    always @(posedge clk or negedge rst_n) begin\n        if (!rst_n)\n            pwm_out &lt;= 1&#x27;b0;\n        else\n            pwm_out &lt;= (cnt &lt; duty);\n    end\n\nendmodule\n\n`default_nettype wire\n"}, {"file": "code/phase3/tb_pwm.v", "type": "verilog", "role": "testbench", "title": "tb_pwm.v - 测占空比/周期", "codeHtml": "//==============================================================================\n// tb_pwm.v  —  Testbench：PWM 占空比/周期自检\n//   PWM_BITS=8 -&gt; 周期 256 个时钟；duty=128 -&gt; 期望高电平约 128/256=50%。\n//==============================================================================\n`timescale 1ns/1ps\n`default_nettype none\n\nmodule tb_pwm;\n\n    reg        clk = 1&#x27;b0;\n    reg        rst_n = 1&#x27;b0;\n    reg  [7:0] duty = 8&#x27;d128;\n    wire       pwm_out;\n\n    integer    k;\n    integer    high_cnt;\n    integer    pass_cnt, fail_cnt;\n\n    always #10 clk = ~clk;\n\n    pwm #(.PWM_BITS(8)) u_dut (\n        .clk     (clk),\n        .rst_n   (rst_n),\n        .duty    (duty),\n        .pwm_out (pwm_out)\n    );\n\n    initial begin\n        pass_cnt = 0; fail_cnt = 0;\n        rst_n = 1&#x27;b0;\n        for (k = 0; k &lt; 20; k = k + 1) @(posedge clk);\n        rst_n = 1&#x27;b1;\n        for (k = 0; k &lt; 400; k = k + 1) @(posedge clk);  // 稳定\n\n        // 统计 2 个周期(512 拍)内高电平拍数\n        high_cnt = 0;\n        for (k = 0; k &lt; 512; k = k + 1) begin\n            @(posedge clk);\n            if (pwm_out === 1&#x27;b1) high_cnt = high_cnt + 1;\n        end\n        $display(&quot;[CHK] high_cnt=%0d / 512 (expect ~256)&quot;, high_cnt);\n        if (high_cnt &gt;= 240 &amp;&amp; high_cnt &lt;= 272) begin\n            pass_cnt = pass_cnt + 1;\n            $display(&quot;[CHK] 占空比约 50%%  OK&quot;);\n        end else begin\n            fail_cnt = fail_cnt + 1;\n            $display(&quot;[CHK] 占空比偏差过大  FAIL&quot;);\n        end\n\n        $display(&quot;========================================&quot;);\n        $display(&quot;tb_pwm: PASS=%0d FAIL=%0d&quot;, pass_cnt, fail_cnt);\n        $display(&quot;========================================&quot;);\n        #1000;\n        $finish;\n    end\n\nendmodule\n\n`default_nettype wire\n"}, {"file": "code/phase3/breathing_rgb_top.v", "type": "verilog", "role": "synthesizable", "title": "breathing_rgb_top.v - 三路 PWM 相位错开呼吸灯", "codeHtml": "//==============================================================================\n// breathing_rgb_top.v - RGB breathing LED\n//==============================================================================\n`default_nettype none\n\nmodule breathing_rgb_top #(\n    parameter integer CLK_FREQ_HZ = 50_000_000,\n    parameter integer PWM_BITS     = 8,\n    parameter integer SLOW_DIV     = 20\n)(\n    input  wire clk,\n    input  wire rst_n,\n    output reg  led_r,\n    output reg  led_g,\n    output reg  led_b\n);\n\n    localparam integer PERIOD = (1 &lt;&lt; PWM_BITS);\n\n    reg [PWM_BITS-1:0] pwm_cnt;\n    reg [PWM_BITS-1:0] duty;\n    reg [SLOW_DIV-1:0] slow_cnt;\n    reg                up;\n\n    always @(posedge clk or negedge rst_n) begin\n        if (!rst_n)\n            pwm_cnt &lt;= {PWM_BITS{1&#x27;b0}};\n        else\n            pwm_cnt &lt;= pwm_cnt + 1&#x27;b1;\n    end\n\n    always @(posedge clk or negedge rst_n) begin\n        if (!rst_n) begin\n            duty     &lt;= {PWM_BITS{1&#x27;b0}};\n            slow_cnt &lt;= {SLOW_DIV{1&#x27;b0}};\n            up       &lt;= 1&#x27;b1;\n        end else begin\n            slow_cnt &lt;= slow_cnt + 1&#x27;b1;\n            if (slow_cnt == {SLOW_DIV{1&#x27;b1}}) begin\n                slow_cnt &lt;= {SLOW_DIV{1&#x27;b0}};\n                if (up) begin\n                    duty &lt;= duty + 1&#x27;b1;\n                    if (duty == PERIOD-1) up &lt;= 1&#x27;b0;\n                end else begin\n                    duty &lt;= duty - 1&#x27;b1;\n                    if (duty == {PWM_BITS{1&#x27;b0}}) up &lt;= 1&#x27;b1;\n                end\n            end\n        end\n    end\n\n    pwm #(.PWM_BITS(PWM_BITS)) u_r (\n        .clk(clk), .rst_n(rst_n), .duty(duty),        .pwm_out(led_r)\n    );\n    pwm #(.PWM_BITS(PWM_BITS)) u_g (\n        .clk(clk), .rst_n(rst_n), .duty(duty + 8&#x27;d85), .pwm_out(led_g)\n    );\n    pwm #(.PWM_BITS(PWM_BITS)) u_b (\n        .clk(clk), .rst_n(rst_n), .duty(duty + 8&#x27;d170), .pwm_out(led_b)\n    );\n\nendmodule\n\n`default_nettype wire\n"}, {"file": "code/phase3/tb_breathing_rgb_top.v", "type": "verilog", "role": "testbench", "title": "tb_breathing_rgb_top.v - 验证三路呼吸变化", "codeHtml": "//==============================================================================\n// tb_breathing_rgb_top.v  —  Testbench：RGB 呼吸灯\n//   用较小 SLOW_DIV=4 让三角波快速走动；验证三路 PWM 输出都在翻转，\n//   且占空比随三角波变化（三路相位错开）。\n//==============================================================================\n`timescale 1ns/1ps\n`default_nettype none\n\nmodule tb_breathing_rgb_top;\n\n    reg  clk = 1&#x27;b0;\n    reg  rst_n = 1&#x27;b0;\n    wire led_r, led_g, led_b;\n\n    integer k;\n    integer r_hi, g_hi, b_hi;\n    integer pass_cnt, fail_cnt;\n\n    always #10 clk = ~clk;\n\n    breathing_rgb_top #(\n        .PWM_BITS (8),\n        .SLOW_DIV (4)\n    ) u_dut (\n        .clk(clk), .rst_n(rst_n),\n        .led_r(led_r), .led_g(led_g), .led_b(led_b)\n    );\n\n    initial begin\n        pass_cnt = 0; fail_cnt = 0;\n        r_hi = 0; g_hi = 0; b_hi = 0;\n        rst_n = 1&#x27;b0;\n        for (k = 0; k &lt; 20; k = k + 1) @(posedge clk);\n        rst_n = 1&#x27;b1;\n\n        // 跑 8192 拍，统计各路高电平拍数\n        for (k = 0; k &lt; 8192; k = k + 1) begin\n            @(posedge clk);\n            if (led_r === 1&#x27;b1) r_hi = r_hi + 1;\n            if (led_g === 1&#x27;b1) g_hi = g_hi + 1;\n            if (led_b === 1&#x27;b1) b_hi = b_hi + 1;\n        end\n        $display(&quot;[CHK] r_hi=%0d g_hi=%0d b_hi=%0d&quot;, r_hi, g_hi, b_hi);\n        // 三路都应既有高也有低（呼吸经过全范围），且三路计数值不必相等\n        if (r_hi &gt; 0 &amp;&amp; g_hi &gt; 0 &amp;&amp; b_hi &gt; 0 &amp;&amp;\n            r_hi &lt; 8192 &amp;&amp; g_hi &lt; 8192 &amp;&amp; b_hi &lt; 8192) begin\n            pass_cnt = pass_cnt + 1;\n            $display(&quot;[CHK] 三路 PWM 均在呼吸变化  OK&quot;);\n        end else begin\n            fail_cnt = fail_cnt + 1;\n            $display(&quot;[CHK] 存在一路恒亮/恒灭  FAIL&quot;);\n        end\n\n        $display(&quot;========================================&quot;);\n        $display(&quot;tb_breathing_rgb_top: PASS=%0d FAIL=%0d&quot;, pass_cnt, fail_cnt);\n        $display(&quot;========================================&quot;);\n        #1000;\n        $finish;\n    end\n\nendmodule\n\n`default_nettype wire\n"}, {"file": "code/phase3/buzzer_music.v", "type": "verilog", "role": "synthesizable", "title": "buzzer_music.v - 音符分频+旋律 ROM，播放小星星", "codeHtml": "//==============================================================================\n// buzzer_music.v  —  可综合：蜂鸣器播放《小星星》\n//   音符 -&gt; 频率 -&gt; 分频：buzzer 每 (CLK/(2*f)) 个时钟翻转一次，得到方波。\n//   音名(中音)：C4=262 D4=294 E4=330 F4=349 G4=392 A4=440 Hz。\n//   旋律按简谱 1 1 5 5 6 6 5 - | 4 4 3 3 2 2 1 - | ... 顺序播放。\n//   DUR_DIV 控制每个音的时长（越小越快，便于仿真）。\n//==============================================================================\n`default_nettype none\n\nmodule buzzer_music #(\n    parameter integer CLK_FREQ_HZ = 50_000_000,\n    parameter integer DUR_DIV     = 20\n)(\n    input  wire clk,\n    input  wire rst_n,\n    output reg  buzzer_out\n);\n\n    // 音符分频表：索引 0..5 对应 C4 D4 E4 F4 G4 A4\n    function [15:0] note_div;\n        input [3:0] n;\n        begin\n            case (n)\n            4&#x27;d0: note_div = 16&#x27;d95419;  // C4 262Hz\n            4&#x27;d1: note_div = 16&#x27;d85034;  // D4 294Hz\n            4&#x27;d2: note_div = 16&#x27;d75758;  // E4 330Hz\n            4&#x27;d3: note_div = 16&#x27;d71633;  // F4 349Hz\n            4&#x27;d4: note_div = 16&#x27;d63776;  // G4 392Hz\n            4&#x27;d5: note_div = 16&#x27;d56818;  // A4 440Hz\n            default: note_div = 16&#x27;d1;   // 休止\n            endcase\n        end\n    endfunction\n\n    // 《小星星》旋律（简谱 -&gt; 音名索引）\n    reg [3:0] melody [0:41];\n    integer   mi;\n    initial begin\n        melody[ 0]=4&#x27;d0; melody[ 1]=4&#x27;d0; melody[ 2]=4&#x27;d4; melody[ 3]=4&#x27;d4;\n        melody[ 4]=4&#x27;d5; melody[ 5]=4&#x27;d5; melody[ 6]=4&#x27;d4;\n        melody[ 7]=4&#x27;d3; melody[ 8]=4&#x27;d3; melody[ 9]=4&#x27;d2; melody[10]=4&#x27;d2;\n        melody[11]=4&#x27;d1; melody[12]=4&#x27;d1; melody[13]=4&#x27;d0;\n        melody[14]=4&#x27;d4; melody[15]=4&#x27;d4; melody[16]=4&#x27;d3; melody[17]=4&#x27;d3;\n        melody[18]=4&#x27;d2; melody[19]=4&#x27;d2;\n        melody[20]=4&#x27;d4; melody[21]=4&#x27;d4; melody[22]=4&#x27;d3; melody[23]=4&#x27;d3;\n        melody[24]=4&#x27;d2; melody[25]=4&#x27;d2;\n        melody[26]=4&#x27;d0; melody[27]=4&#x27;d0; melody[28]=4&#x27;d4; melody[29]=4&#x27;d4;\n        melody[30]=4&#x27;d5; melody[31]=4&#x27;d5; melody[32]=4&#x27;d4;\n        melody[33]=4&#x27;d3; melody[34]=4&#x27;d3; melody[35]=4&#x27;d2; melody[36]=4&#x27;d2;\n        melody[37]=4&#x27;d1; melody[38]=4&#x27;d1; melody[39]=4&#x27;d0;\n        for (mi = 40; mi &lt; 42; mi = mi + 1) melody[mi] = 4&#x27;d6;  // 尾部休止\n    end\n\n    reg [5:0]  note_idx;       // 0..41\n    reg [15:0] dur_cnt;        // 当前音已持续的慢拍数\n    reg [15:0] tone_cnt;       // 方波分频计数\n    reg [15:0] cur_div;\n\n    // 当前音符分频\n    always @(*) begin\n        if (melody[note_idx] &gt;= 4&#x27;d6)\n            cur_div = 16&#x27;d0;        // 休止：不发声\n        else\n            cur_div = note_div(melody[note_idx]);\n    end\n\n    // 音符时长计数：慢 tick 到来时累加，到 DUR_DIV 倍长后换音\n    reg [DUR_DIV-1:0] slow_cnt;\n    wire slow_tick = (slow_cnt == {DUR_DIV{1&#x27;b1}});\n\n    always @(posedge clk or negedge rst_n) begin\n        if (!rst_n) slow_cnt &lt;= {DUR_DIV{1&#x27;b0}};\n        else        slow_cnt &lt;= slow_cnt + 1&#x27;b1;\n    end\n\n    always @(posedge clk or negedge rst_n) begin\n        if (!rst_n) begin\n            note_idx &lt;= 6&#x27;d0;\n            dur_cnt  &lt;= 16&#x27;d0;\n        end else if (slow_tick) begin\n            if (dur_cnt &gt;= 16&#x27;d20) begin     // 每个音约 21 个慢拍\n                dur_cnt  &lt;= 16&#x27;d0;\n                note_idx &lt;= (note_idx == 6&#x27;d41) ? 6&#x27;d0 : note_idx + 1&#x27;b1;\n            end else begin\n                dur_cnt &lt;= dur_cnt + 1&#x27;b1;\n            end\n        end\n    end\n\n    // 方波产生：按当前音符分频翻转\n    always @(posedge clk or negedge rst_n) begin\n        if (!rst_n) begin\n            tone_cnt   &lt;= 16&#x27;d0;\n            buzzer_out &lt;= 1&#x27;b0;\n        end else if (cur_div == 16&#x27;d0) begin\n            buzzer_out &lt;= 1&#x27;b0;            // 休止\n            tone_cnt   &lt;= 16&#x27;d0;\n        end else if (tone_cnt &gt;= cur_div - 1) begin\n            tone_cnt   &lt;= 16&#x27;d0;\n            buzzer_out &lt;= ~buzzer_out;\n        end else begin\n            tone_cnt &lt;= tone_cnt + 1&#x27;b1;\n        end\n    end\n\nendmodule\n\n`default_nettype wire\n"}, {"file": "code/phase3/tb_buzzer_music.v", "type": "verilog", "role": "testbench", "title": "tb_buzzer_music.v - 测音符方波频率", "codeHtml": "//==============================================================================\n// tb_buzzer_music.v  —  Testbench：蜂鸣器音符频率自检\n//   第一个音是 C4（分频 95419）：buzzer 每 95419 个时钟翻转一次。\n//   测量两次翻转之间的时钟数，应约等于 95419（半周期）。\n//==============================================================================\n`timescale 1ns/1ps\n`default_nettype none\n\nmodule tb_buzzer_music;\n\n    reg  clk = 1&#x27;b0;\n    reg  rst_n = 1&#x27;b0;\n    wire buzzer_out;\n\n    integer k;\n    integer edge_gap;\n    integer pass_cnt, fail_cnt;\n    reg     b_d;\n\n    always #10 clk = ~clk;\n\n    buzzer_music #(\n        .CLK_FREQ_HZ(50_000_000),\n        .DUR_DIV(4)\n    ) u_dut (\n        .clk(clk), .rst_n(rst_n), .buzzer_out(buzzer_out)\n    );\n\n    always @(posedge clk) b_d &lt;= buzzer_out;\n    wire rise = (buzzer_out === 1&#x27;b1 &amp;&amp; b_d === 1&#x27;b0);\n\n    initial begin\n        pass_cnt = 0; fail_cnt = 0;\n        rst_n = 1&#x27;b0;\n        for (k = 0; k &lt; 30; k = k + 1) @(posedge clk);\n        rst_n = 1&#x27;b1;\n\n        // 等到第一个上升沿\n        k = 0;\n        while (!rise &amp;&amp; k &lt; 3000000) begin @(posedge clk); k = k + 1; end\n        // 再数到下一个上升沿，间隔应约 = 2*95419（整周期）\n        edge_gap = 0;\n        k = 0;\n        while (!rise &amp;&amp; k &lt; 3000000) begin @(posedge clk); edge_gap = edge_gap + 1; k = k + 1; end\n\n        $display(&quot;[CHK] buzzer 整周期 = %0d 个时钟 (expect ~190838)&quot;, edge_gap);\n        if (edge_gap &gt; 180000 &amp;&amp; edge_gap &lt; 202000) begin\n            pass_cnt = pass_cnt + 1;\n            $display(&quot;[CHK] C4 方波频率正确  OK&quot;);\n        end else begin\n            fail_cnt = fail_cnt + 1;\n            $display(&quot;[CHK] 方波频率偏差过大  FAIL&quot;);\n        end\n\n        $display(&quot;========================================&quot;);\n        $display(&quot;tb_buzzer_music: PASS=%0d FAIL=%0d&quot;, pass_cnt, fail_cnt);\n        $display(&quot;========================================&quot;);\n        #1000;\n        $finish;\n    end\n\nendmodule\n\n`default_nettype wire\n"}], "diagrams": [{"file": "assets/phase3/pwm-duty.svg", "title": "PWM 占空比与平均电压", "caption": "25%/50%/75% 占空比对应不同平均电压，周期固定。", "svgRaw": "<svg xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"0 0 820 280\" font-family=\"system-ui,sans-serif\" font-size=\"12\">\n  <rect x=\"0\" y=\"0\" width=\"820\" height=\"280\" fill=\"#0d1420\"/>\n  <text x=\"410\" y=\"22\" fill=\"#7dd3fc\" text-anchor=\"middle\" font-size=\"15\" font-weight=\"bold\">PWM 占空比与平均电压<\/text>\n\n  <!-- 25% duty -->\n  <text x=\"30\" y=\"60\" fill=\"#94a3b8\">25%<\/text>\n  <polyline points=\"90,55 130,55 130,40 250,40 250,55 780,55\" fill=\"none\" stroke=\"#22d3ee\" stroke-width=\"2\"/>\n  <text x=\"300\" y=\"50\" fill=\"#fcd34d\" font-size=\"11\">平均电压 = 0.25*Vcc<\/text>\n\n  <!-- 50% duty -->\n  <text x=\"30\" y=\"120\" fill=\"#94a3b8\">50%<\/text>\n  <polyline points=\"90,115 170,115 170,100 330,100 330,115 780,115\" fill=\"none\" stroke=\"#22d3ee\" stroke-width=\"2\"/>\n  <text x=\"380\" y=\"110\" fill=\"#fcd34d\" font-size=\"11\">平均电压 = 0.50*Vcc<\/text>\n\n  <!-- 75% duty -->\n  <text x=\"30\" y=\"180\" fill=\"#94a3b8\">75%<\/text>\n  <polyline points=\"90,175 210,175 210,160 450,160 450,175 780,175\" fill=\"none\" stroke=\"#22d3ee\" stroke-width=\"2\"/>\n  <text x=\"500\" y=\"170\" fill=\"#fcd34d\" font-size=\"11\">平均电压 = 0.75*Vcc<\/text>\n\n  <!-- period bracket -->\n  <line x1=\"90\" y1=\"210\" x2=\"250\" y2=\"210\" stroke=\"#64748b\"/>\n  <line x1=\"90\" y1=\"205\" x2=\"90\" y2=\"215\" stroke=\"#64748b\"/>\n  <line x1=\"250\" y1=\"205\" x2=\"250\" y2=\"215\" stroke=\"#64748b\"/>\n  <text x=\"170\" y=\"228\" fill=\"#94a3b8\" text-anchor=\"middle\">PWM 周期 = 2^PWM_BITS 个时钟<\/text>\n\n  <text x=\"410\" y=\"258\" fill=\"#34d399\" text-anchor=\"middle\">占空比 duty/2^N 越大，LED 平均亮度越高；三角波缓升缓降即\"呼吸\"<\/text>\n<\/svg>\n"}], "tools": [{"name": "通用引脚约束模板 fpga_common.xdc", "url": "../code/common/fpga_common.xdc", "required": true, "note": "RGB LED 与蜂鸣器引脚按开发板替换。"}], "tasks": [{"id": "task-3-3-1", "text": "实现 RGB 三色呼吸灯"}, {"id": "task-3-3-2", "text": "驱动蜂鸣器播放《小星星》旋律"}], "cards": [{"q": "PWM 占空比是什么？", "a": "高电平时间占整个周期的比例；占空比越大，平均电压越高，LED 越亮。", "tags": ["PWM", "占空比"]}, {"q": "8 位 PWM 的分辨率是多少？", "a": "1/256，即占空比可在 0/256 到 255/256 之间分 256 级调节。", "tags": ["PWM", "分辨率"]}, {"q": "呼吸灯效果怎么实现？", "a": "让 duty 在 0~255 之间缓慢三角波式升降，人眼看到亮度渐变即呼吸。", "tags": ["呼吸灯"]}, {"q": "PWM 周期怎么算？", "a": "cnt 从 0 加到 2^N-1 溢出，周期 = 2^N 个系统时钟。", "tags": ["PWM", "周期"]}, {"q": "蜂鸣器音符频率和分频系数的关系？", "a": "div = CLK/(2*f)；50MHz 下 C4=262Hz 对应 div≈95419。", "tags": ["蜂鸣器", "分频"]}, {"q": "为什么三路 PWM 的 duty 要错开？", "a": "错开 85/170 使 RGB 呼吸不同步，形成彩虹渐变效果。", "tags": ["RGB", "相位"]}, {"q": "SLOW_DIV 参数控制什么？", "a": "控制三角波变化速度；越大变化越慢，呼吸越平缓。", "tags": ["SLOW_DIV"]}, {"q": "PWM 输出逻辑怎么写？", "a": "pwm_out = (cnt < duty)；cnt 自由计数，duty 决定高电平区间长度。", "tags": ["PWM", "逻辑"]}], "quiz": [{"q": "50% 占空比下，LED 平均亮度约为？", "options": ["0%", "25%", "50%", "100%"], "answer": 2, "explain": "占空比 50% 即一半时间亮，平均亮度一半。"}, {"q": "8 位 PWM 的占空比分辨率是？", "options": ["1/16", "1/64", "1/256", "1/1024"], "answer": 2, "explain": "2^8=256，分辨率 1/256。"}, {"q": "50MHz 时钟，C4=262Hz 对应分频系数约为？", "options": ["95419", "262", "50000", "190000"], "answer": 0, "explain": "div=50M/(2*262)≈95419。"}, {"q": "呼吸灯效果通过什么实现？", "options": ["固定占空比", "duty 三角波缓升缓降", "提高时钟频率", "降低电压"], "answer": 1, "explain": "duty 缓慢三角波变化形成呼吸。"}], "docHtml": "<h1>3.3 PWM 与模拟输出<\/h1>\n<p>PWM（Pulse Width Modulation，脉冲宽度调制）用数字方波的\"占空比\"来近似模拟电压，是 FPGA 驱动 LED 调光、蜂鸣器音调、电机速度的基础手段。<\/p>\n<h2>占空比与平均电压<\/h2>\n<p>PWM 输出是一串周期固定的方波。<strong>占空比<\/strong> = 高电平时间 / 周期。在 50% 占空比下，LED 一半时间亮一半时间灭；由于人眼视觉暂留，看起来亮度是\"一半\"。平均电压 ≈ 占空比 × 高电平电压。<\/p>\n<pre><code>pwm_out = (cnt &lt; duty)\n<\/code><\/pre>\n<p>计数器 <code>cnt<\/code> 从 0 加到 2^N-1 溢出。<code>duty<\/code> 越大，高电平区间越长，占空比越高，LED 越亮。占空比分辨率为 1/2^N，8 位 PWM 即 1/256 级调光。<\/p>\n<h2>呼吸灯亮度包络<\/h2>\n<p>\"呼吸灯\"效果就是让 <code>duty<\/code> 在 0~255 之间缓慢地上升再下降，形成三角波包络。<code>SLOW_DIV<\/code> 控制变化速度：每数满 2^SLOW_DIV 个时钟才把 <code>duty<\/code> 加 1 或减 1。三路 PWM（RGB）的 <code>duty<\/code> 错开 85/170，形成三色呼吸不同步的彩虹效果。<\/p>\n<h2>蜂鸣器与音符频率<\/h2>\n<p>蜂鸣器靠方波驱动发声。音符频率 f 对应分频系数：<\/p>\n<pre><code>div = CLK / (2 * f)\n<\/code><\/pre>\n<p>50MHz 时钟下，C4=262Hz → div≈95419。每个音按简谱设定时长（多少个慢拍），播完自动切下一个音。《小星星》旋律：1 1 5 5 6 6 5 - | 4 4 3 3 2 2 1 - | ...<\/p>\n<h2>代码结构<\/h2>\n<ul>\n<li><code>pwm.v<\/code>：参数位宽 PWM 发生器，<code>pwm_out=(cnt&lt;duty)<\/code>。<\/li>\n<li><code>breathing_rgb_top.v<\/code>：三角波缓升缓降驱动三路 PWM，RGB 相位错开。<\/li>\n<li><code>buzzer_music.v<\/code>：音符分频表 + 旋律 ROM，自动播放《小星星》。<\/li>\n<\/ul>\n<blockquote>\n<p>蜂鸣器频率精度依赖分频系数取整；实际音高需上板用耳朵或示波器验证。<\/p>\n<\/blockquote>"}, {"chapterId": "3.4", "phase": 3, "slug": "vga", "title": "VGA 显示接口", "summary": "640x480@60 行场同步时序、像素坐标生成、50MHz 计数使能得 25MHz 像素时钟，彩条与移动方块。", "doc": "docs/phase3/ch4-vga.md", "code": [{"file": "code/phase3/vga_sync.v", "type": "verilog", "role": "synthesizable", "title": "vga_sync.v - hsync/vsync/video_on/pixel_x/y", "codeHtml": "//==============================================================================\n// vga_sync.v - VGA 640x480@60 时序发生器\n// 水平：640 可见 + 16 前肩 + 96 同步 + 48 后肩 = 800 像素时钟\n// 垂直：480 可见 + 10 前肩 + 2  同步 + 33 后肩 = 525 行\n// 像素时钟 25.175MHz；本设计用 50MHz 计数使能得到 25MHz（不依赖 MMCM）。\n//==============================================================================\n`default_nettype none\n\nmodule vga_sync #(\n    parameter integer CLK_FREQ_HZ = 50_000_000\n)(\n    input  wire clk,\n    input  wire rst_n,\n    output reg  hsync,\n    output reg  vsync,\n    output reg  video_on,\n    output reg  [9:0] pixel_x,\n    output reg  [9:0] pixel_y\n);\n\n    // 水平参数\n    localparam H_VISIBLE   = 640;\n    localparam H_FRONT     = 16;\n    localparam H_SYNC      = 96;\n    localparam H_BACK      = 48;\n    localparam H_TOTAL     = H_VISIBLE + H_FRONT + H_SYNC + H_BACK;  // 800\n\n    // 垂直参数\n    localparam V_VISIBLE   = 480;\n    localparam V_FRONT     = 10;\n    localparam V_SYNC      = 2;\n    localparam V_BACK      = 33;\n    localparam V_TOTAL     = V_VISIBLE + V_FRONT + V_SYNC + V_BACK;  // 525\n\n    reg [9:0] h_cnt;\n    reg [9:0] v_cnt;\n    reg       pix_en;   // 25MHz 像素使能（50MHz 分频）\n\n    // 50MHz -&gt; 25MHz 使能：每 2 个时钟一个像素\n    always @(posedge clk or negedge rst_n) begin\n        if (!rst_n)\n            pix_en &lt;= 1&#x27;b0;\n        else\n            pix_en &lt;= ~pix_en;\n    end\n\n    // 水平计数器\n    always @(posedge clk or negedge rst_n) begin\n        if (!rst_n) begin\n            h_cnt &lt;= 10&#x27;d0;\n        end else if (pix_en) begin\n            if (h_cnt == H_TOTAL - 1)\n                h_cnt &lt;= 10&#x27;d0;\n            else\n                h_cnt &lt;= h_cnt + 1&#x27;b1;\n        end\n    end\n\n    // 垂直计数器\n    always @(posedge clk or negedge rst_n) begin\n        if (!rst_n) begin\n            v_cnt &lt;= 10&#x27;d0;\n        end else if (pix_en &amp;&amp; h_cnt == H_TOTAL - 1) begin\n            if (v_cnt == V_TOTAL - 1)\n                v_cnt &lt;= 10&#x27;d0;\n            else\n                v_cnt &lt;= v_cnt + 1&#x27;b1;\n        end\n    end\n\n    // 同步信号（低有效）\n    always @(posedge clk or negedge rst_n) begin\n        if (!rst_n) begin\n            hsync    &lt;= 1&#x27;b1;\n            vsync    &lt;= 1&#x27;b1;\n            video_on &lt;= 1&#x27;b0;\n            pixel_x  &lt;= 10&#x27;d0;\n            pixel_y  &lt;= 10&#x27;d0;\n        end else if (pix_en) begin\n            // 水平同步：640+16=656 到 656+96=752 为低\n            hsync &lt;= (h_cnt &gt;= H_VISIBLE + H_FRONT &amp;&amp; h_cnt &lt; H_VISIBLE + H_FRONT + H_SYNC) ? 1&#x27;b0 : 1&#x27;b1;\n            // 垂直同步：480+10=490 到 490+2=492 为低\n            vsync &lt;= (v_cnt &gt;= V_VISIBLE + V_FRONT &amp;&amp; v_cnt &lt; V_VISIBLE + V_FRONT + V_SYNC) ? 1&#x27;b0 : 1&#x27;b1;\n            // 可见区域\n            video_on &lt;= (h_cnt &lt; H_VISIBLE &amp;&amp; v_cnt &lt; V_VISIBLE);\n            pixel_x  &lt;= h_cnt;\n            pixel_y  &lt;= v_cnt;\n        end\n    end\n\nendmodule\n\n`default_nettype wire\n"}, {"file": "code/phase3/tb_vga_sync.v", "type": "verilog", "role": "testbench", "title": "tb_vga_sync.v - 断言同步宽度/前后肩/总帧数", "codeHtml": "//==============================================================================\n// tb_vga_sync.v - VGA 时序自检\n// 断言：水平总长度 800、垂直总长度 525、同步脉冲宽度、可见区间、总帧数。\n//==============================================================================\n`timescale 1ns/1ps\n`default_nettype none\n\nmodule tb_vga_sync;\n\n    reg        clk = 1&#x27;b0;\n    reg        rst_n = 1&#x27;b0;\n    wire       hsync, vsync, video_on;\n    wire [9:0] pixel_x, pixel_y;\n\n    integer k;\n    integer h_count, v_count;\n    integer pass_cnt, fail_cnt;\n    integer hsync_low, vsync_low;\n\n    always #10 clk = ~clk;  // 50MHz\n\n    vga_sync u_dut (\n        .clk(clk), .rst_n(rst_n),\n        .hsync(hsync), .vsync(vsync),\n        .video_on(video_on),\n        .pixel_x(pixel_x), .pixel_y(pixel_y)\n    );\n\n    initial begin\n        pass_cnt = 0; fail_cnt = 0;\n        h_count = 0; v_count = 0;\n        hsync_low = 0; vsync_low = 0;\n\n        rst_n = 1&#x27;b0;\n        for (k = 0; k &lt; 30; k = k + 1) @(posedge clk);\n        rst_n = 1&#x27;b1;\n\n        // 跑 2 帧（约 2*800*525*2 个时钟）\n        for (k = 0; k &lt; 2 * 800 * 525 * 4; k = k + 1) begin\n            @(posedge clk);\n            if (hsync === 1&#x27;b0) hsync_low = hsync_low + 1;\n            if (vsync === 1&#x27;b0) vsync_low = vsync_low + 1;\n        end\n\n        // 水平：每 800 个像素时钟一次 hsync 低，低 96 个像素时钟\n        // 2 帧 -&gt; 2 个完整行周期（每行 800 像素时钟，像素使能 = 50% 占空比）\n        // 实际 hsync_low 在 2 帧内应为 2*525*96（像素使能拍）\n        $display(&quot;[CHK] hsync_low=%0d (expect ~%0d)&quot;, hsync_low, 2*525*96/2);\n        $display(&quot;[CHK] vsync_low=%0d (expect ~%0d)&quot;, vsync_low, 2*96/2);\n\n        if (hsync_low &gt; 2*525*40 &amp;&amp; hsync_low &lt; 2*525*60) begin\n            pass_cnt = pass_cnt + 1;\n            $display(&quot;[CHK] hsync 低电平拍数合理 OK&quot;);\n        end else begin\n            fail_cnt = fail_cnt + 1;\n            $display(&quot;[CHK] hsync 低电平拍数异常 FAIL&quot;);\n        end\n\n        if (vsync_low &gt; 80 &amp;&amp; vsync_low &lt; 120) begin\n            pass_cnt = pass_cnt + 1;\n            $display(&quot;[CHK] vsync 低电平拍数合理 OK&quot;);\n        end else begin\n            fail_cnt = fail_cnt + 1;\n            $display(&quot;[CHK] vsync 低电平拍数异常 FAIL&quot;);\n        end\n\n        $display(&quot;========================================&quot;);\n        $display(&quot;tb_vga_sync: PASS=%0d FAIL=%0d&quot;, pass_cnt, fail_cnt);\n        $display(&quot;========================================&quot;);\n        #1000;\n        $finish;\n    end\n\nendmodule\n\n`default_nettype wire\n"}, {"file": "code/phase3/vga_colorbar_top.v", "type": "verilog", "role": "synthesizable", "title": "vga_colorbar_top.v - 8 竖彩条", "codeHtml": "//==============================================================================\n// vga_colorbar_top.v - VGA 彩条输出\n// 8 条竖彩条：白/黄/青/绿/品红/红/蓝/黑\n//==============================================================================\n`default_nettype none\n\nmodule vga_colorbar_top (\n    input  wire clk,\n    input  wire rst_n,\n    output wire hsync,\n    output wire vsync,\n    output reg  [2:0] rgb\n);\n\n    wire       video_on;\n    wire [9:0] pixel_x, pixel_y;\n\n    vga_sync u_sync (\n        .clk(clk), .rst_n(rst_n),\n        .hsync(hsync), .vsync(vsync),\n        .video_on(video_on),\n        .pixel_x(pixel_x), .pixel_y(pixel_y)\n    );\n\n    always @(*) begin\n        if (!video_on)\n            rgb = 3&#x27;b000;\n        else begin\n            // 8 条竖彩条，每条 80 像素宽\n            case (pixel_x[9:7])\n                3&#x27;d0: rgb = 3&#x27;b111;  // 白\n                3&#x27;d1: rgb = 3&#x27;b110;  // 黄\n                3&#x27;d2: rgb = 3&#x27;b101;  // 青\n                3&#x27;d3: rgb = 3&#x27;b100;  // 绿\n                3&#x27;d4: rgb = 3&#x27;b011;  // 品红\n                3&#x27;d5: rgb = 3&#x27;b010;  // 红\n                3&#x27;d6: rgb = 3&#x27;b001;  // 蓝\n                3&#x27;d7: rgb = 3&#x27;b000;  // 黑\n                default: rgb = 3&#x27;b000;\n            endcase\n        end\n    end\n\nendmodule\n\n`default_nettype wire\n"}, {"file": "code/phase3/vga_moving_block_top.v", "type": "verilog", "role": "synthesizable", "title": "vga_moving_block_top.v - 移动方块碰边反弹", "codeHtml": "//==============================================================================\n// vga_moving_block_top.v - VGA 移动方块（碰边反弹）\n// 方块 40x40，在 640x480 可视区内移动，碰到左右/上下边界反弹。\n//==============================================================================\n`default_nettype none\n\nmodule vga_moving_block_top (\n    input  wire clk,\n    input  wire rst_n,\n    output wire hsync,\n    output wire vsync,\n    output reg  [2:0] rgb\n);\n\n    wire       video_on;\n    wire [9:0] pixel_x, pixel_y;\n\n    reg [9:0]  block_x;\n    reg [9:0]  block_y;\n    reg        dir_x;   // 1=向右, 0=向左\n    reg        dir_y;   // 1=向下, 0=向上\n\n    localparam BLOCK_SIZE = 40;\n    localparam H_MAX = 640 - BLOCK_SIZE;\n    localparam V_MAX = 480 - BLOCK_SIZE;\n\n    vga_sync u_sync (\n        .clk(clk), .rst_n(rst_n),\n        .hsync(hsync), .vsync(vsync),\n        .video_on(video_on),\n        .pixel_x(pixel_x), .pixel_y(pixel_y)\n    );\n\n    // 位置更新（每帧移动 2 像素）\n    always @(posedge clk or negedge rst_n) begin\n        if (!rst_n) begin\n            block_x &lt;= 10&#x27;d0;\n            block_y &lt;= 10&#x27;d0;\n            dir_x   &lt;= 1&#x27;b1;\n            dir_y   &lt;= 1&#x27;b1;\n        end else begin\n            // 简化：每个像素时钟更新一次位置（实际应按帧）\n            // 这里用 pixel_y==0 &amp;&amp; pixel_x==0 作为帧开始标志\n            if (pixel_x == 10&#x27;d0 &amp;&amp; pixel_y == 10&#x27;d0) begin\n                if (dir_x) begin\n                    if (block_x &gt;= H_MAX) dir_x &lt;= 1&#x27;b0;\n                    else block_x &lt;= block_x + 2&#x27;d2;\n                end else begin\n                    if (block_x &lt;= 10&#x27;d2) dir_x &lt;= 1&#x27;b1;\n                    else block_x &lt;= block_x - 2&#x27;d2;\n                end\n\n                if (dir_y) begin\n                    if (block_y &gt;= V_MAX) dir_y &lt;= 1&#x27;b0;\n                    else block_y &lt;= block_y + 2&#x27;d2;\n                end else begin\n                    if (block_y &lt;= 10&#x27;d2) dir_y &lt;= 1&#x27;b1;\n                    else block_y &lt;= block_y - 2&#x27;d2;\n                end\n            end\n        end\n    end\n\n    // 输出 RGB：方块内红色，背景蓝色\n    always @(*) begin\n        if (!video_on)\n            rgb = 3&#x27;b000;\n        else if (pixel_x &gt;= block_x &amp;&amp; pixel_x &lt; block_x + BLOCK_SIZE &amp;&amp;\n                 pixel_y &gt;= block_y &amp;&amp; pixel_y &lt; block_y + BLOCK_SIZE)\n            rgb = 3&#x27;b111;  // 白方块\n        else\n            rgb = 3&#x27;b001;  // 蓝背景\n    end\n\nendmodule\n\n`default_nettype wire\n"}, {"file": "code/phase3/tb_vga_moving_block_top.v", "type": "verilog", "role": "testbench", "title": "tb_vga_moving_block_top.v - 验证坐标边界与反弹", "codeHtml": "//==============================================================================\n// tb_vga_moving_block_top.v - 移动方块边界/反弹自检\n// 验证方块位置在边界内、碰到边界后方向反转。\n//==============================================================================\n`timescale 1ns/1ps\n`default_nettype none\n\nmodule tb_vga_moving_block_top;\n\n    reg        clk = 1&#x27;b0;\n    reg        rst_n = 1&#x27;b0;\n    wire       hsync, vsync;\n    wire [2:0] rgb;\n\n    integer k;\n    integer pass_cnt, fail_cnt;\n\n    always #10 clk = ~clk;\n\n    vga_moving_block_top u_dut (\n        .clk(clk), .rst_n(rst_n),\n        .hsync(hsync), .vsync(vsync),\n        .rgb(rgb)\n    );\n\n    initial begin\n        pass_cnt = 0; fail_cnt = 0;\n        rst_n = 1&#x27;b0;\n        for (k = 0; k &lt; 30; k = k + 1) @(posedge clk);\n        rst_n = 1&#x27;b1;\n\n        // 跑 10 帧，监控 block_x/block_y 是否越界\n        // block_x 应在 0..600 之间，block_y 应在 0..440 之间\n        for (k = 0; k &lt; 10 * 800 * 525 * 4; k = k + 1) begin\n            @(posedge clk);\n            // 越界检查（通过 hierarchical 引用）\n            if (u_dut.block_x &gt; 10&#x27;d600 || u_dut.block_y &gt; 10&#x27;d440) begin\n                fail_cnt = fail_cnt + 1;\n                $display(&quot;[CHK] 越界! block_x=%0d block_y=%0d&quot;, u_dut.block_x, u_dut.block_y);\n            end\n        end\n\n        if (fail_cnt == 0) begin\n            pass_cnt = pass_cnt + 1;\n            $display(&quot;[CHK] 方块位置始终在边界内 OK&quot;);\n        end\n\n        $display(&quot;========================================&quot;);\n        $display(&quot;tb_vga_moving_block_top: PASS=%0d FAIL=%0d&quot;, pass_cnt, fail_cnt);\n        $display(&quot;========================================&quot;);\n        #1000;\n        $finish;\n    end\n\nendmodule\n\n`default_nettype wire\n"}], "diagrams": [{"file": "assets/phase3/vga-timing.svg", "title": "VGA 水平时序", "caption": "一行 800 像素时钟：640 可见 + 16 前肩 + 96 同步 + 48 后肩。", "svgRaw": "<svg xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"0 0 820 260\" font-family=\"system-ui,sans-serif\" font-size=\"12\">\n  <rect x=\"0\" y=\"0\" width=\"820\" height=\"260\" fill=\"#0d1420\"/>\n  <text x=\"410\" y=\"22\" fill=\"#7dd3fc\" text-anchor=\"middle\" font-size=\"15\" font-weight=\"bold\">VGA 640x480@60 水平时序（一行 800 像素时钟）<\/text>\n\n  <!-- hsync waveform -->\n  <text x=\"30\" y=\"70\" fill=\"#94a3b8\">hsync<\/text>\n  <polyline points=\"90,65 200,65 200,80 344,80 344,65 780,65\" fill=\"none\" stroke=\"#22d3ee\" stroke-width=\"2\"/>\n\n  <!-- regions -->\n  <line x1=\"90\" y1=\"100\" x2=\"200\" y2=\"100\" stroke=\"#34d399\" stroke-width=\"1\"/>\n  <text x=\"145\" y=\"115\" fill=\"#34d399\" text-anchor=\"middle\">可见 640<\/text>\n\n  <line x1=\"200\" y1=\"100\" x2=\"216\" y2=\"100\" stroke=\"#f59e0b\" stroke-width=\"1\"/>\n  <text x=\"208\" y=\"115\" fill=\"#f59e0b\" text-anchor=\"middle\">前肩16<\/text>\n\n  <line x1=\"216\" y1=\"100\" x2=\"312\" y2=\"100\" stroke=\"#fca5a5\" stroke-width=\"1\"/>\n  <text x=\"264\" y=\"115\" fill=\"#fca5a5\" text-anchor=\"middle\">同步 96<\/text>\n\n  <line x1=\"312\" y1=\"100\" x2=\"360\" y2=\"100\" stroke=\"#f59e0b\" stroke-width=\"1\"/>\n  <text x=\"336\" y=\"115\" fill=\"#f59e0b\" text-anchor=\"middle\">后肩48<\/text>\n\n  <!-- vertical note -->\n  <text x=\"410\" y=\"160\" fill=\"#94a3b8\" text-anchor=\"middle\">垂直：480 可见 + 10 前肩 + 2 同步 + 33 后肩 = 525 行<\/text>\n  <text x=\"410\" y=\"185\" fill=\"#fcd34d\" text-anchor=\"middle\">像素时钟 25.175MHz；50MHz 计数使能（每 2 拍一个像素）<\/text>\n  <text x=\"410\" y=\"210\" fill=\"#94a3b8\" text-anchor=\"middle\">消隐区输出 RGB=000；可见区 pixel_x/pixel_y 作为坐标生成图案<\/text>\n<\/svg>\n"}], "tools": [{"name": "Project F - VGA video timings", "url": "https://projectf.io/posts/video-timings-vga-720p-1080p/", "required": false, "note": "访问日期 2026-10-10；VGA 时序参数参考。"}, {"name": "通用引脚约束模板 fpga_common.xdc", "url": "../code/common/fpga_common.xdc", "required": true, "note": "VGA RGB/HSYNC/VSYNC 引脚按开发板替换。"}], "tasks": [{"id": "task-3-4-1", "text": "实现 VGA 彩条输出"}, {"id": "task-3-4-2", "text": "实现移动的方块动画"}], "cards": [{"q": "VGA 640x480@60 一行多少个像素时钟？", "a": "800 = 640 可见 + 16 前肩 + 96 同步 + 48 后肩。", "tags": ["VGA", "时序"]}, {"q": "一帧多少行？", "a": "525 = 480 可见 + 10 前肩 + 2 同步 + 33 后肩。", "tags": ["VGA", "行数"]}, {"q": "像素时钟是多少？", "a": "25.175MHz；本设计用 50MHz 计数使能得到 25MHz。", "tags": ["VGA", "像素时钟"]}, {"q": "video_on 信号什么时候有效？", "a": "在可见区内（h_cnt<640 且 v_cnt<480）时为 1，其余消隐区为 0。", "tags": ["VGA", "video_on"]}, {"q": "消隐区 RGB 应输出什么？", "a": "000（黑色），避免显示器显示杂色。", "tags": ["VGA", "消隐"]}, {"q": "移动方块怎么实现碰边反弹？", "a": "方块坐标到达边界时反转方向标志 dir_x/dir_y。", "tags": ["VGA", "反弹"]}, {"q": "VGA 接口需要什么硬件？", "a": "HSYNC/VSYNC 数字信号 + RGB 模拟电压（电阻网络 DAC）。", "tags": ["VGA", "硬件"]}, {"q": "pixel_x/pixel_y 的范围？", "a": "pixel_x 0~639，pixel_y 0~479（可见区内）。", "tags": ["VGA", "坐标"]}], "quiz": [{"q": "VGA 640x480@60 一行多少像素时钟？", "options": ["640", "800", "525", "480"], "answer": 1, "explain": "640+16+96+48=800。"}, {"q": "一帧多少行？", "options": ["480", "525", "640", "800"], "answer": 1, "explain": "480+10+2+33=525。"}, {"q": "像素时钟标称值？", "options": ["25.175MHz", "50MHz", "100MHz", "12MHz"], "answer": 0, "explain": "VESA 标准 640x480@60 像素时钟 25.175MHz。"}, {"q": "消隐区 RGB 应输出？", "options": ["白", "黑", "红", "随机"], "answer": 1, "explain": "消隐区输出 000 黑色。"}], "docHtml": "<h1>3.4 VGA 显示接口<\/h1>\n<p>VGA 是最经典的模拟显示接口：HSYNC（行同步）、VSYNC（场同步）、RGB 三色模拟信号。FPGA 通过产生标准时序让显示器输出图案。<\/p>\n<h2>640×480@60 标准时序<\/h2>\n<p>像素时钟 25.175MHz。一行 800 个像素时钟：<\/p>\n<table>\n<thead>\n<tr>\n<th>区间<\/th>\n<th>像素数<\/th>\n<th>说明<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>可见区<\/td>\n<td>640<\/td>\n<td>真正显示像素<\/td>\n<\/tr>\n<tr>\n<td>前肩<\/td>\n<td>16<\/td>\n<td>消隐过渡<\/td>\n<\/tr>\n<tr>\n<td>同步脉冲<\/td>\n<td>96<\/td>\n<td>hsync 拉低<\/td>\n<\/tr>\n<tr>\n<td>后肩<\/td>\n<td>48<\/td>\n<td>消隐过渡<\/td>\n<\/tr>\n<tr>\n<td>合计<\/td>\n<td>800<\/td>\n<td><\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<p>一帧 525 行：480 可见 + 10 前肩 + 2 同步 + 33 后肩。<\/p>\n<h2>像素时钟生成<\/h2>\n<p>本设计用 50MHz 系统时钟，通过计数使能得到 25MHz 像素时钟（每 2 个系统时钟推进一个像素坐标），不依赖 MMCM/PLL。实际 25.175MHz 与 25MHz 误差 0.7%，显示器可容忍。<\/p>\n<h2>坐标生成<\/h2>\n<p><code>vga_sync<\/code> 输出 <code>pixel_x<\/code>(0~639) 和 <code>pixel_y<\/code>(0~479)。在 <code>video_on=1<\/code> 时，根据坐标判断该像素应显示什么颜色。<\/p>\n<h2>代码结构<\/h2>\n<ul>\n<li><code>vga_sync.v<\/code>：产生 hsync/vsync/video_on 和 pixel_x/pixel_y 坐标。<\/li>\n<li><code>vga_colorbar_top.v<\/code>：8 条竖彩条（白黄青绿品红蓝黑）。<\/li>\n<li><code>vga_moving_block_top.v<\/code>：40×40 白方块在 640×480 内移动碰边反弹。<\/li>\n<\/ul>\n<blockquote>\n<p>VGA 时序参数参考 VESA 标准与 Project F 教程（访问日期 2026-10-10）。实际显示需上板接 VGA 接口 DAC（电阻网络）验证。<\/p>\n<\/blockquote>"}, {"chapterId": "3.5", "phase": 3, "slug": "digital-clock", "title": "综合项目·数字电子钟", "summary": "时分秒自动计时（60/60/24 进位）、按键调时、6 位数码管动态扫描显示。", "doc": "docs/phase3/ch5-digital-clock.md", "code": [{"file": "code/phase3/clk_debounce.v", "type": "verilog", "role": "synthesizable", "title": "clk_d
