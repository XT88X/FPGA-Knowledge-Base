function chapterHtml(f){
  var h = '';
  h += '<div class="chapter" id="ch-'+esc(f.chapterId)+'">';
  h += '<h4>'+esc(f.chapterId)+' '+esc(f.title)+'</h4>';
  h += '<p class="sum">'+esc(f.summary)+'</p>';
  if(f.docHtml){
    var dh = f.docHtml.replace(/<table>/g,'<div class="table-wrap"><table>').replace(/<\/table>/g,'</table></div>');
    h += '<div class="doc">'+dh+'</div>';
  }

  // code tabs
  if(f.code && f.code.length){
    h += '<div class="codeblock"><div class="tabs">';
    f.code.forEach(function(c,i){
      h += '<div class="tab'+(i===0?' active':'')+'" data-i="'+i+'">'+esc(c.title||c.file)+'</div>';
    });
    h += '</div>';
    f.code.forEach(function(c,i){
      h += '<pre class="code" data-i="'+i+'" style="display:'+(i===0?'block':'none')+'">'+hlVerilog(c.codeHtml||'')+'</pre>';
    });
    h += '</div>';
  }

  // diagrams (svg raw)
  if(f.diagrams && f.diagrams.length){
    f.diagrams.forEach(function(d){
      h += '<div class="diagram">'+(d.svgRaw||'')+'<div class="cap">'+esc(d.title||'')+'：'+esc(d.caption||'')+'</div></div>';
    });
  }

  // tools
  if(f.tools && f.tools.length){
    h += '<div class="tools">';
    f.tools.forEach(function(t){
      h += '<a href="'+esc(t.url)+'" target="_blank" rel="noopener">'+esc(t.name)+(t.required?'<span class="req">必装</span>':'<span class="req" style="color:#7d8aa5">可选</span>')+'</a>';
    });
    h += '</div>';
  }

  // tasks
  if(f.tasks && f.tasks.length){
    h += '<div style="margin-top:10px;"><div style="font-size:13px;color:var(--muted);">实践任务</div>';
    f.tasks.forEach(function(t){
      h += '<label class="task"><input type="checkbox" class="task-checkbox" id="'+esc(t.id)+'"><label for="'+esc(t.id)+'">'+esc(t.text)+'</label></label>';
    });
    h += '</div>';
  }

  // quiz
  if(f.quiz && f.quiz.length){
    h += '<div style="margin-top:12px;"><div style="font-size:13px;color:var(--muted);">章末小测</div>';
    f.quiz.forEach(function(q,qi){
      h += '<div class="quiz" data-ch="'+esc(f.chapterId)+'" data-qi="'+qi+'">';
      h += '<div class="quid">'+esc(f.chapterId)+' 题'+(qi+1)+'</div>';
      h += '<div class="q">'+esc(q.q)+'</div>';
      q.options.forEach(function(o,oi){
        h += '<div class="opt" data-oi="'+oi+'">'+String.fromCharCode(65+oi)+'. '+esc(o)+'</div>';
      });
      h += '<div class="exp">解析：'+esc(q.explain)+'</div>';
      h += '</div>';
    });
    h += '</div>';
  }
  h += '</div>';
  return h;
}

  });
  // exam start buttons
  document.querySelectorAll('[data-exam-start]').forEach(function(b){
    b.addEventListener('click',function(){ startExam(+b.dataset.examStart); });
  });
}

/* ================= 考试 UI ================= */
var EXAM_RUN = {}; // pid -> {paper:[...], answers:{}}
function startExam(pid){
  var exam=(KB.exams||{})[pid];
  if(!exam || !exam.questions || !exam.questions.length){ toast('该阶段题库准备中'); return; }
  var paper=FPGAExam.shufflePaper(FPGAExam.compose(exam.questions));
  EXAM_RUN[pid]={paper:paper, answers:{}, submitted:false};
  renderExamRun(pid);
  document.getElementById('exam-run-'+pid).scrollIntoView({behavior:'smooth',block:'center'});
}
function renderExamRun(pid){
  var run=EXAM_RUN[pid]; var box=document.getElementById('exam-run-'+pid);
  box.style.display='block';
  if(run.submitted){ renderExamResult(pid); return; }
  var h='<div class="exam-progress">作答进度：<span id="exprog-'+pid+'">0</span>/'+run.paper.length+'</div>';
  run.paper.forEach(function(q,i){
    h+='<div class="exam-q"><span class="eq-type">'+({single:'单选',multi:'多选',judge:'判断',fill:'填空'})[q.type]+'</span><b>'+(i+1)+'. '+esc(q.q)+'</b>';
    if(q.type==='single' || q.type==='judge'){
      q.options.forEach(function(op,oi){
        var checked=(run.answers[i]===oi)?'checked':'';
        h+='<label class="opt"><input type="radio" name="ex'+pid+'-'+i+'" data-q="'+i+'" data-oi="'+oi+'" '+checked+'> '+esc(op)+'</label>';
      });
    } else if(q.type==='multi'){
      q.options.forEach(function(op,oi){
        var checked=(run.answers[i]&&run.answers[i].indexOf(oi)>=0)?'checked':'';
        h+='<label class="opt"><input type="checkbox" data-q="'+i+'" data-oi="'+oi+'" '+checked+'> '+esc(op)+'</label>';
      });
    } else if(q.type==='fill'){
      h+='<input class="exam-fill" data-q="'+i+'" placeholder="输入答案" value="'+esc(run.answers[i]||'')+'">';
    }
    h+='</div>';
  });
  h+='<div class="controls" style="justify-content:flex-start;"><button class="btn primary" data-exam-submit="'+pid+'">交卷</button>'+
     '<button class="btn" data-exam-redo="'+pid+'">换一批重抽</button></div>';
  box.innerHTML=h;
  // bind
  box.querySelectorAll('input[type=radio]').forEach(function(r){ r.addEventListener('change',function(){
    run.answers[+r.dataset.q]=+r.dataset.oi; updProg(pid); });});
  box.querySelectorAll('input[type=checkbox]').forEach(function(c){ c.addEventListener('change',function(){
    var i=+c.dataset.q; run.answers[i]=run.answers[i]||[];
    var oi=+c.dataset.oi, k=run.answers[i].indexOf(oi);
    if(c.checked && k<0) run.answers[i].push(oi);
    if(!c.checked && k>=0) run.answers[i].splice(k,1);
    updProg(pid); });});
  box.querySelectorAll('input.exam-fill').forEach(function(f){ f.addEventListener('input',function(){
    run.answers[+f.dataset.q]=f.value; updProg(pid); });});
  box.querySelector('[data-exam-submit]').addEventListener('click',function(){
    var ansCount=run.paper.filter(function(_,i){
      var a=run.answers[i];
      if(Array.isArray(a)) return a.length>0;
      return a!==undefined && a!=='';
    }).length;
    if(ansCount<run.paper.length && !confirm('还有 '+(run.paper.length-ansCount)+' 题未答，确定交卷？')) return;
    submitExam(pid);
  });
  box.querySelector('[data-exam-redo]').addEventListener('click',function(){ startExam(pid); });
  updProg(pid);
}
function updProg(pid){
  var run=EXAM_RUN[pid]; var n=0;
  run.paper.forEach(function(_,i){ var a=run.answers[i];
    if(Array.isArray(a)){ if(a.length) n++; } else if(a!==undefined&&a!=='') n++; });
  var el=document.getElementById('exprog-'+pid); if(el) el.textContent=n;
}
function submitExam(pid){
  var run=EXAM_RUN[pid];
  var res=FPGAExam.gradePaper(run.paper, run.paper.map(function(_,i){return run.answers[i];}));
  run.submitted=true; run.result=res;
  // 更新存档
  var st=loadExamState(); st.best=st.best||{}; st.passed=st.passed||{};
  if(res.score > (st.best[pid]||0)) st.best[pid]=res.score;
  var newlyPassed=false;
  if(res.passed && !st.passed[pid]){ st.passed[pid]=true; newlyPassed=true; }
  else if(res.passed){ st.passed[pid]=true; }
  saveExamState(st);
  renderExamResult(pid);
  renderPhaseNav(); renderAppLockState();
  if(newlyPassed){ toast('恭喜通过阶段'+pid+'考卷！已解锁阶段'+(+pid+1)); }
}
function renderExamResult(pid){
  var run=EXAM_RUN[pid]; var res=run.result; var box=document.getElementById('exam-run-'+pid);
  var h='<div style="margin:8px 0;">总分 <span class="score-big" style="color:'+(res.passed?'var(--green)':'var(--red)')+'">'+res.score+'</span> 分 — '+
    (res.passed?'<span style="color:var(--green);">及格通过</span>':'<span style="color:var(--red);">未达 85，可重新抽题再考</span>')+'</div>';
  res.detail.forEach(function(d,i){
    h+='<div class="exam-q" style="border-color:'+(d.ok?'var(--green)':'var(--red)')+'">'+
      '<b>'+(i+1)+'. '+esc(d.q)+'</b> '+
      '<span style="color:'+(d.ok?'var(--green)':'var(--red)')+'">['+(d.ok?'✓':'✗')+']</span>'+
      '<div class="your">你的作答：'+esc(d.your)+'</div>'+
      '<div class="your" style="color:var(--green);">正确答案：'+esc(d.correct)+'</div>'+
      '<div style="font-size:12px;color:var(--amber);margin-top:4px;">解析：'+esc(d.explain)+'</div></div>';
  });
  h+='<div class="controls" style="justify-content:flex-start;"><button class="btn primary" data-exam-redo="'+pid+'">重新抽题再考</button></div>';
  box.innerHTML=h;
  box.querySelector('[data-exam-redo]').addEventListener('click',function(){ startExam(pid); });
}
function renderAppLockState(){
  var d=examDerive();
  PHASES.forEach(function(p){
    var el=document.getElementById('phase-'+p.id); if(!el) return;
    el.classList.toggle('locked', !d.unlocked[p.id]);
  });
  renderPhaseNav();
}

/* ================= 进度 / 徽章 ================= */
function allCheckboxes(){return document.querySelectorAll('.task-checkbox');}
function loadProgress(){
  var saved=null; try{saved=JSON.parse(localStorage.getItem(PROGRESS_KEY)||'null');}catch(e){}
  allCheckboxes().forEach(function(cb){
    if(saved && saved[cb.id]!==undefined) cb.checked=saved[cb.id];
    cb.addEventListener('change',updateProgress);
  });
}
function saveProgress(){
  var p={}; allCheckboxes().forEach(function(cb){p[cb.id]=cb.checked;});
  try{localStorage.setItem(PROGRESS_KEY,JSON.stringify(p));}catch(e){}
}
function updateProgress(){
  var cbs=allCheckboxes(); var total=cbs.length, done=0;
  cbs.forEach(function(cb){ if(cb.checked) done++; if(cb.closest('.task')) cb.closest('.task').classList.toggle('done',cb.checked); });
  var pct = total? Math.round(done/total*100):0;
  document.getElementById('total-progress-bar').style.width=pct+'%';
  document.getElementById('total-progress-text').textContent=pct+'%';
  saveProgress();
  // badges
  PHASES.forEach(function(p){
    var list=document.querySelectorAll('.task-checkbox[id^="task-'+p.id+'-"]');
    var all = list.length>0;
    list.forEach(function(cb){ if(!cb.checked) all=false; });
    document.getElementById('badge-'+p.id).classList.toggle('unlocked',all);
  });
}

/* ================= AI 助教（离线检索 + 可选在线） ================= */
function buildCorpus(){
  var corpus=[];
  (KB.chapters||[]).forEach(function(c){
    var plain = (c.docHtml||'').replace(/<[^>]+>/g,' ');
    (c.cards||[]).forEach(function(card){
      corpus.push({ch:c.chapterId, title:c.title, kind:'card', q:card.q, a:card.a, tags:(card.tags||[]).join(' '), text:card.q+' '+card.a+' '+plain});
    });
    corpus.push({ch:c.chapterId, title:c.title, kind:'chapter', q:c.title, a:c.summary, text:c.title+' '+plain});
  });
  return corpus;
}
var CORPUS = [];
function tokens(s){
  s=String(s).toLowerCase();
  var arr=s.split(/[^a-z0-9\u4e00-\u9fa5]+/).filter(Boolean);
  // 中文 bigram
  var zh=s.match(/[\u4e00-\u9fa5]{2,}/g)||[];
  zh.forEach(function(w){ for(var i=0;i<w.length-1;i++) arr.push(w.substr(i,2)); });
  return uniq(arr);
}
function searchKB(query){
  var ts=tokens(query);
  var best=null,bestScore=0;
  CORPUS.forEach(function(item){
    var text=item.text.toLowerCase(); var sc=0;
    ts.forEach(function(t){ if(text.indexOf(t)>=0) sc+= (t.length>=2?2:1); });
    if(sc>bestScore){bestScore=sc;best=item;}
  });
  return {item:best, score:bestScore};
}
function aiSay(role,text,src){
  var box=document.getElementById('aiMsgs');
  var d=document.createElement('div'); d.className='msg '+role;
  d.textContent=text;
  if(src){var s=document.createElement('span');s.className='src';s.textContent='来源：'+src;d.appendChild(s);}
  box.appendChild(d); box.scrollTop=box.scrollHeight;
}
function offlineAnswer(q){
  var r=searchKB(q);
  if(!r.item || r.score<2){
    aiSay('ai','知识库没有直接命中「'+q+'」。你可以换个问法，或点“抽一题”做练习。我只根据本知识库作答，不会编造。');
    return;
  }
  var it=r.item;
  if(it.kind==='card'){ aiSay('ai', it.q+'\n\n'+it.a, '阶段1 第'+it.ch+'章 · '+it.title); }
  else { aiSay('ai','关于「'+it.q+'」：'+it.a+'（详见该章节讲解）', '第'+it.ch+'章 · '+it.title); }
}
function randomQuiz(){
  var pool=[];
  (KB.chapters||[]).forEach(function(c){ (c.quiz||[]).forEach(function(q){pool.push({ch:c.chapterId,title:c.title,q:q});}); });
  if(!pool.length){aiSay('ai','暂无题库。');return;}
  var pick=pool[Math.floor(Math.random()*pool.length)];
  var opts=pick.q.options.map(function(o,i){return String.fromCharCode(65+i)+'. '+o;}).join('\n');
  aiSay('ai','【'+pick.ch+' · '+pick.title+'】\n'+pick.q.q+'\n\n'+opts+'\n\n（答对与否请到对应章节小测里点选，这里只出题）\n答案：'+String.fromCharCode(65+pick.q.answer)+'。'+pick.q.explain);
}
function loadCfg(){ try{return JSON.parse(localStorage.getItem(CFG_KEY)||'{}');}catch(e){return{};} }
async function onlineAnswer(q){
  var cfg=loadCfg();
  if(!cfg.key || !cfg.base){ offlineAnswer(q); return; }
  var ctx=(KB.chapters||[]).map(function(c){return c.chapterId+' '+c.title+'：'+c.summary;}).join('\n');
  try{
    var base=cfg.base.replace(/\/$/,'');
    var r=await fetch(base+'/chat/completions',{method:'POST',
      headers:{'Content-Type':'application/json','Authorization':'Bearer '+cfg.key},
      body:JSON.stringify({model:cfg.model||'deepseek-chat',
        messages:[{role:'system',content:'你是 FPGA 学习助教，只依据以下知识库大纲作答，不知道就说不知道。\n'+ctx},
                  {role:'user',content:q}], temperature:0.3})});
    if(!r.ok) throw new Error('http '+r.status);
    var j=await r.json();
    aiSay('ai', j.choices[0].message.content.trim(), '在线模型:'+(cfg.model||''));
  }catch(e){ offlineAnswer(q); }
}

/* ================= 启动 ================= */
document.addEventListener('DOMContentLoaded',function(){
  renderBadges();
  renderApp();
  renderPhaseNav();
  CORPUS=buildCorpus();
  loadProgress();
  updateProgress();
  document.getElementById('phase-1').classList.add('open');

  document.getElementById('btnExpandAll').onclick=function(){
    var d=examDerive();
    PHASES.forEach(function(p){ if(d.unlocked[p.id]) document.getElementById('phase-'+p.id).classList.add('open'); });
  };
  document.getElementById('btnCollapseAll').onclick=function(){document.querySelectorAll('.phase').forEach(function(p){p.classList.remove('open');});};
  document.getElementById('btnReset').onclick=function(){
    if(confirm('确定要重置所有学习进度、考试存档与刷题/模考记录吗（含勾选/通关/错题本/收藏/模考最高分）？此操作不可撤销！')){
      localStorage.removeItem(PROGRESS_KEY);
      localStorage.removeItem(EXAM_KEY);
      localStorage.removeItem(DRILL_KEY);
      localStorage.removeItem(MOCK_KEY);
      allCheckboxes().forEach(function(cb){cb.checked=false;});
      renderApp(); renderPhaseNav();
      updateProgress();
    }
  };

  // AI panel
  var panel=document.getElementById('aiPanel');
  // drill
  document.getElementById('btnDrill').onclick=drillOpen;
  document.getElementById('drillClose').onclick=drillClosePanel;
  document.getElementById('aiFab').onclick=function(){panel.classList.toggle('open');
    if(panel.classList.contains('open') && !document.getElementById('aiMsgs').children.length)
      aiSay('ai','你好，我是 FPGA 助教。默认离线检索本知识库作答；点“设置”可填 OpenAI 兼容 Key 在线增强。');};
  document.getElementById('btnQuiz').onclick=randomQuiz;
  document.getElementById('btnSetting').onclick=function(){document.getElementById('aiSettings').classList.add('open');
    var c=loadCfg(); document.getElementById('cfgBase').value=c.base||''; document.getElementById('cfgKey').value=c.key||''; document.getElementById('cfgModel').value=c.model||'';};
  document.getElementById('cfgClose').onclick=function(){document.getElementById('aiSettings').classList.remove('open');};
  document.querySelectorAll('.presets .btn').forEach(function(b){
    b.onclick=function(){document.getElementById('cfgBase').value=b.dataset.base; document.getElementById('cfgModel').value=b.dataset.model;};
  });
  document.getElementById('cfgSave').onclick=function(){
    var c={base:document.getElementById('cfgBase').value.trim(), key:document.getElementById('cfgKey').value.trim(), model:document.getElementById('cfgModel').value.trim()};
    try{localStorage.setItem(CFG_KEY,JSON.stringify(c));}catch(e){}
    document.getElementById('aiSettings').classList.remove('open');
    aiSay('ai','设置已保存到本机浏览器。');
  };
  function send(){var v=document.getElementById('aiInput').value.trim(); if(!v)return;
    aiSay('me',v); document.getElementById('aiInput').value=''; onlineAnswer(v);}
  document.getElementById('aiSend').onclick=send;
  document.getElementById('aiInput').addEventListener('keydown',function(e){if(e.key==='Enter')send();});
});
</script>
