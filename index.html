ebounce.v - 按键消抖", "codeHtml": "//==============================================================================\n// clk_debounce.v - 按键消抖\n// 原理：用同步寄存器把异步按键打两拍，再用计数器滤除 &lt;20ms 的抖动。\n//==============================================================================\n`default_nettype none\n\nmodule clk_debounce #(\n    parameter integer CLK_FREQ_HZ = 50_000_000,\n    parameter integer DEBOUNCE_MS = 20\n)(\n    input  wire clk,\n    input  wire rst_n,\n    input  wire key_in,\n    output reg  key_out\n);\n\n    localparam integer CNT_MAX = CLK_FREQ_HZ / 1000 * DEBOUNCE_MS;\n\n    reg [1:0] sync_reg;\n    reg       key_stable;\n    reg [31:0] cnt;\n\n    always @(posedge clk or negedge rst_n) begin\n        if (!rst_n) begin\n            sync_reg  &lt;= 2&#x27;b11;\n            key_stable &lt;= 1&#x27;b1;\n            cnt       &lt;= 32&#x27;d0;\n            key_out   &lt;= 1&#x27;b1;\n        end else begin\n            sync_reg &lt;= {sync_reg[0], key_in};\n            if (sync_reg[1] != key_stable) begin\n                cnt &lt;= cnt + 1&#x27;b1;\n                if (cnt &gt;= CNT_MAX) begin\n                    key_stable &lt;= sync_reg[1];\n                    cnt &lt;= 32&#x27;d0;\n                end\n            end else begin\n                cnt &lt;= 32&#x27;d0;\n            end\n            key_out &lt;= key_stable;\n        end\n    end\n\nendmodule\n\n`default_nettype wire\n"}, {"file": "code/phase3/time_counter.v", "type": "verilog", "role": "synthesizable", "title": "time_counter.v - 时分秒计数+调时", "codeHtml": "//==============================================================================\n// time_counter.v - 时分秒计数器\n// 秒 0~59、分 0~59、时 0~23；按键调时：mode=0 走时，mode=1 调分，mode=2 调时\n//==============================================================================\n`default_nettype none\n\nmodule time_counter #(\n    parameter integer CLK_FREQ_HZ = 50_000_000\n)(\n    input  wire clk,\n    input  wire rst_n,\n    input  wire [1:0] mode,      // 0=走时, 1=调分, 2=调时\n    input  wire add_pulse,        // 调时加一键脉冲\n    output reg  [5:0] sec,       // 0~59\n    output reg  [5:0] min,       // 0~59\n    output reg  [5:0] hour        // 0~23\n);\n\n    localparam integer SEC_MAX = CLK_FREQ_HZ - 1;\n\n    reg [31:0] sec_cnt;\n\n    always @(posedge clk or negedge rst_n) begin\n        if (!rst_n) begin\n            sec_cnt &lt;= 32&#x27;d0;\n            sec     &lt;= 6&#x27;d0;\n            min     &lt;= 6&#x27;d0;\n            hour    &lt;= 6&#x27;d0;\n        end else begin\n            if (mode == 2&#x27;b00) begin\n                // 正常走时\n                sec_cnt &lt;= sec_cnt + 1&#x27;b1;\n                if (sec_cnt &gt;= SEC_MAX) begin\n                    sec_cnt &lt;= 32&#x27;d0;\n                    if (sec == 6&#x27;d59) begin\n                        sec &lt;= 6&#x27;d0;\n                        if (min == 6&#x27;d59) begin\n                            min &lt;= 6&#x27;d0;\n                            if (hour == 6&#x27;d23)\n                                hour &lt;= 6&#x27;d0;\n                            else\n                                hour &lt;= hour + 1&#x27;b1;\n                        end else begin\n                            min &lt;= min + 1&#x27;b1;\n                        end\n                    end else begin\n                        sec &lt;= sec + 1&#x27;b1;\n                    end\n                end\n            end else begin\n                // 调时模式：add_pulse 上升沿加一\n                if (add_pulse) begin\n                    if (mode == 2&#x27;b01) begin\n                        if (min == 6&#x27;d59) min &lt;= 6&#x27;d0;\n                        else min &lt;= min + 1&#x27;b1;\n                    end else if (mode == 2&#x27;b10) begin\n                        if (hour == 6&#x27;d23) hour &lt;= 6&#x27;d0;\n                        else hour &lt;= hour + 1&#x27;b1;\n                    end\n                end\n                sec_cnt &lt;= 32&#x27;d0;\n            end\n        end\n    end\n\nendmodule\n\n`default_nettype wire\n"}, {"file": "code/phase3/tb_time_counter.v", "type": "verilog", "role": "testbench", "title": "tb_time_counter.v - 加速验证 59->00、23:59:59 归零", "codeHtml": "//==============================================================================\n// tb_time_counter.v - 时分秒进位自检\n// 用小 SEC_MAX 加速，验证 59-&gt;00 进位与 23:59:59 归零。\n//==============================================================================\n`timescale 1ns/1ps\n`default_nettype none\n\nmodule tb_time_counter;\n\n    reg        clk = 1&#x27;b0;\n    reg        rst_n = 1&#x27;b0;\n    reg  [1:0] mode = 2&#x27;b00;\n    reg        add_pulse = 1&#x27;b0;\n    wire [5:0] sec, min, hour;\n\n    integer k;\n    integer pass_cnt, fail_cnt;\n\n    always #10 clk = ~clk;  // 50MHz\n\n    // 加速：SEC_MAX=1000 而不是 50M\n    time_counter #(.CLK_FREQ_HZ(1001)) u_dut (\n        .clk(clk), .rst_n(rst_n),\n        .mode(mode), .add_pulse(add_pulse),\n        .sec(sec), .min(min), .hour(hour)\n    );\n\n    initial begin\n        pass_cnt = 0; fail_cnt = 0;\n        rst_n = 1&#x27;b0;\n        for (k = 0; k &lt; 20; k = k + 1) @(posedge clk);\n        rst_n = 1&#x27;b1;\n\n        // 跑 25*60*60 秒（加速后每&quot;秒&quot;=1001 拍）\n        // 验证从 00:00:00 走到 23:59:59 再回 00:00:00\n        for (k = 0; k &lt; 25 * 60 * 60 * 1001 + 2000; k = k + 1) begin\n            @(posedge clk);\n            if (sec &gt; 6&#x27;d59) begin\n                fail_cnt = fail_cnt + 1;\n                $display(&quot;[CHK] 秒越界! sec=%0d&quot;, sec);\n            end\n            if (min &gt; 6&#x27;d59) begin\n                fail_cnt = fail_cnt + 1;\n                $display(&quot;[CHK] 分越界! min=%0d&quot;, min);\n            end\n            if (hour &gt; 6&#x27;d23) begin\n                fail_cnt = fail_cnt + 1;\n                $display(&quot;[CHK] 时越界! hour=%0d&quot;, hour);\n            end\n        end\n\n        $display(&quot;[CHK] 最终 hour=%0d min=%0d sec=%0d&quot;, hour, min, sec);\n\n        if (fail_cnt == 0) begin\n            pass_cnt = pass_cnt + 1;\n            $display(&quot;[CHK] 时分秒无越界 OK&quot;);\n        end\n\n        // 测试调时：mode=2 调时，按 25 次到 25:00:00 应回 0\n        mode = 2&#x27;b10;\n        for (k = 0; k &lt; 25; k = k + 1) begin\n            @(posedge clk);\n            add_pulse = 1&#x27;b1;\n            @(posedge clk);\n            add_pulse = 1&#x27;b0;\n        end\n        $display(&quot;[CHK] 调时后 hour=%0d&quot;, hour);\n        if (hour == 6&#x27;d0) begin\n            pass_cnt = pass_cnt + 1;\n            $display(&quot;[CHK] 23 之后归零 OK&quot;);\n        end else begin\n            fail_cnt = fail_cnt + 1;\n            $display(&quot;[CHK] 23 之后未归零 FAIL&quot;);\n        end\n\n        $display(&quot;========================================&quot;);\n        $display(&quot;tb_time_counter: PASS=%0d FAIL=%0d&quot;, pass_cnt, fail_cnt);\n        $display(&quot;========================================&quot;);\n        #1000;\n        $finish;\n    end\n\nendmodule\n\n`default_nettype wire\n"}, {"file": "code/phase3/seg_dynamic_scan.v", "type": "verilog", "role": "synthesizable", "title": "seg_dynamic_scan.v - 6 位动态扫描", "codeHtml": "//==============================================================================\n// seg_dynamic_scan.v - 数码管动态扫描\n// 6 位数码管（HH-MM-SS）：段选 8 位（a~g+dp），位选 6 位。\n// 每 ~1ms 切一位，利用视觉暂留实现 6 位同时亮。\n//==============================================================================\n`default_nettype none\n\nmodule seg_dynamic_scan #(\n    parameter integer CLK_FREQ_HZ = 50_000_000\n)(\n    input  wire clk,\n    input  wire rst_n,\n    input  wire [3:0] digit0,   // 最右位\n    input  wire [3:0] digit1,\n    input  wire [3:0] digit2,\n    input  wire [3:0] digit3,\n    input  wire [3:0] digit4,\n    input  wire [3:0] digit5,   // 最左位\n    output reg  [7:0] seg,      // 段选 {dp,g,f,e,d,c,b,a}\n    output reg  [5:0] seg_sel    // 位选（低有效）\n);\n\n    localparam integer SCAN_MAX = CLK_FREQ_HZ / 1000;  // 1ms\n\n    reg [15:0] scan_cnt;\n    reg [2:0]  sel;\n    reg [3:0]  cur_digit;\n\n    always @(posedge clk or negedge rst_n) begin\n        if (!rst_n) begin\n            scan_cnt &lt;= 16&#x27;d0;\n            sel      &lt;= 3&#x27;d0;\n        end else begin\n            scan_cnt &lt;= scan_cnt + 1&#x27;b1;\n            if (scan_cnt &gt;= SCAN_MAX) begin\n                scan_cnt &lt;= 16&#x27;d0;\n                sel &lt;= sel + 1&#x27;b1;\n                if (sel == 3&#x27;d5) sel &lt;= 3&#x27;d0;\n            end\n        end\n    end\n\n    always @(*) begin\n        case (sel)\n            3&#x27;d0: begin cur_digit = digit0; seg_sel = 6&#x27;b111110; end\n            3&#x27;d1: begin cur_digit = digit1; seg_sel = 6&#x27;b111101; end\n            3&#x27;d2: begin cur_digit = digit2; seg_sel = 6&#x27;b111011; end\n            3&#x27;d3: begin cur_digit = digit3; seg_sel = 6&#x27;b110111; end\n            3&#x27;d4: begin cur_digit = digit4; seg_sel = 6&#x27;b101111; end\n            3&#x27;d5: begin cur_digit = digit5; seg_sel = 6&#x27;b011111; end\n            default: begin cur_digit = 4&#x27;d0; seg_sel = 6&#x27;b111111; end\n        endcase\n    end\n\n    // 共阴数码管段码（a~g，dp=0）\n    always @(*) begin\n        case (cur_digit)\n            4&#x27;d0: seg = 8&#x27;b00111111;\n            4&#x27;d1: seg = 8&#x27;b00000110;\n            4&#x27;d2: seg = 8&#x27;b01011011;\n            4&#x27;d3: seg = 8&#x27;b01001111;\n            4&#x27;d4: seg = 8&#x27;b01100110;\n            4&#x27;d5: seg = 8&#x27;b01101101;\n            4&#x27;d6: seg = 8&#x27;b01111101;\n            4&#x27;d7: seg = 8&#x27;b00000111;\n            4&#x27;d8: seg = 8&#x27;b01111111;\n            4&#x27;d9: seg = 8&#x27;b01101111;\n            default: seg = 8&#x27;b00000000;\n        endcase\n    end\n\nendmodule\n\n`default_nettype wire\n"}, {"file": "code/phase3/tb_seg_dynamic_scan.v", "type": "verilog", "role": "testbench", "title": "tb_seg_dynamic_scan.v - 位选/段码自检", "codeHtml": "//==============================================================================\n// tb_seg_dynamic_scan.v - 动态扫描自检\n// 验证位选循环、段码 0~9 正确。\n//==============================================================================\n`timescale 1ns/1ps\n`default_nettype none\n\nmodule tb_seg_dynamic_scan;\n\n    reg        clk = 1&#x27;b0;\n    reg        rst_n = 1&#x27;b0;\n    reg  [3:0] digit0;\n    reg  [3:0] digit1;\n    reg  [3:0] digit2;\n    reg  [3:0] digit3;\n    reg  [3:0] digit4;\n    reg  [3:0] digit5;\n    initial begin\n        digit0=4&#x27;d0; digit1=4&#x27;d1; digit2=4&#x27;d2;\n        digit3=4&#x27;d3; digit4=4&#x27;d4; digit5=4&#x27;d5;\n    end\n    wire [7:0] seg;\n    wire [5:0] seg_sel;\n\n    integer k;\n    integer pass_cnt, fail_cnt;\n\n    always #10 clk = ~clk;\n\n    seg_dynamic_scan #(.CLK_FREQ_HZ(1000)) u_dut (\n        .clk(clk), .rst_n(rst_n),\n        .digit0(digit0), .digit1(digit1), .digit2(digit2),\n        .digit3(digit3), .digit4(digit4), .digit5(digit5),\n        .seg(seg), .seg_sel(seg_sel)\n    );\n\n    initial begin\n        pass_cnt = 0; fail_cnt = 0;\n        rst_n = 1&#x27;b0;\n        for (k = 0; k &lt; 20; k = k + 1) @(posedge clk);\n        rst_n = 1&#x27;b1;\n\n        // 跑 10 个扫描周期\n        for (k = 0; k &lt; 10 * 6 * 1000; k = k + 1) begin\n            @(posedge clk);\n        end\n\n        // 验证段码 0 = 0x3F\n        if (seg == 8&#x27;b00111111 || seg == 8&#x27;b00000110) begin\n            pass_cnt = pass_cnt + 1;\n            $display(&quot;[CHK] 段码输出合理 seg=%b OK&quot;, seg);\n        end else begin\n            fail_cnt = fail_cnt + 1;\n            $display(&quot;[CHK] 段码异常 seg=%b FAIL&quot;, seg);\n        end\n\n        if (seg_sel != 6&#x27;b111111) begin\n            pass_cnt = pass_cnt + 1;\n            $display(&quot;[CHK] 位选非全灭 seg_sel=%b OK&quot;, seg_sel);\n        end else begin\n            fail_cnt = fail_cnt + 1;\n            $display(&quot;[CHK] 位选全灭 FAIL&quot;);\n        end\n\n        $display(&quot;========================================&quot;);\n        $display(&quot;tb_seg_dynamic_scan: PASS=%0d FAIL=%0d&quot;, pass_cnt, fail_cnt);\n        $display(&quot;========================================&quot;);\n        #1000;\n        $finish;\n    end\n\nendmodule\n\n`default_nettype wire\n"}, {"file": "code/phase3/digital_clock_top.v", "type": "verilog", "role": "synthesizable", "title": "digital_clock_top.v - 电子钟顶层", "codeHtml": "//==============================================================================\n// digital_clock_top.v - 数字电子钟顶层\n// 时分秒计数 + 按键消抖 + 数码管动态扫描。\n// 按键：key_mode 切换模式（0走时/1调分/2调时），key_add 加一。\n//==============================================================================\n`default_nettype none\n\nmodule digital_clock_top #(\n    parameter integer CLK_FREQ_HZ = 50_000_000\n)(\n    input  wire clk,\n    input  wire rst_n,\n    input  wire key_mode,\n    input  wire key_add,\n    output wire [7:0] seg,\n    output wire [5:0] seg_sel\n);\n\n    wire [5:0] sec, min, hour;\n    wire       mode_db;\n    wire       add_db;\n\n    reg  [1:0] mode_reg;\n    reg        add_pulse;\n    reg        add_last;\n\n    // 按键消抖\n    clk_debounce #(.CLK_FREQ_HZ(CLK_FREQ_HZ)) u_mode (\n        .clk(clk), .rst_n(rst_n), .key_in(key_mode), .key_out(mode_db)\n    );\n    clk_debounce #(.CLK_FREQ_HZ(CLK_FREQ_HZ)) u_add (\n        .clk(clk), .rst_n(rst_n), .key_in(key_add), .key_out(add_db)\n    );\n\n    // mode_db 上升沿切换模式\n    always @(posedge clk or negedge rst_n) begin\n        if (!rst_n) begin\n            mode_reg &lt;= 2&#x27;b00;\n        end else if (mode_db == 1&#x27;b0) begin\n            if (mode_reg == 2&#x27;b10) mode_reg &lt;= 2&#x27;b00;\n            else mode_reg &lt;= mode_reg + 1&#x27;b1;\n        end\n    end\n\n    // add_db 上升沿产生一个拍脉冲\n    always @(posedge clk or negedge rst_n) begin\n        if (!rst_n) begin\n            add_last  &lt;= 1&#x27;b1;\n            add_pulse &lt;= 1&#x27;b0;\n        end else begin\n            add_pulse &lt;= (add_last == 1&#x27;b1 &amp;&amp; add_db == 1&#x27;b0);\n            add_last  &lt;= add_db;\n        end\n    end\n\n    // 时分秒计数器\n    time_counter #(.CLK_FREQ_HZ(CLK_FREQ_HZ)) u_cnt (\n        .clk(clk), .rst_n(rst_n),\n        .mode(mode_reg), .add_pulse(add_pulse),\n        .sec(sec), .min(min), .hour(hour)\n    );\n\n    // BCD 拆分\n    wire [3:0] sec_lo = sec % 10;\n    wire [3:0] sec_hi = sec / 10;\n    wire [3:0] min_lo = min % 10;\n    wire [3:0] min_hi = min / 10;\n    wire [3:0] hour_lo = hour % 10;\n    wire [3:0] hour_hi = hour / 10;\n\n    // 动态扫描\n    seg_dynamic_scan #(.CLK_FREQ_HZ(CLK_FREQ_HZ)) u_scan (\n        .clk(clk), .rst_n(rst_n),\n        .digit0(sec_lo), .digit1(sec_hi),\n        .digit2(min_lo), .digit3(min_hi),\n        .digit4(hour_lo), .digit5(hour_hi),\n        .seg(seg), .seg_sel(seg_sel)\n    );\n\nendmodule\n\n`default_nettype wire\n"}, {"file": "code/phase3/tb_digital_clock_top.v", "type": "verilog", "role": "testbench", "title": "tb_digital_clock_top.v - 顶层自检", "codeHtml": "//==============================================================================\n// tb_digital_clock_top.v - 电子钟顶层自检\n// 验证时分秒计数、段选位选输出非全灭。\n//==============================================================================\n`timescale 1ns/1ps\n`default_nettype none\n\nmodule tb_digital_clock_top;\n\n    reg        clk = 1&#x27;b0;\n    reg        rst_n = 1&#x27;b0;\n    reg        key_mode = 1&#x27;b1;\n    reg        key_add = 1&#x27;b1;\n    wire [7:0] seg;\n    wire [5:0] seg_sel;\n\n    integer k;\n    integer pass_cnt, fail_cnt;\n\n    always #10 clk = ~clk;\n\n    digital_clock_top #(.CLK_FREQ_HZ(1001)) u_dut (\n        .clk(clk), .rst_n(rst_n),\n        .key_mode(key_mode), .key_add(key_add),\n        .seg(seg), .seg_sel(seg_sel)\n    );\n\n    initial begin\n        pass_cnt = 0; fail_cnt = 0;\n        rst_n = 1&#x27;b0;\n        for (k = 0; k &lt; 30; k = k + 1) @(posedge clk);\n        rst_n = 1&#x27;b1;\n\n        // 跑 5 秒（加速）\n        for (k = 0; k &lt; 5 * 1001 + 500; k = k + 1) begin\n            @(posedge clk);\n        end\n\n        $display(&quot;[CHK] sec=%0d min=%0d hour=%0d&quot;,\n                 u_dut.sec, u_dut.min, u_dut.hour);\n\n        if (u_dut.sec &gt;= 5 &amp;&amp; u_dut.sec &lt;= 6) begin\n            pass_cnt = pass_cnt + 1;\n            $display(&quot;[CHK] 秒计数推进 OK&quot;);\n        end else begin\n            fail_cnt = fail_cnt + 1;\n            $display(&quot;[CHK] 秒计数异常 FAIL&quot;);\n        end\n\n        if (seg_sel != 6&#x27;b111111) begin\n            pass_cnt = pass_cnt + 1;\n            $display(&quot;[CHK] 位选有输出 OK&quot;);\n        end else begin\n            fail_cnt = fail_cnt + 1;\n            $display(&quot;[CHK] 位选全灭 FAIL&quot;);\n        end\n\n        $display(&quot;========================================&quot;);\n        $display(&quot;tb_digital_clock_top: PASS=%0d FAIL=%0d&quot;, pass_cnt, fail_cnt);\n        $display(&quot;========================================&quot;);\n        #1000;\n        $finish;\n    end\n\nendmodule\n\n`default_nettype wire\n"}], "diagrams": [{"file": "assets/phase3/clock-block.svg", "title": "电子钟系统框图", "caption": "时钟->秒->分->时进位链，按键消抖接入调时，动态扫描驱动数码管。", "svgRaw": "<svg xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"0 0 820 280\" font-family=\"system-ui,sans-serif\" font-size=\"12\">\n  <rect x=\"0\" y=\"0\" width=\"820\" height=\"280\" fill=\"#0d1420\"/>\n  <text x=\"410\" y=\"22\" fill=\"#7dd3fc\" text-anchor=\"middle\" font-size=\"15\" font-weight=\"bold\">数字电子钟系统框图<\/text>\n\n  <rect x=\"40\" y=\"50\" width=\"120\" height=\"50\" fill=\"#1e293b\" stroke=\"#22d3ee\"/>\n  <text x=\"100\" y=\"80\" fill=\"#22d3ee\" text-anchor=\"middle\">50MHz 时钟<\/text>\n\n  <rect x=\"220\" y=\"50\" width=\"120\" height=\"50\" fill=\"#1e293b\" stroke=\"#34d399\"/>\n  <text x=\"280\" y=\"72\" fill=\"#34d399\" text-anchor=\"middle\">秒计数器<\/text>\n  <text x=\"280\" y=\"88\" fill=\"#94a3b8\" text-anchor=\"middle\">0~59<\/text>\n\n  <rect x=\"400\" y=\"50\" width=\"120\" height=\"50\" fill=\"#1e293b\" stroke=\"#34d399\"/>\n  <text x=\"460\" y=\"72\" fill=\"#34d399\" text-anchor=\"middle\">分计数器<\/text>\n  <text x=\"460\" y=\"88\" fill=\"#94a3b8\" text-anchor=\"middle\">0~59<\/text>\n\n  <rect x=\"580\" y=\"50\" width=\"120\" height=\"50\" fill=\"#1e293b\" stroke=\"#34d399\"/>\n  <text x=\"640\" y=\"72\" fill=\"#34d399\" text-anchor=\"middle\">时计数器<\/text>\n  <text x=\"640\" y=\"88\" fill=\"#94a3b8\" text-anchor=\"middle\">0~23<\/text>\n\n  <line x1=\"160\" y1=\"75\" x2=\"220\" y2=\"75\" stroke=\"#64748b\"/>\n  <line x1=\"340\" y1=\"75\" x2=\"400\" y2=\"75\" stroke=\"#64748b\"/>\n  <line x1=\"520\" y1=\"75\" x2=\"580\" y2=\"75\" stroke=\"#64748b\"/>\n\n  <rect x=\"220\" y=\"140\" width=\"160\" height=\"50\" fill=\"#1e293b\" stroke=\"#f59e0b\"/>\n  <text x=\"300\" y=\"162\" fill=\"#f59e0b\" text-anchor=\"middle\">按键消抖<\/text>\n  <text x=\"300\" y=\"178\" fill=\"#94a3b8\" text-anchor=\"middle\">mode / add<\/text>\n\n  <rect x=\"440\" y=\"140\" width=\"160\" height=\"50\" fill=\"#1e293b\" stroke=\"#f59e0b\"/>\n  <text x=\"520\" y=\"162\" fill=\"#f59e0b\" text-anchor=\"middle\">动态扫描<\/text>\n  <text x=\"520\" y=\"178\" fill=\"#94a3b8\" text-anchor=\"middle\">6 位数码管<\/text>\n\n  <line x1=\"300\" y1=\"140\" x2=\"300\" y2=\"100\" stroke=\"#64748b\"/>\n  <line x1=\"520\" y1=\"140\" x2=\"460\" y2=\"100\" stroke=\"#64748b\"/>\n\n  <text x=\"410\" y=\"230\" fill=\"#fcd34d\" text-anchor=\"middle\">秒满 59 -> 分+1，分满 59 -> 时+1，时满 23 -> 归零<\/text>\n  <text x=\"410\" y=\"255\" fill=\"#94a3b8\" text-anchor=\"middle\">每 1ms 切一位数码管，视觉暂留形成 6 位同时亮<\/text>\n<\/svg>\n"}], "tools": [{"name": "通用引脚约束模板 fpga_common.xdc", "url": "../code/common/fpga_common.xdc", "required": true, "note": "数码管段选/位选与按键引脚按开发板替换。"}], "tasks": [{"id": "task-3-5-1", "text": "实现数码管显示时分秒自动计时"}, {"id": "task-3-5-2", "text": "实现按键调时功能"}], "cards": [{"q": "秒/分/时的进位规则？", "a": "秒 0~59 到 59 回 0 分+1；分 0~59 到 59 回 0 时+1；时 0~23 到 23 回 0。", "tags": ["进位", "电子钟"]}, {"q": "动态扫描原理？", "a": "每 1ms 切一位数码管，视觉暂留让 6 位看起来同时亮。", "tags": ["动态扫描"]}, {"q": "按键消抖为什么需要？", "a": "机械按键按下/松开时有抖动，直接读会误触发；用 20ms 计数滤除。", "tags": ["消抖"]}, {"q": "共阴数码管段码 0 是多少？", "a": "0x3F（gfedcba=0111111，a~f 亮 g 灭）。", "tags": ["段码"]}, {"q": "调时模式怎么切换？", "a": "mode 键在 0走时/1调分/2调时 三态间循环；add 键在当前模式加一。", "tags": ["调时"]}, {"q": "时分秒怎么拆成 BCD 给数码管？", "a": "十位=sec/10，个位=sec%10；分、时同理。", "tags": ["BCD"]}, {"q": "1 秒怎么从 50MHz 产生？", "a": "数满 50,000,000 个时钟拍即 1 秒。", "tags": ["秒基准"]}, {"q": "数码管位选高有效还是低有效？", "a": "取决于硬件；本设计位选低有效（seg_sel=6'b111110 选最右位）。", "tags": ["位选"]}], "quiz": [{"q": "时计数到多少后归零？", "options": ["23", "24", "59", "12"], "answer": 0, "explain": "24 小时制，hour 0~23，到 23+1=24 时归零。"}, {"q": "动态扫描每位间隔约多少？", "options": ["1us", "1ms", "100ms", "1s"], "answer": 1, "explain": "每 1ms 切一位，6 位刷新周期 6ms，人眼不闪。"}, {"q": "共阴数码管数字 0 的段码？", "options": ["0x3F", "0x06", "0x5B", "0x4F"], "answer": 0, "explain": "a~f 亮 g 灭 = 0x3F。"}, {"q": "按键消抖时间典型值？", "options": ["1us", "20ms", "1s", "1min"], "answer": 1, "explain": "机械抖动持续约几 ms，20ms 计数足够滤除。"}], "docHtml": "<h1>3.5 综合项目·数字电子钟<\/h1>\n<p>把前面学过的计数器、按键消抖、动态扫描组合起来，做一个能走时、能调时的 6 位数码管电子钟。<\/p>\n<h2>工作原理<\/h2>\n<ol>\n<li><strong>秒计数器<\/strong>：50MHz 时钟数满 50,000,000 拍即 1 秒，sec+1。<\/li>\n<li><strong>分/时进位<\/strong>：sec 到 59 后回 0，min+1；min 到 59 后回 0，hour+1；hour 到 23 后回 0。<\/li>\n<li><strong>按键调时<\/strong>：mode 键在\"走时/调分/调时\"三态间循环，add 键在当前模式下加一。按键先经消抖再接入逻辑。<\/li>\n<li><strong>动态扫描<\/strong>：6 位数码管每 1ms 切一位，视觉暂留让 6 位同时看起来都亮。<\/li>\n<\/ol>\n<h2>代码结构<\/h2>\n<ul>\n<li><code>clk_debounce.v<\/code>：按键消抖（20ms 计数滤抖）。<\/li>\n<li><code>time_counter.v<\/code>：时分秒计数，支持 mode=0 走时、mode=1 调分、mode=2 调时。<\/li>\n<li><code>seg_dynamic_scan.v<\/code>：6 位动态扫描，输出段选 {dp,g,f,e,d,c,b,a} 与位选。<\/li>\n<li><code>digital_clock_top.v<\/code>：顶层，连接消抖、计数、扫描。<\/li>\n<\/ul>\n<blockquote>\n<p>数码管共阴/共阳段码表不同，需按实际硬件调整。引脚约束引用通用 XDC 模板。<\/p>\n<\/blockquote>"}, {"chapterId": "4.1", "phase": 4, "slug": "ip-clock-mgmt", "title": "IP 核调用与时钟管理", "summary": "IP 核分类(软/硬/加密)、PLL/MMCM 内部原理(PFD/电荷泵/VCO/倍分频/移相)、时钟树与 BUFG、多时钟域与 CDC 概念引入；纯 RTL 分频模型 + Clocking Wizard IP 上板步骤。", "doc": "docs/phase4/ch1-ip-clock-mgmt.md", "code": [{"file": "code/phase4/clk_divider.v", "type": "verilog", "role": "synthesizable", "title": "clk_divider.v — clk_div_even(偶数50%分频) + clk_div_tick(使能分频)", "codeHtml": "//==============================================================================\n// clk_divider.v — 纯 RTL 整数分频（仅用于行为仿真与原理理解）\n//------------------------------------------------------------------------------\n// 说明：\n//   本文件给出两种最常见的&quot;由高频系统时钟得到低频时序&quot;的纯 RTL 写法：\n//     1) clk_div_even —— 偶数分频，输出 50% 占空比的分频时钟（DIV 必须为偶数）。\n//     2) clk_div_tick —— 使能分频，每 DIV 个输入时钟产生一个单周期高电平 tick，\n//                        下游逻辑仍跑在原始时钟上，用 if(tick) 做&quot;慢动作&quot;。\n//\n// 【重要】这是行为模型，仅供仿真理解原理。\n//   - 真实多路时钟/低抖动时钟在 Artix-7/Zynq 上必须用 Clocking Wizard(MMCM/PLL)\n//     IP 生成（见本章文档）。纯 RTL 计数器分频会累积抖动、走普通布线资源，\n//     不能当作芯片级时钟树。\n//   - 推荐工程做法：慢节拍优先用&quot;使能分频(clk_div_tick)+原时钟&quot;，\n//     即单时钟设计里给逻辑打拍，而不是真的生成一个新时钟。\n//==============================================================================\n\n// 1) 偶数分频，50% 占空比\nmodule clk_div_even #(\n    parameter DIV = 4   // 分频系数，必须为偶数且 &gt;= 2（4 -&gt; 四分频）\n)(\n    input  wire clk,\n    input  wire rst_n,   // 异步低电平复位\n    output reg  clk_out  // 50% 占空比分频输出\n);\n    localparam HALF = DIV / 2;          // 半周期计数\n    reg [25:0] cnt;\n\n    always @(posedge clk or negedge rst_n) begin\n        if (!rst_n) begin\n            cnt     &lt;= 26&#x27;d0;\n            clk_out &lt;= 1&#x27;b0;\n        end else if (cnt == HALF - 1) begin\n            cnt     &lt;= cnt + 26&#x27;d1;\n            clk_out &lt;= ~clk_out;          // 到半周期翻转一次\n        end else if (cnt == DIV - 1) begin\n            cnt     &lt;= 26&#x27;d0;\n            clk_out &lt;= ~clk_out;          // 到整周期再翻转一次 -&gt; 50% 占空比\n        end else begin\n            cnt     &lt;= cnt + 26&#x27;d1;\n        end\n    end\nendmodule\n\n\n// 2) 使能分频：每 DIV 个时钟输出一个单周期 tick（任意整数 DIV 都可用）\nmodule clk_div_tick #(\n    parameter DIV = 5    // 分频系数，任意整数 &gt;= 1（5 -&gt; 每 5 个时钟一个 tick）\n)(\n    input  wire clk,\n    input  wire rst_n,\n    output reg  tick     // 单周期高电平使能脉冲\n);\n    reg [25:0] cnt;\n\n    always @(posedge clk or negedge rst_n) begin\n        if (!rst_n) begin\n            cnt  &lt;= 26&#x27;d0;\n            tick &lt;= 1&#x27;b0;\n        end else begin\n            tick &lt;= 1&#x27;b0;                 // 默认拉低，保证单周期\n            if (cnt == DIV - 1) begin\n                cnt  &lt;= 26&#x27;d0;\n                tick &lt;= 1&#x27;b1;\n            end else begin\n                cnt  &lt;= cnt + 26&#x27;d1;\n            end\n        end\n    end\nendmodule\n"}, {"file": "code/phase4/tb_clk_divider.v", "type": "verilog", "role": "testbench", "title": "tb_clk_divider.v — 测量分频周期自检", "codeHtml": "//==============================================================================\n// tb_clk_divider.v — clk_div_even / clk_div_tick 自检\n//------------------------------------------------------------------------------\n// 验证点：\n//   * clk_div_even DIV=4：输出时钟周期 = 4 个输入时钟周期，占空比 50%。\n//   * clk_div_tick  DIV=5：每 5 个输入时钟出现一次单周期 tick。\n//   通过计数器测量输出波形周期并与期望值比对，打印 PASS/FAIL。\n//==============================================================================\n`timescale 1ns/1ps\nmodule tb_clk_divider;\n\n    reg clk;\n    reg rst_n;\n\n    // DUT1: 偶数四分频，期望输出周期 = 4 * T_clk\n    wire even_out;\n    // DUT2: 使能分频，DIV=5，期望每 5 个时钟一个 tick\n    wire tick_out;\n\n    // 输入时钟 100MHz -&gt; 周期 10ns（#5 翻转）\n    initial clk = 1&#x27;b0;\n    always #5 clk = ~clk;\n\n    clk_div_even #(.DIV(4)) u_even (\n        .clk(clk), .rst_n(rst_n), .clk_out(even_out)\n    );\n\n    clk_div_tick #(.DIV(5)) u_tick (\n        .clk(clk), .rst_n(rst_n), .tick(tick_out)\n    );\n\n    // ---- 自检：测量 even_out 的相邻上升沿间隔（单位：输入时钟周期） ----\n    integer rise_cnt;       // 从 even_out 上次上升沿到现在经过的输入时钟数\n    integer measured_period;\n    integer tick_seen;\n    integer errors;\n\n    initial begin\n        rst_n = 1&#x27;b0;\n        rise_cnt = 0;\n        measured_period = 0;\n        tick_seen = 0;\n        errors = 0;\n        #23;\n        rst_n = 1&#x27;b1;\n    end\n\n    // 数输入时钟沿，并在 even_out 上升沿记录周期\n    always @(posedge clk) begin\n        if (rst_n) begin\n            rise_cnt &lt;= rise_cnt + 1;\n            if (even_out) begin\n                if (rise_cnt != 0) begin\n                    measured_period &lt;= rise_cnt;\n                    if (rise_cnt != 4) errors &lt;= errors + 1;\n                end\n                rise_cnt &lt;= 0;\n            end\n        end\n    end\n\n    // 数 tick 个数并验证相邻 tick 间隔\n    integer tick_gap;\n    initial tick_gap = 0;\n    always @(posedge clk) begin\n        if (!rst_n) tick_gap &lt;= 0;\n        else begin\n            tick_gap &lt;= tick_gap + 1;\n            if (tick_out) begin\n                tick_seen &lt;= tick_seen + 1;\n                if (tick_gap != 5 &amp;&amp; tick_seen != 0) errors &lt;= errors + 1;\n                tick_gap &lt;= 0;\n            end\n        end\n    end\n\n    // 跑足够多拍后结束并报告\n    initial begin\n        #500;\n        $display(&quot;---- tb_clk_divider result ----&quot;);\n        $display(&quot;even_out measured period (clk cycles) = %0d, expect 4&quot;, measured_period);\n        $display(&quot;tick pulses observed = %0d&quot;, tick_seen);\n        if (errors == 0 &amp;&amp; tick_seen &gt;= 3)\n            $display(&quot;TB_CLOCK_DIVIDER: PASS&quot;);\n        else\n            $display(&quot;TB_CLOCK_DIVIDER: FAIL (errors=%0d)&quot;, errors);\n        $finish;\n    end\n\nendmodule\n"}, {"file": "code/phase4/multi_tick_led_top.v", "type": "verilog", "role": "synthesizable", "title": "multi_tick_led_top.v — 三种节奏 tick 驱动三盏 LED", "codeHtml": "//==============================================================================\n// multi_tick_led_top.v — 用不同频率&quot;时钟使能&quot;驱动不同 LED 闪烁（纯 RTL 模型）\n//------------------------------------------------------------------------------\n// 设计意图：\n//   不真正生成多个时钟，而是在同一个 clk 上用三个分频系数不同的 tick，\n//   分别翻转 led0/led1/led2 -&gt; 三盏灯以三种不同节奏闪烁。\n//\n//   led0: 每 DIV0 个时钟翻转一次（最快）\n//   led1: 每 DIV1 个时钟翻转一次\n//   led2: 每 DIV2 个时钟翻转一次（最慢）\n//\n// 【上板替换】真实多路不同频率时钟请用 Clocking Wizard(MMCM) IP 生成多个 clk\n// 再分别驱动；本模块是&quot;单时钟 + 多使能&quot;的可综合替代，也是工程上更推荐的写法。\n//==============================================================================\nmodule multi_tick_led_top #(\n    parameter DIV0 = 12500000,   // 50MHz 下约 0.25s 翻转一次\n    parameter DIV1 = 25000000,   // 约 0.5s\n    parameter DIV2 = 50000000    // 约 1.0s\n)(\n    input  wire clk,\n    input  wire rst_n,\n    output wire led0,\n    output wire led1,\n    output wire led2\n);\n    wire tick0, tick1, tick2;\n    reg  l0, l1, l2;\n\n    clk_div_tick #(.DIV(DIV0)) u_tick0 (.clk(clk), .rst_n(rst_n), .tick(tick0));\n    clk_div_tick #(.DIV(DIV1)) u_tick1 (.clk(clk), .rst_n(rst_n), .tick(tick1));\n    clk_div_tick #(.DIV(DIV2)) u_tick2 (.clk(clk), .rst_n(rst_n), .tick(tick2));\n\n    always @(posedge clk or negedge rst_n) begin\n        if (!rst_n) begin l0 &lt;= 1&#x27;b0; l1 &lt;= 1&#x27;b0; l2 &lt;= 1&#x27;b0; end\n        else begin\n            if (tick0) l0 &lt;= ~l0;\n            if (tick1) l1 &lt;= ~l1;\n            if (tick2) l2 &lt;= ~l2;\n        end\n    end\n\n    assign led0 = l0;\n    assign led1 = l1;\n    assign led2 = l2;\n\nendmodule\n"}, {"file": "code/phase4/tb_multi_tick_led_top.v", "type": "verilog", "role": "testbench", "title": "tb_multi_tick_led_top.v — 三灯翻转间隔自检", "codeHtml": "//==============================================================================\n// tb_multi_tick_led_top.v — 三灯不同节奏自检\n//------------------------------------------------------------------------------\n// 把分频系数改小（4/6/8）便于仿真：\n//   led0 每 4 个时钟翻转，led1 每 6 个，led2 每 8 个。\n// 用寄存器保存上一拍电平做上升沿检测，测量两次翻转间隔并与期望值比对。\n//==============================================================================\n`timescale 1ns/1ps\nmodule tb_multi_tick_led_top;\n\n    reg clk;\n    reg rst_n;\n    wire led0, led1, led2;\n\n    initial clk = 1&#x27;b0;\n    always #5 clk = ~clk;\n\n    multi_tick_led_top #(\n        .DIV0(4),\n        .DIV1(6),\n        .DIV2(8)\n    ) u_top (\n        .clk(clk), .rst_n(rst_n),\n        .led0(led0), .led1(led1), .led2(led2)\n    );\n\n    integer c0, c1, c2;      // 距上次上升沿的时钟数\n    integer errors;\n    integer flips0, flips1, flips2;\n    reg     d0, d1, d2;      // 上一拍电平\n\n    initial begin\n        rst_n = 1&#x27;b0;\n        c0 = 0; c1 = 0; c2 = 0;\n        errors = 0;\n        flips0 = 0; flips1 = 0; flips2 = 0;\n        d0 = 0; d1 = 0; d2 = 0;\n        #23;\n        rst_n = 1&#x27;b1;\n    end\n\n    always @(posedge clk) begin\n        if (!rst_n) begin\n            c0 &lt;= 0; c1 &lt;= 0; c2 &lt;= 0;\n            d0 &lt;= 0; d1 &lt;= 0; d2 &lt;= 0;\n        end else begin\n            c0 &lt;= c0 + 1;\n            c1 &lt;= c1 + 1;\n            c2 &lt;= c2 + 1;\n\n            // led0 上升沿\n            if (led0 &amp;&amp; !d0) begin\n                flips0 &lt;= flips0 + 1;\n                if (flips0 != 0 &amp;&amp; c0 != 4) errors &lt;= errors + 1;\n                c0 &lt;= 0;\n            end\n            // led1 上升沿\n            if (led1 &amp;&amp; !d1) begin\n                flips1 &lt;= flips1 + 1;\n                if (flips1 != 0 &amp;&amp; c1 != 6) errors &lt;= errors + 1;\n                c1 &lt;= 0;\n            end\n            // led2 上升沿\n            if (led2 &amp;&amp; !d2) begin\n                flips2 &lt;= flips2 + 1;\n                if (flips2 != 0 &amp;&amp; c2 != 8) errors &lt;= errors + 1;\n                c2 &lt;= 0;\n            end\n\n            d0 &lt;= led0;\n            d1 &lt;= led1;\n            d2 &lt;= led2;\n        end\n    end\n\n    initial begin\n        #400;\n        $display(&quot;---- tb_multi_tick_led_top ----&quot;);\n        $display(&quot;flips0=%0d flips1=%0d flips2=%0d errors=%0d&quot;,\n                 flips0, flips1, flips2, errors);\n        if (flips0 &gt;= 4 &amp;&amp; flips1 &gt;= 3 &amp;&amp; flips2 &gt;= 2 &amp;&amp; errors == 0)\n            $display(&quot;TB_MULTI_LED: PASS&quot;);\n        else\n            $display(&quot;TB_MULTI_LED: FAIL&quot;);\n        $finish;\n    end\n\nendmodule\n"}], "diagrams": [{"file": "assets/phase4/pll_mmcm_internal.svg", "title": "PLL/MMCM 内部结构", "caption": "PFD→电荷泵→LPF→VCO→输出分频，反馈分频锁定；MMCM 多出相位微调。", "svgRaw": "<svg xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"0 0 900 460\" font-family=\"Consolas,Menlo,monospace\">\n  <rect width=\"900\" height=\"460\" fill=\"#0d1420\"/>\n  <text x=\"20\" y=\"30\" fill=\"#22d3ee\" font-size=\"18\" font-weight=\"bold\">PLL / MMCM 内部结构（Artix-7）<\/text>\n\n  <!-- feedback loop -->\n  <!-- blocks -->\n  <rect x=\"40\"  y=\"120\" width=\"110\" height=\"60\" rx=\"6\" fill=\"#16233a\" stroke=\"#22d3ee\" stroke-width=\"1.5\"/>\n  <text x=\"55\" y=\"145\" fill=\"#e2e8f0\" font-size=\"13\">PFD<\/text>\n  <text x=\"48\" y=\"165\" fill=\"#94a3b8\" font-size=\"10\">鉴频鉴相<\/text>\n\n  <rect x=\"190\" y=\"120\" width=\"110\" height=\"60\" rx=\"6\" fill=\"#16233a\" stroke=\"#22d3ee\" stroke-width=\"1.5\"/>\n  <text x=\"205\" y=\"145\" fill=\"#e2e8f0\" font-size=\"13\">CP<\/text>\n  <text x=\"200\" y=\"165\" fill=\"#94a3b8\" font-size=\"10\">电荷泵<\/text>\n\n  <rect x=\"340\" y=\"120\" width=\"110\" height=\"60\" rx=\"6\" fill=\"#16233a\" stroke=\"#22d3ee\" stroke-width=\"1.5\"/>\n  <text x=\"352\" y=\"145\" fill=\"#e2e8f0\" font-size=\"13\">LPF<\/text>\n  <text x=\"350\" y=\"165\" fill=\"#94a3b8\" font-size=\"10\">环路滤波<\/text>\n\n  <rect x=\"490\" y=\"120\" width=\"110\" height=\"60\" rx=\"6\" fill=\"#16233a\" stroke=\"#a78bfa\" stroke-width=\"1.5\"/>\n  <text x=\"508\" y=\"145\" fill=\"#e2e8f0\" font-size=\"13\">VCO<\/text>\n  <text x=\"500\" y=\"165\" fill=\"#94a3b8\" font-size=\"10\">压控振荡<\/text>\n\n  <!-- arrows chain -->\n  <line x1=\"150\" y1=\"150\" x2=\"190\" y2=\"150\" stroke=\"#22d3ee\" stroke-width=\"1.5\" marker-end=\"url(#a)\"/>\n  <line x1=\"300\" y1=\"150\" x2=\"340\" y2=\"150\" stroke=\"#22d3ee\" stroke-width=\"1.5\" marker-end=\"url(#a)\"/>\n  <line x1=\"450\" y1=\"150\" x2=\"490\" y2=\"150\" stroke=\"#22d3ee\" stroke-width=\"1.5\" marker-end=\"url(#a)\"/>\n\n  <!-- input clk -->\n  <text x=\"20\" y=\"110\" fill=\"#fbbf24\" font-size=\"12\">clk_in（晶振）<\/text>\n  <line x1=\"20\" y1=\"150\" x2=\"40\" y2=\"150\" stroke=\"#fbbf24\" stroke-width=\"1.5\" marker-end=\"url(#a)\"/>\n\n  <!-- VCO outputs dividers -->\n  <rect x=\"650\" y=\"70\"  width=\"120\" height=\"40\" rx=\"6\" fill=\"#16233a\" stroke=\"#34d399\" stroke-width=\"1.5\"/>\n  <text x=\"665\" y=\"95\" fill=\"#e2e8f0\" font-size=\"12\">输出分频 M<\/text>\n  <rect x=\"650\" y=\"130\" width=\"120\" height=\"40\" rx=\"6\" fill=\"#16233a\" stroke=\"#34d399\" stroke-width=\"1.5\"/>\n  <text x=\"665\" y=\"155\" fill=\"#e2e8f0\" font-size=\"12\">输出分频 D0<\/text>\n  <rect x=\"650\" y=\"190\" width=\"120\" height=\"40\" rx=\"6\" fill=\"#16233a\" stroke=\"#34d399\" stroke-width=\"1.5\"/>\n  <text x=\"665\" y=\"215\" fill=\"#e2e8f0\" font-size=\"12\">输出分频 D1..D5<\/text>\n\n  <line x1=\"600\" y1=\"150\" x2=\"650\" y2=\"90\"  stroke=\"#34d399\" stroke-width=\"1.5\" marker-end=\"url(#a)\"/>\n  <line x1=\"600\" y1=\"150\" x2=\"650\" y2=\"150\" stroke=\"#34d399\" stroke-width=\"1.5\" marker-end=\"url(#a)\"/>\n  <line x1=\"600\" y1=\"150\" x2=\"650\" y2=\"210\" stroke=\"#34d399\" stroke-width=\"1.5\" marker-end=\"url(#a)\"/>\n\n  <text x=\"790\" y=\"95\"  fill=\"#34d399\" font-size=\"12\">clk_out0<\/text>\n  <text x=\"790\" y=\"155\" fill=\"#34d399\" font-size=\"12\">clk_out1<\/text>\n  <text x=\"790\" y=\"215\" fill=\"#34d399\" font-size=\"12\">...<\/text>\n\n  <!-- feedback divider -->\n  <rect x=\"340\" y=\"300\" width=\"120\" height=\"44\" rx=\"6\" fill=\"#16233a\" stroke=\"#fbbf24\" stroke-width=\"1.5\"/>\n  <text x=\"352\" y=\"326\" fill=\"#e2e8f0\" font-size=\"12\">反馈分频 N<\/text>\n  <path d=\"M545 180 L545 230 L400 230 L400 300\" fill=\"none\" stroke=\"#fbbf24\" stroke-width=\"1.5\" marker-end=\"url(#a)\"/>\n  <path d=\"M340 322 L100 322 L100 180\" fill=\"none\" stroke=\"#fbbf24\" stroke-width=\"1.5\" marker-end=\"url(#a)\"/>\n  <text x=\"180\" y=\"315\" fill=\"#fbbf24\" font-size=\"11\">反馈：f_vco/N 与 f_in 比较，锁定后相等<\/text>\n\n  <!-- MMCM extra -->\n  <rect x=\"40\" y=\"380\" width=\"820\" height=\"60\" rx=\"6\" fill=\"#1a1430\" stroke=\"#a78bfa\" stroke-width=\"1.2\"/>\n  <text x=\"55\" y=\"405\" fill=\"#a78bfa\" font-size=\"13\" font-weight=\"bold\">MMCM 比 PLL 多出：相位微调（Phase Adjust）+ 可动态/细粒度分频<\/text>\n  <text x=\"55\" y=\"428\" fill=\"#94a3b8\" font-size=\"11\">可对每路输出做 ±相位移动、占空比校正，用于补偿布线延迟、对齐多路时钟；PLL 只能倍/分频。<\/text>\n\n  <defs>\n    <marker id=\"a\" markerWidth=\"8\" markerHeight=\"8\" refX=\"6\" refY=\"3\" orient=\"auto\">\n      <path d=\"M0,0 L6,3 L0,6 Z\" fill=\"#cbd5e1\"/>\n    <\/marker>\n  <\/defs>\n<\/svg>\n"}, {"file": "assets/phase4/clock_tree.svg", "title": "FPGA 时钟树", "caption": "晶振→IBUF→MMCM→BUFG→全局时钟树→触发器，保证低 skew。", "svgRaw": "<svg xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"0 0 900 360\" font-family=\"Consolas,Menlo,monospace\">\n  <rect width=\"900\" height=\"360\" fill=\"#0d1420\"/>\n  <text x=\"20\" y=\"30\" fill=\"#22d3ee\" font-size=\"18\" font-weight=\"bold\">FPGA 时钟树：从晶振到触发器<\/text>\n\n  <!-- board osc -->\n  <rect x=\"30\" y=\"150\" width=\"110\" height=\"60\" rx=\"6\" fill=\"#16233a\" stroke=\"#fbbf24\" stroke-width=\"1.5\"/>\n  <text x=\"45\" y=\"175\" fill=\"#e2e8f0\" font-size=\"12\">板载晶振<\/text>\n  <text x=\"45\" y=\"195\" fill=\"#94a3b8\" font-size=\"10\">50MHz 接引脚<\/text>\n\n  <!-- IBUF -->\n  <rect x=\"190\" y=\"150\" width=\"90\" height=\"60\" rx=\"6\" fill=\"#16233a\" stroke=\"#22d3ee\" stroke-width=\"1.5\"/>\n  <text x=\"205\" y=\"175\" fill=\"#e2e8f0\" font-size=\"12\">IBUF<\/text>\n  <text x=\"200\" y=\"195\" fill=\"#94a3b8\" font-size=\"10\">输入缓冲<\/text>\n\n  <!-- MMCM -->\n  <rect x=\"330\" y=\"140\" width=\"130\" height=\"80\" rx=\"6\" fill=\"#1a1430\" stroke=\"#a78bfa\" stroke-width=\"1.5\"/>\n  <text x=\"350\" y=\"170\" fill=\"#e2e8f0\" font-size=\"13\">MMCM/PLL<\/text>\n  <text x=\"345\" y=\"192\" fill=\"#94a3b8\" font-size=\"10\">倍频/分频/移相<\/text>\n\n  <!-- BUFG -->\n  <rect x=\"510\" y=\"150\" width=\"90\" height=\"60\" rx=\"6\" fill=\"#16233a\" stroke=\"#34d399\" stroke-width=\"1.5\"/>\n  <text x=\"525\" y=\"175\" fill=\"#e2e8f0\" font-size=\"12\">BUFG<\/text>\n  <text x=\"518\" y=\"195\" fill=\"#94a3b8\" font-size=\"10\">全局时钟缓冲<\/text>\n\n  <line x1=\"140\" y1=\"180\" x2=\"190\" y2=\"180\" stroke=\"#cbd5e1\" stroke-width=\"1.5\" marker-end=\"url(#b)\"/>\n  <line x1=\"280\" y1=\"180\" x2=\"330\" y2=\"180\" stroke=\"#cbd5e1\" stroke-width=\"1.5\" marker-end=\"url(#b)\"/>\n  <line x1=\"460\" y1=\"180\" x2=\"510\" y2=\"180\" stroke=\"#cbd5e1\" stroke-width=\"1.5\" marker-end=\"url(#b)\"/>\n\n  <!-- clock routing to flops -->\n  <path d=\"M600 180 L660 180\" stroke=\"#34d399\" stroke-width=\"1.5\"/>\n  <path d=\"M660 120 L660 260\" stroke=\"#34d399\" stroke-width=\"1.5\"/>\n  <line x1=\"660\" y1=\"120\" x2=\"720\" y2=\"120\" stroke=\"#34d399\" stroke-width=\"1.5\" marker-end=\"url(#b)\"/>\n  <line x1=\"660\" y1=\"180\" x2=\"720\" y2=\"180\" stroke=\"#34d399\" stroke-width=\"1.5\" marker-end=\"url(#b)\"/>\n  <line x1=\"660\" y1=\"260\" x2=\"720\" y2=\"260\" stroke=\"#34d399\" stroke-width=\"1.5\" marker-end=\"url(#b)\"/>\n\n  <rect x=\"720\" y=\"100\" width=\"90\" height=\"40\" rx=\"4\" fill=\"#16233a\" stroke=\"#475569\"/>\n  <text x=\"735\" y=\"125\" fill=\"#e2e8f0\" font-size=\"12\">触发器<\/text>\n  <rect x=\"720\" y=\"160\" width=\"90\" height=\"40\" rx=\"4\" fill=\"#16233a\" stroke=\"#475569\"/>\n  <text x=\"735\" y=\"185\" fill=\"#e2e8f0\" font-size=\"12\">触发器<\/text>\n  <rect x=\"720\" y=\"240\" width=\"90\" height=\"40\" rx=\"4\" fill=\"#16233a\" stroke=\"#475569\"/>\n  <text x=\"735\" y=\"265\" fill=\"#e2e8f0\" font-size=\"12\">触发器<\/text>\n\n  <text x=\"30\" y=\"320\" fill=\"#94a3b8\" font-size=\"12\">关键点：时钟必须走专用全局时钟网络(BUFG)，到达每个触发器的延迟/偏斜(skew)才小且可控。<\/text>\n  <text x=\"30\" y=\"342\" fill=\"#94a3b8\" font-size=\"12\">用普通布线跑\"分频出来的时钟\"会 skew 大、易时序失败——这就是多路时钟要用 MMCM+BUFG 的原因。<\/text>\n\n  <defs>\n    <marker id=\"b\" markerWidth=\"8\" markerHeight=\"8\" refX=\"6\" refY=\"3\" orient=\"auto\">\n      <path d=\"M0,0 L6,3 L0,6 Z\" fill=\"#cbd5e1\"/>\n    <\/marker>\n  <\/defs>\n<\/svg>\n"}, {"file": "assets/phase4/multi_clock_domain.svg", "title": "多时钟域与 CDC 框图", "caption": "时钟域 A 与 B 之间经 CDC（两级同步/异步 FIFO）通信。", "svgRaw": "<svg xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"0 0 900 380\" font-family=\"Consolas,Menlo,monospace\">\n  <rect width=\"900\" height=\"380\" fill=\"#0d1420\"/>\n  <text x=\"20\" y=\"30\" fill=\"#22d3ee\" font-size=\"18\" font-weight=\"bold\">多时钟域与跨时钟域(CDC)概念框图<\/text>\n\n  <!-- domain A -->\n  <rect x=\"30\" y=\"90\" width=\"260\" height=\"200\" rx=\"8\" fill=\"#10233a\" stroke=\"#22d3ee\" stroke-width=\"1.5\"/>\n  <text x=\"50\" y=\"118\" fill=\"#22d3ee\" font-size=\"14\" font-weight=\"bold\">时钟域 A：clk_a (100MHz)<\/text>\n  <rect x=\"60\" y=\"140\" width=\"200\" height=\"50\" rx=\"4\" fill=\"#16233a\" stroke=\"#475569\"/>\n  <text x=\"90\" y=\"170\" fill=\"#e2e8f0\" font-size=\"12\">发送逻辑<\/text>\n  <rect x=\"60\" y=\"210\" width=\"200\" height=\"50\" rx=\"4\" fill=\"#16233a\" stroke=\"#475569\"/>\n  <text x=\"90\" y=\"240\" fill=\"#e2e8f0\" font-size=\"12\">数据/指针<\/text>\n\n  <!-- CDC box -->\n  <rect x=\"340\" y=\"120\" width=\"220\" height=\"140\" rx=\"8\" fill=\"#2a1a10\" stroke=\"#fbbf24\" stroke-width=\"1.8\"/>\n  <text x=\"360\" y=\"148\" fill=\"#fbbf24\" font-size=\"14\" font-weight=\"bold\">跨时钟域处理 CDC<\/text>\n  <text x=\"360\" y=\"175\" fill=\"#e2e8f0\" font-size=\"11\">单 bit：两级触发器同步<\/text>\n  <text x=\"360\" y=\"197\" fill=\"#e2e8f0\" font-size=\"11\">多 bit 数据：异步 FIFO<\/text>\n  <text x=\"360\" y=\"219\" fill=\"#e2e8f0\" font-size=\"11\">(格雷码指针 + 同步)<\/text>\n  <text x=\"360\" y=\"245\" fill=\"#94a3b8\" font-size=\"10\">直接跨域会产生亚稳态<\/text>\n\n  <!-- domain B -->\n  <rect x=\"610\" y=\"90\" width=\"260\" height=\"200\" rx=\"8\" fill=\"#102a1a\" stroke=\"#34d399\" stroke-width=\"1.5\"/>\n  <text x=\"630\" y=\"118\" fill=\"#34d399\" font-size=\"14\" font-weight=\"bold\">时钟域 B：clk_b (25MHz)<\/text>\n  <rect x=\"640\" y=\"140\" width=\"200\" height=\"50\" rx=\"4\" fill=\"#16233a\" stroke=\"#475569\"/>\n  <text x=\"670\" y=\"170\" fill=\"#e2e8f0\" font-size=\"12\">接收逻辑<\/text>\n  <rect x=\"640\" y=\"210\" width=\"200\" height=\"50\" rx=\"4\" fill=\"#16233a\" stroke=\"#475569\"/>\n  <text x=\"670\" y=\"240\" fill=\"#e2e8f0\" font-size=\"12\">采样/握手<\/text>\n\n  <line x1=\"290\" y1=\"190\" x2=\"340\" y2=\"190\" stroke=\"#fbbf24\" stroke-width=\"1.8\" marker-end=\"url(#c)\"/>\n  <line x1=\"560\" y1=\"190\" x2=\"610\" y2=\"190\" stroke=\"#fbbf24\" stroke-width=\"1.8\" marker-end=\"url(#c)\"/>\n\n  <text x=\"30\" y=\"330\" fill=\"#94a3b8\" font-size=\"12\">本阶段：4.1 建立多时钟域概念；4.2 用异步 FIFO + 格雷码解决多 bit 跨域数据传输。<\/text>\n  <text x=\"30\" y=\"352\" fill=\"#94a3b8\" font-size=\"12\">单 bit 控制信号跨域用两级同步器（见阶段2 按键消抖），总线/数据跨域不能直接并窜。<\/text>\n\n  <defs>\n    <marker id=\"c\" markerWidth=\"8\" markerHeight=\"8\" refX=\"6\" refY=\"3\" orient=\"auto\">\n      <path d=\"M0,0 L6,3 L0,6 Z\" fill=\"#fbbf24\"/>\n    <\/marker>\n  <\/defs>\n<\/svg>\n"}], "tools": [{"name": "PG065 Clocking Wizard Product Guide (v6.0)", "url": "https://docs.amd.com/v/u/en-US/pg065-clocking-wizard", "required": true, "note": "访问日期 2026-10-10；MMCM/PLL IP 配置手册。"}, {"name": "Clocking Wizard 产品页", "url": "https://www.amd.com/en/products/adaptive-socs-and-fpgas/intellectual-property/clocking_wizard.html", "required": false, "note": "访问日期 2026-10-10。"}, {"name": "通用引脚约束模板 fpga_common.xdc", "url": "../code/common/fpga_common.xdc", "required": true, "note": "相对本仓库；create_clock 主时钟约束模板。"}], "tasks": [{"id": "task-4-1-1", "text": "调用 PLL/MMCM (Clocking Wizard) IP 生成多路不同频率时钟"}, {"id": "task-4-1-2", "text": "用不同频率时钟（或使能）驱动不同 LED 以不同频率闪烁"}], "cards": [{"q": "FPGA 的 IP 核分哪几类？", "a": "软核(用逻辑实现可综合，如 FIFO/FIR)、硬核(芯片固化硅电路如 Zynq ARM/SerDes)、加密核(只给网表保护算法)。", "tags": ["IP核"]}, {"q": "PLL 由哪几部分组成？", "a": "PFD 鉴频鉴相器、电荷泵 CP、环路滤波 LPF、压控振荡器 VCO，外加反馈分频 N；锁定后 f_vco/N = f_in。", "tags": ["PLL", "原理"]}, {"q": "MMCM 比 PLL 多了什么能力？", "a": "MMCM 在 PLL 倍/分频之外，还能对每路输出做相位调整(移相)和占空比校正，用于补偿布线延迟、对齐多路时钟。", "tags": ["MMCM", "移相"]}, {"q": "什么是抖动 jitter？", "a": "时钟沿位置的随机微小晃动。PLL 锁相输出抖动远小于计数器手动分频；用普通布线跑分频时钟抖动/skew 都大。", "tags": ["抖动"]}, {"q": "时钟为什么必须走 BUFG 全局时钟网络？", "a": "BUFG 专用时钟树到达各触发器延迟小、偏斜 skew 可控；用普通逻辑布线跑时钟会 skew 大、时序失败。", "tags": ["时钟树", "BUFG"]}, {"q": "单 bit 信号跨时钟域怎么处理？", "a": "用两级触发器同步器打两拍，避免采样到亚稳态；多 bit 数据总线不能各自同步，要用异步 FIFO/格雷码。", "tags": ["CDC", "亚稳态"]}, {"q": "慢节拍（LED 闪烁）推荐用真分频时钟还是使能？", "a": "单时钟域里推荐使能分频(clk_div_tick)+原时钟打拍，不产生新时钟，最省资源且无时序风险；真多路时钟才用 MMCM IP。", "tags": ["分频", "最佳实践"]}, {"q": "主时钟 XDC 约束怎么写？", "a": "create_clock -period 20.000 -name clk_in1 [get_ports clk_in1]，50MHz 对应周期 20ns；IP 输出时钟由 generated clock 自动生成。", "tags": ["XDC", "约束"]}, {"q": "Clocking Wizard 输出的 locked 信号有什么用？", "a": "locked 拉高表示 MMCM 已锁定、时钟稳定；下游应在 locked 前保持复位，通常 rst = ~locked | 外部复位。", "tags": ["ClockingWizard", "复位"]}, {"q": "为什么本仓库的纯 RTL 分频不能直接当多路时钟上板？", "a": "纯 RTL 计数器走普通布线、skew 大、累积抖动；MMCM 是 Xilinx 专用原语。上板生成多路时钟必须用 Clocking Wizard IP 并在真实 Vivado 综合验证。", "tags": ["RTL", "上板"]}], "quiz": [{"q": "PLL 锁定后，VCO 频率 f_vco 与输入 f_in 的关系？", "options": ["f_vco = f_in / N", "f_vco = N × f_in", "f_vco = f_in", "f_vco = 2×f_in"], "answer": 1, "explain": "反馈分频 N 使 PFD 比较 f_vco/N 与 f_in，锁定后相等，故 f_vco = N×f_in。"}, {"q": "MMCM 相对 PLL 的核心增强是？", "options": ["能省更多 LUT", "可对输出做相位/占空比调整", "不需要晶振", "只能分频不能倍频"], "answer": 1, "explain": "MMCM 在倍/分频外提供相位移动与占空比校正。"}, {"q": "时钟信号应走哪种网络？", "options": ["普通布线", "BUFG 全局时钟缓冲", "任意连线", "BRAM"], "answer": 1, "explain": "走 BUFG 专用时钟树才能把 skew 控到最小。"}, {"q": "50MHz 主时钟的 create_clock 周期是？", "options": ["5ns", "10ns", "20ns", "50ns"], "answer": 2, "explain": "周期 = 1/f = 1/50MHz = 20ns。"}], "docHtml": "<h1>4.1 IP 核调用与时钟管理<\/h1>\n<p>到了系统级开发，你会发现很多\"轮子\"不用自己造：官方把常用电路封装成<strong>IP 核<\/strong>，在 Vivado 里双击图形界面、填几个参数就能生成。本节先建立 IP 核的概念，再吃透时钟系统——PLL/MMCM 怎么把 50MHz 晶振变成你想要的多路时钟，以及为什么多路时钟必须走专用时钟网络。<\/p>\n<h2>一、IP 核是什么，分哪几类<\/h2>\n<p>IP（Intellectual Property）核就是\"预先做好、验证过的电路模块\"，按交付形式分三类：<\/p>\n<table>\n<thead>\n<tr>\n<th>类型<\/th>\n<th>说明<\/th>\n<th>在 Artix-7/Zynq 上的例子<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td><strong>软核 (Soft IP)<\/strong><\/td>\n<td>用 Verilog 描述、综合时映射到普通逻辑/LUT/BRAM，可综合<\/td>\n<td>FIFO、FIR 滤波器、UART、自定义外设<\/td>\n<\/tr>\n<tr>\n<td><strong>硬核 (Hard IP)<\/strong><\/td>\n<td>芯片里固化的硅电路，不能改但性能最高、最省资源<\/td>\n<td>Zynq 的 PS(ARM)、SerDes/GTP、PCle 块、ADC<\/td>\n<\/tr>\n<tr>\n<td><strong>已加密核 (Encrypted/Netlist)<\/strong><\/td>\n<td>只给网表不给源码，授权后可综合，保护算法<\/td>\n<td>部分高速接口、第三方算法核<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<p>Vivado 的 <strong>IP Catalog<\/strong> 里搜名字即可调用。本节用两个软核：<strong>Clocking Wizard<\/strong>（时钟）、后面 4.2 的 <strong>Block Memory Generator / FIFO Generator<\/strong>。<\/p>\n<blockquote>\n<p>经验法则：<strong>能用官方 IP 就别手写<\/strong>。时钟、存储、高速接口这类对时序/抖动敏感的模块，手写纯 RTL 往往\"功能对、时序挂\"。但学习原理时手写纯 RTL 模型很有价值——本节代码就是\"纯 RTL 行为模型\"。<\/p>\n<\/blockquote>\n<h2>二、PLL / MMCM 锁相环原理<\/h2>\n<p>板上只有一颗晶振（如 50MHz），但系统里经常需要 100MHz、25MHz、甚至相位错开的多路时钟。<strong>PLL（Phase-Locked Loop，锁相环）<\/strong>就是干这个的。它由四部分组成（见 <code>pll_mmcm_internal.svg<\/code>）：<\/p>\n<ol>\n<li><strong>PFD（鉴频鉴相器）<\/strong>：比较输入时钟 <code>clk_in<\/code> 和反馈回来的时钟的相位差，输出\"超前/滞后\"脉冲。<\/li>\n<li><strong>CP（电荷泵）+ LPF（环路滤波）<\/strong>：把相位差脉冲转成一个平滑的直流控制电压。<\/li>\n<li><strong>VCO（压控振荡器）<\/strong>：控制电压越高，振荡越快，输出一个高频 <code>f_vco<\/code>。<\/li>\n<li><strong>反馈分频 N<\/strong>：把 VCO 频率 N 分频后送回 PFD。锁定后 <code>f_vco/N == f_in<\/code>，于是 <code>f_vco = N × f_in<\/code>。<\/li>\n<\/ol>\n<p>在 VCO 之后再挂几路<strong>输出分频（M/D0/D1…）<\/strong>，就从一颗晶振倍频/分频出多路时钟：<\/p>\n<pre><code>f_vco = f_in × (反馈倍频)\nf_out0 = f_vco / D0\nf_out1 = f_vco / D1\n<\/code><\/pre>\n<p><strong>抖动 (jitter)<\/strong>：VCO 输出沿不是绝对干净的，会有微小随机晃动。PLL 锁相后输出抖动远小于你自己用计数器\"翻出来\"的时钟。<\/p>\n<p><strong>MMCM vs PLL<\/strong>：Artix-7 里更常用的是 <strong>MMCM（Mixed-Mode Clock Manager）<\/strong>，它是 PLL 的增强版。MMCM 在 PLL 基础上多出<strong>相位调整（Phase Adjust）<\/strong>和更细的占空比/分频：可以对每路输出做 ±相位移动，用来补偿不同布线延迟、对齐多路时钟。PLL 只能倍频/分频，不能移相。<\/p>\n<h2>三、时钟树：为什么必须走 BUFG<\/h2>\n<p>晶振进来后，时钟路径是：<code>晶振引脚 → IBUF → MMCM/PLL → BUFG（全局时钟缓冲）→ 遍布全片的时钟树 → 每个触发器<\/code>（见 <code>clock_tree.svg<\/code>）。<\/p>\n<p>关键概念：<\/p>\n<ul>\n<li><strong>时钟偏斜 (clock skew)<\/strong>：同一个时钟到达不同触发器的时间差。走专用全局时钟网络(BUFG)时 skew 极小且可控。<\/li>\n<li>如果你用普通逻辑布线去跑一个\"计数器分频出来的时钟\"，这条线上 skew 大、延迟不确定，时序几乎一定失败。<\/li>\n<\/ul>\n<blockquote>\n<p>结论：<strong>真实多路时钟上板必须用 Clocking Wizard(MMCM) IP + BUFG<\/strong>；纯 RTL 计数器分频只用于仿真理解，或作为\"单时钟域里的慢节拍使能\"（推荐做法）。<\/p>\n<\/blockquote>\n<h2>四、多时钟域设计基础<\/h2>\n<p>一个芯片里有多个频率/相位的时钟，就划分出多个<strong>时钟域 (Clock Domain, CDC 见 <code>multi_clock_domain.svg<\/code>)<\/strong>。信号从一个时钟域直接跑到另一个时钟域，采样沿可能正好打在数据变化的不确定窗口上，产生<strong>亚稳态 (metastability)<\/strong>。<\/p>\n<ul>\n<li>单 bit 控制信号跨域：用<strong>两级触发器同步器<\/strong>（阶段2 按键消抖已练过）。<\/li>\n<li>多 bit 数据总线跨域：不能一位一位各自同步（各位到达时间不一致会采错），要用<strong>异步 FIFO + 格雷码指针<\/strong>——这是 4.2 的主题。<\/li>\n<\/ul>\n<h2>五、本节纯 RTL 代码（仅仿真/原理）<\/h2>\n<p><code>code/phase4/clk_divider.v<\/code> 给了两个模块：<\/p>\n<ul>\n<li><strong><code>clk_div_even<\/code><\/strong>：偶数分频，输出 50% 占空比的分频时钟（参数 <code>DIV<\/code> 必须为偶数）。<\/li>\n<li><strong><code>clk_div_tick<\/code><\/strong>：使能分频，每 <code>DIV<\/code> 个时钟输出一个单周期 tick；下游逻辑仍跑在原时钟上，用 <code>if(tick)<\/code> 做慢动作。这是工程上更推荐的\"伪分频\"写法——不产生新时钟。<\/li>\n<\/ul>\n<p><code>code/phase4/multi_tick_led_top.v<\/code>：在<strong>同一个 clk<\/strong> 上挂三个不同分频系数的 tick，分别翻转 <code>led0/led1/led2<\/code>，实现三灯不同节奏闪烁。<code>tb_*.v<\/code> 内含自检。<\/p>\n<blockquote>\n<p>⚠️ 这些是行为模型。真实上板要生成多路不同频率时钟时，按下一节用 Clocking Wizard IP 替换。<\/p>\n<\/blockquote>\n<h2>六、Vivado Clocking Wizard IP 上板步骤（可照做）<\/h2>\n<p>目标：输入 50MHz，生成 100MHz / 25MHz / 50MHz 三路时钟。<\/p>\n<ol>\n<li><strong>打开 IP Catalog<\/strong>：Flow Navigator → IP Catalog，搜索 <code>Clocking Wizard<\/code>，双击打开配置向导。<\/li>\n<li><strong>Clocking Options 页<\/strong>：<\/li>\n<li><code>Primitive<\/code> 选 <code>MMCM<\/code>（推荐；PLL 仅在资源紧张时用）。<\/li>\n<li><code>Input Clock Information<\/code>：Input Frequency 填你的板级晶振，如 <code>50MHz<\/code>，时钟类型选 <code>differential<\/code>/<code>single ended<\/code> 按板子。<\/li>\n<li>勾选 <code>Locked<\/code> 输出端口（锁定指示，建议在复位逻辑里等它拉高）。<\/li>\n<li><strong>Output Clocks 页<\/strong>：<\/li>\n<li><code>clk_out1<\/code> 填 <code>100MHz<\/code>，<code>clk_out2<\/code> 填 <code>25MHz<\/code>，<code>clk_out3<\/code> 填 <code>50MHz<\/code>；占空比先保持 50%。<\/li>\n<li>若需要移相，在对应输出的 <code>Phase<\/code> 里填度数（这是 MMCM 才有的能力）。<\/li>\n<li>Vivado 会自动算出 VCO 频率和倍/分频系数，并提示是否在 MMCM 合法范围内（红色报错即超范围）。<\/li>\n<li><strong>确认与生成<\/strong>：OK → Generate。Vivado 生成 <code>clk_wiz.xci<\/code> 和例化模板。<\/li>\n<li><strong>例化<\/strong>：把生成的 <code>clk_wiz_0.veo<\/code> 模板复制进你的顶层，端口典型为：<\/li>\n<li>输入：<code>clk_in1<\/code>（接板级 50MHz 引脚）、<code>reset<\/code>（高有效复位，可接复位按键）。<\/li>\n<li>输出：<code>clk_out1/clk_out2/clk_out3<\/code>、<code>locked<\/code>。<\/li>\n<li><strong>复位注意<\/strong>：<code>locked<\/code> 拉高前时钟未稳定，下游应保持复位；通常 <code>rst_sys = ~locked | 外部复位<\/code>。<\/li>\n<\/ol>\n<h3>XDC 时钟约束<\/h3>\n<p>主时钟约束（在你的约束文件里，<code>code/common/fpga_common.xdc<\/code> 是通用模板，按板子改引脚）：<\/p>\n<pre><code class=\"language-xdc\"># 主时钟：50MHz 晶振接在引脚 xxx，周期 20ns\ncreate_clock -period 20.000 -name clk_in1 [get_ports clk_in1]\n<\/code><\/pre>\n<p>Clocking Wizard IP 内部会自动为每路输出生成 <strong>generated clock<\/strong>（<code>create_generated_clock<\/code> 由 IP 自带约束给出），一般不用手写；综合后可用 <code>report_clocks<\/code> 确认所有时钟及它们的关系。<\/p>\n<h3>何时用纯 RTL，何时用 IP<\/h3>\n<table>\n<thead>\n<tr>\n<th>场景<\/th>\n<th>选择<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>单时钟域里做慢节拍（LED 闪烁、秒计数）<\/td>\n<td>纯 RTL 使能分频 <code>clk_div_tick<\/code>，最省资源<\/td>\n<\/tr>\n<tr>\n<td>需要不同频率的真时钟域、低抖动、移相<\/td>\n<td>Clocking Wizard (MMCM) IP<\/td>\n<\/tr>\n<tr>\n<td>多时钟之间要跨域传数据<\/td>\n<td>IP 生成时钟 + 4.2 的异步 FIFO<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<h2>七、官方手册（已核实，访问日期 2026-10-10）<\/h2>\n<ul>\n<li><strong>PG065 Clocking Wizard Product Guide (v6.0)<\/strong>：https://docs.amd.com/v/u/en-US/pg065-clocking-wizard （产品介绍页：https://www.amd.com/en/products/adaptive-socs-and-fpgas/intellectual-property/clocking_wizard.html ）<\/li>\n<li>通用约束写法见 4.3 的 <strong>UG903<\/strong>。<\/li>\n<\/ul>\n<blockquote>\n<p>说明：Clocking Wizard(MMCM) 是 Xilinx 原语，本仓库纯 RTL 模型仅用于仿真理解原理；上板生成多路时钟必须在真实 Vivado 里调用 Clocking Wizard IP 并综合验证。<\/p>\n<\/blockquote>"}, {"chapterId": "4.2", "phase": 4, "slug": "bram-fifo", "title": "BRAM 与 FIFO 缓存", "summary": "BRAM vs 分布式 RAM、单口/简单双口/真双口与 BRAM 推断；同步 FIFO 与异步 FIFO；格雷码指针+两级同步解决跨时钟域数据传输；Block Memory Generator/FIFO Generator IP 调用。", "doc": "docs/phase4/ch2-bram-fifo.md", "code": [{"file": "code/phase4/sfifo.v", "type": "verilog", "role": "synthesizable", "title": "sfifo.v — 同步 FIFO（推断双口 RAM，empty/full/almost/count）", "codeHtml": "//==============================================================================\n// sfifo.v — 同步 FIFO（单时钟，推断双口 BRAM）\n//------------------------------------------------------------------------------\n// 特点：\n//   * 读写共用一个 clk，指针用多一位(ADDR_WIDTH+1)区分空/满。\n//   * 存储体用可综合数组描述，Vivado 会推断成 Block RAM（同步读）。\n//   * 提供 empty / full / almost_full / 当前数据个数 count。\n//   * 写满时 wr_en 无效，读空时 rd_en 无效。\n//==============================================================================\nmodule sfifo #(\n    parameter DATA_WIDTH = 8,\n    parameter ADDR_WIDTH  = 4                 // 深度 = 2^4 = 16\n)(\n    // 端口位宽用数字字面量（与默认参数一致：DATA_WIDTH=8, ADDR_WIDTH=4）\n    input  wire                    clk,\n    input  wire                    rst_n,\n    // 写端口\n    input  wire                    wr_en,\n    input  wire [7:0]              wr_data,\n    // 读端口\n    input  wire                    rd_en,\n    output wire [7:0]              rd_data,\n    // 状态\n    output wire                    empty,\n    output wire                    full,\n    output wire                    almost_full,\n    output wire [4:0]              count   // ADDR_WIDTH+1 = 5 位\n);\n    localparam DEPTH = 1 &lt;&lt; ADDR_WIDTH;\n\n    reg [DATA_WIDTH-1:0] ram [0:DEPTH-1];   // 推断为 BRAM\n    reg [ADDR_WIDTH:0]   wr_ptr;            // 多 1 位作为满标志位\n    reg [ADDR_WIDTH:0]   rd_ptr;\n    reg [DATA_WIDTH-1:0] rd_data_r;\n\n    wire [ADDR_WIDTH:0] wr_next = wr_ptr + 1&#x27;b1;\n    wire [ADDR_WIDTH:0] rd_next = rd_ptr + 1&#x27;b1;\n\n    // 空：读写指针完全相等；满：低 ADDR_WIDTH 位相等且最高位相反\n    assign empty       = (wr_ptr == rd_ptr);\n    assign full        = (wr_ptr[ADDR_WIDTH] != rd_ptr[ADDR_WIDTH]) &amp;&amp;\n                         (wr_ptr[ADDR_WIDTH-1:0] == rd_ptr[ADDR_WIDTH-1:0]);\n    assign almost_full = (count &gt;= DEPTH - 2);\n    assign count       = wr_ptr - rd_ptr;\n    assign rd_data     = rd_data_r;\n\n    // 写存储体（不复位 BRAM，便于推断）\n    always @(posedge clk) begin\n        if (wr_en &amp;&amp; !full)\n            ram[wr_ptr[ADDR_WIDTH-1:0]] &lt;= wr_data;\n    end\n\n    // 同步读：rd_en 有效时下一拍输出 ram[rd_ptr]\n    always @(posedge clk) begin\n        if (rd_en &amp;&amp; !empty)\n            rd_data_r &lt;= ram[rd_ptr[ADDR_WIDTH-1:0]];\n    end\n\n    // 读写指针\n    always @(posedge clk or negedge rst_n) begin\n        if (!rst_n) begin\n            wr_ptr &lt;= 0;\n            rd_ptr &lt;= 0;\n        end else begin\n            if (wr_en &amp;&amp; !full) wr_ptr &lt;= wr_next;\n            if (rd_en &amp;&amp; !empty) rd_ptr &lt;= rd_next;\n        end\n    end\n\nendmodule\n"}, {"file": "code/phase4/tb_sfifo.v", "type": "verilog", "role": "testbench", "title": "tb_sfifo.v — 写满/读空/回环数据自检", "codeHtml": "//==============================================================================\n// tb_sfifo.v — 同步 FIFO 自检\n//------------------------------------------------------------------------------\n// 流程：复位 -&gt; 连续写满 16 个数(0..15) 观察 full -&gt; 再写应被忽略 -&gt;\n//       连续读空 观察 empty -&gt; 校验读出顺序 0..15 -&gt; 回环再写读一轮。\n//==============================================================================\n`timescale 1ns/1ps\nmodule tb_sfifo;\n\n    reg         clk;\n    reg         rst_n;\n    reg         wr_en;\n    reg  [7:0]  wr_data;\n    reg         rd_en;\n    wire [7:0]  rd_data;\n    wire        empty, full, almost_full;\n    wire [4:0]  count;\n\n    initial clk = 1&#x27;b0;\n    always #10 clk = ~clk;\n\n    sfifo #(.DATA_WIDTH(8), .ADDR_WIDTH(4)) dut (\n        .clk(clk), .rst_n(rst_n),\n        .wr_en(wr_en), .wr_data(wr_data),\n        .rd_en(rd_en), .rd_data(rd_data),\n        .empty(empty), .full(full),\n        .almost_full(almost_full), .count(count)\n    );\n\n    integer i;\n    integer errors;\n    integer got;\n    reg     full_seen;\n    reg     empty_seen;\n\n    initial begin\n        rst_n = 1&#x27;b0;\n        wr_en = 1&#x27;b0; rd_en = 1&#x27;b0; wr_data = 8&#x27;d0;\n        errors = 0; got = 0;\n        full_seen = 0; empty_seen = 0;\n        #25;\n        rst_n = 1&#x27;b1;\n        #20;\n\n        // 1) 写满 16 个数\n        for (i = 0; i &lt; 16; i = i + 1) begin\n            @(posedge clk);\n            wr_en   = 1&#x27;b1;\n            wr_data = i[7:0];\n        end\n        @(posedge clk);\n        wr_en = 1&#x27;b0;\n        if (full) full_seen = 1;\n\n        // 写满后再写一个，应被忽略\n        @(posedge clk);\n        wr_en = 1&#x27;b1; wr_data = 8&#x27;hAA;\n        @(posedge clk);\n        wr_en = 1&#x27;b0;\n\n        // 2) 读空 16 个数，顺序应为 0..15\n        for (i = 0; i &lt; 16; i = i + 1) begin\n            @(posedge clk);\n            rd_en = 1&#x27;b1;\n            @(posedge clk);\n            rd_en = 1&#x27;b0;\n            if (rd_data !== i[7:0]) errors = errors + 1;\n            got = got + 1;\n        end\n        if (empty) empty_seen = 1;\n\n        // 3) 回环：再写读一轮\n        for (i = 0; i &lt; 16; i = i + 1) begin\n            @(posedge clk);\n            wr_en = 1&#x27;b1; wr_data = i[7:0] + 8&#x27;h20;\n        end\n        @(posedge clk); wr_en = 1&#x27;b0;\n        for (i = 0; i &lt; 16; i = i + 1) begin\n            @(posedge clk);\n            rd_en = 1&#x27;b1;\n            @(posedge clk);\n            rd_en = 1&#x27;b0;\n            if (rd_data !== i[7:0] + 8&#x27;h20) errors = errors + 1;\n        end\n\n        #20;\n        $display(&quot;---- tb_sfifo ----&quot;);\n        $display(&quot;full_seen=%0d empty_seen=%0d got=%0d errors=%0d&quot;,\n                 full_seen, empty_seen, got, errors);\n        if (full_seen &amp;&amp; empty_seen &amp;&amp; errors == 0)\n            $display(&quot;TB_SFIFO: PASS&quot;);\n        else\n            $display(&quot;TB_SFIFO: FAIL&quot;);\n        $finish;\n    end\n\nendmodule\n"}, {"file": "code/phase4/afifo.v", "type": "verilog", "role": "synthesizable", "title": "afifo.v — 异步 FIFO（双口RAM+格雷码指针+两级同步）", "codeHtml": "//==============================================================================\n// afifo.v — 异步 FIFO（双时钟，跨时钟域传数据）\n//------------------------------------------------------------------------------\n// 原理（经典 Gray-code 异步 FIFO）：\n//   * 存储体：真正双口 RAM，写在 wr_clk、读在 rd_clk。\n//   * 指针：二进制指针 + 格雷码指针；格雷码每次只变 1 位，跨域采样不会采到&quot;跳变中间态&quot;。\n//   * 跨域：把写指针格雷码打两拍到读时钟域做 empty；把读指针格雷码打两拍到写时钟域做 full。\n//   * 空：读域当前格雷码 == 同步过来的写格雷码。\n//   * 满：写指针的&quot;下一个格雷码&quot; == 同步过来的读格雷码（最高两位取反）。\n//==============================================================================\nmodule afifo #(\n    parameter DATA_WIDTH = 8,\n    parameter ADDR_WIDTH  = 4                 // 深度 = 2^4 = 16\n)(\n    // 写时钟域（位宽与默认参数一致 DATA_WIDTH=8）\n    input  wire                    wr_clk,\n    input  wire                    wr_rst_n,\n    input  wire                    wr_en,\n    input  wire [7:0]              wr_data,\n    output wire                    wr_full,\n    // 读时钟域\n    input  wire                    rd_clk,\n    input  wire                    rd_rst_n,\n    input  wire                    rd_en,\n    output wire [7:0]              rd_data,\n    output wire                    rd_empty\n);\n    localparam DEPTH = 1 &lt;&lt; ADDR_WIDTH;\n\n    reg [DATA_WIDTH-1:0] ram [0:DEPTH-1];\n\n    // ---- 写域指针 ----\n    reg  [ADDR_WIDTH:0] wr_ptr_bin;\n    reg  [ADDR_WIDTH:0] wr_ptr_gray;\n    wire [ADDR_WIDTH:0] wr_bin_next  = wr_ptr_bin + 1&#x27;b1;\n    wire [ADDR_WIDTH:0] wr_gray_next = wr_bin_next ^ (wr_bin_next &gt;&gt; 1);\n\n    // ---- 读域指针 ----\n    reg  [ADDR_WIDTH:0] rd_ptr_bin;\n    reg  [ADDR_WIDTH:0] rd_ptr_gray;\n    wire [ADDR_WIDTH:0] rd_bin_next  = rd_ptr_bin + 1&#x27;b1;\n    wire [ADDR_WIDTH:0] rd_gray_next = rd_bin_next ^ (rd_bin_next &gt;&gt; 1);\n\n    // ---- 跨域两级同步寄存器 ----\n    reg [ADDR_WIDTH:0] wr2rd_gray0, wr2rd_gray1;  // 写指针格雷码 -&gt; 读域\n    reg [ADDR_WIDTH:0] rd2wr_gray0, rd2wr_gray1;  // 读指针格雷码 -&gt; 写域\n\n    // 空标志：读域当前格雷码 == 同步过来的写格雷码\n    assign rd_empty = (rd_ptr_gray == wr2rd_gray1);\n\n    // 满标志：写指针下一格雷码 == 同步过来的读格雷码（最高两位取反）\n    assign wr_full  = (wr_gray_next ==\n                       {~rd2wr_gray1[ADDR_WIDTH],\n                        ~rd2wr_gray1[ADDR_WIDTH-1],\n                        rd2wr_gray1[ADDR_WIDTH-2:0]});\n\n    // 读数据：异步组合读（小深度模型；上板可换 Block Memory Generator IP）\n    assign rd_data = ram[rd_ptr_bin[ADDR_WIDTH-1:0]];\n\n    // ---- 写域逻辑 ----\n    always @(posedge wr_clk or negedge wr_rst_n) begin\n        if (!wr_rst_n) begin\n            wr_ptr_bin  &lt;= 0;\n            wr_ptr_gray &lt;= 0;\n        end else if (wr_en &amp;&amp; !wr_full) begin\n            ram[wr_ptr_bin[ADDR_WIDTH-1:0]] &lt;= wr_data;\n            wr_ptr_bin  &lt;= wr_bin_next;\n            wr_ptr_gray &lt;= wr_gray_next;\n        end\n    end\n\n    // ---- 读域逻辑 ----\n    always @(posedge rd_clk or negedge rd_rst_n) begin\n        if (!rd_rst_n) begin\n            rd_ptr_bin  &lt;= 0;\n            rd_ptr_gray &lt;= 0;\n        end else if (rd_en &amp;&amp; !rd_empty) begin\n            rd_ptr_bin  &lt;= rd_bin_next;\n            rd_ptr_gray &lt;= rd_gray_next;\n        end\n    end\n\n    // ---- 写指针格雷码 -&gt; 读域两级同步 ----\n    always @(posedge rd_clk or negedge rd_rst_n) begin\n        if (!rd_rst_n) begin\n            wr2rd_gray0 &lt;= 0;\n            wr2rd_gray1 &lt;= 0;\n        end else begin\n            wr2rd_gray0 &lt;= wr_ptr_gray;\n            wr2rd_gray1 &lt;= wr2rd_gray0;\n        end\n    end\n\n    // ---- 读指针格雷码 -&gt; 写域两级同步 ----\n    always @(posedge wr_clk or negedge wr_rst_n) begin\n        if (!wr_rst_n) begin\n            rd2wr_gray0 &lt;= 0;\n            rd2wr_gray1 &lt;= 0;\n        end else begin\n            rd2wr_gray0 &lt;= rd_ptr_gray;\n            rd2wr_gray1 &lt;= rd2wr_gray0;\n        end\n    end\n\nendmodule\n"}, {"file": "code/phase4/tb_afifo.v", "type": "verilog", "role": "testbench", "title": "tb_afifo.v — 50MHz 写/25MHz 读跨域数据自检", "codeHtml": "//==============================================================================\n// tb_afifo.v — 异步 FIFO 跨时钟域自检\n//------------------------------------------------------------------------------\n// 写时钟 wr_clk 周期 20ns，读时钟 rd_clk 周期 40ns（两个不同频率时钟域）。\n// 写侧连续写入 16 个数(0..15)，读侧以慢时钟逐个读出，校验数据完整性与顺序。\n//==============================================================================\n`timescale 1ns/1ps\nmodule tb_afifo;\n\n    reg         wr_clk, rd_clk;\n    reg         wr_rst_n, rd_rst_n;\n    reg         wr_en;\n    reg  [7:0]  wr_data;\n    wire        wr_full;\n    reg         rd_en;\n    wire [7:0]  rd_data;\n    wire        rd_empty;\n\n    initial wr_clk = 1&#x27;b0;\n    always #10 wr_clk = ~wr_clk;     // 50MHz\n\n    initial rd_clk = 1&#x27;b0;\n    always #20 rd_clk = ~rd_clk;     // 25MHz\n\n    afifo #(.DATA_WIDTH(8), .ADDR_WIDTH(4)) dut (\n        .wr_clk(wr_clk), .wr_rst_n(wr_rst_n),\n        .wr_en(wr_en), .wr_data(wr_data), .wr_full(wr_full),\n        .rd_clk(rd_clk), .rd_rst_n(rd_rst_n),\n        .rd_en(rd_en), .rd_data(rd_data), .rd_empty(rd_empty)\n    );\n\n    integer i;\n    integer errors;\n    integer got;\n\n    initial begin\n        wr_rst_n = 1&#x27;b0; rd_rst_n = 1&#x27;b0;\n        wr_en = 1&#x27;b0; rd_en = 1&#x27;b0; wr_data = 8&#x27;d0;\n        errors = 0; got = 0;\n        #50;\n        wr_rst_n = 1&#x27;b1; rd_rst_n = 1&#x27;b1;\n        #50;\n\n        // 写侧：16 个数，遇到 full 就等一拍\n        for (i = 0; i &lt; 16; i = i + 1) begin\n            @(posedge wr_clk);\n            wr_en   = 1&#x27;b1;\n            wr_data = i[7:0];\n        end\n        @(posedge wr_clk);\n        wr_en = 1&#x27;b0;\n\n        // 等写指针格雷码同步到读域\n        #200;\n\n        // 读侧：非空就读，先采样 rd_data 再推进指针\n        for (i = 0; i &lt; 16; i = i + 1) begin\n            // 等待非空\n            while (rd_empty) @(posedge rd_clk);\n            @(posedge rd_clk);\n            if (rd_data !== i[7:0]) errors = errors + 1;\n            got = got + 1;\n            rd_en = 1&#x27;b1;\n            @(posedge rd_clk);\n            rd_en = 1&#x27;b0;\n        end\n\n        #200;\n        $display(&quot;---- tb_afifo ----&quot;);\n        $display(&quot;got=%0d errors=%0d rd_empty=%0d&quot;, got, errors, rd_empty);\n        if (got == 16 &amp;&amp; errors == 0)\n            $display(&quot;TB_AFIFO: PASS&quot;);\n        else\n            $display(&quot;TB_AFIFO: FAIL&quot;);\n        $finish;\n    end\n\nendmodule\n"}], "diagrams": [{"file": "assets/phase4/bram_structure.svg", "title": "BRAM vs 分布式 RAM", "caption": "专用 BRAM 块与 LUT 分布式 RAM 的容量/读方式/用途对比。", "svgRaw": "<svg xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"0 0 900 380\" font-family=\"Consolas,Menlo,monospace\">\n  <rect width=\"900\" height=\"380\" fill=\"#0d1420\"/>\n  <text x=\"20\" y=\"30\" fill=\"#22d3ee\" font-size=\"18\" font-weight=\"bold\">BRAM 块存储器结构 vs 分布式 RAM<\/text>\n\n  <!-- BRAM -->\n  <rect x=\"30\" y=\"70\" width=\"400\" height=\"220\" rx=\"8\" fill=\"#10233a\" stroke=\"#22d3ee\" stroke-width=\"1.5\"/>\n  <text x=\"50\" y=\"98\" fill=\"#22d3ee\" font-size=\"14\" font-weight=\"bold\">Block RAM (BRAM)<\/text>\n  <text x=\"50\" y=\"122\" fill=\"#94a3b8\" font-size=\"11\">一块专用存储块(如 36Kb)，可配置宽度×深度<\/text>\n  <rect x=\"60\" y=\"140\" width=\"150\" height=\"40\" rx=\"4\" fill=\"#16233a\" stroke=\"#34d399\"/>\n  <text x=\"75\" y=\"165\" fill=\"#e2e8f0\" font-size=\"12\">端口 A（写）<\/text>\n  <rect x=\"240\" y=\"140\" width=\"150\" height=\"40\" rx=\"4\" fill=\"#16233a\" stroke=\"#34d399\"/>\n  <text x=\"255\" y=\"165\" fill=\"#e2e8f0\" font-size=\"12\">端口 B（读）<\/text>\n  <rect x=\"60\" y=\"200\" width=\"330\" height=\"70\" rx=\"4\" fill=\"#0f1b2e\" stroke=\"#475569\"/>\n  <text x=\"150\" y=\"240\" fill=\"#e2e8f0\" font-size=\"12\">存储阵列 16Kb / 36Kb<\/text>\n  <text x=\"50\" y=\"310\" fill=\"#94a3b8\" font-size=\"11\">大容量、固定双口、同步读、省 LUT；适合 FIFO/帧缓冲/查表<\/text>\n\n  <!-- distributed -->\n  <rect x=\"470\" y=\"70\" width=\"400\" height=\"220\" rx=\"8\" fill=\"#1a2310\" stroke=\"#a3e635\" stroke-width=\"1.5\"/>\n  <text x=\"490\" y=\"98\" fill=\"#a3e635\" font-size=\"14\" font-weight=\"bold\">Distributed RAM (LUT RAM)<\/text>\n  <text x=\"490\" y=\"122\" fill=\"#94a3b8\" font-size=\"11\">用 LUT 当小存储，分布在逻辑里<\/text>\n  <rect x=\"500\" y=\"145\" width=\"80\" height=\"34\" rx=\"3\" fill=\"#16233a\" stroke=\"#a3e635\"/>\n  <text x=\"512\" y=\"167\" fill=\"#e2e8f0\" font-size=\"11\">LUT<\/text>\n  <rect x=\"590\" y=\"145\" width=\"80\" height=\"34\" rx=\"3\" fill=\"#16233a\" stroke=\"#a3e635\"/>\n  <text x=\"602\" y=\"167\" fill=\"#e2e8f0\" font-size=\"11\">LUT<\/text>\n  <rect x=\"680\" y=\"145\" width=\"80\" height=\"34\" rx=\"3\" fill=\"#16233a\" stroke=\"#a3e635\"/>\n  <text x=\"692\" y=\"167\" fill=\"#e2e8f0\" font-size=\"11\">LUT<\/text>\n  <rect x=\"500\" y=\"195\" width=\"80\" height=\"34\" rx=\"3\" fill=\"#16233a\" stroke=\"#a3e635\"/>\n  <text x=\"512\" y=\"217\" fill=\"#e2e8f0\" font-size=\"11\">LUT<\/text>\n  <rect x=\"590\" y=\"195\" width=\"80\" height=\"34\" rx=\"3\" fill=\"#16233a\" stroke=\"#a3e635\"/>\n  <text x=\"602\" y=\"217\" fill=\"#e2e8f0\" font-size=\"11\">LUT<\/text>\n  <text x=\"490\" y=\"260\" fill=\"#94a3b8\" font-size=\"11\">小容量（几十 bit~几 Kb）、占用 LUT、可异步读<\/text>\n  <text x=\"490\" y=\"310\" fill=\"#94a3b8\" font-size=\"11\">适合小 FIFO、小移位寄存器、小查表<\/text>\n\n  <text x=\"30\" y=\"355\" fill=\"#94a3b8\" font-size=\"12\">单口 / 简单双口(一只写一只读) / 真双口(A、B 都可读写) 三种模式，按数据流向选。<\/text>\n<\/svg>\n"}, {"file": "assets/phase4/fifo_organization.svg", "title": "FIFO 环形缓冲与读写指针", "caption": "wr_ptr/rd_ptr 回绕，empty/full/count 的判断规则。", "svgRaw": "<svg xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"0 0 900 360\" font-family=\"Consolas,Menlo,monospace\">\n  <rect width=\"900\" height=\"360\" fill=\"#0d1420\"/>\n  <text x=\"20\" y=\"30\" fill=\"#22d3ee\" font-size=\"18\" font-weight=\"bold\">FIFO 数据组织：环形缓冲 + 读写指针<\/text>\n\n  <!-- memory array cells -->\n  <g>\n    <rect x=\"60\"  y=\"90\" width=\"70\" height=\"50\" fill=\"#16233a\" stroke=\"#34d399\"/>\n    <rect x=\"140\" y=\"90\" width=\"70\" height=\"50\" fill=\"#16233a\" stroke=\"#34d399\"/>\n    <rect x=\"220\" y=\"90\" width=\"70\" height=\"50\" fill=\"#16233a\" stroke=\"#34d399\"/>\n    <rect x=\"300\" y=\"90\" width=\"70\" height=\"50\" fill=\"#16233a\" stroke=\"#34d399\"/>\n    <rect x=\"380\" y=\"90\" width=\"70\" height=\"50\" fill=\"#16233a\" stroke=\"#34d399\"/>\n    <rect x=\"460\" y=\"90\" width=\"70\" height=\"50\" fill=\"#16233a\" stroke=\"#34d399\"/>\n    <rect x=\"540\" y=\"90\" width=\"70\" height=\"50\" fill=\"#16233a\" stroke=\"#34d399\"/>\n    <rect x=\"620\" y=\"90\" width=\"70\" height=\"50\" fill=\"#16233a\" stroke=\"#34d399\"/>\n    <text x=\"80\"  y=\"120\" fill=\"#94a3b8\" font-size=\"12\">0<\/text>\n    <text x=\"160\" y=\"120\" fill=\"#94a3b8\" font-size=\"12\">1<\/text>\n    <text x=\"240\" y=\"120\" fill=\"#94a3b8\" font-size=\"12\">2<\/text>\n    <text x=\"320\" y=\"120\" fill=\"#e2e8f0\" font-size=\"12\">A<\/text>\n    <text x=\"400\" y=\"120\" fill=\"#e2e8f0\" font-size=\"12\">B<\/text>\n    <text x=\"480\" y=\"120\" fill=\"#e2e8f0\" font-size=\"12\">C<\/text>\n    <text x=\"560\" y=\"120\" fill=\"#e2e8f0\" font-size=\"12\">D<\/text>\n    <text x=\"640\" y=\"120\" fill=\"#94a3b8\" font-size=\"12\">7<\/text>\n  <\/g>\n\n  <!-- write pointer -->\n  <text x=\"290\" y=\"180\" fill=\"#fbbf24\" font-size=\"13\">写指针 wr_ptr（下一个写入位置）<\/text>\n  <line x1=\"335\" y1=\"170\" x2=\"335\" y2=\"142\" stroke=\"#fbbf24\" stroke-width=\"2\" marker-end=\"url(#e)\"/>\n\n  <!-- read pointer -->\n  <text x=\"400\" y=\"230\" fill=\"#22d3ee\" font-size=\"13\">读指针 rd_ptr（下一个读出位置）<\/text>\n  <line x1=\"415\" y1=\"218\" x2=\"415\" y2=\"142\" stroke=\"#22d3ee\" stroke-width=\"2\" marker-end=\"url(#e)\"/>\n\n  <!-- head/tail logic -->\n  <rect x=\"60\" y=\"270\" width=\"780\" height=\"70\" rx=\"6\" fill=\"#16233a\" stroke=\"#475569\"/>\n  <text x=\"80\" y=\"298\" fill=\"#e2e8f0\" font-size=\"12\">写一个数据 -> 写指针 +1；读一个数据 -> 读指针 +1；到头回绕（环形）。<\/text>\n  <text x=\"80\" y=\"322\" fill=\"#94a3b8\" font-size=\"12\">empty = (wr_ptr==rd_ptr)；full = 两指针最高位相反且低位相同；count = wr_ptr - rd_ptr。<\/text>\n\n  <defs>\n    <marker id=\"e\" markerWidth=\"9\" markerHeight=\"9\" refX=\"6\" refY=\"3\" orient=\"auto\">\n      <path d=\"M0,0 L6,3 L0,6 Z\" fill=\"#cbd5e1\"/>\n    <\/marker>\n  <\/defs>\n<\/svg>\n"}, {"file": "assets/phase4/afifo_gray_cdc.svg", "title": "异步 FIFO 格雷码跨时钟域", "caption": "格雷码指针经两级同步器跨域，分别算 empty/full。", "svgRaw": "<svg xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"0 0 900 420\" font-family=\"Consolas,Menlo,monospace\">\n  <rect width=\"900\" height=\"420\" fill=\"#0d1420\"/>\n  <text x=\"20\" y=\"30\" fill=\"#22d3ee\" font-size=\"18\" font-weight=\"bold\">异步 FIFO：格雷码指针跨时钟域<\/text>\n\n  <!-- write domain -->\n  <rect x=\"20\" y=\"70\" width=\"250\" height=\"280\" rx=\"8\" fill=\"#10233a\" stroke=\"#22d3ee\" stroke-width=\"1.5\"/>\n  <text x=\"40\" y=\"98\" fill=\"#22d3ee\" font-size=\"13\" font-weight=\"bold\">写时钟域 wr_clk<\/text>\n  <rect x=\"45\" y=\"115\" width=\"200\" height=\"40\" rx=\"4\" fill=\"#16233a\" stroke=\"#475569\"/>\n  <text x=\"70\" y=\"140\" fill=\"#e2e8f0\" font-size=\"12\">写指针 bin->gray<\/text>\n  <rect x=\"45\" y=\"170\" width=\"200\" height=\"40\" rx=\"4\" fill=\"#16233a\" stroke=\"#475569\"/>\n  <text x=\"70\" y=\"195\" fill=\"#e2e8f0\" font-size=\"12\">写 RAM<\/text>\n  <text x=\"45\" y=\"240\" fill=\"#94a3b8\" font-size=\"11\">full 由同步过来的<\/text>\n  <text x=\"45\" y=\"258\" fill=\"#94a3b8\" font-size=\"11\">读格雷码判断<\/text>\n\n  <!-- dual port ram -->\n  <rect x=\"330\" y=\"150\" width=\"240\" height=\"100\" rx=\"8\" fill=\"#1a2310\" stroke=\"#a3e635\" stroke-width=\"1.5\"/>\n  <text x=\"380\" y=\"195\" fill=\"#e2e8f0\" font-size=\"13\">双口 RAM<\/text>\n  <text x=\"360\" y=\"220\" fill=\"#94a3b8\" font-size=\"11\">A口写 / B口读<\/text>\n\n  <!-- read domain -->\n  <rect x=\"630\" y=\"70\" width=\"250\" height=\"280\" rx=\"8\" fill=\"#102a1a\" stroke=\"#34d399\" stroke-width=\"1.5\"/>\n  <text x=\"650\" y=\"98\" fill=\"#34d399\" font-size=\"13\" font-weight=\"bold\">读时钟域 rd_clk<\/text>\n  <rect x=\"655\" y=\"115\" width=\"200\" height=\"40\" rx=\"4\" fill=\"#16233a\" stroke=\"#475569\"/>\n  <text x=\"680\" y=\"140\" fill=\"#e2e8f0\" font-size=\"12\">读指针 bin->gray<\/text>\n  <rect x=\"655\" y=\"170\" width=\"200\" height=\"40\" rx=\"4\" fill=\"#16233a\" stroke=\"#475569\"/>\n  <text x=\"680\" y=\"195\" fill=\"#e2e8f0\" font-size=\"12\">读 RAM<\/text>\n  <text x=\"655\" y=\"240\" fill=\"#94a3b8\" font-size=\"11\">empty 由同步过来的<\/text>\n  <text x=\"655\" y=\"258\" fill=\"#94a3b8\" font-size=\"11\">写格雷码判断<\/text>\n\n  <!-- arrows ram -->\n  <line x1=\"270\" y1=\"190\" x2=\"330\" y2=\"190\" stroke=\"#a3e635\" stroke-width=\"1.5\" marker-end=\"url(#g)\"/>\n  <line x1=\"570\" y1=\"190\" x2=\"630\" y2=\"190\" stroke=\"#a3e635\" stroke-width=\"1.5\" marker-end=\"url(#g)\"/>\n\n  <!-- gray sync path write->read -->\n  <path d=\"M145 280 L145 330 L755 330 L755 280\" fill=\"none\" stroke=\"#fbbf24\" stroke-width=\"1.8\" stroke-dasharray=\"6,4\" marker-end=\"url(#g)\"/>\n  <rect x=\"400\" y=\"312\" width=\"120\" height=\"30\" rx=\"4\" fill=\"#2a1a10\" stroke=\"#fbbf24\"/>\n  <text x=\"410\" y=\"332\" fill=\"#fbbf24\" font-size=\"11\">两级同步器<\/text>\n  <text x=\"330\" y=\"380\" fill=\"#94a3b8\" font-size=\"11\">写格雷码 -> 打两拍进读域 -> 算 empty<\/text>\n\n  <!-- gray sync path read->write -->\n  <path d=\"M755 280 L755 395 L145 395 L145 300\" fill=\"none\" stroke=\"#fbbf24\" stroke-width=\"1.8\" stroke-dasharray=\"2,4\"/>\n  <text x=\"330\" y=\"410\" fill=\"#94a3b8\" font-size=\"11\">读格雷码 -> 打两拍进写域 -> 算 full<\/text>\n\n  <defs>\n    <marker id=\"g\" markerWidth=\"9\" markerHeight=\"9\" refX=\"6\" refY=\"3\" orient=\"auto\">\n      <path d=\"M0,0 L6,3 L0,6 Z\" fill=\"#cbd5e1\"/>\n    <\/marker>\n  <\/defs>\n<\/svg>\n"}], "tools": [{"name": "PG058 Block Memory Generator Product Guide (v8.4)", "url": "https://docs.amd.com/v/u/en-US/pg058-blk-mem-gen", "required": true, "note": "访问日期 2026-10-10。"}, {"name": "PG057 FIFO Generator Product Guide (v13.2)", "url": "https://docs.amd.com/v/u/en-US/pg057-fifo-generator", "required": true, "note": "访问日期 2026-10-10。"}, {"name": "Block Memory Generator 产品页", "url": "https://www.amd.com/en/products/adaptive-socs-and-fpgas/intellectual-property/block_memory_generator.html", "required": false, "note": "访问日期 2026-10-10。"}], "tasks": [{"id": "task-4-2-1", "text": "调用 BRAM IP (Block Memory Generator) 实现读写测试"}, {"id": "task-4-2-2", "text": "用异步 FIFO 实现跨时钟域数据传输"}], "cards": [{"q": "BRAM 和分布式 RAM 有什么区别？", "a": "BRAM 是专用存储块(36Kb/块)、容量大、同步读、适合 FIFO/帧缓冲；分布式 RAM 用 LUT 当小存储、容量小、可异步读、适合小队列。", "tags": ["BRAM", "存储"]}, {"q": "BRAM 有哪几种端口模式？", "a": "单口(一个端口读或写)、简单双口(A写B读，最匹配FIFO)、真双口(A/B都可独立读写)。", "tags": ["BRAM", "端口"]}, {"q": "怎么让综合器把数组推断成 BRAM？", "a": "写 reg 数组 + 同步写 always @(posedge clk) + 同步读；别给 ram 加异步复位、别用组合读，否则会被降级成分布式 RAM/触发器。", "tags": ["BRAM", "推断"]}, {"q": "FIFO 的 empty/full 怎么判断？", "a": "empty = 写指针==读指针；full = 指针多存一位，最高位相反且低位相同；count = 写指针-读指针。", "tags": ["FIFO", "指针"]}, {"q": "同步 FIFO 和异步 FIFO 的区别？", "a": "同步 FIFO 读写共用一个时钟，逻辑简单；异步 FIFO 读写各一个时钟，用于跨时钟域传数据。", "tags": ["FIFO"]}, {"q": "为什么跨时钟域传指针要用格雷码？", "a": "二进制指针加1多位同时跳变，对方采样会采到中间乱值；格雷码相邻值只变1位，跨域采样最多取到旧值或新值，不会错。", "tags": ["格雷码", "CDC"]}, {"q": "二进制怎么转格雷码？", "a": "gray = bin ^ (bin >> 1)，即自身异或右移一位。", "tags": ["格雷码", "公式"]}, {"q": "跨域为什么要打两拍同步器？", "a": "第一拍可能采到亚稳态，第二拍让信号稳定；吸收亚稳态后再使用，是单bit/格雷码跨域的标准做法。", "tags": ["同步器", "亚稳态"]}, {"q": "什么时候该用 FIFO Generator IP 而不是手写 RTL？", "a": "大深度、需要精确 almost 阈值/FWFT/标准复位时序、或综合没推断成 BRAM 时用 IP；学习和小队列可用纯 RTL。产品级建议调 IP 并跑 report_cdc。", "tags": ["IP", "FIFO"]}, {"q": "异步 FIFO 的端口分哪两组？", "a": "写组 wr_clk/wr_en/din/full，读组 rd_clk/rd_en/dout/empty；两组时钟相互独立。", "tags": ["异步FIFO", "端口"]}], "quiz": [{"q": "FIFO 最匹配的 BRAM 端口模式是？", "options": ["单口", "简单双口(A写B读)", "真双口", "三态口"], "answer": 1, "explain": "FIFO 一只写一只读，正好对应简单双口。"}, {"q": "格雷码相邻两个数之间有几位不同？", "options": ["全部位", "恰好 1 位", "2 位", "随机"], "answer": 1, "explain": "格雷码相邻值只有 1 bit 变化，跨域采样不会取到跳变中间态。"}, {"q": "gray = bin ^ (bin>>1) 用于？", "options": ["二进制转格雷码", "格雷码转二进制", "加密", "分频"], "answer": 0, "explain": "这是二进制到格雷码的标准转换。"}, {"q": "异步 FIFO 判断 empty 依据？", "options": ["写时钟计数", "读格雷码与同步过来的写格雷码比较", "固定深度", "外部信号"], "answer": 1, "explain": "读域把写指针格雷码打两拍同步后，与读格雷码比较判 empty。"}], "docHtml": "<h1>4.2 BRAM 与 FIFO 缓存<\/h1>\n<p>系统级设计里，数据很少\"随产随用\"：收发速度不匹配、两个时钟域、要先攒一批再处理——都需要一块<strong>片上缓存<\/strong>。FPGA 里最大的片上存储就是 <strong>BRAM<\/strong>，而最常用的缓存结构就是 <strong>FIFO<\/strong>。本节讲清 BRAM 原理、同步/异步 FIFO，以及异步 FIFO 如何靠<strong>格雷码<\/strong>安全地跨时钟域传数据。<\/p>\n<h2>一、块存储器 BRAM 原理<\/h2>\n<p>Artix-7 里有两种片上存储资源（见 <code>bram_structure.svg<\/code>）：<\/p>\n<table>\n<thead>\n<tr>\n<th><\/th>\n<th>Block RAM (BRAM)<\/th>\n<th>Distributed RAM (LUT RAM)<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>本质<\/td>\n<td>专用存储块（每块 36Kb，可拆成两个 18Kb）<\/td>\n<td>用 LUT 当小存储<\/td>\n<\/tr>\n<tr>\n<td>容量<\/td>\n<td>大（几十~几百 Kb）<\/td>\n<td>小（几十 bit~几 Kb）<\/td>\n<\/tr>\n<tr>\n<td>读<\/td>\n<td>同步读（寄存输出）<\/td>\n<td>可异步读<\/td>\n<\/tr>\n<tr>\n<td>用途<\/td>\n<td>FIFO、帧缓冲、大查表、队列<\/td>\n<td>小 FIFO、小移位寄存器<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<p><strong>BRAM 三种端口模式<\/strong>：<\/p>\n<ul>\n<li><strong>单口 (Single Port)<\/strong>：一个端口，同一时刻只能读或写。<\/li>\n<li><strong>简单双口 (Simple Dual Port)<\/strong>：A 口只写、B 口只读——最常用，正好匹配 FIFO。<\/li>\n<li><strong>真双口 (True Dual Port)<\/strong>：A、B 两口都可独立读写。<\/li>\n<\/ul>\n<p><strong>如何\"推断\"BRAM<\/strong>：不用直接例化原语，只要写出特定写法的数组，Vivado 会自动映射到 BRAM。关键写法（本仓库 <code>sfifo.v<\/code> 即如此）：<\/p>\n<pre><code class=\"language-verilog\">reg [DATA_WIDTH-1:0] ram [0:DEPTH-1];\nalways @(posedge clk) begin\n    if (we) ram[addr] &lt;= din;        // 同步写\nend\n// 同步读：下一拍给出 ram[raddr]\n<\/code><\/pre>\n<p>写成这样综合器就会把它识别成 Block RAM；若写得不像（比如组合读、带异步复位 ram），可能被降级成分布式 RAM 甚至触发器。<\/p>\n<h2>二、FIFO 的数据组织<\/h2>\n<p>FIFO（First-In-First-Out，先进先出）就是一块<strong>环形缓冲 + 两个指针<\/strong>（见 <code>fifo_organization.svg<\/code>）：<\/p>\n<ul>\n<li><strong>写指针 wr_ptr<\/strong>：指向下一个可写位置，写一个就 +1，到头回绕。<\/li>\n<li><strong>读指针 rd_ptr<\/strong>：指向下一个可读位置，读一个就 +1。<\/li>\n<li><strong>empty<\/strong>：wr_ptr == rd_ptr（没数据可读）。<\/li>\n<li><strong>full<\/strong>：写指针追到读指针一圈。实现技巧是指针多存一位：最高位相反、低位相等即满。<\/li>\n<li><strong>count<\/strong>：wr_ptr - rd_ptr = 当前数据个数。<\/li>\n<\/ul>\n<h3>同步 FIFO（单时钟）<\/h3>\n<p>读写共用一个时钟，逻辑最简单：在同一个 <code>clk<\/code> 下根据 <code>wr_en/rd_en<\/code> 更新两个指针。本仓库 <code>sfifo.v<\/code> 就是同步 FIFO（8bit×16 深，可改参数），提供 <code>empty/full/almost_full/count<\/code>。<code>tb_sfifo.v<\/code> 验证了写满→再写被忽略→读空→数据顺序正确→回环。<\/p>\n<h3>异步 FIFO（双时钟）<\/h3>\n<p>读写各用一个时钟（如写 50MHz、读 25MHz），这才是跨时钟域传数据的主角。<\/p>\n<h2>三、异步 FIFO 与格雷码跨时钟域<\/h2>\n<p><strong>问题<\/strong>：读写指针是多 bit 的二进制数，要跨到对方时钟域去判断 empty/full。但二进制指针加 1 时<strong>多位同时跳变<\/strong>（如 011→100），对方时钟在中间采，可能采到乱七八糟的值。<\/p>\n<p><strong>解法——格雷码 (Gray Code)<\/strong>：相邻两个数之间<strong>只有 1 bit 不同<\/strong>。<\/p>\n<pre><code>二进制: 000 001 010 011 100 101 ...\n格雷码: 000 001 011 010 110 111 ...   (每次只变一位)\n<\/code><\/pre>\n<p>二进制转格雷码：<code>gray = bin ^ (bin &gt;&gt; 1)<\/code>。<\/p>\n<p>跨域流程（见 <code>afifo_gray_cdc.svg<\/code>）：<\/p>\n<ol>\n<li>写域把写指针转成格雷码，<strong>打两拍同步器<\/strong>送到读域 → 读域用它和自己的读格雷码比，判断 <code>empty<\/code>。<\/li>\n<li>读域把读指针格雷码<strong>打两拍<\/strong>送到写域 → 写域用它判断 <code>full<\/code>。<\/li>\n<li>因为格雷码每次只变一位，跨域采样最多采到\"旧值或新值\"，绝不会采到跳变中间态；再配两级同步器打拍，亚稳态被吸收。<\/li>\n<\/ol>\n<p>本仓库 <code>afifo.v<\/code> 就是经典格雷码异步 FIFO（双口 RAM + 二进制/格雷指针 + 两级同步 + empty/full），<code>tb_afifo.v<\/code> 用 50MHz 写、25MHz 读验证 16 个数据完整读出、顺序正确。<\/p>\n<blockquote>\n<p>为什么是\"打两拍\"而不是一拍？第一拍可能进入亚稳态，第二拍让它稳定下来——这就是阶段2 按键消抖里同步器的思路，对多 bit 格雷码同样适用。<\/p>\n<\/blockquote>\n<h2>四、纯 RTL 还是官方 IP？<\/h2>\n<table>\n<thead>\n<tr>\n<th>场景<\/th>\n<th>建议<\/th>\n<\/tr>\n<
