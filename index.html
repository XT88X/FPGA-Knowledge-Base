\n    reg [31:0] uart_rdata;\n    always @(*) begin\n        if (uart_data_sel) uart_rdata = {24&#x27;h0, rx_data_r};\n        else               uart_rdata = {30&#x27;h0, rx_avail_r, tx_ready};\n    end\n\n    // ---- GPIO ----\n    wire [7:0] gpio_o, gpio_i;\n    wire [7:0] dir_reg, out_reg;\n    assign gpio_i = gpio;                 // 仿真观察：外部输入脚\n    assign gpio   = (dir_reg != 8&#x27;h00) ? gpio_o : 8&#x27;hzz;\n\n    ch4_gpio #(.WIDTH(8)) u_gpio (\n        .clk(clk), .rst_n(rst_n),\n        .we_dir(we_gpio_dir), .we_out(we_gpio_out), .wdata(dmem_wdata),\n        .gpio_i(gpio_i), .gpio_o(gpio_o),\n        .dir_reg(dir_reg), .out_reg(out_reg)\n    );\n\n    // GPIO 读回：DIR 口=dir_reg，OUT 口=out_reg，IN 口=gpio_i\n    reg [31:0] gpio_rdata;\n    always @(*) begin\n        if (gpio_dir_sel)      gpio_rdata = {24&#x27;h0, dir_reg};\n        else if (gpio_out_sel) gpio_rdata = {24&#x27;h0, out_reg};\n        else                   gpio_rdata = {24&#x27;h0, gpio_i};\n    end\n\n    // ---- 定时器 ----\n    wire [31:0] timer_cnt;\n    wire        timer_irq_flag;\n    wire        timer_irq_pulse;\n\n    ch4_timer #(.RESET_CMP(32&#x27;d50)) u_timer (\n        .clk(clk), .rst_n(rst_n),\n        .we_ctrl(we_timer_ctrl), .we_cmp(we_timer_cmp), .we_clr(we_timer_clr),\n        .wdata(dmem_wdata),\n        .cnt(timer_cnt), .irq_flag(timer_irq_flag), .irq_pulse(timer_irq_pulse)\n    );\n\n    // 定时器读回\n    reg [31:0] timer_rdata;\n    always @(*) begin\n        if (timer_cnt_sel)       timer_rdata = timer_cnt;\n        else if (timer_ctrl_sel) timer_rdata = {31&#x27;h0, 1&#x27;b1};  // 始终&quot;已使能&quot;镜像\n        else                     timer_rdata = 32&#x27;h0;\n    end\n\n    // ---- 中断汇总 ----\n    reg inte_reg;          // INTE[0]\n    reg intf_reg;          // INTF[0]\n    always @(posedge clk) begin\n        if (!rst_n) begin\n            inte_reg &lt;= 1&#x27;b0;\n            intf_reg &lt;= 1&#x27;b0;\n        end else begin\n            if (we_inte) inte_reg &lt;= dmem_wdata[0];\n            // 定时器匹配置位；写 INTF(W1C) 清零\n            if (timer_irq_flag) intf_reg &lt;= 1&#x27;b1;\n            if (we_intf)        intf_reg &lt;= intf_reg &amp; ~dmem_wdata[0];\n        end\n    end\n\n    wire irq_to_core = intf_reg &amp; inte_reg;   // 定时器中断 &amp; 全局使能\n\n    reg [31:0] int_rdata;\n    always @(*) begin\n        if (inte_sel) int_rdata = {31&#x27;h0, inte_reg};\n        else          int_rdata = {31&#x27;h0, intf_reg};   // intf_sel\n    end\n\n    // ---- CPU 例化 ----\n    wire [31:0] dbg_pc;\n    ch4_rv_core #(\n        .RESET_VECTOR(RESET_VECTOR), .TRAP_VEC(TRAP_VEC)\n    ) u_core (\n        .clk(clk), .rst_n(rst_n),\n        .imem_addr(imem_addr), .imem_rdata(imem_rdata),\n        .dmem_addr(dmem_addr), .dmem_wdata(dmem_wdata),\n        .dmem_we(dmem_we), .dmem_rdata(dmem_rdata),\n        .irq_i(irq_to_core), .mie(inte_reg),\n        .dbg_pc(dbg_pc)\n    );\n\nendmodule\n"}, {"file": "code/phase5/ch4_tb_soc.v", "type": "verilog", "role": "testbench", "title": "ch4_tb_soc.v — 自检 UART 打印/定时器中断翻转 LED/GPIO 镜像", "codeHtml": "// =============================================================================\n// ch4_tb_soc.v — 5.4 自制 SoC 顶层自检 testbench\n//\n//   验证点（行为仿真，hierarchical 观察内部信号）：\n//     1) UART 打印：复位后经 UART 数据寄存器发出 &#x27;O&#x27;(79) 与 &#x27;K&#x27;(75)；\n//     2) 定时器中断翻转 LED：timer 到 cmp 后进入 ISR，GPIO_OUT bit0 翻转；\n//     3) GPIO 输入-&gt;输出：主循环把 GPIO_IN 镜像到 GPIO_OUT；\n//     4) RAM 读写：固件循环里 LW/SW 访问 RAM（程序本身在 RAM 上跑）。\n//\n//   风格对齐 ch1_tb_riscv_soc：#delay 时序 + initial/always，不用 task/forever。\n//   注意：本环境无 iverilog，仅做 pyverilog 结构校验；波形需本地跑。\n// =============================================================================\n`timescale 1ns/1ps\nmodule ch4_tb_soc;\n\n    reg        clk = 0;\n    reg        rst_n = 0;\n    wire       tx_o;\n    reg        rx_i = 1&#x27;b1;\n    wire [7:0] gpio;          // inout\n\n    // 驱动 gpio_i：先给一个固定输入，观察镜像\n    reg  [7:0] gpio_drv;\n    reg        gpio_dir_out;   // 由固件配置为输出\n    assign gpio = gpio_dir_out ? gpio_drv : 8&#x27;hzz;\n\n    always #5 clk = ~clk;      // 10ns 周期\n\n    ch4_soc_top u_dut (\n        .clk(clk), .rst_n(rst_n),\n        .tx_o(tx_o), .rx_i(rx_i),\n        .gpio(gpio)\n    );\n\n    // ---- 捕获 UART 发送的字节 ----\n    integer uart_cnt;\n    reg [7:0] uart_chars [0:3];\n    integer i;\n    always @(posedge clk) begin\n        if (rst_n &amp;&amp; u_dut.we_uart_data) begin\n            if (uart_cnt &lt; 4) uart_chars[uart_cnt] &lt;= u_dut.dmem_wdata[7:0];\n            uart_cnt &lt;= uart_cnt + 1;\n        end\n    end\n\n    // ---- 记录 GPIO_OUT bit0 的翻转次数（定时器中断是否触发）----\n    integer toggle_cnt;\n    reg     prev_bit0;\n    always @(posedge clk) begin\n        if (rst_n) begin\n            if (u_dut.out_reg[0] !== prev_bit0) begin\n                toggle_cnt &lt;= toggle_cnt + 1;\n                prev_bit0  &lt;= u_dut.out_reg[0];\n            end\n        end\n    end\n\n    integer errors;\n    initial begin\n        uart_cnt   = 0;\n        toggle_cnt = 0;\n        prev_bit0  = 1&#x27;b0;\n        errors     = 0;\n        gpio_drv   = 8&#x27;h00;\n        gpio_dir_out = 1&#x27;b0;\n\n        rst_n = 0;\n        #50;\n        rst_n = 1;\n\n        // 让固件配置 GPIO 为输出后，给外部输入 0xA5，观察镜像\n        #200;\n        gpio_drv = 8&#x27;hA5;\n        gpio_dir_out = 1&#x27;b1;\n\n        // 跑足够多周期：定时器 cmp=20，约数千周期应触发多次中断\n        #3000;\n\n        $display(&quot;---- ch4_tb_soc CHECK ----&quot;);\n        $display(&quot;UART chars = 0x%02x 0x%02x (expect 0x4F &#x27;O&#x27;, 0x4B &#x27;K&#x27;), count=%0d&quot;,\n                 uart_chars[0], uart_chars[1], uart_cnt);\n        $display(&quot;GPIO_OUT bit0 toggles = %0d (expect &gt;=2, 定时器中断多次翻转)&quot;, toggle_cnt);\n        $display(&quot;GPIO_IN 镜像: gpio_drv=0x%02x, out_reg=0x%02x&quot;, gpio_drv, u_dut.out_reg);\n\n        if (uart_chars[0] !== 8&#x27;h4F || uart_chars[1] !== 8&#x27;h4B) begin\n            $display(&quot;FAIL: UART print mismatch&quot;);\n            errors = errors + 1;\n        end\n        if (toggle_cnt &lt; 2) begin\n            $display(&quot;FAIL: timer interrupt did not toggle LED&quot;);\n            errors = errors + 1;\n        end\n        if (errors == 0)\n            $display(&quot;PASS: SoC UART + timer IRQ + GPIO mirror OK&quot;);\n        else\n            $display(&quot;FAIL count = %0d&quot;, errors);\n\n        $finish;\n    end\n\n    initial begin #20000; $display(&quot;  [TB] 超时护栏&quot;); $finish; end\n\nendmodule\n"}, {"file": "code/phase5/ch4_firmware.hex", "type": "verilog", "role": "synthesizable", "title": "ch4_firmware.hex — 手工汇编教学镜像（$readmemh 加载）", "codeHtml": "// ch4_firmware.hex - hand-assembled RV32I (auto-generated by gen_fw.py)\n// Reset word0: print &#x27;OK&#x27;, setup GPIO_DIR/timer/INTE, loop mirrors GPIO_IN-&gt;OUT\n// ISR word0x40 (byte0x100): toggle GPIO_OUT bit0, clear timer flag, return via x5\n20000537\n0ff00593\n00b52823\n04f00593\n00b52023\n04b00593\n00b52023\n01400593\n02b52223\n00100593\n02b52023\n02b52823\n01852583\n00b52a23\nff9ff06f\n00000000\n00000000\n00000000\n00000000\n00000000\n00000000\n00000000\n00000000\n00000000\n00000000\n00000000\n00000000\n00000000\n00000000\n00000000\n00000000\n00000000\n00000000\n00000000\n00000000\n00000000\n00000000\n00000000\n00000000\n00000000\n00000000\n00000000\n00000000\n00000000\n00000000\n00000000\n00000000\n00000000\n00000000\n00000000\n00000000\n00000000\n00000000\n00000000\n00000000\n00000000\n00000000\n00000000\n00000000\n00000000\n00000000\n00000000\n00000000\n00000000\n01452583\n0015c593\n00b52a23\n02052623\n00028067\n00000000\n00000000\n00000000\n00000000\n00000000\n00000000\n00000000\n00000000\n00000000\n00000000\n00000000\n00000000\n00000000\n00000000\n00000000\n00000000\n00000000\n00000000\n00000000\n00000000\n00000000\n00000000\n00000000\n00000000\n00000000\n00000000\n00000000\n00000000\n00000000\n00000000\n00000000\n00000000\n00000000\n00000000\n00000000\n00000000\n00000000\n00000000\n00000000\n00000000\n00000000\n00000000\n00000000\n00000000\n00000 000\n00000000\n00000000\n00000000\n00000000\n00000000\n00000000\n00000000\n00000000\n00000000\n00000000\n00000000\n00000000\n00000000\n00000000\n00000000\n00000000\n00000000\n00000000\n00000000\n00000000\n00000000\n00000000\n00000000\n00000000\n00000000\n00000000\n00000000\n00000000\n00000000\n00000000\n00000000\n00000000\n00000000\n00000000\n00000000\n00000000\n00000000\n00000000\n00000000\n00000000\n00000000\n00000000\n00000000\n00000000\n00000000\n00000000\n00000000\n00000000\n00000000\n00000000\n00000000\n00000000\n00000000\n00000000\n00000000\n00000000\n00000000\n00000000\n00000000\n00000000\n00000000\n00000000\n00000000\n00000000\n00000000\n00000000\n00000000\n00000000\n00000000\n00000000\n00000000\n00000000\n00000000\n00000000\n00000000\n00000000\n00000000\n00000000\n00000000\n00000000\n00000000\n00000000\n00000000\n00000000\n00000000\n00000000\n00000000\n00000000\n00000000\n00000000\n00000000\n00000000\n00000000\n00000000\n00000000\n00000000\n00000000\n00000000\n00000000\n00000000\n00000000\n00000000\n00000000\n00000000\n00000000\n00000000\n00000000\n00000000\n00000000\n00000000\n"}, {"file": "code/phase5/startup_ch4.s", "type": "verilog", "role": "synthesizable", "title": "startup_ch4.s — 复位与中断向量启动文件", "codeHtml": "/* =============================================================================\n * startup_ch4.s — ch4 SoC 裸机启动文件（复位与中断向量）\n *\n *  由 RISC-V 交叉工具链构建（本仓库未安装，仅提供源码）。\n *  复位入口：设栈、清 .bss、调 main()。\n *  中断向量：TRAP_VEC=0x100，保存现场(教学版仅用 x5 存返回地址)，\n *            跳 C 层 isr_timer()，返回后用 x5 回 PC。\n * ==========================================================================*/\n    .section .text.start\n    .globl _start\n_start:\n    /* 设栈顶（链接脚本给出 _stack_top） */\n    la      sp, _stack_top\n\n    /* 清 .bss */\n    la      t0, _bss_start\n    la      t1, _bss_end\n1:  bgeu    t0, t1, 2f\n    sw      zero, 0(t0)\n    addi    t0, t0, 4\n    j       1b\n2:\n\n    /* 跳 main */\n    call    main\n\n    /* main 不应返回；若返回则在此死循环 */\n3:  j       3b\n\n/* ---- 中断向量入口（地址 0x100，由硬件取指跳来）---- */\n    .org    0x100\n    .globl _trap_entry\n_trap_entry:\n    /* 教学简化：硬件已把返回地址写入 x5；这里直接调 C 层 ISR */\n    call    isr_timer\n    /* 返回：x5 即被打断指令的下一条地址 */\n    jr      x5\n"}, {"file": "code/phase5/ch4_link.ld", "type": "verilog", "role": "synthesizable", "title": "ch4_link.ld — 裸机链接脚本", "codeHtml": "/* =============================================================================\n * ch4_link.ld — ch4 SoC 裸机链接脚本\n *   RAM 起点 0x00000000，大小 4KB(0x1000)；栈顶在 RAM 顶端。\n *   由 RISC-V 交叉工具链使用（本仓库未安装，仅提供源码）。\n * ==========================================================================*/\nMEMORY\n{\n    RAM (rwx) : ORIGIN = 0x00000000, LENGTH = 0x00001000\n}\n\nENTRY(_start)\n\nSECTIONS\n{\n    . = ORIGIN(RAM);\n\n    .text : {\n        *(.text.start)\n        *(.text)\n    } &gt; RAM\n\n    .rodata : { *(.rodata) } &gt; RAM\n    .data   : { *(.data)   } &gt; RAM\n    .bss    : {\n        _bss_start = .;\n        *(.bss)\n        _bss_end = .;\n    } &gt; RAM\n\n    _stack_top = ORIGIN(RAM) + LENGTH(RAM);\n}\n"}, {"file": "code/phase5/ch4_main.c", "type": "verilog", "role": "synthesizable", "title": "ch4_main.c — 裸机 C（定时器中断翻转 LED+串口打印+轮询按键）", "codeHtml": "/* =============================================================================\n * ch4_main.c — ch4 SoC 裸机 C 程序（定时器中断翻转 LED + 串口打印 + 轮询按键）\n *\n *  【说明】本文件需用 RISC-V 交叉工具链编译（本仓库环境未安装工具链，\n *          仅提供源码与寄存器地址宏）。仿真自检用的是手工编码的 ch4_firmware.hex。\n *\n *  地址映射（与 ch4_bus_mux.v / ch4_soc_top.v 一致）：\n *    0x20000000  UART_DATA   (写=发字节)\n *    0x20000004  UART_STATUS\n *    0x20000010  GPIO_DIR\n *    0x20000014  GPIO_OUT\n *    0x20000018  GPIO_IN\n *    0x20000020  TIMER_CTRL\n *    0x20000024  TIMER_CMP\n *    0x20000028  TIMER_CNT\n *    0x2000002C  TIMER_CLR\n *    0x20000030  INTE\n *    0x20000034  INTF\n * ==========================================================================*/\n#define UART_DATA   (*(volatile unsigned int *)0x20000000)\n#define UART_STAT   (*(volatile unsigned int *)0x20000004)\n#define GPIO_DIR    (*(volatile unsigned int *)0x20000010)\n#define GPIO_OUT    (*(volatile unsigned int *)0x20000014)\n#define GPIO_IN     (*(volatile unsigned int *)0x20000018)\n#define TIMER_CTRL  (*(volatile unsigned int *)0x20000020)\n#define TIMER_CMP   (*(volatile unsigned int *)0x20000024)\n#define TIMER_CLR   (*(volatile unsigned int *)0x2000002C)\n#define INTE        (*(volatile unsigned int *)0x20000030)\n#define INTF        (*(volatile unsigned int *)0x20000034)\n\nstatic void putchar(char c) { UART_DATA = (unsigned char)c; }\nstatic void puts(const char *s) { while (*s) putchar(*s++); }\n\n/* 定时器中断 ISR（由 _trap_entry 调用）：翻转 LED，清中断标志 */\nvoid isr_timer(void) {\n    GPIO_OUT ^= 0x1;     /* 翻转 LED */\n    TIMER_CLR = 1;       /* 写清中断标志 */\n}\n\nint main(void) {\n    GPIO_DIR = 0xFF;              /* GPIO 全部输出 */\n    puts(&quot;Hello from ch4 SoC!\\r\\n&quot;);\n\n    TIMER_CMP  = 1000;           /* 定时器周期 */\n    TIMER_CTRL = 1;              /* 启动定时器 */\n    INTE       = 1;              /* 使能定时器中断 */\n\n    /* 主循环：轮询按键(GPIO_IN bit0)，按下则打印，并镜像输入到输出 */\n    while (1) {\n        unsigned int in = GPIO_IN;\n        GPIO_OUT = in;           /* 镜像输入到输出 */\n        if (in &amp; 0x1) {\n            putchar(&#x27;B&#x27;);         /* 按键按下 */\n        }\n    }\n    return 0;\n}\n"}], "diagrams": [{"file": "assets/phase5/ch4_soc_block.svg", "title": "SoC 顶层框图", "caption": "CPU/RAM/UART/GPIO/Timer/中断汇总/地址译码。", "svgRaw": "<svg xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"0 0 900 420\" font-family=\"Consolas,monospace\">\n  <rect width=\"900\" height=\"420\" fill=\"#0f1420\"/>\n  <text x=\"450\" y=\"26\" fill=\"#60a5fa\" font-size=\"16\" text-anchor=\"middle\" font-weight=\"bold\">自制 SoC 单片机顶层架构（ch4_soc_top）<\/text>\n\n  <!-- CPU -->\n  <rect x=\"330\" y=\"150\" width=\"240\" height=\"90\" rx=\"8\" fill=\"#1e3a5f\" stroke=\"#60a5fa\" stroke-width=\"2\"/>\n  <text x=\"450\" y=\"180\" fill=\"#e5e7eb\" font-size=\"14\" text-anchor=\"middle\">RV32I 教学核<\/text>\n  <text x=\"450\" y=\"200\" fill=\"#9ca3af\" font-size=\"11\" text-anchor=\"middle\">PC/Regfile/ALU/控制器<\/text>\n  <text x=\"450\" y=\"218\" fill=\"#9ca3af\" font-size=\"11\" text-anchor=\"middle\">ch4_rv_core.v (+简化中断)<\/text>\n\n  <!-- RAM -->\n  <rect x=\"60\" y=\"150\" width=\"180\" height=\"90\" rx=\"8\" fill=\"#1a2e1a\" stroke=\"#22c55e\" stroke-width=\"2\"/>\n  <text x=\"150\" y=\"180\" fill=\"#e5e7eb\" font-size=\"13\" text-anchor=\"middle\">片上 RAM 4KB<\/text>\n  <text x=\"150\" y=\"200\" fill=\"#9ca3af\" font-size=\"11\" text-anchor=\"middle\">0x0000_0000<\/text>\n  <text x=\"150\" y=\"218\" fill=\"#9ca3af\" font-size=\"11\" text-anchor=\"middle\">$readmemh 加载固件<\/text>\n\n  <!-- Bus mux -->\n  <rect x=\"330\" y=\"290\" width=\"240\" height=\"50\" rx=\"8\" fill=\"#1e293b\" stroke=\"#fbbf24\" stroke-width=\"1.5\"/>\n  <text x=\"450\" y=\"320\" fill=\"#e5e7eb\" font-size=\"12\" text-anchor=\"middle\">地址译码 / 读数据 mux (ch4_bus_mux)<\/text>\n\n  <!-- Peripherals -->\n  <rect x=\"620\" y=\"80\" width=\"120\" height=\"50\" rx=\"6\" fill=\"#3b1d4f\" stroke=\"#a855f7\" stroke-width=\"1.5\"/>\n  <text x=\"680\" y=\"105\" fill=\"#e5e7eb\" font-size=\"12\" text-anchor=\"middle\">UART<\/text>\n  <text x=\"680\" y=\"122\" fill=\"#9ca3af\" font-size=\"10\" text-anchor=\"middle\">0x2000_0000<\/text>\n\n  <rect x=\"620\" y=\"150\" width=\"120\" height=\"50\" rx=\"6\" fill=\"#3b1d1d\" stroke=\"#fb923c\" stroke-width=\"1.5\"/>\n  <text x=\"680\" y=\"175\" fill=\"#e5e7eb\" font-size=\"12\" text-anchor=\"middle\">GPIO<\/text>\n  <text x=\"680\" y=\"192\" fill=\"#9ca3af\" font-size=\"10\" text-anchor=\"middle\">0x2000_0010<\/text>\n\n  <rect x=\"620\" y=\"220\" width=\"120\" height=\"50\" rx=\"6\" fill=\"#1a2e1a\" stroke=\"#22c55e\" stroke-width=\"1.5\"/>\n  <text x=\"680\" y=\"245\" fill=\"#e5e7eb\" font-size=\"12\" text-anchor=\"middle\">TIMER<\/text>\n  <text x=\"680\" y=\"262\" fill=\"#9ca3af\" font-size=\"10\" text-anchor=\"middle\">0x2000_0020<\/text>\n\n  <rect x=\"620\" y=\"290\" width=\"120\" height=\"50\" rx=\"6\" fill=\"#1e3a5f\" stroke=\"#22d3ee\" stroke-width=\"1.5\"/>\n  <text x=\"680\" y=\"315\" fill=\"#e5e7eb\" font-size=\"12\" text-anchor=\"middle\">INTE/INTF<\/text>\n  <text x=\"680\" y=\"332\" fill=\"#9ca3af\" font-size=\"10\" text-anchor=\"middle\">0x2000_0030<\/text>\n\n  <!-- IRQ line -->\n  <line x1=\"680\" y1=\"270\" x2=\"680\" y2=\"290\" stroke=\"#fbbf24\" stroke-width=\"1.5\"/>\n  <path d=\"M680 290 L560 290 L560 240 L570 240\" fill=\"none\" stroke=\"#fbbf24\" stroke-width=\"1.5\" marker-end=\"url(#ab)\"/>\n  <text x=\"600\" y=\"285\" fill=\"#fbbf24\" font-size=\"10\">timer irq<\/text>\n\n  <!-- arrows CPU<->RAM, CPU<->bus -->\n  <line x1=\"240\" y1=\"195\" x2=\"330\" y2=\"195\" stroke=\"#22c55e\" stroke-width=\"2\"/>\n  <line x1=\"330\" y1=\"210\" x2=\"240\" y2=\"210\" stroke=\"#22c55e\" stroke-width=\"2\"/>\n  <line x1=\"450\" y1=\"240\" x2=\"450\" y2=\"290\" stroke=\"#fbbf24\" stroke-width=\"1.5\"/>\n\n  <text x=\"60\" y=\"390\" fill=\"#9ca3af\" font-size=\"12\">von Neumann：取指与 LW/SW 共用 RAM；外设全部内存映射；timer 中断汇总后送 CPU irq_i。<\/text>\n<\/svg>\n"}, {"file": "assets/phase5/ch4_addr_map.svg", "title": "地址映射表", "caption": "RAM 0x0 + 外设 0x2000_00xx 完整寄存器表。", "svgRaw": "<svg xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"0 0 900 420\" font-family=\"Consolas,monospace\">\n  <rect width=\"900\" height=\"420\" fill=\"#0f1420\"/>\n  <text x=\"450\" y=\"26\" fill=\"#60a5fa\" font-size=\"16\" text-anchor=\"middle\" font-weight=\"bold\">SoC 内存映射地址表（32-bit 字节地址）<\/text>\n\n  <g font-size=\"12\">\n    <rect x=\"120\" y=\"50\" width=\"300\" height=\"34\" rx=\"4\" fill=\"#1a2e1a\" stroke=\"#22c55e\"/>\n    <text x=\"270\" y=\"72\" fill=\"#e5e7eb\" text-anchor=\"middle\">0x0000_0000 – 0x0000_0FFF 片上 RAM 4KB<\/text>\n\n    <rect x=\"120\" y=\"92\" width=\"300\" height=\"30\" rx=\"4\" fill=\"#3b1d4f\" stroke=\"#a855f7\"/>\n    <text x=\"270\" y=\"112\" fill=\"#e5e7eb\" text-anchor=\"middle\">0x2000_0000  UART_DATA<\/text>\n    <rect x=\"120\" y=\"126\" width=\"300\" height=\"30\" rx=\"4\" fill=\"#3b1d4f\" stroke=\"#a855f7\"/>\n    <text x=\"270\" y=\"146\" fill=\"#e5e7eb\" text-anchor=\"middle\">0x2000_0004  UART_STATUS<\/text>\n\n    <rect x=\"120\" y=\"160\" width=\"300\" height=\"30\" rx=\"4\" fill=\"#3b1d1d\" stroke=\"#fb923c\"/>\n    <text x=\"270\" y=\"180\" fill=\"#e5e7eb\" text-anchor=\"middle\">0x2000_0010  GPIO_DIR<\/text>\n    <rect x=\"120\" y=\"194\" width=\"300\" height=\"30\" rx=\"4\" fill=\"#3b1d1d\" stroke=\"#fb923c\"/>\n    <text x=\"270\" y=\"214\" fill=\"#e5e7eb\" text-anchor=\"middle\">0x2000_0014  GPIO_OUT<\/text>\n    <rect x=\"120\" y=\"228\" width=\"300\" height=\"30\" rx=\"4\" fill=\"#3b1d1d\" stroke=\"#fb923c\"/>\n    <text x=\"270\" y=\"248\" fill=\"#e5e7eb\" text-anchor=\"middle\">0x2000_0018  GPIO_IN<\/text>\n\n    <rect x=\"120\" y=\"262\" width=\"300\" height=\"30\" rx=\"4\" fill=\"#1a2e1a\" stroke=\"#22c55e\"/>\n    <text x=\"270\" y=\"282\" fill=\"#e5e7eb\" text-anchor=\"middle\">0x2000_0020  TIMER_CTRL<\/text>\n    <rect x=\"120\" y=\"296\" width=\"300\" height=\"30\" rx=\"4\" fill=\"#1a2e1a\" stroke=\"#22c55e\"/>\n    <text x=\"270\" y=\"316\" fill=\"#e5e7eb\" text-anchor=\"middle\">0x2000_0024  TIMER_CMP<\/text>\n    <rect x=\"120\" y=\"330\" width=\"300\" height=\"30\" rx=\"4\" fill=\"#1a2e1a\" stroke=\"#22c55e\"/>\n    <text x=\"270\" y=\"350\" fill=\"#e5e7eb\" text-anchor=\"middle\">0x2000_0028  TIMER_CNT / 0x2C CLR<\/text>\n\n    <rect x=\"460\" y=\"160\" width=\"300\" height=\"30\" rx=\"4\" fill=\"#1e3a5f\" stroke=\"#22d3ee\"/>\n    <text x=\"610\" y=\"180\" fill=\"#e5e7eb\" text-anchor=\"middle\">0x2000_0030  INTE（中断使能）<\/text>\n    <rect x=\"460\" y=\"194\" width=\"300\" height=\"30\" rx=\"4\" fill=\"#1e3a5f\" stroke=\"#22d3ee\"/>\n    <text x=\"610\" y=\"214\" fill=\"#e5e7eb\" text-anchor=\"middle\">0x2000_0034  INTF（中断标志 W1C）<\/text>\n  <\/g>\n\n  <text x=\"120\" y=\"395\" fill=\"#9ca3af\" font-size=\"12\">未用地址读出为 0；外设寄存器位宽 32，只取低 8/1 bit。<\/text>\n<\/svg>\n"}, {"file": "assets/phase5/ch4_irq_datapath.svg", "title": "中断与数据通路", "caption": "timer 匹配->INTF->CPU irq->ISR->jr x5 返回。", "svgRaw": "<svg xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"0 0 900 380\" font-family=\"Consolas,monospace\">\n  <rect width=\"900\" height=\"380\" fill=\"#0f1420\"/>\n  <text x=\"450\" y=\"26\" fill=\"#60a5fa\" font-size=\"16\" text-anchor=\"middle\" font-weight=\"bold\">中断与数据通路：timer 匹配 -> INTF -> CPU irq_i -> ISR<\/text>\n\n  <!-- Timer -->\n  <rect x=\"60\" y=\"120\" width=\"160\" height=\"70\" rx=\"8\" fill=\"#1a2e1a\" stroke=\"#22c55e\" stroke-width=\"2\"/>\n  <text x=\"140\" y=\"150\" fill=\"#e5e7eb\" font-size=\"13\" text-anchor=\"middle\">TIMER<\/text>\n  <text x=\"140\" y=\"170\" fill=\"#9ca3af\" font-size=\"11\" text-anchor=\"middle\">cnt==cmp 置 flag<\/text>\n\n  <!-- INTF -->\n  <rect x=\"290\" y=\"120\" width=\"160\" height=\"70\" rx=\"8\" fill=\"#1e3a5f\" stroke=\"#22d3ee\" stroke-width=\"2\"/>\n  <text x=\"370\" y=\"150\" fill=\"#e5e7eb\" font-size=\"13\" text-anchor=\"middle\">INTF 中断标志<\/text>\n  <text x=\"370\" y=\"170\" fill=\"#9ca3af\" font-size=\"11\" text-anchor=\"middle\">W1C 写 1 清零<\/text>\n\n  <!-- INTE gate -->\n  <rect x=\"520\" y=\"120\" width=\"160\" height=\"70\" rx=\"8\" fill=\"#3b1d4f\" stroke=\"#a855f7\" stroke-width=\"2\"/>\n  <text x=\"600\" y=\"150\" fill=\"#e5e7eb\" font-size=\"13\" text-anchor=\"middle\">INTE &amp; INTF<\/text>\n  <text x=\"600\" y=\"170\" fill=\"#9ca3af\" font-size=\"11\" text-anchor=\"middle\">= irq_to_core<\/text>\n\n  <!-- CPU -->\n  <rect x=\"740\" y=\"120\" width=\"130\" height=\"70\" rx=\"8\" fill=\"#1e3a5f\" stroke=\"#60a5fa\" stroke-width=\"2\"/>\n  <text x=\"805\" y=\"150\" fill=\"#e5e7eb\" font-size=\"13\" text-anchor=\"middle\">RV 核<\/text>\n  <text x=\"805\" y=\"170\" fill=\"#9ca3af\" font-size=\"11\" text-anchor=\"middle\">跳 0x100 ISR<\/text>\n\n  <!-- arrows -->\n  <line x1=\"220\" y1=\"155\" x2=\"290\" y2=\"155\" stroke=\"#22c55e\" stroke-width=\"2\"/>\n  <line x1=\"450\" y1=\"155\" x2=\"520\" y2=\"155\" stroke=\"#22d3ee\" stroke-width=\"2\"/>\n  <line x1=\"680\" y1=\"155\" x2=\"740\" y2=\"155\" stroke=\"#a855f7\" stroke-width=\"2\"/>\n\n  <!-- ISR return -->\n  <path d=\"M805 190 L805 260 L370 260 L370 190\" fill=\"none\" stroke=\"#fbbf24\" stroke-width=\"1.5\" stroke-dasharray=\"6,4\"/>\n  <text x=\"560\" y=\"252\" fill=\"#fbbf24\" font-size=\"11\">ISR 翻转 GPIO、清 INTF、jr x5 返回被打断处<\/text>\n\n  <text x=\"60\" y=\"320\" fill=\"#9ca3af\" font-size=\"12\">教学简化：无 Cause CSR/无栈切换；返回地址存 x5，ISR 末尾 `jalr x0,x5,0`。<\/text>\n  <text x=\"60\" y=\"345\" fill=\"#fbbf24\" font-size=\"12\">数据通路：CPU dmem_addr -> bus_mux 译码 -> 各外设；读数据经 m_rdata 返回 CPU。<\/text>\n<\/svg>\n"}, {"file": "assets/phase5/ch4_board_flow.svg", "title": "Vivado 上板流程", "caption": "建工程->约束->综合->实现->比特流下载（待用户完成）。", "svgRaw": "<svg xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"0 0 900 300\" font-family=\"Consolas,monospace\">\n  <rect width=\"900\" height=\"300\" fill=\"#0f1420\"/>\n  <text x=\"450\" y=\"26\" fill=\"#60a5fa\" font-size=\"16\" text-anchor=\"middle\" font-weight=\"bold\">Vivado 上板流程（待用户在 Vivado 完成）<\/text>\n\n  <g font-size=\"12\" text-anchor=\"middle\">\n    <rect x=\"40\" y=\"120\" width=\"130\" height=\"50\" rx=\"6\" fill=\"#1e3a5f\" stroke=\"#60a5fa\"/>\n    <text x=\"105\" y=\"150\" fill=\"#e5e7eb\">①建工程加源文件<\/text>\n\n    <rect x=\"200\" y=\"120\" width=\"130\" height=\"50\" rx=\"6\" fill=\"#1a2e1a\" stroke=\"#22c55e\"/>\n    <text x=\"265\" y=\"143\" fill=\"#e5e7eb\">②写约束.xdc<\/text>\n    <text x=\"265\" y=\"160\" fill=\"#9ca3af\" font-size=\"10\">clk/uart/gpio 引脚<\/text>\n\n    <rect x=\"360\" y=\"120\" width=\"130\" height=\"50\" rx=\"6\" fill=\"#3b1d4f\" stroke=\"#a855f7\"/>\n    <text x=\"425\" y=\"143\" fill=\"#e5e7eb\">③Synthesis<\/text>\n    <text x=\"425\" y=\"160\" fill=\"#9ca3af\" font-size=\"10\">看 Utilization 报告<\/text>\n\n    <rect x=\"520\" y=\"120\" width=\"130\" height=\"50\" rx=\"6\" fill=\"#3b1d1d\" stroke=\"#fb923c\"/>\n    <text x=\"585\" y=\"143\" fill=\"#e5e7eb\">④Implementation<\/text>\n    <text x=\"585\" y=\"160\" fill=\"#9ca3af\" font-size=\"10\">布局布线+时序<\/text>\n\n    <rect x=\"680\" y=\"120\" width=\"160\" height=\"50\" rx=\"6\" fill=\"#1e293b\" stroke=\"#fbbf24\"/>\n    <text x=\"760\" y=\"143\" fill=\"#e5e7eb\">⑤Generate Bitstream<\/text>\n    <text x=\"760\" y=\"160\" fill=\"#9ca3af\" font-size=\"10\">JTAG 下载上板<\/text>\n  <\/g>\n\n  <line x1=\"170\" y1=\"145\" x2=\"200\" y2=\"145\" stroke=\"#9ca3af\" stroke-width=\"1.5\"/>\n  <line x1=\"330\" y1=\"145\" x2=\"360\" y2=\"145\" stroke=\"#9ca3af\" stroke-width=\"1.5\"/>\n  <line x1=\"490\" y1=\"145\" x2=\"520\" y2=\"145\" stroke=\"#9ca3af\" stroke-width=\"1.5\"/>\n  <line x1=\"650\" y1=\"145\" x2=\"680\" y2=\"145\" stroke=\"#9ca3af\" stroke-width=\"1.5\"/>\n\n  <text x=\"450\" y=\"230\" fill=\"#fbbf24\" font-size=\"12\" text-anchor=\"middle\">真实综合/上板/跑 C/跑 OS 均需用户在 Vivado + 交叉工具链环境完成，本仓库仅提供结构校验与仿真自检。<\/text>\n<\/svg>\n"}], "tools": [{"name": "RT-Thread 官网（OS 进阶参考）", "url": "https://www.rt-thread.org/index.html", "required": false, "note": "开源 RTOS；本 SoC 当前跑裸机，OS 为进阶方向。访问于 2026-10。"}, {"name": "RT-Thread GitHub", "url": "https://github.com/RT-Thread/rt-thread", "required": false, "note": "RTOS 源码与移植 BSP。访问于 2026-10。"}, {"name": "NEORV32 开源类单片机 SoC", "url": "https://github.com/stnolting/neorv32", "required": false, "note": "自带 UART/GPIO/Timer/IRQ 的参考软核。访问于 2026-10。"}], "tasks": [{"id": "task-5-4-1", "text": "整合 CPU+串口+GPIO+定时器的完整 SoC（ch4_soc_top，地址映射+中断汇总）"}, {"id": "task-5-4-2", "text": "在自制 SoC 上运行简单裸机程序（OS 作为进阶方向，本仓库未声称已跑 OS）"}], "cards": [{"q": "自制 SoC 由哪些模块组成？", "a": "RV32I 核 + 片上 RAM(von Neumann) + 地址译码 + UART + GPIO + 定时器 + 中断汇总，全部内存映射。", "tags": ["SoC", "架构"]}, {"q": "什么是内存映射外设？", "a": "外设寄存器占据特定地址，CPU 用 LW/SW 指令读写这些地址就等于读写外设寄存器，无需专门 IO 指令。", "tags": ["内存映射", "总线"]}, {"q": "教学版中断是怎么工作的？", "a": "定时器 cnt==cmp 置 INTF[0]，若 INTE[0]=1 则 irq_to_core=1，CPU 跳 0x100 并把返回地址存 x5，ISR 末尾 jalr x0,x5,0 返回。", "tags": ["中断", "ISR"]}, {"q": "为什么说本 SoC 的中断是'教学简化'？", "a": "没有 Cause CSR、栈切换、特权级；只保存返回地址到 x5。要完整特权架构应替换为 5.1 完整核。", "tags": ["中断", "简化"]}, {"q": "片上 RAM 为什么用 von Neumann 结构？", "a": "取指与 LW/SW 共用同一块 RAM，简化设计；代价是指令口和数据口竞争同一存储器带宽。", "tags": ["RAM", "冯诺依曼"]}, {"q": "TIMER_CLR 寄存器的作用？", "a": "写任意值清除定时器中断标志 INTF[0]，避免 ISR 返回后立刻再次触发同一中断。", "tags": ["定时器", "中断"]}, {"q": "INTE 和 INTF 有什么区别？", "a": "INTE 是中断使能（屏蔽位），INTF 是中断标志（记录哪类中断挂起，W1C 写 1 清零）。", "tags": ["中断", "寄存器"]}, {"q": "本仓库是否声称已在板上跑起操作系统？", "a": "没有。当前跑的是裸机轮询+中断程序；跑 RTOS 是进阶方向，需完整特权指令与移植 BSP，本仓库如实说明未实现。", "tags": ["OS", "如实"]}, {"q": "ch4_firmware.hex 是怎么来的？", "a": "手工汇编 RV32I 指令生成（gen_fw.py），$readmemh 加载进 RAM；复位后打印 OK、配置 GPIO/定时器/中断。", "tags": ["固件", "机器码"]}, {"q": "Vivado 上板需要哪几步？", "a": "建工程加源文件->写 xdc 约束引脚->Synthesis->Implementation->Generate Bitstream->JTAG 下载。", "tags": ["Vivado", "上板"]}], "quiz": [{"q": "CPU 读写 UART/GPIO 寄存器靠的是？", "options": ["专门的 IN/OUT 指令", "LW/SW 读写内存映射地址", "直接拨开关", "JTAG 命令"], "answer": 1, "explain": "外设寄存器被映射到地址空间，CPU 用 load/store 指令访问即等于操作外设。"}, {"q": "定时器中断触发后，CPU 跳转到哪里？", "options": ["0x0000_0000", "0x0000_0100 (TRAP_VEC)", "0x2000_0000", "随机地址"], "answer": 1, "explain": "irq_to_core=1 时 CPU 下一拍取指跳到 TRAP_VEC=0x100，返回地址存 x5。"}, {"q": "关于本 SoC 运行 OS，正确的是？", "options": ["已经跑起 RT-Thread", "跑的是裸机轮询+中断，OS 是进阶方向", "不需要工具链就能跑 C", "OS 由硬件自动运行"], "answer": 1, "explain": "本仓库如实说明当前是裸机程序；跑 RTOS 需完整特权指令与移植 BSP，属后续工程。"}, {"q": "TIMER_CLR 的作用是？", "options": ["启动定时器", "清除中断标志避免重复触发", "设置周期", "读计数器"], "answer": 1, "explain": "写任意值清 INTF[0]，防止 ISR 返回后立刻再次进入同一中断。"}], "docHtml": "<h1>5.4 终极项目：自制 SoC 单片机<\/h1>\n<p>这是阶段 5 的收官之作——把前面所有零件攒成一颗<strong>自己设计的单片机<\/strong>：一颗 RV32I CPU + 片上 RAM + UART + GPIO + 定时器 + 中断控制器，全部用 Verilog 手写，跑裸机 C 程序。它就是一颗\"软核 MCU\"，和你用过的 STM32 在概念上是同一类东西。<\/p>\n<h2>5.4.1 顶层架构<\/h2>\n<p><code>ch4_soc_top.v<\/code> 把以下模块连起来（见 <code>ch4_soc_block.svg<\/code>）：<\/p>\n<table>\n<thead>\n<tr>\n<th>模块<\/th>\n<th>文件<\/th>\n<th>职责<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>RV32I 核<\/td>\n<td><code>ch4_rv_core.v<\/code><\/td>\n<td>取指/译码/执行/访存/写回，带简化 vectored 中断<\/td>\n<\/tr>\n<tr>\n<td>片上 RAM 4KB<\/td>\n<td>顶层内 <code>ram<\/code><\/td>\n<td>von Neumann，取指与 LW/SW 共用，<code>$readmemh<\/code> 加载固件<\/td>\n<\/tr>\n<tr>\n<td>地址译码<\/td>\n<td><code>ch4_bus_mux.v<\/code><\/td>\n<td>按地址片选外设、拼读数据<\/td>\n<\/tr>\n<tr>\n<td>UART<\/td>\n<td><code>ch4_uart.v<\/code><\/td>\n<td>可综合 tx/rx，1 起始+8 数据+1 停止<\/td>\n<\/tr>\n<tr>\n<td>GPIO<\/td>\n<td><code>ch4_gpio.v<\/code><\/td>\n<td>方向寄存器 + 数据寄存器，8 bit<\/td>\n<\/tr>\n<tr>\n<td>定时器<\/td>\n<td><code>ch4_timer.v<\/code><\/td>\n<td>自由计数，到 cmp 置中断标志<\/td>\n<\/tr>\n<tr>\n<td>中断汇总<\/td>\n<td>顶层内<\/td>\n<td><code>INTF &amp; INTE[0] -&gt; CPU irq_i<\/code><\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<h2>5.4.2 完整地址映射表<\/h2>\n<p>32-bit 字节地址（见 <code>ch4_addr_map.svg<\/code>）：<\/p>\n<table>\n<thead>\n<tr>\n<th>地址<\/th>\n<th>寄存器<\/th>\n<th>读写<\/th>\n<th>说明<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td><code>0x0000_0000–0x0000_0FFF<\/code><\/td>\n<td>片上 RAM<\/td>\n<td>R/W<\/td>\n<td>4KB，取指+数据共用<\/td>\n<\/tr>\n<tr>\n<td><code>0x2000_0000<\/code><\/td>\n<td>UART_DATA<\/td>\n<td>W/R<\/td>\n<td>写=发字节；读=最近收到字节<\/td>\n<\/tr>\n<tr>\n<td><code>0x2000_0004<\/code><\/td>\n<td>UART_STATUS<\/td>\n<td>R<\/td>\n<td>bit0=tx_ready, bit1=rx_avail<\/td>\n<\/tr>\n<tr>\n<td><code>0x2000_0010<\/code><\/td>\n<td>GPIO_DIR<\/td>\n<td>R/W<\/td>\n<td>bit=1 该脚为输出<\/td>\n<\/tr>\n<tr>\n<td><code>0x2000_0014<\/code><\/td>\n<td>GPIO_OUT<\/td>\n<td>R/W<\/td>\n<td>输出值<\/td>\n<\/tr>\n<tr>\n<td><code>0x2000_0018<\/code><\/td>\n<td>GPIO_IN<\/td>\n<td>R<\/td>\n<td>外部输入脚<\/td>\n<\/tr>\n<tr>\n<td><code>0x2000_0020<\/code><\/td>\n<td>TIMER_CTRL<\/td>\n<td>R/W<\/td>\n<td>bit0=timer 使能<\/td>\n<\/tr>\n<tr>\n<td><code>0x2000_0024<\/code><\/td>\n<td>TIMER_CMP<\/td>\n<td>R/W<\/td>\n<td>周期匹配值<\/td>\n<\/tr>\n<tr>\n<td><code>0x2000_0028<\/code><\/td>\n<td>TIMER_CNT<\/td>\n<td>R<\/td>\n<td>当前计数值<\/td>\n<\/tr>\n<tr>\n<td><code>0x2000_002C<\/code><\/td>\n<td>TIMER_CLR<\/td>\n<td>W<\/td>\n<td>写任意值清中断标志<\/td>\n<\/tr>\n<tr>\n<td><code>0x2000_0030<\/code><\/td>\n<td>INTE<\/td>\n<td>R/W<\/td>\n<td>bit0=定时器中断使能<\/td>\n<\/tr>\n<tr>\n<td><code>0x2000_0034<\/code><\/td>\n<td>INTF<\/td>\n<td>R/W1C<\/td>\n<td>bit0=定时器中断标志，写 1 清零<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<h2>5.4.3 中断与数据通路<\/h2>\n<p>教学版中断（见 <code>ch4_irq_datapath.svg<\/code>）：定时器 <code>cnt==cmp<\/code> 置 <code>INTF[0]<\/code>；若 <code>INTE[0]=1<\/code>，则 <code>irq_to_core=1<\/code>，CPU 下一拍取指跳到 <code>TRAP_VEC=0x100<\/code>，并把返回地址 <code>pc+4<\/code> 写入 <code>x5<\/code>。ISR 末尾 <code>jalr x0, x5, 0<\/code> 返回。<strong>这是教学简化<\/strong>——没有 Cause CSR、没有栈切换、没有特权级，只为讲清\"中断=跳转到 ISR 再回来\"。要做完整特权架构可替换为 5.1 的完整核。<\/p>\n<p>数据通路：CPU 出 <code>dmem_addr<\/code> → <code>ch4_bus_mux<\/code> 译码片选 → 各外设；被读外设数据经 <code>m_rdata<\/code> 返回 CPU。<\/p>\n<h2>5.4.4 裸机软件<\/h2>\n<ul>\n<li><code>startup_ch4.s<\/code>：复位入口设栈、清 <code>.bss<\/code>、调 <code>main()<\/code>；<code>0x100<\/code> 中断向量调 C 层 <code>isr_timer()<\/code>。<\/li>\n<li><code>ch4_link.ld<\/code>：RAM 起点 <code>0x00000000<\/code>、4KB、栈顶在 RAM 顶端。<\/li>\n<li><code>ch4_main.c<\/code>：配置 GPIO 为输出、串口打印、启动定时器并使能中断；主循环轮询 <code>GPIO_IN<\/code> 镜像到 <code>GPIO_OUT<\/code>，按键按下打印 <code>'B'<\/code>。<\/li>\n<li><code>ch4_firmware.hex<\/code>：手工汇编的教学镜像（由 <code>gen_fw.py<\/code> 生成），复位后打印 <code>\"OK\"<\/code>、配置 GPIO/定时器/中断、循环镜像 GPIO，ISR 在 <code>0x100<\/code> 翻转 LED 并清标志。<\/li>\n<\/ul>\n<h2>5.4.5 资源估算与上板步骤<\/h2>\n<p>资源估算方法（Vivado 综合后看 <code>Utilization<\/code> 报告，本仓库未综合）：\n- 教学 RV 核 + 寄存器堆 ≈ 数百 LUT/FF；\n- 4KB RAM 可映射为 BRAM（1 块 36Kb BRAM 足够）；\n- UART/GPIO/Timer 各约几十 LUT。<\/p>\n<p>上板步骤（见 <code>ch4_board_flow.svg<\/code>，待用户在 Vivado 完成）：\n1. 新建 Vivado 工程，加入 <code>code/phase5/ch4_*.v<\/code>；\n2. 写 <code>.xdc<\/code> 约束：<code>clk<\/code>、<code>tx_o<\/code>、<code>rx_i<\/code>、<code>gpio[7:0]<\/code> 引脚；\n3. 把 <code>ch4_firmware.hex<\/code> 加入工程（<code>$readmemh<\/code> 加载）；\n4. Synthesis → Implementation → Generate Bitstream → JTAG 下载；\n5. 串口终端观察 <code>\"OK\"<\/code>，LED 按定时器周期闪烁。<\/p>\n<h2>5.4.6 \"运行操作系统\"作为进阶方向<\/h2>\n<p>任务里写的\"在自制 SoC 上运行简单操作系统\"是<strong>进阶目标<\/strong>，本仓库如实说明：\n- 本 SoC 目前跑的是<strong>裸机轮询 + 中断<\/strong>程序，不是 OS；\n- 想跑协作式调度器，可在 <code>main()<\/code> 的 while 循环里加任务切换；\n- 想跑真正 RTOS（如开源 RT-Thread），需要完整 RV32I 特权指令、时钟节拍、内存保护与移植 BSP——这是后续工程，<strong>本仓库未实现、未声称已跑 OS<\/strong>。<\/p>\n<p>官方参考（访问于 2026-10）：\n- RT-Thread 官网：<a href=\"https://www.rt-thread.org/index.html\">https://www.rt-thread.org/index.html<\/a>\n- RT-Thread GitHub：<a href=\"https://github.com/RT-Thread/rt-thread\">https://github.com/RT-Thread/rt-thread<\/a>\n- 开源软核 NEORV32（类单片机 SoC，自带 UART/GPIO/Timer/IRQ）：<a href=\"https://github.com/stnolting/neorv32\">https://github.com/stnolting/neorv32<\/a><\/p>\n<blockquote>\n<p>如实声明：本 SoC 仅做行为仿真与结构校验；真实综合、上板、跑 C、跑 OS 均需用户在 Vivado + RISC-V 交叉工具链环境完成。<\/p>\n<\/blockquote>"}], "tools": [{"name": "AMD Vivado ML Edition 下载（2025.2）", "url": "https://www.xilinx.com/support/download.html", "required": true, "note": "免费 ML Standard 版即可，支持 Artix-7/Zynq。"}, {"name": "Vivado 授权说明（ML Standard 免 License）", "url": "https://www.amd.com/en/products/software/adaptive-socs-and-fpgas/licensing-faq.html", "required": true, "note": "2025.2 及更早 Standard 版无需 License。"}, {"name": "电缆/JTAG 驱动安装指南", "url": "https://digilent.com/reference/programmable-logic/guides/installing-vivado-and-vitis", "required": false, "note": "有开发板再装；纯仿真可略过。"}, {"name": "通用引脚约束模板 fpga_common.xdc", "url": "../code/common/fpga_common.xdc", "required": true, "note": "相对本仓库；按开发板替换 PACKAGE_PIN。"}, {"name": "板级适配方法（board-adaptation.md）", "url": "../docs/board-adaptation.md", "required": true, "note": "如何找正点原子/野火板的参考引脚。"}, {"name": "SSD1306 产品页（Solomon Systech 官方）", "url": "https://www.solomon-systech.com/product/ssd1306/", "required": true, "note": "访问日期 2026-10-10；官方 datasheet 需向厂方索取。"}, {"name": "SSD1306 datasheet PDF（Mouser 托管）", "url": "https://www.mouser.com/datasheet/2/813/SSD1306-2490209.pdf", "required": false, "note": "访问日期 2026-10-10；命令集与显存定义以此为准。"}, {"name": "Project F - VGA video timings", "url": "https://projectf.io/posts/video-timing
