ead=(%0d,%0d)&quot;, head_x, head_y);\n\n        $finish;\n    end\nendmodule\n"}, {"file": "code/phase4/ch5_render.v", "type": "verilog", "role": "synthesizable", "title": "ch5_render.v — 网格到像素配色（可综合）", "codeHtml": "//============================================================================\n// ch5_render.v — 游戏渲染：网格-&gt;像素配色（可综合）\n//   像素坐标换算网格格：gx = pixel_x / 32, gy = pixel_y / 32。\n//   把 gx/gy 输出给 snake_core 做组合查询 snake_hit，再叠加背景/网格/蛇/食物。\n//============================================================================\nmodule ch5_render(\n    input  wire       clk,\n    input  wire       rst_n,\n    input  wire       pxl_en,\n    input  wire [9:0] pixel_x,\n    input  wire [9:0] pixel_y,\n    input  wire       hsync_in,\n    input  wire       vsync_in,\n    input  wire       video_on,\n    input  wire [4:0] head_x,\n    input  wire [3:0] head_y,\n    input  wire [4:0] food_x,\n    input  wire [3:0] food_y,\n    input  wire       snake_hit,\n    input  wire       game_over,\n    output wire [4:0] gx,        // 回送给 snake_core.qx\n    output wire [3:0] gy,        // 回送给 snake_core.qy\n    output reg        hsync,\n    output reg        vsync,\n    output reg  [3:0] vga_r,\n    output reg  [3:0] vga_g,\n    output reg  [3:0] vga_b\n);\n    // 坐标换算：每格 32px\n    assign gx = pixel_x[9:5];\n    assign gy = pixel_y[8:5];\n\n    wire is_food  = (gx == food_x) &amp;&amp; (gy == food_y);\n    wire is_head  = (gx == head_x) &amp;&amp; (gy == head_y);\n    wire grid_line = (pixel_x[4] == 1&#x27;b0) || (pixel_y[4] == 1&#x27;b0);  // 每格左/上边界细线\n\n    always @(posedge clk or negedge rst_n) begin\n        if (!rst_n) begin\n            hsync  &lt;= 1&#x27;b1;\n            vsync  &lt;= 1&#x27;b1;\n            vga_r  &lt;= 4&#x27;h0;\n            vga_g  &lt;= 4&#x27;h0;\n            vga_b  &lt;= 4&#x27;h0;\n        end else if (pxl_en) begin\n            hsync &lt;= hsync_in;\n            vsync &lt;= vsync_in;\n            if (!video_on) begin\n                vga_r &lt;= 4&#x27;h0; vga_g &lt;= 4&#x27;h0; vga_b &lt;= 4&#x27;h0;\n            end else if (game_over) begin\n                vga_r &lt;= 4&#x27;h8; vga_g &lt;= 4&#x27;h1; vga_b &lt;= 4&#x27;h1;\n            end else if (is_food) begin\n                vga_r &lt;= 4&#x27;hF; vga_g &lt;= 4&#x27;h2; vga_b &lt;= 4&#x27;h2;   // 食物红\n            end else if (is_head) begin\n                vga_r &lt;= 4&#x27;hB; vga_g &lt;= 4&#x27;hF; vga_b &lt;= 4&#x27;h3;   // 蛇头亮黄绿\n            end else if (snake_hit) begin\n                vga_r &lt;= 4&#x27;h2; vga_g &lt;= 4&#x27;hC; vga_b &lt;= 4&#x27;h2;    // 蛇身绿\n            end else if (grid_line) begin\n                vga_r &lt;= 4&#x27;h1; vga_g &lt;= 4&#x27;h2; vga_b &lt;= 4&#x27;h3;    // 网格暗线\n            end else begin\n                vga_r &lt;= 4&#x27;h0; vga_g &lt;= 4&#x27;h0; vga_b &lt;= 4&#x27;h1;    // 背景深蓝黑\n            end\n        end\n    end\nendmodule\n"}, {"file": "code/phase4/tb_ch5_render.v", "type": "verilog", "role": "testbench", "title": "tb_ch5_render.v", "codeHtml": "// tb_ch5_render.v — 渲染自检：视频区/食物/蛇像素配色基本正确\n`timescale 1ns/1ps\nmodule tb_ch5_render;\n    reg clk = 0;\n    reg rst_n = 0;\n    reg pxl_en = 0;\n    reg [9:0] pixel_x = 0;\n    reg [9:0] pixel_y = 0;\n    reg hsync_in = 1;\n    reg vsync_in = 1;\n    reg video_on = 1;\n    reg [4:0] head_x = 5;\n    reg [3:0] head_y = 7;\n    reg [4:0] food_x = 7;\n    reg [3:0] food_y = 7;\n    reg snake_hit = 0;\n    reg game_over = 0;\n    wire [4:0] gx;\n    wire [3:0] gy;\n    wire hsync, vsync;\n    wire [3:0] vga_r, vga_g, vga_b;\n\n    ch5_render u_dut (\n        .clk(clk), .rst_n(rst_n), .pxl_en(pxl_en),\n        .pixel_x(pixel_x), .pixel_y(pixel_y),\n        .hsync_in(hsync_in), .vsync_in(vsync_in), .video_on(video_on),\n        .head_x(head_x), .head_y(head_y),\n        .food_x(food_x), .food_y(food_y),\n        .snake_hit(snake_hit), .game_over(game_over),\n        .gx(gx), .gy(gy), .hsync(hsync), .vsync(vsync),\n        .vga_r(vga_r), .vga_g(vga_g), .vga_b(vga_b)\n    );\n    always #10 clk = ~clk;\n\n    integer i;\n    initial begin\n        rst_n = 0; #55; rst_n = 1; #10;\n\n        // 像素 (7*32, 7*32) = (224,224) -&gt; 网格(7,7) = 食物\n        pixel_x = 10&#x27;d224; pixel_y = 10&#x27;d224; pxl_en = 1;\n        @(posedge clk); #5;\n        if (gx == 7 &amp;&amp; gy == 7)\n            $display(&quot;RENDER OK: gx/gy=(%0d,%0d) at pixel(224,224)&quot;, gx, gy);\n        else\n            $display(&quot;RENDER FAIL: gx/gy=(%0d,%0d)&quot;, gx, gy);\n        if (vga_r &gt;= 4&#x27;h8)\n            $display(&quot;RENDER OK: food pixel is reddish r=%0h&quot;, vga_r);\n        else\n            $display(&quot;RENDER NOTE: food pixel r=%0h&quot;, vga_r);\n\n        // 视频关闭应输出黑色\n        pxl_en = 0; video_on = 0;\n        @(posedge clk); pxl_en = 1; @(posedge clk); #5;\n        if (vga_r == 0 &amp;&amp; vga_g == 0 &amp;&amp; vga_b == 0)\n            $display(&quot;RENDER OK: blanking -&gt; black&quot;);\n        else\n            $display(&quot;RENDER NOTE: blanking rgb=%0h%0h%0h&quot;, vga_r, vga_g, vga_b);\n        $finish;\n    end\nendmodule\n"}, {"file": "code/phase4/ch5_snake_top.v", "type": "verilog", "role": "synthesizable", "title": "ch5_snake_top.v — 贪吃蛇顶层（可综合）", "codeHtml": "//============================================================================\n// ch5_snake_top.v — VGA 贪吃蛇顶层（可综合）\n//   vga_sync + snake_core + render 互连；含 25MHz 像素使能、帧节拍分频、\n//   按键同步/方向编码。引脚见 code/common/fpga_common.xdc（不编造引脚号）。\n//============================================================================\nmodule ch5_snake_top #(\n    parameter integer FRAME_DIV = 6_250_000   // 50MHz/8Hz ≈ 6.25M\n)(\n    input  wire      clk,\n    input  wire      rst_n,\n    input  wire [3:0] btn,        // {up,down,left,right}，高有效（板级需消抖）\n    output wire      hsync,\n    output wire      vsync,\n    output wire [3:0] vga_r,\n    output wire [3:0] vga_g,\n    output wire [3:0] vga_b\n);\n    wire       pxl_en;\n    wire [9:0] pixel_x;\n    wire [9:0] pixel_y;\n    wire       video_on;\n    wire       hsync_raw;\n    wire       vsync_raw;\n\n    ch5_vga_sync u_vga (\n        .clk(clk), .rst_n(rst_n),\n        .hsync(hsync_raw), .vsync(vsync_raw), .video_on(video_on),\n        .pixel_x(pixel_x), .pixel_y(pixel_y), .pxl_en(pxl_en)\n    );\n\n    // 帧节拍分频\n    reg [22:0] frame_cnt;\n    reg        frame_tick;\n    always @(posedge clk or negedge rst_n) begin\n        if (!rst_n) begin\n            frame_cnt  &lt;= 23&#x27;d0;\n            frame_tick &lt;= 1&#x27;b0;\n        end else if (frame_cnt == FRAME_DIV - 1) begin\n            frame_cnt  &lt;= 23&#x27;d0;\n            frame_tick &lt;= 1&#x27;b1;\n        end else begin\n            frame_cnt  &lt;= frame_cnt + 1&#x27;b1;\n            frame_tick &lt;= 1&#x27;b0;\n        end\n    end\n\n    // 按键两级同步 + 方向锁存（无键时保持上一次方向）\n    reg [3:0] btn_s1, btn_s2;\n    reg [1:0] dir_cmd;\n    localparam D_UP = 2&#x27;b00, D_DOWN = 2&#x27;b01, D_LEFT = 2&#x27;b10, D_RIGHT = 2&#x27;b11;\n    always @(posedge clk or negedge rst_n) begin\n        if (!rst_n) begin\n            btn_s1 &lt;= 4&#x27;b0000;\n            btn_s2 &lt;= 4&#x27;b0000;\n            dir_cmd &lt;= D_RIGHT;\n        end else begin\n            btn_s1 &lt;= btn;\n            btn_s2 &lt;= btn_s1;\n            if (btn_s2 != 4&#x27;b0000) begin\n                if      (btn_s2[0]) dir_cmd &lt;= D_RIGHT;\n                else if (btn_s2[1]) dir_cmd &lt;= D_LEFT;\n                else if (btn_s2[2]) dir_cmd &lt;= D_DOWN;\n                else if (btn_s2[3]) dir_cmd &lt;= D_UP;\n            end\n        end\n    end\n\n    wire [4:0] gx;\n    wire [3:0] gy;\n    wire [4:0] core_head_x;\n    wire [3:0] core_head_y;\n    wire [4:0] core_food_x;\n    wire [3:0] core_food_y;\n    wire       snake_hit;\n    wire       game_over;\n    wire [7:0] score;\n    wire       food_eaten;\n\n    ch5_snake_core u_core (\n        .clk(clk), .rst_n(rst_n),\n        .frame_tick(frame_tick), .dir_cmd(dir_cmd), .restart(1&#x27;b0),\n        .game_over(game_over), .score(score),\n        .food_x(core_food_x), .food_y(core_food_y),\n        .head_x(core_head_x), .head_y(core_head_y),\n        .qx(gx), .qy(gy), .snake_hit(snake_hit),\n        .food_eaten(food_eaten)\n    );\n\n    ch5_render u_render (\n        .clk(clk), .rst_n(rst_n), .pxl_en(pxl_en),\n        .pixel_x(pixel_x), .pixel_y(pixel_y),\n        .hsync_in(hsync_raw), .vsync_in(vsync_raw), .video_on(video_on),\n        .head_x(core_head_x), .head_y(core_head_y),\n        .food_x(core_food_x), .food_y(core_food_y),\n        .snake_hit(snake_hit), .game_over(game_over),\n        .gx(gx), .gy(gy),\n        .hsync(hsync), .vsync(vsync),\n        .vga_r(vga_r), .vga_g(vga_g), .vga_b(vga_b)\n    );\nendmodule\n"}, {"file": "code/phase4/tb_ch5_snake_top.v", "type": "verilog", "role": "testbench", "title": "tb_ch5_snake_top.v", "codeHtml": "// tb_ch5_snake_top.v — 顶层冒烟自检：缩短帧分频，检查行场同步与 RGB 输出活动\n`timescale 1ns/1ps\nmodule tb_ch5_snake_top;\n    reg clk = 0;\n    reg rst_n = 0;\n    reg [3:0] btn = 4&#x27;b0000;\n    wire hsync, vsync;\n    wire [3:0] vga_r, vga_g, vga_b;\n\n    // FRAME_DIV 调小到 50，便于仿真里看到多次游戏步进\n    ch5_snake_top #(.FRAME_DIV(50)) u_dut (\n        .clk(clk), .rst_n(rst_n), .btn(btn),\n        .hsync(hsync), .vsync(vsync),\n        .vga_r(vga_r), .vga_g(vga_g), .vga_b(vga_b)\n    );\n    always #10 clk = ~clk;\n\n    integer i;\n    integer h_toggle = 0;\n    integer rgb_active = 0;\n    reg last_h;\n    initial begin\n        rst_n = 0; #55; rst_n = 1; #20;\n        last_h = hsync;\n        for (i = 0; i &lt; 200000; i = i + 1) begin\n            @(posedge clk);\n            if (hsync !== last_h) h_toggle = h_toggle + 1;\n            last_h = hsync;\n            if (vga_r || vga_g || vga_b) rgb_active = rgb_active + 1;\n            // 中途按右键\n            if (i == 50000) btn = 4&#x27;b0001;\n        end\n        if (h_toggle &gt; 100)\n            $display(&quot;SNAKE_TOP OK: hsync toggles=%0d&quot;, h_toggle);\n        else\n            $display(&quot;SNAKE_TOP FAIL: hsync toggles=%0d&quot;, h_toggle);\n        if (rgb_active &gt; 0)\n            $display(&quot;SNAKE_TOP OK: rgb active pixels=%0d&quot;, rgb_active);\n        else\n            $display(&quot;SNAKE_TOP FAIL: no rgb activity&quot;);\n        $finish;\n    end\nendmodule\n"}], "diagrams": [{"file": "assets/phase4/ch5-game-block.svg", "title": "游戏系统框图", "caption": "vga_sync→snake_core→render→VGA，LFSR 供食物，按键经同步编码。", "svgRaw": "<svg xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"0 0 880 380\" font-family=\"Consolas,Menlo,monospace\">\n  <rect width=\"880\" height=\"380\" fill=\"#0d1420\"/>\n  <text x=\"20\" y=\"30\" fill=\"#4fc3f7\" font-size=\"18\" font-weight=\"bold\">VGA 贪吃蛇系统框图<\/text>\n\n  <rect x=\"40\" y=\"130\" width=\"150\" height=\"70\" rx=\"6\" fill=\"#16263c\" stroke=\"#4fc3f7\"/>\n  <text x=\"55\" y=\"160\" fill=\"#4fc3f7\" font-size=\"13\">ch5_vga_sync<\/text>\n  <text x=\"55\" y=\"180\" fill=\"#9fb3d1\" font-size=\"11\">640x480@60 行场同步<\/text>\n\n  <rect x=\"250\" y=\"130\" width=\"160\" height=\"70\" rx=\"6\" fill=\"#16263c\" stroke=\"#81c784\"/>\n  <text x=\"265\" y=\"155\" fill=\"#81c784\" font-size=\"13\">ch5_snake_core<\/text>\n  <text x=\"265\" y=\"173\" fill=\"#9fb3d1\" font-size=\"11\">移动/转向/碰撞/食物<\/text>\n  <text x=\"265\" y=\"188\" fill=\"#9fb3d1\" font-size=\"11\">计分状态机<\/text>\n\n  <rect x=\"470\" y=\"130\" width=\"150\" height=\"70\" rx=\"6\" fill=\"#16263c\" stroke=\"#e0a7f0\"/>\n  <text x=\"485\" y=\"160\" fill=\"#e0a7f0\" font-size=\"13\">ch5_render<\/text>\n  <text x=\"485\" y=\"180\" fill=\"#9fb3d1\" font-size=\"11\">网格->RGB 配色<\/text>\n\n  <rect x=\"660\" y=\"130\" width=\"160\" height=\"70\" rx=\"6\" fill=\"#16263c\" stroke=\"#ffb74d\"/>\n  <text x=\"675\" y=\"160\" fill=\"#ffb74d\" font-size=\"13\">VGA 输出<\/text>\n  <text x=\"675\" y=\"180\" fill=\"#9fb3d1\" font-size=\"11\">hsync/vsync/RGB[3:0]<\/text>\n\n  <line x1=\"190\" y1=\"165\" x2=\"250\" y2=\"165\" stroke=\"#9fb3d1\" marker-end=\"url(#c)\"/>\n  <text x=\"200\" y=\"158\" fill=\"#9fb3d1\" font-size=\"10\">pixel_x/y,video_on<\/text>\n  <line x1=\"410\" y1=\"165\" x2=\"470\" y2=\"165\" stroke=\"#9fb3d1\" marker-end=\"url(#c)\"/>\n  <text x=\"418\" y=\"158\" fill=\"#9fb3d1\" font-size=\"10\">snake_hit/head/food<\/text>\n  <line x1=\"620\" y1=\"165\" x2=\"660\" y2=\"165\" stroke=\"#9fb3d1\" marker-end=\"url(#c)\"/>\n\n  <!-- lfsr -->\n  <rect x=\"250\" y=\"250\" width=\"160\" height=\"50\" rx=\"6\" fill=\"#1a2030\" stroke=\"#ffb74d\"/>\n  <text x=\"270\" y=\"280\" fill=\"#ffb74d\" font-size=\"12\">ch5_lfsr 伪随机食物<\/text>\n  <line x1=\"330\" y1=\"250\" x2=\"330\" y2=\"200\" stroke=\"#ffb74d\" stroke-dasharray=\"4,3\" marker-end=\"url(#c)\"/>\n\n  <!-- 按键 -->\n  <text x=\"250\" y=\"115\" fill=\"#81c784\" font-size=\"11\">按键(消抖/编码) -> dir_cmd<\/text>\n  <defs><marker id=\"c\" markerWidth=\"8\" markerHeight=\"8\" refX=\"6\" refY=\"3\" orient=\"auto\">\n    <path d=\"M0,0 L6,3 L0,6 Z\" fill=\"#9fb3d1\"/><\/marker><\/defs>\n  <text x=\"20\" y=\"340\" fill=\"#7c8db0\" font-size=\"12\">像素使能 25MHz、游戏帧节拍约 8~10Hz；引脚见 code/common/fpga_common.xdc。<\/text>\n<\/svg>\n"}, {"file": "assets/phase4/ch5-grid-map.svg", "title": "网格到像素映射", "caption": "20x15 格、每格 32px；gx=pixel_x/32，gy=pixel_y/32。", "svgRaw": "<svg xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"0 0 880 400\" font-family=\"Consolas,Menlo,monospace\">\n  <rect width=\"880\" height=\"400\" fill=\"#0d1420\"/>\n  <text x=\"20\" y=\"30\" fill=\"#4fc3f7\" font-size=\"18\" font-weight=\"bold\">网格到像素映射（20x15 格，每格 32px）<\/text>\n\n  <!-- grid -->\n  <g stroke=\"#2a3a55\" stroke-width=\"1\">\n    <!-- 8x6 sample grid representing 20x15 -->\n    <rect x=\"60\" y=\"70\" width=\"480\" height=\"300\" fill=\"#101c2e\"/>\n  <\/g>\n  <!-- vertical lines every 60px (sample) -->\n  <g stroke=\"#2a3a55\">\n    <line x1=\"120\" y1=\"70\" x2=\"120\" y2=\"370\"/><line x1=\"180\" y1=\"70\" x2=\"180\" y2=\"370\"/>\n    <line x1=\"240\" y1=\"70\" x2=\"240\" y2=\"370\"/><line x1=\"300\" y1=\"70\" x2=\"300\" y2=\"370\"/>\n    <line x1=\"360\" y1=\"70\" x2=\"360\" y2=\"370\"/><line x1=\"420\" y1=\"70\" x2=\"420\" y2=\"370\"/>\n    <line x1=\"480\" y1=\"70\" x2=\"480\" y2=\"370\"/>\n    <line x1=\"60\" y1=\"130\" x2=\"540\" y2=\"130\"/><line x1=\"60\" y1=\"190\" x2=\"540\" y2=\"190\"/>\n    <line x1=\"60\" y1=\"250\" x2=\"540\" y2=\"250\"/><line x1=\"60\" y1=\"310\" x2=\"540\" y2=\"310\"/>\n  <\/g>\n  <!-- head cell -->\n  <rect x=\"180\" y=\"190\" width=\"60\" height=\"60\" fill=\"#2a7a2a\" stroke=\"#81c784\"/>\n  <text x=\"195\" y=\"225\" fill=\"#d7ffd7\" font-size=\"12\">蛇头(5,7)<\/text>\n  <!-- food cell -->\n  <rect x=\"300\" y=\"190\" width=\"60\" height=\"60\" fill=\"#7a1a1a\" stroke=\"#f06060\"/>\n  <text x=\"315\" y=\"225\" fill=\"#ffd7d7\" font-size=\"12\">食物(7,7)<\/text>\n\n  <text x=\"580\" y=\"90\" fill=\"#9fb3d1\" font-size=\"13\">坐标换算：<\/text>\n  <text x=\"580\" y=\"120\" fill=\"#4fc3f7\" font-size=\"13\">gx = pixel_x / 32<\/text>\n  <text x=\"580\" y=\"145\" fill=\"#4fc3f7\" font-size=\"13\">gy = pixel_y / 32<\/text>\n  <text x=\"580\" y=\"185\" fill=\"#9fb3d1\" font-size=\"12\">640/32 = 20 列<\/text>\n  <text x=\"580\" y=\"205\" fill=\"#9fb3d1\" font-size=\"12\">480/32 = 15 行<\/text>\n  <text x=\"580\" y=\"245\" fill=\"#e0a7f0\" font-size=\"12\">渲染逐像素问 core：<\/text>\n  <text x=\"580\" y=\"265\" fill=\"#e0a7f0\" font-size=\"12\">snake_hit(gx,gy)?<\/text>\n\n  <text x=\"20\" y=\"390\" fill=\"#7c8db0\" font-size=\"12\">图为示意缩放；真实坐标 0..19(x)、0..14(y)。<\/text>\n<\/svg>\n"}, {"file": "assets/phase4/ch5-fsm.svg", "title": "游戏控制状态机", "caption": "帧节拍驱动：移动→碰撞/吃食物判定→增长或结束。", "svgRaw": "<svg xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"0 0 880 360\" font-family=\"Consolas,Menlo,monospace\">\n  <rect width=\"880\" height=\"360\" fill=\"#0d1420\"/>\n  <text x=\"20\" y=\"30\" fill=\"#4fc3f7\" font-size=\"18\" font-weight=\"bold\">游戏控制状态机（frame_tick 驱动）<\/text>\n\n  <rect x=\"60\" y=\"140\" width=\"130\" height=\"60\" rx=\"30\" fill=\"#16263c\" stroke=\"#4fc3f7\"/>\n  <text x=\"90\" y=\"175\" fill=\"#4fc3f7\" font-size=\"13\">INIT 初始化<\/text>\n\n  <rect x=\"260\" y=\"140\" width=\"140\" height=\"60\" rx=\"6\" fill=\"#16263c\" stroke=\"#81c784\"/>\n  <text x=\"285\" y=\"165\" fill=\"#81c784\" font-size=\"13\">MOVE 移动<\/text>\n  <text x=\"285\" y=\"185\" fill=\"#9fb3d1\" font-size=\"11\">算新头/锁方向<\/text>\n\n  <polygon points=\"500,120 580,170 500,220 420,170\" fill=\"#16263c\" stroke=\"#ffb74d\"/>\n  <text x=\"465\" y=\"165\" fill=\"#ffb74d\" font-size=\"12\">撞墙/撞自身?<\/text>\n  <text x=\"470\" y=\"185\" fill=\"#9fb3d1\" font-size=\"11\">吃到食物?<\/text>\n\n  <rect x=\"640\" y=\"90\" width=\"150\" height=\"55\" rx=\"6\" fill=\"#2a1620\" stroke=\"#f06060\"/>\n  <text x=\"665\" y=\"123\" fill=\"#f06060\" font-size=\"13\">GAME_OVER<\/text>\n\n  <rect x=\"640\" y=\"200\" width=\"150\" height=\"55\" rx=\"6\" fill=\"#102a1a\" stroke=\"#81c784\"/>\n  <text x=\"665\" y=\"223\" fill=\"#81c784\" font-size=\"12\">GROW 增长+计分<\/text>\n  <text x=\"665\" y=\"242\" fill=\"#9fb3d1\" font-size=\"11\">重投食物<\/text>\n\n  <line x1=\"190\" y1=\"170\" x2=\"260\" y2=\"170\" stroke=\"#9fb3d1\" marker-end=\"url(#d)\"/>\n  <line x1=\"400\" y1=\"170\" x2=\"420\" y2=\"170\" stroke=\"#9fb3d1\" marker-end=\"url(#d)\"/>\n  <line x1=\"580\" y1=\"170\" x2=\"640\" y2=\"118\" stroke=\"#f06060\" marker-end=\"url(#d)\"/>\n  <text x=\"590\" y=\"140\" fill=\"#f06060\" font-size=\"11\">是<\/text>\n  <line x1=\"580\" y1=\"170\" x2=\"640\" y2=\"228\" stroke=\"#81c784\" marker-end=\"url(#d)\"/>\n  <text x=\"590\" y=\"200\" fill=\"#81c784\" font-size=\"11\">吃食物<\/text>\n  <!-- loop back to move -->\n  <path d=\"M 715 200 L 715 280 L 330 280 L 330 200\" fill=\"none\" stroke=\"#81c784\" stroke-dasharray=\"4,3\" marker-end=\"url(#d)\"/>\n  <text x=\"420\" y=\"295\" fill=\"#81c784\" font-size=\"11\">下一拍继续移动<\/text>\n\n  <defs><marker id=\"d\" markerWidth=\"8\" markerHeight=\"8\" refX=\"6\" refY=\"3\" orient=\"auto\">\n    <path d=\"M0,0 L6,3 L0,6 Z\" fill=\"#9fb3d1\"/><\/marker><\/defs>\n  <text x=\"20\" y=\"330\" fill=\"#7c8db0\" font-size=\"12\">方向锁：禁止 180° 反向；restart 回到 INIT。<\/text>\n<\/svg>\n"}, {"file": "assets/phase4/ch5-datapath.svg", "title": "核心数据通路", "caption": "蛇身数组后移、新头写入，nx/ny 与 bx/by 逐格比较。", "svgRaw": "<svg xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"0 0 880 360\" font-family=\"Consolas,Menlo,monospace\">\n  <rect width=\"880\" height=\"360\" fill=\"#0d1420\"/>\n  <text x=\"20\" y=\"30\" fill=\"#4fc3f7\" font-size=\"18\" font-weight=\"bold\">核心数据通路：蛇身数组与坐标比较<\/text>\n\n  <!-- body array -->\n  <text x=\"40\" y=\"80\" fill=\"#9fb3d1\" font-size=\"13\">bx[0..31] / by[0..31]（index0=头）<\/text>\n  <g font-size=\"12\" font-family=\"Consolas,monospace\">\n    <rect x=\"40\" y=\"95\" width=\"60\" height=\"34\" fill=\"#16263c\" stroke=\"#81c784\"/><text x=\"52\" y=\"117\" fill=\"#81c784\">[0]头<\/text>\n    <rect x=\"105\" y=\"95\" width=\"60\" height=\"34\" fill=\"#16263c\" stroke=\"#9fb3d1\"/><text x=\"118\" y=\"117\" fill=\"#9fb3d1\">[1]<\/text>\n    <rect x=\"170\" y=\"95\" width=\"60\" height=\"34\" fill=\"#16263c\" stroke=\"#9fb3d1\"/><text x=\"183\" y=\"117\" fill=\"#9fb3d1\">[2]<\/text>\n    <rect x=\"235\" y=\"95\" width=\"60\" height=\"34\" fill=\"#101826\" stroke=\"#3a4a63\"/><text x=\"248\" y=\"117\" fill=\"#7c8db0\">...<\/text>\n  <\/g>\n\n  <!-- shift on move -->\n  <text x=\"40\" y=\"160\" fill=\"#e0a7f0\" font-size=\"12\">移动：整体后移一格，新头写 [0]，尾部丢弃<\/text>\n  <text x=\"40\" y=\"180\" fill=\"#e0a7f0\" font-size=\"12\">吃食物：len+1（尾部保留）<\/text>\n\n  <!-- compare -->\n  <rect x=\"40\" y=\"210\" width=\"360\" height=\"110\" rx=\"6\" fill=\"#101c2e\" stroke=\"#ffb74d\"/>\n  <text x=\"55\" y=\"235\" fill=\"#ffb74d\" font-size=\"13\">碰撞/吃食物比较器<\/text>\n  <text x=\"55\" y=\"260\" fill=\"#9fb3d1\" font-size=\"12\">nx,ny  vs  bx[i],by[i]（i&lt;len）<\/text>\n  <text x=\"55\" y=\"282\" fill=\"#9fb3d1\" font-size=\"12\">越界(nx&gt;19/ny&gt;14) -> 撞墙<\/text>\n  <text x=\"55\" y=\"302\" fill=\"#9fb3d1\" font-size=\"12\">nx==food_x &amp;&amp; ny==food_y -> 吃<\/text>\n\n  <defs><marker id=\"e\" markerWidth=\"8\" markerHeight=\"8\" refX=\"6\" refY=\"3\" orient=\"auto\">\n    <path d=\"M0,0 L6,3 L0,6 Z\" fill=\"#9fb3d1\"/><\/marker><\/defs>\n  <path d=\"M 300 112 L 430 112 L 430 250 L 400 250\" fill=\"none\" stroke=\"#9fb3d1\" marker-end=\"url(#e)\"/>\n  <text x=\"430\" y=\"200\" fill=\"#7c8db0\" font-size=\"11\">逐格比较<\/text>\n<\/svg>\n"}], "tools": [{"name": "AMD/Xilinx Vivado 下载", "url": "https://www.xilinx.com/support/download.html", "required": true, "note": "ML Standard 免费版；访问日期 2026-10。"}, {"name": "VGA 640x480 时序参考（MIT 6.111）", "url": "https://web.mit.edu/6.111/www/s2004/NEWKIT/vga.shtml", "required": false, "note": "行 800/场 525、25.175MHz 像素时钟；访问日期 2026-10。"}, {"name": "通用引脚约束模板 fpga_common.xdc", "url": "../code/common/fpga_common.xdc", "required": true, "note": "相对本仓库；VGA RGB/同步与按键引脚按板卡替换。"}, {"name": "板级适配方法 board-adaptation.md", "url": "../docs/board-adaptation.md", "required": true, "note": "如何找板卡 VGA/按键参考引脚。"}], "tasks": [{"id": "task-4-5-1", "text": "实现游戏画面渲染与蛇身移动"}, {"id": "task-4-5-2", "text": "按键控制方向，食物生成与碰撞检测"}, {"id": "task-4-5-3", "text": "加分与游戏结束逻辑"}], "cards": [{"q": "640x480@60 的行/场总像素是多少？", "a": "行 800（640可见+16前肩+96同步+48后肩），场 525（480可见+10前肩+2同步+33后肩），像素时钟约 25.175MHz。", "tags": ["VGA", "时序"]}, {"q": "为什么用 25MHz 像素使能而不是真起一个 25MHz 时钟？", "a": "板载 50MHz，用时钟使能每两拍推一个像素点，避免多时钟域，时序约束更简单。", "tags": ["时钟", "使能"]}, {"q": "20x15 网格每格多少像素正好满 640x480？", "a": "每格 32px：20*32=640，15*32=480。", "tags": ["网格", "计算"]}, {"q": "渲染时怎么由像素坐标得到网格格号？", "a": "gx=pixel_x/32（取 pixel_x[9:5]），gy=pixel_y/32（取 pixel_y[8:5]）。", "tags": ["坐标", "换算"]}, {"q": "贪吃蛇为什么禁止 180° 反向？", "a": "蛇身连续，向右时直接按左会立刻撞到自己脖子；状态机只接受垂直转向或同向。", "tags": ["方向", "规则"]}, {"q": "蛇身移动时数组怎么更新？", "a": "整体后移一格（bx[i]=bx[i-1]），新头写入 index0；吃食物时长度+1 保留尾部。", "tags": ["蛇身", "数据通路"]}, {"q": "撞墙判定怎么做？", "a": "新头坐标 nx>19 或 ny>14（网格边界）即越界撞墙。", "tags": ["碰撞", "撞墙"]}, {"q": "LFSR 在游戏里干什么？", "a": "产生伪随机食物落点；8 位最长序列，上电固定种子避免全 0 死锁。", "tags": ["LFSR", "随机"]}, {"q": "游戏帧节拍为什么是 8~10Hz 而不是像素速率？", "a": "蛇要按可玩速度移动，约每秒 8~10 步；像素只负责渲染，二者分离。", "tags": ["帧节拍", "时序"]}, {"q": "snake_hit(qx,qy) 是组合还是时序输出？", "a": "组合：逐格比较 qx/qy 是否落在当前蛇身数组里，供渲染逐像素查询。", "tags": ["组合逻辑", "渲染"]}], "quiz": [{"q": "640x480@60 一行的总像素数是？", "options": ["640", "800", "525", "480"], "answer": 1, "explain": "640+16+96+48=800。"}, {"q": "每格 32px，20 列对应屏幕宽度？", "options": ["320px", "480px", "640px", "800px"], "answer": 2, "explain": "20*32=640。"}, {"q": "向右移动时按左方向键会怎样？", "options": ["立即反向", "被忽略（禁180°）", "加速", "结束游戏"], "answer": 1, "explain": "状态机禁止 180° 反向，按左无效。"}, {"q": "新头 nx=20（网格 0..19）属于？", "options": ["正常移动", "撞墙", "吃食物", "重生"], "answer": 1, "explain": "nx>19 越界即撞墙。"}], "docHtml": "<h1>4.5 综合项目 · VGA 贪吃蛇游戏<\/h1>\n<blockquote>\n<p>阶段 4 综合项目二：在 3.4 VGA 基础上做一个完整的交互式游戏。\n默认时钟 50MHz，640×480@60。本设计已通过结构校验与 testbench 自检；真实综合/时序/上板需在 Vivado 完成。<\/p>\n<\/blockquote>\n<h2>1. 系统架构<\/h2>\n<p><img alt=\"VGA 贪吃蛇系统框图\" src=\"assets/phase4/ch5-game-block.svg\" /><\/p>\n<table>\n<thead>\n<tr>\n<th>模块<\/th>\n<th>职责<\/th>\n<th>关键参数<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td><code>ch5_vga_sync<\/code><\/td>\n<td>产生行/场同步、像素坐标、显示区<\/td>\n<td>行 800(640+16+96+48)、场 525(480+10+2+33)、25MHz 像素使能<\/td>\n<\/tr>\n<tr>\n<td><code>ch5_lfsr<\/code><\/td>\n<td>伪随机数，用于食物落点<\/td>\n<td>8 位 LFSR，多项式 x^8+x^6+x^5+x^4+1<\/td>\n<\/tr>\n<tr>\n<td><code>ch5_snake_core<\/code><\/td>\n<td>蛇身存储、移动 FSM、转向/碰撞/吃食物/计分<\/td>\n<td>网格 20×15，最大长度 32<\/td>\n<\/tr>\n<tr>\n<td><code>ch5_render<\/code><\/td>\n<td>网格→像素配色（背景/网格/蛇/食物）<\/td>\n<td>每格 32px<\/td>\n<\/tr>\n<tr>\n<td><code>ch5_snake_top<\/code><\/td>\n<td>顶层互连 + 帧节拍分频 + 按键同步/方向编码<\/td>\n<td><code>FRAME_DIV<\/code>（默认约 8Hz）<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<h2>2. VGA 时序参数<\/h2>\n<p>640×480@60（VESA 标准，像素时钟 25.175MHz）：<\/p>\n<table>\n<thead>\n<tr>\n<th><\/th>\n<th>可见<\/th>\n<th>前肩<\/th>\n<th>同步<\/th>\n<th>后肩<\/th>\n<th>总计<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>行(像素)<\/td>\n<td>640<\/td>\n<td>16<\/td>\n<td>96<\/td>\n<td>48<\/td>\n<td><strong>800<\/strong><\/td>\n<\/tr>\n<tr>\n<td>场(行)<\/td>\n<td>480<\/td>\n<td>10<\/td>\n<td>2<\/td>\n<td>33<\/td>\n<td><strong>525<\/strong><\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<ul>\n<li>板载 50MHz，用<strong>时钟使能<\/strong>分频出 25MHz 像素点（每 2 个系统时钟推进一个像素），不另起时钟域，便于时序约束。<\/li>\n<li><code>hsync/vsync<\/code> 低电平有效；消隐期 <code>RGB=0<\/code>。<\/li>\n<\/ul>\n<h2>3. 网格与坐标换算<\/h2>\n<p><img alt=\"网格到像素映射\" src=\"assets/phase4/ch5-grid-map.svg\" /><\/p>\n<ul>\n<li>游戏网格 <strong>20 列 × 15 行<\/strong>，每格 32px：20×32=640，15×32=480，正好满屏。<\/li>\n<li>渲染时由像素坐标反算网格格：<\/li>\n<li><code>gx = pixel_x / 32<\/code>（取 <code>pixel_x[9:5]<\/code>）<\/li>\n<li><code>gy = pixel_y / 32<\/code>（取 <code>pixel_y[8:5]<\/code>）<\/li>\n<li>渲染模块把 <code>gx/gy<\/code> 回送给 <code>snake_core<\/code>，组合查询 <code>snake_hit(gx,gy)<\/code> 判断该像素是否蛇身。<\/li>\n<\/ul>\n<h2>4. 游戏状态机与数据通路<\/h2>\n<p><img alt=\"游戏控制状态机\" src=\"assets/phase4/ch5-fsm.svg\" /><\/p>\n<ul>\n<li><strong>帧节拍<\/strong>：游戏不跟像素走，而是约 8~10Hz 的 <code>frame_tick<\/code> 推进一步，速度人眼可玩。<\/li>\n<li><strong>方向控制<\/strong>：按键经两级同步后编码为 <code>dir_cmd<\/code>；状态机<strong>禁止 180° 反向<\/strong>（向右时按左无效）。<\/li>\n<li><strong>蛇身存储<\/strong>：<code>bx[0..31]/by[0..31]<\/code> 数组，index0 为头；移动时整体后移、新头写入 [0]。<\/li>\n<\/ul>\n<p><img alt=\"核心数据通路\" src=\"assets/phase4/ch5-datapath.svg\" /><\/p>\n<ul>\n<li><strong>碰撞检测<\/strong>：新头 <code>(nx,ny)<\/code> 越界（nx&gt;19 或 ny&gt;14）= 撞墙；命中身体某格 = 撞自身。<\/li>\n<li><strong>食物<\/strong>：<code>(nx,ny)==food<\/code> 则吃到 → <code>len+1<\/code>（尾部保留）、<code>score+1<\/code>、用 LFSR 重投食物。<\/li>\n<li><strong>结束/重启<\/strong>：撞墙或撞自身 → <code>game_over<\/code>；<code>restart<\/code> 回到初始蛇形。<\/li>\n<\/ul>\n<h2>5. 渲染配色（示例）<\/h2>\n<ul>\n<li>背景深蓝黑、网格暗线；<\/li>\n<li>蛇身绿、蛇头亮黄绿；<\/li>\n<li>食物红色；<\/li>\n<li><code>game_over<\/code> 时整屏压暗偏红。<\/li>\n<\/ul>\n<p>分数可用屏幕 OSD（简单字符 ROM）或外接数码管显示；本教学版把 <code>score<\/code> 引出，上板可接数码管。<\/p>\n<h2>6. 上板与资源注意事项<\/h2>\n<ul>\n<li><strong>引脚<\/strong>：不写死引脚号，按 <code>code/common/fpga_common.xdc<\/code> 第 6 段（VGA）与按键段替换 <code>PACKAGE_PIN<\/code>，参考 <code>docs/board-adaptation.md<\/code>。<\/li>\n<li><strong>像素时钟<\/strong>：25MHz 使能而非真时钟，避免多时钟域；若用 PLL 出 25MHz 需做时钟约束。<\/li>\n<li><strong>按键消抖<\/strong>：顶层做了两级同步与方向锁存；机械按键真实消抖建议加 ~20ms 计数消抖（本设计在 md 标注为上板增强项）。<\/li>\n<li><strong>LFSR 食物<\/strong>：教学版不严格避开蛇身，极端情况下食物可能落在蛇身上；上板可加落点合法性检查。<\/li>\n<li><strong>资源<\/strong>：蛇身数组 32×(5+4)bit + 比较器，LUT/FF 占用很小，Artix-7 任意型号可跑。<\/li>\n<\/ul>\n<h2>7. 实践任务<\/h2>\n<ul>\n<li><strong>task-4-5-1<\/strong>：实现游戏画面渲染与蛇身移动。<\/li>\n<li><strong>task-4-5-2<\/strong>：按键控制方向，食物生成与碰撞检测。<\/li>\n<li><strong>task-4-5-3<\/strong>：加分与游戏结束逻辑。<\/li>\n<\/ul>\n<h2>8. 验证说明<\/h2>\n<ul>\n<li><code>tb_ch5_vga_sync<\/code>：核对行总 800、场总 525，同步脉冲存在。<\/li>\n<li><code>tb_ch5_lfsr<\/code>：核对非零、每拍变化、不卡死。<\/li>\n<li><code>tb_ch5_snake_core<\/code>：直行、禁止反向、吃食物增长+计分、撞墙 game_over、重启、撞自身 game_over。<\/li>\n<li><code>tb_ch5_render<\/code>：核对网格坐标换算与食物像素配色。<\/li>\n<li><code>tb_ch5_snake_top<\/code>：缩短帧分频冒烟，核对行场同步翻转与 RGB 活动。<\/li>\n<\/ul>\n<blockquote>\n<p>注：当前环境无 Vivado/iverilog，以上为结构校验 + 自检代码；真实波形、VGA 显示与上板需在 Vivado 行为/时序仿真后完成。<\/p>\n<\/blockquote>"}, {"chapterId": "5.1", "phase": 5, "slug": "riscv-softcore", "title": "RISC-V 软核入门", "summary": "CPU 五级流水线与单周期数据通路、RV32I 六种指令格式与常用指令、最小 SoC（核+RAM+UART）结构与 C Hello World 工具链。", "doc": "docs/phase5/ch1-riscv-softcore.md", "code": [{"file": "code/phase5/ch1_riscv_regfile.v", "type": "verilog", "role": "synthesizable", "title": "ch1_riscv_regfile.v — 32×32 寄存器堆（x0 恒零）", "codeHtml": "// =============================================================================\n// ch1_riscv_regfile.v — 教学型 RV32I 32x32 寄存器堆\n//   * 32 个 32-bit 通用寄存器 x0..x31\n//   * x0 硬连线恒为 0（写 x0 丢弃，读 x0 恒 0）\n//   * 组合读（组合读出 ra/rs1），时钟沿同步写（rd）\n//   * 同步低电平复位（rst_n）\n// 说明：这是&quot;单周期 RISC-V&quot;教学数据通路的标准做法——读用组合逻辑，\n//       写用时钟沿，综合后对应分布式 RAM / 触发器堆。\n// =============================================================================\nmodule ch1_riscv_regfile #(\n    parameter WIDTH = 32              // 数据位宽（RV32I 固定 32）\n)(\n    input  wire               clk,\n    input  wire               rst_n,  // 同步低电平复位\n    // 读端口 1（rs1）\n    input  wire [4:0]         raddr1,\n    output wire [WIDTH-1:0]   rdata1,\n    // 读端口 2（rs2）\n    input  wire [4:0]         raddr2,\n    output wire [WIDTH-1:0]   rdata2,\n    // 写端口（rd）\n    input  wire               we,\n    input  wire [4:0]         waddr,\n    input  wire [WIDTH-1:0]   wdata\n);\n\n    // 32 个寄存器；x0 单独恒零，其余用数组\n    reg [WIDTH-1:0] rf [1:31];\n    integer i;\n\n    // ---- 组合读：x0 恒 0，其余按地址取 ----\n    assign rdata1 = (raddr1 == 5&#x27;d0) ? {WIDTH{1&#x27;b0}} : rf[raddr1];\n    assign rdata2 = (raddr2 == 5&#x27;d0) ? {WIDTH{1&#x27;b0}} : rf[raddr2];\n\n    // ---- 同步写 + 同步复位 ----\n    always @(posedge clk) begin\n        if (!rst_n) begin\n            for (i = 1; i &lt; 32; i = i + 1) rf[i] &lt;= {WIDTH{1&#x27;b0}};\n        end else if (we &amp;&amp; (waddr != 5&#x27;d0)) begin\n            rf[waddr] &lt;= wdata;   // 写 x0 自动丢弃\n        end\n    end\n\nendmodule\n"}, {"file": "code/phase5/ch1_riscv_alu.v", "type": "verilog", "role": "synthesizable", "title": "ch1_riscv_alu.v — 教学 ALU（ADD/SUB/AND/OR/XOR/SLT/SLTU）", "codeHtml": "// =============================================================================\n// ch1_riscv_alu.v — 教学型 RV32I ALU\n//   支持：ADD / SUB / AND / OR / XOR / SLT(有符号比较) / SLTU(无符号比较)\n//   全部组合逻辑输出，无时钟（纯组合运算单元）。\n//   alu_op 编码（localparam，大写）：\n//     4&#x27;d0 ADD, 4&#x27;d1 SUB, 4&#x27;d2 AND, 4&#x27;d3 OR,\n//     4&#x27;d4 XOR, 4&#x27;d5 SLT, 4&#x27;d6 SLTU\n// =============================================================================\nmodule ch1_riscv_alu #(\n    parameter WIDTH = 32\n)(\n    input  wire [WIDTH-1:0]  a,\n    input  wire [WIDTH-1:0]  b,\n    input  wire [3:0]        alu_op,\n    output reg  [WIDTH-1:0]  y,\n    output wire              zero      // 结果是否为 0（供 BEQ/BNE 使用）\n);\n\n    localparam ALU_ADD  = 4&#x27;d0;\n    localparam ALU_SUB  = 4&#x27;d1;\n    localparam ALU_AND  = 4&#x27;d2;\n    localparam ALU_OR   = 4&#x27;d3;\n    localparam ALU_XOR  = 4&#x27;d4;\n    localparam ALU_SLT  = 4&#x27;d5;\n    localparam ALU_SLTU = 4&#x27;d6;\n\n    wire signed [WIDTH-1:0] sa = a;\n    wire signed [WIDTH-1:0] sb = b;\n\n    always @(*) begin\n        case (alu_op)\n            ALU_ADD : y = a + b;\n            ALU_SUB : y = a - b;\n            ALU_AND : y = a &amp; b;\n            ALU_OR  : y = a | b;\n            ALU_XOR : y = a ^ b;\n            ALU_SLT : y = (sa &lt; sb) ? 32&#x27;d1 : 32&#x27;d0;   // 有符号比较\n            ALU_SLTU: y = (a &lt; b)   ? 32&#x27;d1 : 32&#x27;d0;  // 无符号比较\n            default : y = {WIDTH{1&#x27;b0}};\n        endcase\n    end\n\n    assign zero = (y == {WIDTH{1&#x27;b0}});\n\nendmodule\n"}, {"file": "code/phase5/ch1_riscv_core.v", "type": "verilog", "role": "synthesizable", "title": "ch1_riscv_core.v — 单周期 RV32I 核心", "codeHtml": "// =============================================================================\n// ch1_riscv_core.v — 教学型单周期 RV32I 处理器核心\n//   数据通路：PC -&gt; 取指 -&gt; 译码(立即数/寄存器) -&gt; 执行(ALU) -&gt; 访存 -&gt; 写回\n//   本核把五级流水线&quot;压平&quot;成一个时钟一拍完成（单周期），便于教学理解；\n//   上板可综合（组合取指/访存读 + 时钟沿写回）。\n//\n//   支持指令（RV32I 子集，教学够用）：\n//     LUI, AUIPC\n//     ADDI, ANDI, ORI, XORI, SLTI, SLTIU      （I 型立即数运算）\n//     ADD, SUB, AND, OR, XOR, SLT, SLTU       （R 型寄存器运算）\n//     LW                                       （加载字）\n//     SW                                       （存字）\n//     BEQ, BNE                                 （分支）\n//     JAL, JALR                                （跳转）\n//\n//   与存储器解耦：本核只暴露&quot;指令读口&quot;和&quot;数据读写口&quot;，由 SoC 拼接 RAM/外设。\n// =============================================================================\nmodule ch1_riscv_core #(\n    parameter WIDTH = 32,\n    parameter [WIDTH-1:0] RESET_VECTOR = 32&#x27;h0000_0000\n)(\n    input  wire               clk,\n    input  wire               rst_n,        // 同步低电平复位\n\n    // ---- 指令口（组合读：本拍给地址，本拍拿到指令）----\n    output wire [WIDTH-1:0]   imem_addr,\n    input  wire [WIDTH-1:0]   imem_rdata,\n\n    // ---- 数据口（组合读 / 时钟沿写）----\n    output wire [WIDTH-1:0]   dmem_addr,\n    output wire [WIDTH-1:0]   dmem_wdata,\n    output wire               dmem_we,\n    input  wire [WIDTH-1:0]   dmem_rdata,\n\n    // ---- 调试观察口 ----\n    output wire [WIDTH-1:0]   dbg_pc,\n    output wire [WIDTH-1:0]   dbg_instr\n);\n\n    // ---- 指令字段拆分 ----\n    wire [6:0]  opcode = imem_rdata[6:0];\n    wire [4:0]  rd     = imem_rdata[11:7];\n    wire [2:0]  funct3 = imem_rdata[14:12];\n    wire [4:0]  rs1    = imem_rdata[19:15];\n    wire [4:0]  rs2    = imem_rdata[24:20];\n    wire [6:0]  funct7 = imem_rdata[31:25];\n\n    // ---- 操作码（opcode[6:0]）----\n    localparam OP_LUI    = 7&#x27;b0110111;\n    localparam OP_AUIPC  = 7&#x27;b0010111;\n    localparam OP_JAL    = 7&#x27;b1101111;\n    localparam OP_JALR   = 7&#x27;b1100111;\n    localparam OP_BRANCH = 7&#x27;b1100011;\n    localparam OP_LOAD   = 7&#x27;b0000011;\n    localparam OP_STORE  = 7&#x27;b0100011;\n    localparam OP_OPIMM  = 7&#x27;b0010011;\n    localparam OP_OP     = 7&#x27;b0110011;\n\n    // ---- ALU 操作编码 ----\n    localparam ALU_ADD  = 4&#x27;d0;\n    localparam ALU_SUB  = 4&#x27;d1;\n    localparam ALU_AND   = 4&#x27;d2;\n    localparam ALU_OR    = 4&#x27;d3;\n    localparam ALU_XOR   = 4&#x27;d4;\n    localparam ALU_SLT   = 4&#x27;d5;\n    localparam ALU_SLTU  = 4&#x27;d6;\n\n    // ---- 立即数生成（按指令格式）----\n    wire [WIDTH-1:0] imm_i = {{20{imem_rdata[31]}}, imem_rdata[31:20]};\n    wire [WIDTH-1:0] imm_s = {{20{imem_rdata[31]}}, imem_rdata[31:25], imem_rdata[11:7]};\n    wire [WIDTH-1:0] imm_b = {{19{imem_rdata[31]}}, imem_rdata[31], imem_rdata[7],\n                               imem_rdata[30:25], imem_rdata[11:8], 1&#x27;b0};\n    wire [WIDTH-1:0] imm_u = {imem_rdata[31:12], 12&#x27;b0};\n    wire [WIDTH-1:0] imm_j = {{11{imem_rdata[31]}}, imem_rdata[31], imem_rdata[19:12],\n                               imem_rdata[20], imem_rdata[30:21], 1&#x27;b0};\n\n    // ---- PC 寄存器 ----\n    reg [WIDTH-1:0] pc;\n    assign imem_addr = pc;\n    assign dbg_pc    = pc;\n    assign dbg_instr = imem_rdata;\n\n    // ---- 寄存器堆例化 ----\n    wire [WIDTH-1:0] rs1_data, rs2_data;\n    wire             rf_we;\n    wire [WIDTH-1:0] rf_wdata;\n\n    ch1_riscv_regfile u_regfile (\n        .clk     (clk),\n        .rst_n   (rst_n),\n        .raddr1  (rs1),\n        .rdata1  (rs1_data),\n        .raddr2  (rs2),\n        .rdata2  (rs2_data),\n        .we      (rf_we),\n        .waddr   (rd),\n        .wdata   (rf_wdata)\n    );\n\n    // ---- ALU 例化 ----\n    reg  [3:0]        alu_op;\n    reg  [WIDTH-1:0]  alu_b;       // ALU 第二操作数：rs2 或立即数\n    wire [WIDTH-1:0]  alu_y;\n    wire              alu_zero;\n\n    ch1_riscv_alu u_alu (\n        .a    (rs1_data),\n        .b    (alu_b),\n        .alu_op (alu_op),\n        .y    (alu_y),\n        .zero (alu_zero)\n    );\n\n    // ---- 控制器：根据 opcode/funct3 选通数据通路 ----\n    reg  [WIDTH-1:0] next_pc;\n    reg             branch_taken;\n\n    // ALU 第二操作数：R 型用 rs2，其余（立即数/加载/存储）用立即数\n    always @(*) begin\n        if (opcode == OP_OP)\n            alu_b = rs2_data;\n        else\n            alu_b = imm_i;   // I 型运算 / LW / JALR 都用 imm_i\n    end\n\n    // ALU 操作选择\n    always @(*) begin\n        case (opcode)\n            OP_LUI, OP_AUIPC, OP_JAL, OP_JALR:\n                alu_op = ALU_ADD;                 // 仅做加法\n            OP_LOAD, OP_STORE:\n                alu_op = ALU_ADD;                 // 地址 = rs1 + imm\n            OP_OP: begin                          // R 型\n                case (funct3)\n                    3&#x27;b000: alu_op = (funct7[5]) ? ALU_SUB : ALU_ADD;\n                    3&#x27;b111: alu_op = ALU_AND;\n                    3&#x27;b110: alu_op = ALU_OR;\n                    3&#x27;b100: alu_op = ALU_XOR;\n                    3&#x27;b010: alu_op = ALU_SLT;\n                    3&#x27;b011: alu_op = ALU_SLTU;\n                    default: alu_op = ALU_ADD;\n                endcase\n            end\n            OP_OPIMM: begin                       // I 型立即数运算\n                case (funct3)\n                    3&#x27;b000: alu_op = ALU_ADD;     // ADDI\n                    3&#x27;b111: alu_op = ALU_AND;     // ANDI\n                    3&#x27;b110: alu_op = ALU_OR;      // ORI\n                    3&#x27;b100: alu_op = ALU_XOR;     // XORI\n                    3&#x27;b010: alu_op = ALU_SLT;     // SLTI\n                    3&#x27;b011: alu_op = ALU_SLTU;    // SLTIU\n                    default: alu_op = ALU_ADD;\n                endcase\n            end\n            default: alu_op = ALU_ADD;\n        endcase\n    end\n\n    // ---- 分支判定：BEQ/BNE ----\n    always @(*) begin\n        branch_taken = 1&#x27;b0;\n        if (opcode == OP_BRANCH) begin\n            case (funct3)\n                3&#x27;b000: branch_taken = (rs1_data == rs2_data);      // BEQ\n                3&#x27;b001: branch_taken = (rs1_data != rs2_data);      // BNE\n                default: branch_taken = 1&#x27;b0;\n            endcase\n        end\n    end\n\n    // ---- 下一条 PC ----\n    always @(*) begin\n        case (opcode)\n            OP_JAL:            next_pc = pc + imm_j;\n            OP_JALR:           next_pc = (rs1_data + imm_i) &amp; ~32&#x27;h1;\n            OP_BRANCH:         next_pc = branch_taken ? (pc + imm_b) : (pc + 4);\n            default:           next_pc = pc + 4;\n        endcase\n    end\n\n    // ---- 存储器写 ----\n    assign dmem_addr = alu_y;                 // LW/SW 有效地址\n    assign dmem_wdata = rs2_data;\n    assign dmem_we   = (opcode == OP_STORE);\n\n    // ---- 写回寄存器堆 ----\n    //   写回来源：LW-&gt;dmem_rdata；LUI-&gt;imm_u；AUIPC-&gt;pc+imm_u；\n    //             JAL/JALR-&gt;pc+4；其余-&gt;alu_y\n    reg [WIDTH-1:0] wb_data;\n    always @(*) begin\n        case (opcode)\n            OP_LOAD:   wb_data = dmem_rdata;\n            OP_LUI:    wb_data = imm_u;\n            OP_AUIPC:  wb_data = pc + imm_u;\n            OP_JAL,\n            OP_JALR:   wb_data = pc + 4;\n            default:   wb_data = alu_y;\n        endcase\n    end\n\n    // 除 STORE/BRANCH 外都写回 rd\n    assign rf_we   = (opcode != OP_STORE) &amp;&amp; (opcode != OP_BRANCH);\n    assign rf_wdata = wb_data;\n\n    // ---- PC 更新（同步复位 + 同步更新）----\n    always @(posedge clk) begin\n        if (!rst_n)\n            pc &lt;= RESET_VECTOR;\n        else\n            pc &lt;= next_pc;\n    end\n\nendmodule\n"}, {"file": "code/phase5/ch1_riscv_soc.v", "type": "verilog", "role": "synthesizable", "title": "ch1_riscv_soc.v — 最小 SoC（RAM+UART 寄存器）", "codeHtml": "// =============================================================================\n// ch1_riscv_soc.v — 教学型 RV32I 最小 SoC\n//   组成：CPU 核心 + 统一指令/数据 RAM（von Neumann）+ 内存映射 UART 输出寄存器\n//\n//   内存映射（32-bit 字节地址）：\n//     0x0000_0000 ~ 0x0000_0FFF : 片上统一 RAM（4KB = 1024 字）\n//                                  取指与 LW/SW 都走这里；上电 $readmemh 加载固件\n//     0x1000_0000               : UART 数据寄存器（写=发送一个字符；读=0）\n//                                  （本处仅做&quot;字符打印寄存器&quot;，完整 UART 发送器在 5.4 集成）\n//\n//   对外：clk / rst_n；UART 字符观察口 uart_tx_data / uart_tx_valid。\n//   上板时把 uart_tx_data/valid 接到阶段 3 写过的 UART 发送模块即可真正从串口出字符。\n// =============================================================================\nmodule ch1_riscv_soc #(\n    parameter RAM_WORDS = 1024,                      // 4KB\n    parameter [31:0] UART_BASE = 32&#x27;h1000_0000,\n    parameter [31:0] RESET_VECTOR = 32&#x27;h0000_0000\n)(\n    input  wire        clk,\n    input  wire        rst_n,\n\n    // 简化 UART 观察口（上板接真实 UART 发送器）\n    output wire [7:0]  uart_tx_data,\n    output wire       uart_tx_valid\n);\n\n    localparam AW = 12;   // 字节地址线 12bit -&gt; 4KB\n\n    // ---- CPU 与存储器之间的连线 ----\n    wire [31:0] imem_addr;\n    wire [31:0] imem_rdata;\n    wire [31:0] dmem_addr;\n    wire [31:0] dmem_wdata;\n    wire        dmem_we;\n    wire [31:0] dmem_rdata;\n\n    // ---- 片上统一 RAM（组合读 / 同步写）----\n    reg [31:0] ram [0:RAM_WORDS-1];\n\n    initial begin\n        // 上电加载固件（仿真 &amp; Vivado ROM 初始化均支持）\n        $readmemh(&quot;ch1_firmware.hex&quot;, ram);\n    end\n\n    // 取指：组合读\n    assign imem_rdata = ram[imem_addr[AW-1:2]];\n\n    // 数据口地址译码\n    wire ram_sel   = (dmem_addr[31:AW] == 10&#x27;h000);        // 0x0000_0xxx 区间\n    wire uart_sel  = (dmem_addr[31:0] == UART_BASE);\n\n    wire [31:0] ram_rdata = ram[dmem_addr[AW-1:2]];\n\n    // 同步写 RAM\n    always @(posedge clk) begin\n        if (dmem_we &amp;&amp; ram_sel)\n            ram[dmem_addr[AW-1:2]] &lt;= dmem_wdata;\n    end\n\n    // ---- UART 输出寄存器（写触发一拍 valid）----\n    reg [7:0] uart_data_r;\n    reg       uart_valid_r;\n\n    always @(posedge clk) begin\n        if (!rst_n) begin\n            uart_data_r  &lt;= 8&#x27;h00;\n            uart_valid_r &lt;= 1&#x27;b0;\n        end else if (dmem_we &amp;&amp; uart_sel) begin\n            uart_data_r  &lt;= dmem_wdata[7:0];   // 只取低 8 位作为字符\n            uart_valid_r &lt;= 1&#x27;b1;\n        end else begin\n            uart_valid_r &lt;= 1&#x27;b0;\n        end\n    end\n\n    assign uart_tx_data  = uart_data_r;\n    assign uart_tx_valid = uart_valid_r;\n\n    // ---- 数据读回译码：RAM 或 UART（UART 读返回 0）----\n    assign dmem_rdata = ram_sel ? ram_rdata : 32&#x27;h0000_0000;\n\n    // ---- CPU 核心例化 ----\n    ch1_riscv_core #(\n        .WIDTH(32),\n        .RESET_VECTOR(RESET_VECTOR)\n    ) u_core (\n        .clk        (clk),\n        .rst_n      (rst_n),\n        .imem_addr  (imem_addr),\n        .imem_rdata (imem_rdata),\n        .dmem_addr  (dmem_addr),\n        .dmem_wdata (dmem_wdata),\n        .dmem_we    (dmem_we),\n        .dmem_rdata (dmem_rdata),\n        .dbg_pc     (),\n        .dbg_instr  ()\n    );\n\nendmodule\n"}, {"file": "code/phase5/ch1_tb_riscv_soc.v", "type": "verilog", "role": "testbench", "title": "ch1_tb_riscv_soc.v — 求和+串口打印断言", "codeHtml": "// =============================================================================\n// ch1_tb_riscv_soc.v — RV32I 最小 SoC 测试平台\n//   做法：例化 ch1_riscv_soc，给 50MHz 时钟与同步复位；\n//         监视 UART 打印口，统计打印字符；运行足够周期后断言：\n//           1) RAM[0] == 0x0000_0037（1..10 求和 = 55）\n//           2) UART 恰好打印两个字符 &#x27;5&#x27;(0x35)\n//   机器码由 ch1_riscv_soc 内 $readmemh(&quot;ch1_firmware.hex&quot;) 加载。\n// =============================================================================\n`timescale 1ns/1ps\nmodule ch1_tb_riscv_soc;\n\n    reg         clk;\n    reg         rst_n;\n    wire [7:0]  uart_tx_data;\n    wire        uart_tx_valid;\n\n    // 例化 DUT\n    ch1_riscv_soc u_dut (\n        .clk          (clk),\n        .rst_n        (rst_n),\n        .uart_tx_data (uart_tx_data),\n        .uart_tx_valid(uart_tx_valid)\n    );\n\n    // 50MHz 时钟：周期 20ns\n    initial clk = 1&#x27;b0;\n    always #10 clk = ~clk;\n\n    // 统计 UART 打印\n    integer uart_count;\n    reg [7:0] uart_chars [0:3];\n    integer i;\n\n    initial begin\n        uart_count = 0;\n        for (i = 0; i &lt; 4; i = i + 1) uart_chars[i] = 8&#x27;h00;\n    end\n\n    always @(posedge clk) begin\n        if (uart_tx_valid &amp;&amp; rst_n) begin\n            if (uart_count &lt; 4) uart_chars[uart_count] = uart_tx_data;\n            uart_count = uart_count + 1;\n            $display(&quot;[UART] print char = 0x%02x (&#x27;%c&#x27;)&quot;, uart_tx_data, uart_tx_data);\n        end\n    end\n\n    // 主流程\n    reg [31:0] expected_sum;\n    initial begin\n        expected_sum = 32&#x27;h0000_0037;\n\n        // 复位\n        rst_n = 1&#x27;b0;\n        clk   = 1&#x27;b0;\n        #50;\n        rst_n = 1&#x27;b1;\n\n        // 跑足够多周期：循环约 10 次，每轮 4~5 拍 + 收尾\n        #2000;\n\n        // ---- 断言 ----\n        $display(&quot;---- TB CHECK ----&quot;);\n        $display(&quot;RAM[0] = 0x%08x (expect 0x00000037)&quot;, u_dut.ram[0]);\n        $display(&quot;UART chars = 0x%02x 0x%02x (expect 0x35 0x35), count=%0d&quot;,\n                 uart_chars[0], uart_chars[1], uart_count);\n\n        if (u_dut.ram[0] !== expected_sum)\n            $display(&quot;FAIL: RAM[0] sum mismatch&quot;);\n        else if (uart_count !== 2)\n            $display(&quot;FAIL: UART print count mismatch&quot;);\n        else if (uart_chars[0] !== 8&#x27;h35 || uart_chars[1] !== 8&#x27;h35)\n            $display(&quot;FAIL: UART char mismatch&quot;);\n        else\n            $display(&quot;PASS: RV32I core sum &amp; UART print OK&quot;);\n\n        $finish;\n    end\n\nendmodule\n"}, {"file": "code/phase5/ch1_firmware.hex", "type": "verilog", "role": "synthesizable", "title": "ch1_firmware.hex — 手工机器码（求 1..10 和）", "codeHtml": "// ch1_firmware.hex — 教学型 RV32I 固件（手工汇编，32-bit 字，$readmemh 加载）\n// 功能：x5 循环求和 1..10 -&gt; 应得 55(0x37)；把结果存到 RAM[0]；\n//       再通过内存映射 UART(0x10000000) 连续打印两个字符 &#x27;5&#x27;(0x35)。\n//\n//  字节地址  机器码       汇编\n//  0x000     0x00000293  addi  x5, x0, 0      ; sum = 0\n//  0x004     0x00000313  addi  x6, x0, 1      ; i = 1\n//  0x008     0x00B00E13  addi  x28, x0, 11    ; bound = 11\n//  0x00C     0x006282B3  add   x5, x5, x6     ; loop: sum += i\n//  0x010     0x00130313  addi  x6, x6, 1      ; i++\n//  0x014     0x01C32433  slt   x8, x6, x28    ; x8 = (i &lt; 11)\n//  0x018     0xFE0412E3  bne   x8, x0, -12    ; if (i&lt;11) goto loop\n//  0x01C     0x00502023  sw    x5, 0(x0)      ; RAM[0] = sum = 0x37\n//  0x020     0x100004B7  lui   x9, 0x10000    ; x9 = 0x1000_0000 (UART base)\n//  0x024     0x03500513  addi  x10, x0, 0x35  ; &#x27;5&#x27;\n//  0x028     0x00A4A023  sw    x10, 0(x9)    ; print &#x27;5&#x27;\n//  0x02C     0x00A4A023  sw    x10, 0(x9)    ; print &#x27;5&#x27;\n//  0x030     0x00000063  beq   x0, x0, 0      ; halt(原地跳转)\n0x00000293\n0x00000313\n0x00B00E13\n0x006282B3\n0x00130313\n0x01C32433\n0xFE0412E3\n0x00502023\n0x100004B7\n0x03500513\n0x00A4A023\n0x00A4A023\n0x00000063\n"}, {"file": "code/phase5/ch1_hello.c", "type": "verilog", "role": "synthesizable", "title": "ch1_hello.c — 裸机 Hello World", "codeHtml": "/*\n * ch1_hello.c — 在教学型 RV32I 软核上通过 UART 打印 &quot;Hello, RISC-V!\\n&quot;\n *\n * 硬件对应 ch1_riscv_soc.v：\n *   UART 数据寄存器 = 0x1000_0000，写一个字节即&quot;打印&quot;一个字符。\n *   （本最小系统里没有发送缓冲/状态寄存器，直接写即可；\n *     上板接真实 UART 发送器后，这里就是裸机 printf 的底层 putchar。）\n *\n * 构建命令（本机未安装工具链，仅给出命令与预期）：\n *   riscv-none-elf-gcc -march=rv32i -mabi=ilp32 -O2 \\\n *       -T ch1_link.ld -nostdlib -o ch1_hello.elf ch1_startup.S ch1_hello.c\n *   riscv-none-elf-objcopy -O verilog ch1_hello.elf ch1_firmware.hex\n *   # 或用 -O binary + 自己转 mem 十六进制\n */\n\n#define UART_BASE (*(volatile unsigned int *)0x10000000U)\n\n/* 裸机 putchar：直接往 UART 数据寄存器写一个字节 */\nstatic void putchar(char c)\n{\n    if (c == &#x27;\\n&#x27;)\n        UART_BASE = (unsigned int)&#x27;\\r&#x27;;   /* 串口习惯：换行前先回车 */\n    UART_BASE = (unsigned int)c;\n}\n\nstatic void puts(const char *s)\n{\n    while (*s)\n        putchar(*s++);\n}\n\nint main(void)\n{\n    const char *msg = &quot;Hello, RISC-V softcore!\\n&quot;;\n    puts(msg);\n\n    /* 再打印一个简单数字：1+2+...+10 = 55 = &#x27;7&#x27; 的偏移演示 */\n    volatile unsigned int sum = 0;\n    for (int i = 1; i &lt;= 10; i++)\n        sum += (unsigned int)i;\n    /* 55 -&gt; 字符 &#x27;7&#x27;(0x37) 的低字节演示 */\n    putchar((char)(&#x27;0&#x27; + (sum / 10)));   /* 打印 &#x27;5&#x27; */\n    putchar((char)(&#x27;0&#x27; + (sum % 10)));   /* 打印 &#x27;5&#x27; */\n    putchar(&#x27;\\n&#x27;);\n\n    while (1) { /* 死循环 */ }\n    return 0;\n}\n"}, {"file": "code/phase5/ch1_startup.S", "type": "verilog", "role": "synthesizable", "title": "ch1_startup.S — 最小启动汇编", "codeHtml": "/*\n * ch1_startup.S — RV32I 最小启动汇编\n *   1) 设栈指针 sp = 0x1000（RAM 4KB 末尾，与链接脚本一致）\n *   2) 清零 .bss\n *   3) 跳 C 入口 main()\n *   4) main 返回后原地死循环\n *\n * 注意：lui rd, imm 含义是 rd = (imm &lt;&lt; 12)；要得到 sp=0x1000，写 lui sp,1。\n */\n\n    .section .text.startup, &quot;ax&quot;\n    .globl _start\n_start:\n    /* sp = 0x1000（RAM 末尾）*/\n    lui   sp, 1                  /* sp = 1 &lt;&lt; 12 = 0x1000 */\n\n    /* 清零 .bss：__bss_start .. __bss_end */\n    la    t0, __bss_start\n    la    t1, __bss_end\n1:\n    bge   t0, t1, 2f\n    sw    zero, 0(t0)\n    addi  t0, t0, 4\n    j     1b\n2:\n    /* 调 main() */\n    call  main\n\n    /* main 返回后死循环 */\n3:\n    j     3b\n"}, {"file": "code/phase5/ch1_link.ld", "type": "verilog", "role": "synthesizable", "title": "ch1_link.ld — 链接脚本", "codeHtml": "/*\n * ch1_link.ld — RV32I 最小链接脚本（对应 ch1_riscv_soc.v 的内存映射）\n *   内存：0x0000_0000 起 4KB 统一 RAM（代码+数据+栈）\n *   UART 数据寄存器：0x1000_0000（写一个字节即打印一个字符）\n */\nENTRY(_start)\n\nMEMORY\n{\n    RAM (rwx) : ORIGIN = 0x00000000, LENGTH = 4K\n}\n\nSECTIONS\n{\n    .text : {\n        *(.text.startup)   /* _start 最先 */\n        *(.text)\n        *(.text.*)\n        . = ALIGN(4);\n    } &gt; RAM\n\n    .rodata : {\n        *(.rodata)\n        *(.rodata.*)\n        . = ALIGN(4);\n    } &gt; RAM\n\n    .data : {\n        *(.data)\n        *(.data.*)\n        . = ALIGN(4);\n    } &gt; RAM\n\n    .bss : {\n        __bss_start = .;\n        *(.bss)\n        *(.bss.*)\n        . = ALIGN(4);\n        __bss_end = .;\n    } &gt; RAM\n\n    /* 栈顶放在 RAM 末尾（4KB=0x1000）*/\n    __stack_top = ORIGIN(RAM) + LENGTH(RAM);\n}\n"}], "diagrams": [{"file": "assets/phase5/ch1_cpu_datapath.svg", "title": "单周期 RV32I 数据通路", "caption": "PC→取指→译码→ALU→访存→写回，含 PC+4/分支改写。", "svgRaw": "<svg xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"0 0 900 420\" font-family=\"Consolas,monospace\">\n  <rect width=\"900\" height=\"420\" fill=\"#0f1420\"/>\n  <text x=\"450\" y=\"28\" fill=\"#60a5fa\" font-size=\"16\" text-anchor=\"middle\" font-weight=\"bold\">单周期 RV32I 数据通路（取指→译码→执行→访存→写回）<\/text>\n\n  <!-- PC -->\n  <rect x=\"20\" y=\"60\" width=\"90\" height=\"44\" rx=\"6\" fill=\"#1e3a5f\" stroke=\"#60a5fa\" stroke-width=\"1.5\"/>\n  <text x=\"65\" y=\"87\" fill=\"#e5e7eb\" font-size=\"13\" text-anchor=\"middle\">PC<\/text>\n\n  <!-- IMEM -->\n  <rect x=\"150\" y=\"60\" width=\"110\" height=\"44\" rx=\"6\" fill=\"#1e3a5f\" stroke=\"#22d3ee\" stroke-width=\"1.5\"/>\n  <text x=\"205\" y=\"80\" fill=\"#e5e7eb\" font-size=\"12\" text-anchor=\"middle\">指令 RAM<\/text>\n  <text x=\"205\" y=\"96\" fill=\"#9ca3af\" font-size=\"10\" text-anchor=\"middle\">(组合读)<\/text>\n\n  <!-- 指令字段 -->\n  <rect x=\"300\" y=\"60\" width=\"150\" height=\"44\" rx=\"6\" fill=\"#1e293b\" stroke=\"#a855f7\" stroke-width=\"1.5\"/>\n  <text x=\"375\" y=\"80\" fill=\"#e5e7eb\" font-size=\"12\" text-anchor=\"middle\">译码/立即数生成<\/text>\n  <text x=\"375\" y=\"96\" fill=\"#9ca3af\" font-size=\"10\" text-anchor=\"middle\">opcode/rd/rs1/rs2/imm<\/text>\n\n  <!-- Regfile -->\n  <rect x=\"150\" y=\"170\" width=\"120\" height=\"50\" rx=\"6\" fill=\"#1e3a5f\" stroke=\"#fbbf24\" stroke-width=\"1.5\"/>\n  <text x=\"210\" y=\"192\" fill=\"#e5e7eb\" font-size=\"12\" text-anchor=\"middle\">寄存器堆<\/text>\n  <text x=\"210\" y=\"208\" fill=\"#9ca3af\" font-size=\"10\" text-anchor=\"middle\">32×32, x0=0<\/text>\n\n  <!-- ALU -->\n  <rect x=\"330\" y=\"170\" width=\"110\" height=\"50\" rx=\"6\" fill=\"#1e3a5f\" stroke=\"#22c55e\" stroke-width=\"1.5\"/>\n  <text x=\"385\" y=\"192\" fill=\"#e5e7eb\" font-size=\"12\" text-anchor=\"middle\">ALU<\/text>\n  <text x=\"385\" y=\"208\" fill=\"#9ca3af\" font-size=\"10\" text-anchor=\"middle\">ADD/SUB/CMP<\/text>\n\n  <!-- DataMem -->\n  <rect x=\"490\" y=\"170\" width=\"120\" height=\"50\" rx=\"6\" fill=\"#1e3a5f\" stroke=\"#fb923c\" stroke-width=\"1.5\"/>\n  <text x=\"550\" y=\"192\" fill=\"#e5e7eb\" font-size=\"12\" text-anchor=\"middle\">数据 RAM<\/text>\n  <text x=\"550\" y=\"208\" fill=\"#9ca3af\" font-size=\"10\" text-anchor=\"middle\">LW/SW<\/text>\n\n  <!-- 写回 mux -->\n  <rect x=\"660\" y=\"170\" width=\"120\" height=\"50\" rx=\"6\" fill=\"#3b1d4f\" stroke=\"#a855f7\" stroke-width=\"1.5\"/>\n  <text x=\"720\" y=\"192\" fill=\"#e5e7eb\" font-size=\"12\" text-anchor=\"middle\">写回选择<\/text>\n  <text x=\"720\" y=\"208\" fill=\"#9ca3af\" font-size=\"10\" text-anchor=\"middle\">ALU/MEM/PC+4/imm<\/text>\n\n  <!-- arrows -->\n  <line x1=\"110\" y1=\"82\" x2=\"150\" y2=\"82\" stroke=\"#60a5fa\" stroke-width=\"1.5\" marker-end=\"url(#ab)\"/>\n  <line x1=\"260\" y1=\"82\" x2=\"300\" y2=\"82\" stroke=\"#22d3ee\" stroke-width=\"1.5\" marker-end=\"url(#ab)\"/>\n  <line x1=\"375\" y1=\"104\" x2=\"250\" y2=\"170\" stroke=\"#a855f7\" stroke-width=\"1.5\" marker-end=\"url(#ab)\"/>\n  <line x1=\"270\" y1=\"195\" x2=\"330\" y2=\"195\" stroke=\"#fbbf24\" stroke-width=\"1.5\" marker-end=\"url(#ab)\"/>\n  <line x1=\"440\" y1=\"195\" x2=\"490\" y2=\"195\" stroke=\"#22c55e\" stroke-width=\"1.5\" marker-end=\"url(#ab)\"/>\n  <line x1=\"610\" y1=\"195\" x2=\"660\" y2=\"195\" stroke=\"#fb923c\" stroke-width=\"1.5\" marker-end=\"url(#ab)\"/>\n\n  <!-- 写回到 regfile -->\n  <path d=\"M720,220 L720,290 L210,290 L210,220\" fill=\"none\" stroke=\"#a855f7\" stroke-width=\"1.5\" marker-end=\"url(#ab)\"/>\n  <text x=\"430\" y=\"283\" fill=\"#a855f7\" font-size=\"11\" text-anchor=\"middle\">写回 rd<\/text>\n\n  <!-- PC +4 / branch -->\n  <path d=\"M65,104 L65,340 L800,340 L800,100 L110,82\" fill=\"none\" stroke=\"#60a5fa\" stroke-width=\"1.5\" stroke-dasharray=\"5,4\" marker-end=\"url(#ab)\"/>\n  <text x=\"430\" y=\"358\" fill=\"#60a5fa\" font-size=\"11\" text-anchor=\"middle\">PC+4 / 分支跳转改写 PC<\/text>\n\n  <defs>\n    <marker id=\"ab\" markerWidth=\"10\" markerHeight=\"10\" refX=\"8\" refY=\"3\" orient=\"auto\">\n      <path d=\"M0,0 L0,6 L9,3 z\" fill=\"#60a5fa\"/>\n    <\/marker>\n  <\/defs>\n<\/svg>\n"}, {"file": "assets/phase5/ch1_rv32i_formats.svg", "title": "RV32I 六种指令格式", "caption": "R/I/S/B/U/J 位段排布，opcode 恒在 bit[6:0]。", "svgRaw": "<svg xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"0 0 900 460\" font-family=\"Consolas,monospace\">\n  <rect width=\"900\" height=\"460\" fill=\"#0f1420\"/>\n  <text x=\"450\" y=\"26\" fill=\"#60a5fa\" font-size=\"16\" text-anchor=\"middle\" font-weight=\"bold\">RV32I 六种指令格式（bit 31 → bit 0）<\/text>\n\n  <!-- R -->\n  <text x=\"20\" y=\"60\" fill=\"#fbbf24\" font-size=\"13\" font-weight=\"bold\">R<\/text>\n  <g font-size=\"11\" text-anchor=\"middle\">\n    <rect x=\"70\" y=\"46\" width=\"140\" height=\"26\" fill=\"#1e3a5f\" stroke=\"#60a5fa\"/><text x=\"140\" y=\"63\" fill=\"#e5e7eb\">funct7<\ <rect x=\"670\" y=\"196\" width=\"90\" height=\"26\" fill=\"#1a2e1a\" stroke=\"#22c55e\"/><text x=\"715\" y=\"213\" fill=\"#e5e7eb\">opcode<\/text>\n  <\/g>\n\n  <!-- U -->\n  <text x=\"20\" y=\"260\" fill=\"#fbbf24\" font-size=\"13\" font-weight=\"bold\">U<\/text>\n  <g font-size=\"11\" text-anchor=\"middle\">\n    <rect x=\"70\" y=\"246\" width=\"420\" height=\"26\" fill=\"#1e3a5f\" stroke=\"#22d3ee\"/><text x=\"280\" y=\"263\" fill=\"#e5e7eb\">imm[31:12]<\/text>\n    <rect x=\"490\" y=\"246\" width=\"90\" height=\"26\" fill=\"#1e3a5f\" stroke=\"#60a5fa\"/><text x=\"535\" y=\"263\" fill=\"#e5e7eb\">rd<\/text>\n    <rect x=\"580\" y=\"246\" width=\"100\" height=\"26\" fill=\"#1a2e1a\" stroke=\"#22c55e\"/><text x=\"630\" y=\"263\" fill=\"#e5e7eb\">opcode<\/text>\n  <\/g>\n\n  <!-- J -->\n  <text x=\"20\" y=\"310\" fill=\"#fbbf24\" font-size=\"13\" font-weight=\"bold\">J<\/text>\n  <g font-size=\"11\" text-anchor=\"middle\">\n    <rect x=\"70\" y=\"296\" width=\"60\" height=\"26\" fill=\"#1e3a5f\" stroke=\"#22d3ee\"/><text x=\"100\" y=\"313\" fill=\"#e5e7eb\">imm[20]<\/text>\n    <rect x=\"130\" y=\"296\" width=\"120\" height=\"26\" fill=\"#1e3a5f\" stroke=\"#22d3ee\"/><text x=\"190\" y=\"313\" fill=\"#e5e7eb\">imm[10:1]<\/text>\n    <rect x=\"250\" y=\"296\" width=\"60\" height=\"26\" fill=\"#1e3a5f\" stroke=\"#22d3ee\"/><text x=\"280\" y=\"313\" fill=\"#e5e7eb\">imm[11]<\/text>\n    <rect x=\"310\" y=\"296\" width=\"120\" height=\"26\" fill=\"#1e3a5f\" stroke=\"#22d3ee\"/><text x=\"370\" y=\"313\" fill=\"#e5e7eb\">imm[19:12]<\/text>\n    <rect x=\"430\" y=\"296\" width=\"90\" height=\"26\" fill=\"#1e3a5f\" stroke=\"#60a5fa\"/><text x=\"475\" y=\"313\" fill=\"#e5e7eb\">rd<\/text>\n    <rect x=\"520\" y=\"296\" width=\"100\" height=\"26\" fill=\"#1a2e1a\" stroke=\"#22c55e\"/><text x=\"570\" y=\"313\" fill=\"#e5e7eb\">opcode<\/text>\n  <\/g>\n\n  <text x=\"20\" y=\"360\" fill=\"#9ca3af\" font-size=\"12\">图例：蓝=地址/寄存器号，紫=funct3，青=立即数，绿=opcode<\/text>\n  <text x=\"20\" y=\"382\" fill=\"#9ca3af\" font-size=\"12\">B/J 类立即数按位散布，便于硬件拼接；opcode 恒在 bit[6:0]。<\/text>\n<\/svg>\n"}, {"file": "assets/phase5/ch1_soc_block.svg", "title": "最小 SoC 结构", "caption": "CPU+统一 RAM+内存映射 UART 寄存器。", "svgRaw": "<svg xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"0 0 900 380\" font-family=\"Consolas,monospace\">\n  <rect width=\"900\" height=\"380\" fill=\"#0f1420\"/>\n  <text x=\"450\" y=\"26\" fill=\"#60a5fa\" font-size=\"16\" text-anchor=\"middle\" font-weight=\"bold\">RV32I 最小 SoC 结构<\/text>\n\n  <!-- CPU core -->\n  <rect x=\"330\" y=\"120\" width=\"240\" height=\"90\" rx=\"8\" fill=\"#1e3a5f\" stroke=\"#60a5fa\" stroke-width=\"2\"/>\n  <text x=\"450\" y=\"150\" fill=\"#e5e7eb\" font-size=\"14\" text-anchor=\"middle\">RV32I 核心<\/text>\n  <text x=\"450\" y=\"170\" fill=\"#9ca3af\" font-size=\"11\" text-anchor=\"middle\">PC / Regfile / ALU / 控制器<\/text>\n  <text x=\"450\" y=\"188\" fill=\"#9ca3af\" font-size=\"11\" text-anchor=\"middle\">ch1_riscv_core.v<\/text>\n\n  <!-- RAM -->\n  <rect x=\"80\" y=\"120\" width=\"180\" height=\"90\" rx=\"8\" fill=\"#1a2e1a\" stroke=\"#22c55e\" stroke-width=\"2\"/>\n  <text x=\"170\" y=\"150\" fill=\"#e5e7eb\" font-size=\"13\" text-anchor=\"middle\">统一 RAM 4KB<\/text>\n  <text x=\"170\" y=\"170\" fill=\"#9ca3af\" font-size=\"11\" text-anchor=\"middle\">0x0000_0000<\/text>\n  <text x=\"170\" y=\"188\" fill=\"#9ca3af\" font-size=\"11\" text-anchor=\"middle\">$readmemh 加载固件<\/text>\n\n  <!-- UART reg -->\n  <rect x=\"640\" y=\"120\" width=\"180\" height=\"90\" rx=\"8\" fill=\"#3b1d4f\" stroke=\"#a855f7\" stroke-width=\"2\"/>\n  <text x=\"730\" y=\"150\" fill=\"#e5e7eb\" font-size=\"13\" text-anchor=\"middle\">UART 数据寄存器<\/text>\n  <text x=\"730\" y=\"170\" fill=\"#9ca3af\" font-size=\"11\" text-anchor=\"middle\">0x1000_0000<\/text>\n  <text x=\"730\" y=\"188\" fill=\"#9ca3af\" font-size=\"11\" text-anchor=\"middle\">写字节=打印字符<\/text>\n\n  <!-- arrows CPU<->RAM -->\n  <line x1=\"260\" y1=\"165\" x2=\"330\" y2=\"165\" stroke=\"#22c55e\" stroke-width=\"2\" marker-end=\"url(#ab2)\"/>\n  <line x1=\"330\" y1=\"185\" x2=\"260\" y2=\"185\" stroke=\"#22c55e\" stroke-width=\"2\" marker-end=\"url(#ab2)\"/>\n  <!-- arrows CPU<->UART -->\n  <line x1=\"570\" y1=\"165\" x2=\"640\" y2=\"165\" stroke=\"#a855f7\" stroke-width=\"2\" marker-end=\"url(#ab2)\"/>\n  <line x1=\"640\" y1=\"185\" x2=\"570\" y2=\"185\" stroke=\"#a855f7\" stroke-width=\"2\" marker-end=\"url(#ab2)\"/>\n\n  <!-- clk/rst -->\n  <rect x=\"330\" y=\"40\" width=\"240\" height=\"40\" rx=\"6\" fill=\"#1e293b\" stroke=\"#fbbf24\" stroke-width=\"1.5\"/>\n  <text x=\"450\" y=\"65\" fill=\"#e5e7eb\" font-size=\"12\" text-anchor=\"middle\">clk (50MHz) / rst_n<\/text>\n  <line x1=\"450\" y1=\"80\" x2=\"450\" y2=\"120\" stroke=\"#fbbf24\" stroke-width=\"1.5\" marker-end=\"url(#ab2)\"/>\n\n  <!-- UART output -->\n  <rect x=\"640\" y=\"250\" width=\"180\" height=\"40\" rx=\"6\" fill=\"#1e293b\" stroke=\"#fb923c\" stroke-width=\"1.5\"/>\n  <text x=\"730\" y=\"275\" fill=\"#e5e7eb\" font-size=\"12\" text-anchor=\"middle\">uart_tx_data/valid → 串口<\/text>\n  <line x1=\"730\" y1=\"210\" x2=\"730\" y2=\"250\" stroke=\"#fb923c\" stroke-width=\"1.5\" marker-end=\"url(#ab2)\"/>\n\n  <text x=\"20\" y=\"340\" fill=\"#9ca3af\" font-size=\"12\">von Neumann：取指与 LW/SW 共用同一块 RAM；UART 为内存映射外设。<\/text>\n\n  <defs>\n    <marker id=\"ab2\" markerWidth=\"10\" markerHeight=\"10\" refX=\"8\" refY=\"3\" orient=\"auto\">\n      <path d=\"M0,0 L0,6 L9,3 z\" fill=\"#60a5fa\"/>\n    <\/marker>\n  <\/defs>\n<\/svg>\n"}], "tools": [{"name": "RISC-V 非特权指令集规范", "url": "https://docs.riscv.org/reference/isa/unpriv/unpriv-index.html", "required": true, "note": "访问于 2026-10；RV32I 官方定义。"}, {"name": "xPack RISC-V 嵌入式 GCC（安装文档）", "url": "https://xpack-dev-tools.github.io/riscv-none-elf-gcc-xpack/docs/install/", "required": true, "note": "交叉工具链预编译二进制；访问于 2026-10。"}, {"name": "xPack RISC-V GCC GitHub 发布页", "url": "https://github.com/xpack-dev-tools/riscv-none-elf-gcc-xpack", "required": false, "note": "访问于 2026-10。"}, {"name": "PicoRV32 开源软核", "url": "https://github.com/YosysHQ/picorv32", "required": false, "note": "极小 RV32I/E/M/C 核；访问于 2026-10。"}, {"name": "NEORV32 开源 SoC", "url": "https://github.com/stnolting/neorv32", "required": false, "note": "类单片机 RISC-V SoC；访问于 2026-10。"}], "tasks": [{"id": "task-5-1-1", "text": "搭建 RISC-V 软核最小系统"}, {"id": "task-5-1-2", "text": "编写 C 语言程序，通过串口打印 Hello World"}], "cards": [{"q": "CPU 五级流水线是哪五级？", "a": "取指 IF、译码 ID、执行 EX、访存 MEM、写回 WB。本教学核压平成单周期，一拍完成全部动作。", "tags": ["CPU", "流水线"]}, {"q": "RISC-V RV32I 有哪六种指令格式？", "a": "R（寄存器运算）、I（立即数/加载/JALR）、S（存储）、B（分支）、U（高位立即数 LUI/AUIPC）、J（JAL）。", "tags": ["RISC-V", "指令格式"]}, {"q": "RISC-V 的 x0 寄存器有什么特殊？", "a": "硬连线恒为 0：写它无效，读它恒返回 0。常用于生成零值和作为无关寄存器。", "tags": ["RISC-V", "寄存器"]}, {"q": "opcode 在指令的哪几位？", "a": "恒在 bit[6:0]，最低 7 位；硬件先看它决定指令大类。", "tags": ["RISC-V", "编码"]}, {"q": "LUI 和 AUIPC 分别做什么？", "a": "LUI 把 20-bit 立即数加载到 rd 的高 20 位；AUIPC 把该立即数加到 PC 上再写回 rd，用于 PC 相对寻址。", "tags": ["RISC-V", "U 型"]}, {"q": "单周期 CPU 写回数据来自哪里？", "a": "LW 取存储器读出值；LUI 取高位立即数；JAL/JALR 取 PC+4；其余取 ALU 结果。", "tags": ["CPU", "数据通路"]}, {"q": "本教学核最小 SoC 的内存映射是怎样的？", "a": "0x0000_0000 起 4KB 统一 RAM（取指与 LW/SW 共用）；0x1000_0000 是 UART 数据寄存器，写字节即打印。", "tags": ["SoC", "内存映射"]}, {"q": "没有工具链时怎么验证 CPU？", "a": "手工汇编机器码写成 .hex，用 $readmemh 加载，在 testbench 里跑并断言寄存器/内存结果与串口输出。", "tags": ["验证", "仿真"]}, {"q": "裸机 C 怎么打印字符？", "a": "把 UART 数据寄存器当 volatile 指针直接写：*(volatile uint32_t*)0x10000000 = c；再由底层 putchar 封装。", "tags": ["C", "UART"]}, {"q": "PicoRV32 与 NEORV32 是什么？", "a": "两个开源 RISC-V 软核：PicoRV32 极小（~千 LUT），NEORV32 是自带 UART/GPIO/定时器的类单片机 SoC。", "tags": ["开源核", "RISC-V"]}], "quiz": [{"q": "RISC-V RV32I 指令定长多少位？", "options": ["16 位", "32 位", "64 位", "可变长"], "answer": 1, "explain": "RV32I 基础整数指令集定长 32 位（C 扩展才压缩到 16 位）。"}, {"q": "x0 寄存器读出来恒等于？", "options": ["随机值", "0", "PC", "栈顶"], "answer": 1, "explain": "x0 硬连线恒零，写无效、读恒 0。"}, {"q": "下面哪个不是 RV32I 的六种指令格式之一？", "options": ["R", "I", "S", "X"], "answer": 3, "explain": "六种是 R/I/S/B/U/J，没有 X 型。"}, {"q": "LUI 指令把立即数写到 rd 的哪部分？", "options": ["低 12 位", "高 20 位", "整个 32 位", "符号扩展"], "answer": 1, "explain": "LUI 把 20-bit 立即数放到 rd[31:12]，低 12 位补 0。"}], "docHtml": "<h1>5.1 RISC-V 软核入门<\/h1>\n<p>到这里你已经会写状态机、会调 IP、会用 BRAM。下一步是把前面所有知识攒起来——<strong>亲手造一颗 CPU<\/strong>。本节我们不追求高性能，而是做一颗\"能跑 C 程序、能从串口打印\"的教学型 RISC-V 软核，把\"指令到底是怎么被执行的\"这件事彻底讲透。<\/p>\n<h2>5.1.1 CPU 到底在干什么<\/h2>\n<p>一颗通用 CPU 反复做同一件事——<strong>取一条指令、译码它、执行它、把结果写回去<\/strong>，然后 PC 指向下一条，周而复始。经典五级流水线把这件事拆成五拍：<\/p>\n<ol>\n<li><strong>取指 IF<\/strong>：PC 给出地址，从指令存储器读出 32-bit 指令；<\/li>\n<li><strong>译码 ID<\/strong>：把指令拆成 opcode / rd / rs1 / rs2 / 立即数，从寄存器堆读出操作数；<\/li>\n<li><strong>执行 EX<\/strong>：ALU 做加减/比较/算地址；<\/li>\n<li><strong>访存 MEM<\/strong>：需要时读/写数据存储器；<\/li>\n<li><strong>写回 WB<\/strong>：把结果写回寄存器堆。<\/li>\n<\/ol>\n<p>配套的核心部件：<\/p>\n<ul>\n<li><strong>PC（程序计数器）<\/strong>：存当前指令地址，每拍 +4（或被分支/跳转改写）；<\/li>\n<li><strong>寄存器堆（Regfile）<\/strong>：32 个 32-bit 通用寄存器 <code>x0..x31<\/code>，其中 <code>x0<\/code> 硬连线恒为 0（写它无效、读它为 0）；<\/li>\n<li><strong>ALU<\/strong>：做算术/逻辑/比较；<\/li>\n<li><strong>存储器总线<\/strong>：指令口 + 数据口（本教学核合并成一条 von Neumann 总线）。<\/li>\n<\/ul>\n<blockquote>\n<p>教学取舍：真实 CPU 是五级流水线、乱序执行；我们把它<strong>压平成单周期<\/strong>——一个时钟拍完成\"取指→译码→执行→访存→写回\"全部动作。这样你看一眼数据通路就知道每条指令在哪一拍被算出来，理解优先于性能。<\/p>\n<\/blockquote>\n<h2>5.1.2 RISC-V RV32I 与六种指令格式<\/h2>\n<p>RISC-V 的指令定长 32-bit（基础整数指令集 RV32I），低 7 位是 <code>opcode<\/code>。它只有<strong>六种指令格式<\/strong>，这正是 RISC-V \"精简\"的精髓——格式少，译码简单：<\/p>\n<table>\n<thead>\n<tr>\n<th>格式<\/th>\n<th>用途<\/th>\n<th>典型指令<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td><strong>R<\/strong><\/td>\n<td>寄存器-寄存器运算<\/td>\n<td><code>ADD/SUB/AND/OR/XOR/SLT/SLTU<\/code><\/td>\n<\/tr>\n<tr>\n<td><strong>I<\/strong><\/td>\n<td>立即数运算 / 加载 / 跳转寄存器<\/td>\n<td><code>ADDI/ANDI/ORI/XORI/SLTI/SLTIU<\/code>、<code>LW<\/code>、<code>JALR<\/code><\/td>\n<\/tr>\n<tr>\n<td><strong>S<\/strong><\/td>\n<td>存储<\/td>\n<td><code>SW<\/code><\/td>\n<\/tr>\n<tr>\n<td><strong>B<\/strong><\/td>\n<td>分支（条件跳转）<\/td>\n<td><code>BEQ/BNE<\/code><\/td>\n<\/tr>\n<tr>\n<td><strong>U<\/strong><\/td>\n<td>高位立即数<\/td>\n<td><code>LUI/AUIPC<\/code><\/td>\n<\/tr>\n<tr>\n<td><strong>J<\/strong><\/td>\n<td>无条件跳转<\/td>\n<td><code>JAL<\/code><\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<p>六种格式的位段排布见配套图 <code>ch1_rv32i_formats.svg<\/code>。本教学核实现的指令子集：<\/p>\n<ul>\n<li><strong>立即数运算<\/strong>：<code>ADDI / ANDI / ORI / XORI / SLTI / SLTIU<\/code><\/li>\n<li><strong>寄存器运算<\/strong>：<code>ADD / SUB / AND / OR / XOR / SLT / SLTU<\/code><\/li>\n<li><strong>访存<\/strong>：<code>LW / SW<\/code>（按字）<\/li>\n<li><strong>控制流<\/strong>：<code>BEQ / BNE / JAL / JALR<\/code><\/li>\n<li><strong>高位立即数<\/strong>：<code>LUI / AUIPC<\/code><\/li>\n<\/ul>\n<blockquote>\n<p>这套子集够写循环、累加、查表、串口打印。乘除、移位、原子指令等留到后续扩展。<\/p>\n<\/blockquote>\n<h2>5.1.3 数据通路与控制器怎么搭<\/h2>\n<p>本仓库代码 <code>code/phase5/ch1_riscv_*.v<\/code> 分成四块：<\/p>\n<ul>\n<li><code>ch1_riscv_regfile.v<\/code>：32×32 寄存器堆，组合读、时钟沿同步写，<code>x0<\/code> 恒零；<\/li>\n<li><code>ch1_riscv_alu.v<\/code>：组合 ALU，支持 ADD/SUB/AND/OR/XOR/SLT/SLTU，输出 <code>zero<\/code>；<\/li>\n<li><code>ch1_riscv_core.v<\/code>：单周期核心——PC 寄存器、立即数生成、控制器（按 opcode/funct3 选 ALU 操作数与写回来源）、下一条 PC 计算；<\/li>\n<li><code>ch1_riscv_soc.v<\/code>：把核心 + 4KB 统一 RAM + 内存映射 UART 寄存器拼成最小 SoC。<\/li>\n<\/ul>\n<p><strong>写回来源<\/strong>由控制器选择：<code>LW<\/code> 取数据存储器读出值；<code>LUI<\/code> 取高位立即数；<code>JAL/JALR<\/code> 取 <code>PC+4<\/code>；其余取 ALU 结果。<strong>下一条 PC<\/strong>：分支成立取 <code>PC+imm_b<\/code>，<code>JAL<\/code> 取 <code>PC+imm_j<\/code>，<code>JALR<\/code> 取 <code>(rs1+imm_i)&amp;~1<\/code>，否则 <code>PC+4<\/code>。数据通路框图见 <code>ch1_cpu_datapath.svg<\/code>。<\/p>\n<h2>5.1.4 最小 SoC 内存映射<\/h2>\n<p><code>ch1_riscv_soc.v<\/code> 的地址空间：<\/p>\n<table>\n<thead>\n<tr>\n<th>地址区间<\/th>\n<th>部件<\/th>\n<th>说明<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td><code>0x0000_0000 ~ 0x0000_0FFF<\/code><\/td>\n<td>片上统一 RAM（4KB）<\/td>\n<td>取指与 <code>LW/SW<\/code> 都走这里；上电 <code>$readmemh(\"ch1_firmware.hex\")<\/code> 加载固件<\/td>\n<\/tr>\n<tr>\n<td><code>0x1000_0000<\/code><\/td>\n<td>UART 数据寄存器<\/td>\n<td>写一个字节 = \"打印一个字符\"（本核只做字符打印寄存器，完整 UART 发送器在 5.4 集成）<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<p>SoC 框图见 <code>ch1_soc_block.svg<\/code>。<\/p>\n<h2>5.1.5 验证：机器码 + 断言<\/h2>\n<p><code>ch1_firmware.hex<\/code> 是手工汇编的一小段程序：用循环求 <code>1+2+...+10<\/code>，把结果 <code>0x37(=55)<\/code> 存到 <code>RAM[0]<\/code>，再通过 UART 寄存器打印两个字符 <code>'5'<\/code>。<code>ch1_tb_riscv_soc.v<\/code> 跑完后断言：<\/p>\n<ul>\n<li><code>RAM[0] == 0x0000_0037<\/code>；<\/li>\n<li>UART 恰好打印两个 <code>0x35('5')<\/code>。<\/li>\n<\/ul>\n<p>机器码与汇编一一对应（hex 文件内有注释）。这就是\"没有工具链时怎么验证 CPU\"的办法：手工编码 + 行为仿真断言。<\/p>\n<h2>5.1.6 跑 C 程序：Hello World<\/h2>\n<p>要跑真正的 C，需要 RISC-V 交叉工具链。推荐 <strong>xPack GNU RISC-V Embedded GCC<\/strong>（预编译二进制，免自己编译）：<\/p>\n<ul>\n<li>官方文档/下载：<a href=\"https://xpack-dev-tools.github.io/riscv-none-elf-gcc-xpack/docs/install/\">https://xpack-dev-tools.github.io/riscv-none-elf-gcc-xpack/docs/install/<\/a>（访问于 2026-10）<\/li>\n<li>GitHub 发布页：<a href=\"https://github.com/xpack-dev-tools/riscv-none-elf-gcc-xpack\">https://github.com/xpack-dev-tools/riscv-none-elf-gcc-xpack<\/a>（访问于 2026-10）<\/li>\n<\/ul>\n<p>最小 C 工程三件套（本仓库 <code>code/phase5/<\/code>）：<\/p>\n<ul>\n<li><code>ch1_link.ld<\/code>：链接脚本，RAM 起点 <code>0x00000000<\/code>、栈顶 <code>0x1000<\/code>；<\/li>\n<li><code>ch1_startup.S<\/code>：设栈、清 <code>.bss<\/code>、调 <code>main()<\/code>；<\/li>\n<li><code>ch1_hello.c<\/code>：裸机 <code>putchar<\/code> 直写 <code>0x1000_0000<\/code> UART 寄存器，打印 <code>Hello, RISC-V softcore!<\/code>。<\/li>\n<\/ul>\n<p>构建与转 mem 的命令（<strong>本环境未安装工具链，以下命令与预期已给出、未在本机构建<\/strong>）：<\/p>\n<pre><code class=\"language-bash\">riscv-none-elf-gcc -march=rv32i -mabi=ilp32 -O2 \\\n    -T ch1_link.ld -nostdlib -o ch1_hello.elf ch1_startup.S ch1_hello.c\nriscv-none-elf-objcopy -O verilog ch1_hello.elf ch1_firmware.hex\n# 再把 ch1_firmware.hex 放进工程，$readmemh 加载\n<\/code><\/pre>\n<blockquote>\n<p>说明：本教学核是 von Neumann 统一 RAM、无中断、无缓存；<code>printf<\/code> 这类库函数需要自己实现底层 <code>putchar<\/code>，我们直接用寄存器写。<\/p>\n<\/blockquote>\n<h2>5.1.7 上板流程与开源核参考<\/h2>\n<p>上板步骤：①把 <code>ch1_riscv_soc.v<\/code> 各文件加入 Vivado 工程；②写顶层把 <code>uart_tx_data/uart_tx_valid<\/code> 接到阶段 3 写过的 UART 发送模块；③加时钟约束与引脚约束；④综合、实现、生成比特流下载；⑤打开串口终端看 <code>Hello<\/code>。<\/p>\n<p>真实项目不必从零写核，可参考开源软核（理解后再裁剪）：<\/p>\n<ul>\n<li><strong>PicoRV32<\/strong>（Claire Wolf / YosysHQ）：极小 RV32I/E/M/C 核，~750–2000 LUT——<a href=\"https://github.com/YosysHQ/picorv32\">https://github.com/YosysHQ/picorv32<\/a>（访问于 2026-10）<\/li>\n<li><strong>NEORV32<\/strong>（Stephan Nolting）：类单片机 SoC，自带 UART/GPIO/定时器——<a href=\"https://github.com/stnolting/neorv32\">https://github.com/stnolting/neorv32<\/a>（数据手册 <a href=\"https://stnolting.github.io/neorv32/\">https://stnolting.github.io/neorv32/<\/a>，访问于 2026-10）<\/li>\n<li>RISC-V 非特权指令集官方规范：<a href=\"https://docs.riscv.org/reference/isa/unpriv/unpriv-index.html\">https://docs.riscv.org/reference/isa/unpriv/unpriv-index.html<\/a>（访问于 2026-10）<\/li>\n<\/ul>\n<blockquote>\n<p>如实声明：本教学核未在 Vivado 真正综合上板，也未用工具链真实构建/运行 C；上述上板与 C 构建命令为流程与预期，需在装有 Vivado + xPack 工具链的环境完成。<\/p>\n<\/blockquote>"}, {"chapterId": "5.2", "phase": 5, "slug": "axi-bus", "title": "AXI 总线与外设挂载", "summary": "AXI4/AXI4-Lite/AXI4-Stream 区别、五个独立通道与 VALID/READY 握手、内存映射地址译码、自定义 AXI4-Lite GPIO 从机与 Vivado IPI 挂载。", "doc": "docs/phase5/ch2-axi-bus.md", "code": [{"file": "code/phase5/ch2_axi_lite_gpio.v", "type": "verilog", "role": "synthesizable", "title": "ch2_axi_lite_gpio.v — AXI4-Lite GPIO 从机", "codeHtml": "// =============================================================================\n// ch2_axi_lite_gpio.v — 可综合 AXI4-Lite 从机：自定义 GPIO/LED 外设\n//\n//   寄存器映射（32-bit，基地址由 Vivado 地址编辑器分配）：\n//     偏移 0x00  GPIO_DATA   (R/W)  写 -&gt; 驱动 led_o；读 -&gt; 返回当前锁存值\n//     偏移 0x04  GPIO_INPUT  (R)    读 -&gt; 返回 sw_i（按键/拨码开关）\n//     偏移 0x08  VERSION     (R)    读 -&gt; 固定版本号 0x20261010\n//\n//   握手严格遵循 AXI4-Lite：\n//     * VALID 由驱动方拉高并保持，直到 READY 同时拉高（握手那拍被采样）；\n//     * READY 由本设计用寄存 FSM 产生，保证不违例；\n//     * AW/W 两通道可同时或先后到达，FSM 分别锁存地址与数据；\n//     * 写响应 B 通道返回 OKAY(2&#x27;b00)；读 R 通道返回数据与 OKAY。\n// =============================================================================\nmodule ch2_axi_lite_gpio #(\n    parameter C_AXI_ADDR_WIDTH = 32,\n    parameter [31:0] VERSION_VALUE = 32&#x27;h2026_1010\n)(\n    input  wire                       s_axi_aclk,\n    input  wire                       s_axi_aresetn,\n\n    // 写地址通道 AW\n    input  wire [C_AXI_ADDR_WIDTH-1:0] s_axi_awaddr,\n    input  wire                       s_axi_awvalid,\n    output reg                        s_axi_awready,\n\n    // 写数据通道 W\n    input  wire [31:0]                s_axi_wdata,\n    input  wire [3:0]                 s_axi_wstrb,\n    input  wire                       s_axi_wvalid,\n    output reg                        s_axi_wready,\n\n    // 写响应通道 B\n    output reg  [1:0]                 s_axi_bresp,\n    output reg                        s_axi_bvalid,\n    input  wire                       s_axi_bready,\n\n    // 读地址通道 AR\n    input  wire [C_AXI_ADDR_WIDTH-1:0] s_axi_araddr,\n    input  wire                       s_axi_arvalid,\n    output reg                        s_axi_arready,\n\n    // 读数据通道 R\n    output reg  [31:0]                s_axi_rdata,\n    output reg  [1:0]                 s_axi_rresp,\n    output reg                        s_axi_rvalid,\n    input  wire                       s_axi_rready,\n\n    // 外设 I/O\n    output reg  [3:0]                 led_o,\n    input  wire [3:0]                 sw_i\n);\n\n    // 寄存器偏移（按字地址 [3:2] 译码）\n    localparam ADDR_GPIO_DATA  = 2&#x27;b00;   // 0x00\n    localparam ADDR_GPIO_INPUT = 2&#x27;b01;   // 0x04\n    localparam ADDR_VERSION     = 2&#x27;b10;   // 0x08\n\n    reg [1:0]  wr_addr;\n    reg [31:0] wr_data;\n\n    // 写 FSM\n    localparam W_IDLE   = 2&#x27;d0;\n    localparam W_WAIT_W = 2&#x27;d1;   // 已锁 AW，等 W\n    localparam W_WAIT_A = 2&#x27;d2;   // 已锁 W，等 AW\n    localparam W_RESP   = 2&#x27;d3;   // 回写响应\n    reg [1:0] wstate;\n\n    // 读 FSM\n    localparam R_IDLE = 1&#x27;d0;\n    localparam R_WAIT = 1&#x27;d1;\n    reg       rstate;\n    reg [1:0] rd_addr;\n\n    // ---- 写 FSM（含寄存器写）----\n    always @(posedge s_axi_aclk) begin\n        if (!s_axi_aresetn) begin\n            wstate        &lt;= W_IDLE;\n            s_axi_awready &lt;= 1&#x27;b0;\n            s_axi_wready  &lt;= 1&#x27;b0;\n            s_axi_bvalid  &lt;= 1&#x27;b0;\n            s_axi_bresp   &lt;= 2&#x27;b00;\n            led_o         &lt;= 4&#x27;h0;\n        end else begin\n            case (wstate)\n                W_IDLE: begin\n                    s_axi_awready &lt;= 1&#x27;b1;\n                    s_axi_wready  &lt;= 1&#x27;b1;\n\n                    if (s_axi_awvalid &amp;&amp; s_axi_wvalid) begin\n                        // AW/W 同时到达：一拍完成写\n                        if (s_axi_awaddr[3:2] == ADDR_GPIO_DATA)\n                            led_o &lt;= s_axi_wdata[3:0];\n                        s_axi_awready &lt;= 1&#x27;b0;\n                        s_axi_wready  &lt;= 1&#x27;b0;\n                        s_axi_bvalid  &lt;= 1&#x27;b1;\n                        s_axi_bresp   &lt;= 2&#x27;b00;\n                        wstate        &lt;= W_RESP;\n                    end else if (s_axi_awvalid) begin\n                        wr_addr       &lt;= s_axi_awaddr[3:2];\n                        s_axi_awready &lt;= 1&#x27;b0;\n                        wstate        &lt;= W_WAIT_W;\n                    end else if (s_axi_wvalid) begin\n                        wr_data       &lt;= s_axi_wdata;\n                        s_axi_wready  &lt;= 1&#x27;b0;\n                        wstate        &lt;= W_WAIT_A;\n                    end\n                end\n\n                W_WAIT_W: begin\n                    s_axi_wready &lt;= 1&#x27;b1;\n                    if (s_axi_wvalid) begin\n                        if (wr_addr == ADDR_GPIO_DATA)\n                            led_o &lt;= s_axi_wdata[3:0];\n                        s_axi_wready &lt;= 1&#x27;b0;\n                        s_axi_bvalid &lt;= 1&#x27;b1;\n                        s_axi_bresp  &lt;= 2&#x27;b00;\n                        wstate       &lt;= W_RESP;\n                    end\n                end\n\n                W_WAIT_A: begin\n                    s_axi_awready &lt;= 1&#x27;b1;\n                    if (s_axi_awvalid) begin\n                        if (s_axi_awaddr[3:2] == ADDR_GPIO_DATA)\n                            led_o &lt;= wr_data[3:0];\n                        s_axi_awready &lt;= 1&#x27;b0;\n                        s_axi_bvalid  &lt;= 1&#x27;b1;\n                        s_axi_bresp   &lt;= 2&#x27;b00;\n                        wstate        &lt;= W_RESP;\n                    end\n                end\n\n                W_RESP: begin\n                    s_axi_bvalid &lt;= 1&#x27;b1;\n                    if (s_axi_bready) begin\n                        s_axi_bvalid &lt;= 1&#x27;b0;\n                        wstate       &lt;= W_IDLE;\n                    end\n                end\n\n                default: wstate &lt;= W_IDLE;\n            endcase\n        end\n    end\n\n    // ---- 读 FSM ----\n    always @(posedge s_axi_aclk) begin\n        if (!s_axi_aresetn) begin\n            rstate       &lt;= R_IDLE;\n            s_axi_arready &lt;= 1&#x27;b0;\n            s_axi_rvalid  &lt;= 1&#x27;b0;\n            s_axi_rresp   &lt;= 2&#x27;b00;\n            s_axi_rdata   &lt;= 32&#x27;h0;\n        end else begin\n            case (rstate)\n                R_IDLE: begin\n                    s_axi_arready &lt;= 1&#x27;b1;\n                    if (s_axi_arvalid) begin\n                        rd_addr       &lt;= s_axi_araddr[3:2];\n                        s_axi_arready  &lt;= 1&#x27;b0;\n                        s_axi_rvalid  &lt;= 1&#x27;b1;\n                        s_axi_rresp   &lt;= 2&#x27;b00;\n                        case (s_axi_araddr[3:2])\n                            ADDR_GPIO_DATA:  s_axi_rdata &lt;= {28&#x27;h0, led_o};\n                            ADDR_GPIO_INPUT: s_axi_rdata &lt;= {28&#x27;h0, sw_i};\n                            ADDR_VERSION:    s_axi_rdata &lt;= VERSION_VALUE;\n                            default:         s_axi_rdata &lt;= 32&#x27;hDEAD_BEEF;\n                        endcase\n                        rstate &lt;= R_WAIT;\n                    end\n                end\n\n                R_WAIT: begin\n                    if (s_axi_rready) begin\n                        s_axi_rvalid &lt;= 1&#x27;b0;\n                        rstate       &lt;= R_IDLE;\n                    end\n                end\n\n                default: rstate &lt;= R_IDLE;\n            endcase\n        end\n    end\n\nendmodule\n"}, {"file": "code/phase5/ch2_addr_decode.v", "type": "verilog", "role": "synthesizable", "title": "ch2_addr_decode.v — 地址译码示例", "codeHtml": "// =============================================================================\n// ch2_addr_decode.v — 内存映射地址译码示例（组合逻辑）\n//   把 32-bit 地址高位译码成各从机的片选，教学用。\n//   真实 Vivado 工程里由 AXI Interconnect (PG059) 自动完成，\n//   这里手写一份帮助理解&quot;基地址 + 地址范围&quot;是怎么切出来的。\n//\n//   示例映射：\n//     0x0000_0000 ~ 0x0FFF_FFFF : RAM\n//     0x4000_0000 ~ 0x4000_FFFF : AXI GPIO(本 ch2 外设)\n//     0x8000_0000 ~ 0x8000_FFFF : UART\n//     其它                       : 默认从机(返回错误)\n// =============================================================================\nmodule ch2_addr_decode #(\n    parameter [31:0] RAM_BASE   = 32&#x27;h0000_0000,\n    parameter [31:0] GPIO_BASE  = 32&#x27;h4000_0000,\n    parameter [31:0] UART_BASE   = 32&#x27;h8000_0000\n)(\n    input  wire [31:0] addr,\n    output reg         cs_ram,\n    output reg         cs_gpio,\n    output reg         cs_uart,\n    output reg         cs_error\n);\n\n    // 取高位做粗译码（每块 64KB，即高 26 位相同即选中）\n    wire [5:0] block = addr[31:26];\n\n    always @(*) begin\n        cs_ram   = 1&#x27;b0;\n        cs_gpio  = 1&#x27;b0;\n        cs_uart  = 1&#x27;b0;\n        cs_error = 1&#x27;b0;\n        case (block)\n            RAM_BASE[31:26]   : cs_ram   = 1&#x27;b1;\n            GPIO_BASE[31:26]  : cs_gpio  = 1&#x27;b1;\n            UART_BASE[31:26]  : cs_uart  = 1&#x27;b1;\n            default           : cs_error = 1&#x27;b1;\n        endcase\n    end\n\nendmodule\n"}, {"file": "code/phase5/ch2_tb_axi_gpio.v", "type": "verilog", "role": "testbench", "title": "ch2_tb_axi_gpio.v — AXI 读写与握手断言", "codeHtml": "// =============================================================================\n// ch2_tb_axi_gpio.v — AXI4-Lite GPIO 从机测试平台\n//   内置简易 AXI 主端序列（内联 while 等待，便于纯语法解析）：\n//     1) 写 GPIO_DATA -&gt; led_o 跟随；读回 GPIO_DATA 一致\n//     2) 读 GPIO_INPUT 跟随 sw_i\n//     3) 读 VERSION 返回固定值\n//     4) AW/W 先后到达（人为 stall awvalid）仍能正确完成写\n//     5) B/R 响应恒为 OKAY\n// =============================================================================\n`timescale 1ns/1ps\nmodule ch2_tb_axi_gpio;\n\n    reg         clk;\n    reg         rstn;\n\n    reg  [31:0] awaddr;  reg awvalid; wire awready;\n    reg  [31:0] wdata;   reg [3:0] wstrb; reg wvalid; wire wready;\n    wire [1:0]  bresp;   wire bvalid; reg bready;\n    reg  [31:0] araddr;  reg arvalid; wire arready;\n    wire [31:0] rdata;   wire [1:0] rresp; wire rvalid; reg rready;\n    wire [3:0]  led_o;\n    reg  [3:0]  sw_i;\n\n    ch2_axi_lite_gpio u_dut (\n        .s_axi_aclk(clk),\n        .s_axi_aresetn(rstn),\n        .s_axi_awaddr(awaddr), .s_axi_awvalid(awvalid), .s_axi_awready(awready),\n        .s_axi_wdata(wdata),   .s_axi_wstrb(wstrb),     .s_axi_wvalid(wvalid), .s_axi_wready(wready),\n        .s_axi_bresp(bresp),   .s_axi_bvalid(bvalid),   .s_axi_bready(bready),\n        .s_axi_araddr(araddr), .s_axi_arvalid(arvalid), .s_axi_arready(arready),\n        .s_axi_rdata(rdata),   .s_axi_rresp(rresp),     .s_axi_rvalid(rvalid), .s_axi_rready(rready),\n        .led_o(led_o), .sw_i(sw_i)\n    );\n\n    initial clk = 1&#x27;b0;\n    always #10 clk = ~clk;\n\n    reg [31:0] rd_val;\n    integer pass;\n    integer done;\n\n    initial begin\n        pass = 0;\n        done = 0;\n        rstn = 1&#x27;b0;\n
