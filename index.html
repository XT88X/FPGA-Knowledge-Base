= 1&#x27;b0;\n        rst_n = 1&#x27;b0;\n        key   = 1&#x27;b1;      // 默认松开\n        err   = 0;\n        prev  = 8&#x27;b0000_0001;\n\n        #25 rst_n = 1&#x27;b1;\n\n        // 跑 3 拍，应观察到 led 左移（1-&gt;2-&gt;4-&gt;8）\n        #600;\n        $display(&quot;[TB] after 3 steps left: led=%b&quot;, led);\n        if (led != 8&#x27;b0000_1000) begin\n            err = err + 1;\n            $display(&quot;[TB] FAIL: 左移 3 拍后 led=%b expect=0000_1000&quot;, led);\n        end\n\n        // 按下按键（保持几个时钟让两级同步采到下降沿）\n        key = 1&#x27;b0;\n        #60;\n        key = 1&#x27;b1;\n\n        // 再跑 3 拍，应向右移回（8-&gt;4-&gt;2-&gt;1）\n        #600;\n        $display(&quot;[TB] after key + 3 steps right: led=%b&quot;, led);\n        if (led != 8&#x27;b0000_0001) begin\n            err = err + 1;\n            $display(&quot;[TB] FAIL: 反向 3 拍后 led=%b expect=0000_0001&quot;, led);\n        end\n\n        if (err == 0) $display(&quot;[TB] PASS: 流水灯左右方向切换正确&quot;);\n        else          $display(&quot;[TB] FAIL: 共 %0d 处错误&quot;, err);\n\n        $finish;\n    end\n\nendmodule\n\n`default_nettype wire\n"}], "diagrams": [{"file": "assets/phase2/dff-structure.svg", "title": "D 触发器结构与时序", "caption": "每个 clk 上升沿把 D 锁存到 Q。", "svgRaw": "<svg xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"0 0 760 260\" font-family=\"system-ui,sans-serif\" font-size=\"12\">\n  <rect x=\"0\" y=\"0\" width=\"760\" height=\"260\" fill=\"#0d1420\"/>\n  <text x=\"380\" y=\"22\" fill=\"#7dd3fc\" text-anchor=\"middle\" font-size=\"15\" font-weight=\"bold\">D 触发器结构：时钟沿把 D 锁存到 Q<\/text>\n\n  <!-- DFF block -->\n  <rect x=\"280\" y=\"70\" width=\"160\" height=\"110\" rx=\"6\" fill=\"#16233a\" stroke=\"#38bdf8\" stroke-width=\"2\"/>\n  <text x=\"360\" y=\"125\" fill=\"#e2e8f0\" text-anchor=\"middle\" font-size=\"14\" font-weight=\"bold\">DFF<\/text>\n  <text x=\"360\" y=\"145\" fill=\"#94a3b8\" text-anchor=\"middle\" font-size=\"11\">always @(posedge clk)<\/text>\n\n  <text x=\"240\" y=\"100\" fill=\"#22d3ee\" text-anchor=\"end\">D<\/text>\n  <line x1=\"245\" y1=\"96\" x2=\"280\" y2=\"96\" stroke=\"#22d3ee\" stroke-width=\"2\"/>\n  <text x=\"240\" y=\"150\" fill=\"#f59e0b\" text-anchor=\"end\">clk<\/text>\n  <line x1=\"245\" y1=\"146\" x2=\"280\" y2=\"146\" stroke=\"#f59e0b\" stroke-width=\"2\"/>\n  <text x=\"450\" y=\"100\" fill=\"#34d399\">Q<\/text>\n  <line x1=\"440\" y1=\"96\" x2=\"480\" y2=\"96\" stroke=\"#34d399\" stroke-width=\"2\"/>\n  <text x=\"488\" y=\"100\" fill=\"#6ee7b7\">&lt;= D （仅上升沿）<\/text>\n\n  <!-- timing -->\n  <text x=\"30\" y=\"210\" fill=\"#94a3b8\">clk<\/text>\n  <polyline points=\"70,214 150,214 150,194 230,194 230,214 310,214 310,194 390,194 390,214 470,214 470,194 550,194 550,214\"\n    fill=\"none\" stroke=\"#f59e0b\" stroke-width=\"2\"/>\n  <text x=\"30\" y=\"245\" fill=\"#94a3b8\">Q<\/text>\n  <polyline points=\"70,249 230,249 230,234 390,234 390,249 550,249\" fill=\"none\" stroke=\"#34d399\" stroke-width=\"2\"/>\n  <text x=\"250\" y=\"240\" fill=\"#6ee7b7\" font-size=\"11\">每个 clk 上升沿，Q 更新为当时的 D<\/text>\n<\/svg>\n"}, {"file": "assets/phase2/shift-reg-timing.svg", "title": "移位寄存器时序", "caption": "8 级触发器级联，每个时钟沿整体右移一位。", "svgRaw": "<svg xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"0 0 760 240\" font-family=\"system-ui,sans-serif\" font-size=\"12\">\n  <rect x=\"0\" y=\"0\" width=\"760\" height=\"240\" fill=\"#0d1420\"/>\n  <text x=\"380\" y=\"22\" fill=\"#7dd3fc\" text-anchor=\"middle\" font-size=\"15\" font-weight=\"bold\">移位寄存器：8 级触发器级联，每个时钟沿移一位<\/text>\n\n  <!-- 8 FFs -->\n  <g font-size=\"11\" fill=\"#e2e8f0\" text-anchor=\"middle\">\n    <rect x=\"60\"  y=\"70\" width=\"60\" height=\"44\" fill=\"#16233a\" stroke=\"#38bdf8\"/>\n    <text x=\"90\"  y=\"96\">q0<\/text>\n    <rect x=\"150\" y=\"70\" width=\"60\" height=\"44\" fill=\"#16233a\" stroke=\"#38bdf8\"/>\n    <text x=\"180\" y=\"96\">q1<\/text>\n    <rect x=\"240\" y=\"70\" width=\"60\" height=\"44\" fill=\"#16233a\" stroke=\"#38bdf8\"/>\n    <text x=\"270\" y=\"96\">q2<\/text>\n    <text x=\"330\" y=\"96\" fill=\"#64748b\">…<\/text>\n    <rect x=\"360\" y=\"70\" width=\"60\" height=\"44\" fill=\"#16233a\" stroke=\"#38bdf8\"/>\n    <text x=\"390\" y=\"96\">q6<\/text>\n    <rect x=\"450\" y=\"70\" width=\"60\" height=\"44\" fill=\"#16233a\" stroke=\"#38bdf8\"/>\n    <text x=\"480\" y=\"96\">q7<\/text>\n  <\/g>\n  <g stroke=\"#38bdf8\" stroke-width=\"1.5\" fill=\"none\" marker-end=\"\">\n    <line x1=\"120\" y1=\"92\" x2=\"150\" y2=\"92\"/>\n    <line x1=\"210\" y1=\"92\" x2=\"240\" y2=\"92\"/>\n    <line x1=\"420\" y1=\"92\" x2=\"450\" y2=\"92\"/>\n  <\/g>\n  <text x=\"40\" y=\"96\" fill=\"#22d3ee\" text-anchor=\"end\">sin→<\/text>\n  <text x=\"520\" y=\"96\" fill=\"#34d399\">→sout<\/text>\n  <text x=\"280\" y=\"135\" fill=\"#94a3b8\" text-anchor=\"middle\">pout = {q7..q0} 并行读出（串入并出 SIPO）<\/text>\n\n  <!-- timing: bit walks -->\n  <text x=\"30\" y=\"175\" fill=\"#94a3b8\">sin=1 移入过程<\/text>\n  <g font-size=\"11\" fill=\"#fcd34d\">\n    <text x=\"60\"  y=\"200\">clk1: 1→q0<\/text>\n    <text x=\"180\" y=\"200\">clk2: →q1<\/text>\n    <text x=\"290\" y=\"200\">clk3: →q2<\/text>\n    <text x=\"400\" y=\"200\">…<\/text>\n    <text x=\"470\" y=\"200\">clk8: 到达 q7=sout<\/text>\n  <\/g>\n  <text x=\"380\" y=\"225\" fill=\"#64748b\" text-anchor=\"middle\">每来一个上升沿，所有位向右挪一格，sin 进入 q0<\/text>\n<\/svg>\n"}, {"file": "assets/phase2/ring-vs-johnson.svg", "title": "环形 vs 扭环计数波形", "caption": "环形 n 位→n 状态；扭环 n 位→2n 状态且相邻仅变一位。", "svgRaw": "<svg xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"0 0 760 260\" font-family=\"system-ui,sans-serif\" font-size=\"12\">\n  <rect x=\"0\" y=\"0\" width=\"760\" height=\"260\" fill=\"#0d1420\"/>\n  <text x=\"380\" y=\"22\" fill=\"#7dd3fc\" text-anchor=\"middle\" font-size=\"15\" font-weight=\"bold\">环形计数器 vs 扭环(约翰逊)计数器 波形对比（3 位）<\/text>\n\n  <!-- ring -->\n  <text x=\"30\" y=\"60\" fill=\"#7dd3fc\" font-size=\"12\" font-weight=\"bold\">环形 ring：8 状态，1 个 1 循环右移<\/text>\n  <g font-size=\"10\" fill=\"#94a3b8\">\n    <text x=\"40\"  y=\"90\">q0<\/text><text x=\"40\" y=\"110\">q1<\/text><text x=\"40\" y=\"130\">q2<\/text>\n  <\/g>\n  <polyline points=\"80,86 160,86 160,74 240,74 240,86 700,86\" fill=\"none\" stroke=\"#22d3ee\" stroke-width=\"1.5\"/>\n  <polyline points=\"80,110 240,110 240,98 320,98 320,110 700,110\" fill=\"none\" stroke=\"#34d399\" stroke-width=\"1.5\"/>\n  <polyline points=\"80,130 320,130 320,118 400,118 400,130 700,130\" fill=\"none\" stroke=\"#f59e0b\" stroke-width=\"1.5\"/>\n\n  <!-- johnson -->\n  <text x=\"30\" y=\"170\" fill=\"#7dd3fc\" font-size=\"12\" font-weight=\"bold\">扭环 johnson：把~q7 反馈回输入，6 状态（2n）<\/text>\n  <g font-size=\"10\" fill=\"#94a3b8\">\n    <text x=\"40\"  y=\"200\">q0<\/text><text x=\"40\" y=\"220\">q1<\/text><text x=\"40\" y=\"240\">q2<\/text>\n  <\/g>\n  <polyline points=\"80,196 200,196 200,184 440,184 440,196 700,196\" fill=\"none\" stroke=\"#22d3ee\" stroke-width=\"1.5\"/>\n  <polyline points=\"80,220 280,220 280,208 520,208 520,220 700,220\" fill=\"none\" stroke=\"#34d399\" stroke-width=\"1.5\"/>\n  <polyline points=\"80,240 360,240 360,228 600,228 600,240 700,240\" fill=\"none\" stroke=\"#f59e0b\" stroke-width=\"1.5\"/>\n  <text x=\"380\" y=\"155\" fill=\"#64748b\" font-size=\"10\">环形：n 位→n 状态；扭环：n 位→2n 状态，译码更简单无毛刺<\/text>\n<\/svg>\n"}], "tools": [{"name": "AMD Vivado ML Edition 下载", "url": "https://www.xilinx.com/support/download.html", "required": true, "note": "免费 ML Standard 版即可；访问日期 2026-10。"}, {"name": "通用引脚约束模板 fpga_common.xdc", "url": "../code/common/fpga_common.xdc", "required": true, "note": "相对本仓库；按开发板官方原理图替换 PACKAGE_PIN。"}], "tasks": [{"id": "task-2-2-1", "text": "实现 8 位流水灯（跑马灯）效果"}, {"id": "task-2-2-2", "text": "实现双向流水灯，按键切换方向"}], "cards": [{"q": "D 触发器在 Verilog 里怎么写？", "a": "always @(posedge clk or negedge rst_n)，复位时赋初值，否则 q<=d；只在时钟上升沿更新。", "tags": ["D触发器", "时序"]}, {"q": "时序逻辑为什么用非阻塞赋值 <=？", "a": "<= 描述时钟沿到来时所有寄存器并行更新，避免顺序赋值带来的意外；组合逻辑才用 =。", "tags": ["非阻塞", "赋值"]}, {"q": "移位寄存器 q<={q[6:0],sin} 的效果？", "a": "每个时钟沿所有位右挪一格，sin 进入最低位；WIDTH 个时钟后串行位在并行口同时出现。", "tags": ["移位寄存器", "SIPO"]}, {"q": "50MHz、每步 250ms，节拍计数器数多少？", "a": "50,000,000×0.25=12,500,000 个时钟。", "tags": ["计算", "流水灯"]}, {"q": "数到 12,500,000 需要几位计数器？", "a": "2^23=8.4M 不够，2^24=16.7M 够，故 24 位 reg [23:0]。", "tags": ["位宽", "计算"]}, {"q": "循环左移一位怎么写？", "a": "led <= {led[6:0], led[7]}；把最高位接到最低位形成环。", "tags": ["移位", "流水灯"]}, {"q": "环形计数器和扭环(约翰逊)计数器的区别？", "a": "环形把最高位反馈回输入，n 位 n 状态；扭环把取反的最高位反馈，n 位 2n 状态，相邻仅变一位。", "tags": ["环形", "扭环"]}, {"q": "两级同步在这里起什么作用？", "a": "把异步按键经两个触发器同步到时钟域，减少跨域亚稳态概率；完整消抖见 2.3。", "tags": ["同步", "跨时钟域"]}], "quiz": [{"q": "D 触发器更新输出的时刻是？", "options": ["任何时刻", "clk 上升沿", "clk 下降沿", "复位时"], "answer": 1, "explain": "always @(posedge clk) 只在上升沿把 d 锁存到 q。"}, {"q": "移位寄存器 q<={q[6:0],sin} 经过 8 个时钟后？", "options": ["sin 到达最高位并行输出", "全部清零", "sin 还在最低位", "输出保持不变"], "answer": 0, "explain": "每沿右移一位，8 沿后最先移入的位到达最高位，可并行读出。"}, {"q": "50MHz、250ms 一拍，节拍计数器满分值？", "options": ["12,500,000", "50,000,000", "1,250,000", "25,000"], "answer": 0, "explain": "50e6×0.25=12,500,000。"}, {"q": "扭环(约翰逊)计数器 n 位产生多少状态？", "options": ["n", "2n", "2^n", "n/2"], "answer": 1, "explain": "取反反馈使状态数翻倍为 2n，且相邻状态仅一位翻转。"}], "docHtml": "<h1>2.2 时序逻辑与移位寄存器<\/h1>\n<h2>从组合到时序：D 触发器<\/h2>\n<p>组合逻辑没有记忆，时序逻辑靠<strong>触发器(Flip-Flop)<\/strong>记住状态。最基本的是 <strong>D 触发器<\/strong>：<\/p>\n<pre><code class=\"language-verilog\">always @(posedge clk or negedge rst_n) begin\n    if (!rst_n) q &lt;= 1'b0;\n    else        q &lt;= d;      // 只在 clk 上升沿把 d 锁存到 q\nend\n<\/code><\/pre>\n<p><code>@(posedge clk)<\/code> 表示只在时钟上升沿动作。这是 FPGA 一切时序的根基：<strong>所有状态变化都对齐到时钟沿<\/strong>，输出 <code>q<\/code> 在下一个沿才更新。<\/p>\n<p><img alt=\"D 触发器结构\" src=\"../../../assets/phase2/dff-structure.svg\" /><\/p>\n<p>要点：<\/p>\n<ul>\n<li><code>&lt;=<\/code> 是非阻塞赋值，时序逻辑专用，描述\"沿到来时并行更新\"。<\/li>\n<li>异步复位写在敏感表 <code>or negedge rst_n<\/code>，块内先判复位。<\/li>\n<\/ul>\n<h2>移位寄存器<\/h2>\n<p>把多个 D 触发器首尾相接——前一级的输出接下一级的 D 端——就成了<strong>移位寄存器<\/strong>：<\/p>\n<pre><code class=\"language-verilog\">always @(posedge clk or negedge rst_n) begin\n    if (!rst_n) q &lt;= 0;\n    else        q &lt;= {q[WIDTH-2:0], sin};   // 整体右移，sin 进最低位\nend\n<\/code><\/pre>\n<p>每个时钟沿，所有位挪一格，<code>sin<\/code> 进入最低位。于是：<\/p>\n<ul>\n<li><strong>并行输出 <code>pout=q<\/code><\/strong>：经过 WIDTH 个时钟后，串行进来的位在 8 根线上同时出现 → <strong>串入并出(SIPO)<\/strong>。<\/li>\n<li><strong>最高位 <code>sout<\/code><\/strong>：可继续往下一级送，做<strong>并入串出(PISO)<\/strong>或级联扩展。<\/li>\n<\/ul>\n<p><img alt=\"移位寄存器时序\" src=\"../../../assets/phase2/shift-reg-timing.svg\" /><\/p>\n<p>代码 <code>shift_reg8.v<\/code> 即 8 位移位寄存器，<code>tb_shift_reg8.v<\/code> 串行送入 <code>1011_0100<\/code> 后并行读出比对。<\/p>\n<h2>流水灯：移位寄存器的直观应用<\/h2>\n<p>流水灯就是让一个\"1\"在 8 个 LED 里循环移动。用节拍计数器放慢移位速度：<\/p>\n<ul>\n<li>50MHz、每步 250ms → 每拍时钟数 = <code>50,000,000 × 0.25 = 12,500,000<\/code>。<\/li>\n<li>位宽 = <code>ceil(log2(12,500,000)) = 24 bit<\/code>（2^24=16.7M 够）。<\/li>\n<li>循环左移：<code>led &lt;= {led[6:0], led[7]};<\/code><\/li>\n<\/ul>\n<p><code>water_led.v<\/code> 实现单向流水；<code>water_led_dir.v<\/code> 在此基础上用按键切换方向——它对按键做了<strong>内置两级同步 + 下降沿检测<\/strong>（完整的机械消抖见 2.3），检测到按下就翻转 <code>dir<\/code>，左移/右移：<\/p>\n<ul>\n<li>左移：<code>{led[6:0], led[7]}<\/code><\/li>\n<li>右移：<code>{led[0],   led[7:1]}<\/code><\/li>\n<\/ul>\n<h2>环形与扭环计数器<\/h2>\n<p>移位寄存器把输出反馈回输入，就成了<strong>计数器<\/strong>：<\/p>\n<ul>\n<li><strong>环形计数器(ring)<\/strong>：把最高位接回输入，n 位移位寄存器循环出 n 个状态，独热编码。<\/li>\n<li><strong>扭环/约翰逊计数器(johnson)<\/strong>：把<strong>取反<\/strong>的最高位接回输入，n 位出 2n 个状态，相邻状态只变一位，译码无毛刺。<\/li>\n<\/ul>\n<p><img alt=\"环形与扭环波形对比\" src=\"../../../assets/phase2/ring-vs-johnson.svg\" /><\/p>\n<p>它们是流水灯/顺序脉冲发生器的底层思想：不用写加法计数器，靠移位+反馈就能产生循环节拍。<\/p>\n<h2>关键计算小结<\/h2>\n<ul>\n<li>节拍计数 = <code>CLK_FREQ_HZ × STEP_MS / 1000<\/code>；本例 50MHz×250ms=12,500,000。<\/li>\n<li>节拍计数器位宽 = <code>ceil(log2(节拍计数))<\/code>，本例 24 bit。<\/li>\n<li>环形 n 位 → n 状态；扭环 n 位 → 2n 状态。<\/li>\n<\/ul>\n<blockquote>\n<p>本仓库环境无 Vivado 工程，代码均通过结构校验；实际综合、上板看到流水灯需在 Vivado ML Standard（Artix-7/Zynq）中完成，引脚按 <code>code/common/fpga_common.xdc<\/code> 模板与你板子官方原理图填写。<\/p>\n<\/blockquote>"}, {"chapterId": "2.3", "phase": 2, "slug": "debounce-sync", "title": "按键消抖与输入处理", "summary": "机械按键抖动成因与时长、计数窗口消抖（50MHz×20ms=1,000,000/20bit）、亚稳态成因危害、单 bit 两级触发器同步，及按一下切换 LED。", "doc": "docs/phase2/ch3-debounce.md", "code": [{"file": "code/phase2/debounce.v", "type": "verilog", "role": "synthesizable", "title": "debounce.v — 计数窗口消抖（参数化）", "codeHtml": "//==============================================================================\n// debounce.v  —  可综合：机械按键延时消抖（计数窗口法）\n// 目标器件：通用 Xilinx Artix-7 / Zynq（7 系列）\n//\n// 原理：机械按键按下/松开时会在高低电平间抖动约 5~20ms。\n//   只有当输入 key_in 与当前稳定输出 key_out 不一致、且这种不一致\n//   连续保持 HOLD_MS 不抖动，才更新输出。\n//   计数：HOLD_CNT = CLK_FREQ_HZ * HOLD_MS / 1000\n//   例：50MHz、20ms =&gt; 50,000,000*0.02 = 1,000,000，需 20 bit。\n//   key_in 低有效（按下为 0），复位后 key_out 默认高电平(松开)。\n//==============================================================================\n`default_nettype none\n\nmodule debounce #(\n    parameter integer CLK_FREQ_HZ = 50_000_000,\n    parameter integer HOLD_MS     = 20\n)(\n    input  wire clk,\n    input  wire rst_n,\n    input  wire key_in,     // 原始按键，低有效\n    output reg  key_out    // 消抖后稳定信号，低有效\n);\n\n    localparam integer HOLD_CNT = CLK_FREQ_HZ * HOLD_MS / 1000;  // 1,000,000\n    localparam integer CNT_W     = 20;                            // 2^20=1.05M\n\n    reg [CNT_W-1:0] cnt;\n\n    always @(posedge clk or negedge rst_n) begin\n        if (!rst_n) begin\n            cnt     &lt;= {CNT_W{1&#x27;b0}};\n            key_out &lt;= 1&#x27;b1;            // 默认松开\n        end else if (key_in == key_out) begin\n            // 输入与当前输出一致：抖动回到原态，计数清零\n            cnt &lt;= {CNT_W{1&#x27;b0}};\n        end else if (cnt &gt;= HOLD_CNT - 1) begin\n            // 输入稳定保持够久：采纳并更新\n            cnt     &lt;= {CNT_W{1&#x27;b0}};\n            key_out &lt;= key_in;\n        end else begin\n            cnt &lt;= cnt + 1&#x27;b1;\n        end\n    end\n\nendmodule\n\n`default_nettype wire\n"}, {"file": "code/phase2/tb_debounce.v", "type": "verilog", "role": "testbench", "title": "tb_debounce.v — 抖动波形+单次翻转断言", "codeHtml": "//==============================================================================\n// tb_debounce.v  —  Testbench：消抖模块（带抖动波形）自检\n//   * 仿真提速：CLK_FREQ_HZ=1000, HOLD_MS=1 =&gt; HOLD_CNT=10 个时钟。\n//   * 制造一段&quot;按下抖动&quot;：快速来回跳变若干拍，再稳定保持低电平。\n//   * 断言 key_out 在整个按下过程中只翻转一次（抖动期间不翻转）。\n//==============================================================================\n`timescale 1ns/1ps\n`default_nettype none\n\nmodule tb_debounce;\n\n    reg      clk;\n    reg      rst_n;\n    reg      key_in;\n    wire     key_out;\n\n    integer  trans;\n    integer  err;\n\n    always #10 clk = ~clk;\n\n    debounce #(\n        .CLK_FREQ_HZ(1000),\n        .HOLD_MS(1)\n    ) u_dut (\n        .clk    (clk),\n        .rst_n  (rst_n),\n        .key_in (key_in),\n        .key_out(key_out)\n    );\n\n    // 统计 key_out 翻转次数\n    always @(key_out) begin\n        trans = trans + 1;\n        $display(&quot;[%0t ns] key_out -&gt; %b&quot;, $time, key_out);\n    end\n\n    initial begin\n        clk    = 1&#x27;b0;\n        rst_n  = 1&#x27;b0;\n        key_in = 1&#x27;b1;\n        trans  = 0;\n        err    = 0;\n\n        #25 rst_n = 1&#x27;b1;\n\n        // --- 按下抖动：快速来回 5 次（每次持续 1 拍，不够 10 拍窗口）---\n        key_in = 1&#x27;b0; #20;\n        key_in = 1&#x27;b1; #20;\n        key_in = 1&#x27;b0; #20;\n        key_in = 1&#x27;b1; #20;\n        key_in = 1&#x27;b0; #20;\n\n        // 稳定保持低电平 30 拍（&gt;10 拍窗口）：应被采纳，key_out 翻转为 0\n        key_in = 1&#x27;b0; #600;\n\n        // --- 松开抖动 ---\n        key_in = 1&#x27;b1; #20;\n        key_in = 1&#x27;b0; #20;\n        key_in = 1&#x27;b1; #20;\n        key_in = 1&#x27;b0; #20;\n        key_in = 1&#x27;b1; #20;\n\n        // 稳定保持高电平 30 拍：key_out 翻回 1\n        key_in = 1&#x27;b1; #600;\n\n        // 期望：key_out 共翻转 2 次（按下稳定一次、松开稳定一次）\n        if (trans != 2) begin\n            err = err + 1;\n            $display(&quot;[TB] FAIL: key_out 翻转 %0d 次，期望 2 次（抖动不应引起额外翻转）&quot;, trans);\n        end\n        if (key_out != 1&#x27;b1) begin\n            err = err + 1;\n            $display(&quot;[TB] FAIL: 结束时 key_out=%b 应为 1(松开)&quot;, key_out);\n        end\n\n        if (err == 0) $display(&quot;[TB] PASS: 消抖模块在抖动波形下只输出稳定单次翻转&quot;);\n        else          $display(&quot;[TB] FAIL: 共 %0d 处错误&quot;, err);\n\n        $finish;\n    end\n\nendmodule\n\n`default_nettype wire\n"}, {"file": "code/phase2/sync_2ff.v", "type": "verilog", "role": "synthesizable", "title": "sync_2ff.v — 单 bit 两级同步", "codeHtml": "//==============================================================================\n// sync_2ff.v  —  可综合：单 bit 异步输入两级触发器同步\n// 目标器件：通用 Xilinx Artix-7 / Zynq（7 系列）\n//\n// 原理：异步输入在时钟沿附近变化时，第一级触发器可能进入亚稳态\n//   （输出不确定、需一段时间才稳定）。两级触发器把信号再打一拍：\n//   即使第一级亚稳，到第二级采样时通常已稳定，从而把亚稳态局限在\n//   第一级、避免传播到后续逻辑。\n//   q1 &lt;= async_in; q2 &lt;= q1; sync_out = q2;\n//==============================================================================\n`default_nettype none\n\nmodule sync_2ff (\n    input  wire clk,\n    input  wire rst_n,\n    input  wire async_in,   // 异步输入（跨时钟域/按键）\n    output wire sync_out     // 同步后输出\n);\n\n    reg q1, q2;\n\n    always @(posedge clk or negedge rst_n) begin\n        if (!rst_n) begin\n            q1 &lt;= 1&#x27;b0;\n            q2 &lt;= 1&#x27;b0;\n        end else begin\n            q1 &lt;= async_in;\n            q2 &lt;= q1;\n        end\n    end\n\n    assign sync_out = q2;\n\nendmodule\n\n`default_nettype wire\n"}, {"file": "code/phase2/tb_sync_2ff.v", "type": "verilog", "role": "testbench", "title": "tb_sync_2ff.v — X 注入演示亚稳态", "codeHtml": "//==============================================================================\n// tb_sync_2ff.v  —  Testbench：两级触发器同步演示\n//   * 先复位；再让异步输入变 1，等待 3 个时钟后 sync_out 应稳定为 1。\n//   * 再让异步输入变 0（期间注入一次 X 模拟亚稳态），最终 sync_out 应稳定为 0。\n//==============================================================================\n`timescale 1ns/1ps\n`default_nettype none\n\nmodule tb_sync_2ff;\n\n    reg      clk;\n    reg      rst_n;\n    reg      async_in;\n    wire     sync_out;\n    integer  err;\n\n    always #10 clk = ~clk;\n\n    sync_2ff u_dut (\n        .clk      (clk),\n        .rst_n    (rst_n),\n        .async_in (async_in),\n        .sync_out (sync_out)\n    );\n\n    initial begin\n        clk      = 1&#x27;b0;\n        rst_n    = 1&#x27;b0;\n        async_in = 1&#x27;b0;\n        err      = 0;\n\n        #25 rst_n = 1&#x27;b1;\n\n        // 异步输入拉高（故意在时钟沿附近变化，模拟跨域）\n        async_in = 1&#x27;b1;\n        #60;                       // 3 个时钟，两级同步应已采到\n        $display(&quot;[TB] async_in=1, sync_out=%b&quot;, sync_out);\n        if (sync_out != 1&#x27;b1) begin\n            err = err + 1;\n            $display(&quot;[TB] FAIL: sync_out=%b 应为 1&quot;, sync_out);\n        end\n\n        // 注入 X 模拟第一级亚稳态，随后拉低\n        async_in = 1&#x27;bx;\n        #15;\n        async_in = 1&#x27;b0;\n        #60;\n        $display(&quot;[TB] async_in=0, sync_out=%b&quot;, sync_out);\n        if (sync_out != 1&#x27;b0) begin\n            err = err + 1;\n            $display(&quot;[TB] FAIL: sync_out=%b 应为 0&quot;, sync_out);\n        end\n\n        if (err == 0) $display(&quot;[TB] PASS: 两级同步输出在两拍后跟随异步输入&quot;);\n        else          $display(&quot;[TB] FAIL: 共 %0d 处错误&quot;, err);\n\n        $finish;\n    end\n\nendmodule\n\n`default_nettype wire\n"}, {"file": "code/phase2/key_toggle.v", "type": "verilog", "role": "synthesizable", "title": "key_toggle.v — 按一下切换 LED（复用 debounce）", "codeHtml": "//==============================================================================\n// key_toggle.v  —  可综合：按一下切换一次 LED（内部复用 debounce）\n// 目标器件：通用 Xilinx Artix-7 / Zynq（7 系列）\n//\n// 链路：原始按键 -&gt; debounce 消抖 -&gt; 打一拍做下降沿检测 -&gt; led 翻转。\n//   key 低有效；按下(同步消抖后的下降沿)触发一次 led 翻转。\n//==============================================================================\n`default_nettype none\n\nmodule key_toggle #(\n    parameter integer CLK_FREQ_HZ = 50_000_000,\n    parameter integer HOLD_MS      = 20\n)(\n    input  wire clk,\n    input  wire rst_n,\n    input  wire key_in,\n    output reg  led\n);\n\n    wire key_db;       // 消抖后、低有效\n    reg  key_db_d;     // 打一拍做边沿检测\n\n    debounce #(\n        .CLK_FREQ_HZ(CLK_FREQ_HZ),\n        .HOLD_MS(HOLD_MS)\n    ) u_debounce (\n        .clk    (clk),\n        .rst_n  (rst_n),\n        .key_in (key_in),\n        .key_out(key_db)\n    );\n\n    always @(posedge clk or negedge rst_n) begin\n        if (!rst_n) key_db_d &lt;= 1&#x27;b1;\n        else        key_db_d &lt;= key_db;\n    end\n\n    wire key_fell = key_db_d &amp; ~key_db;   // 消抖后下降沿 = 一次有效按下\n\n    always @(posedge clk or negedge rst_n) begin\n        if (!rst_n) led &lt;= 1&#x27;b0;\n        else if (key_fell) led &lt;= ~led;\n    end\n\nendmodule\n\n`default_nettype wire\n"}, {"file": "code/phase2/tb_key_toggle.v", "type": "verilog", "role": "testbench", "title": "tb_key_toggle.v — 一次按下翻转一次", "codeHtml": "//==============================================================================\n// tb_key_toggle.v  —  Testbench：按一下切换一次 LED\n//   * 提速：CLK_FREQ_HZ=1000, HOLD_MS=1（消抖窗口 10 拍）。\n//   * 模拟一次带抖动的按下-&gt;松开，断言 led 恰好翻转一次。\n//==============================================================================\n`timescale 1ns/1ps\n`default_nettype none\n\nmodule tb_key_toggle;\n\n    reg      clk;\n    reg      rst_n;\n    reg      key_in;\n    wire     led;\n    integer  trans;\n    integer  err;\n\n    always #10 clk = ~clk;\n\n    key_toggle #(\n        .CLK_FREQ_HZ(1000),\n        .HOLD_MS(1)\n    ) u_dut (\n        .clk    (clk),\n        .rst_n  (rst_n),\n        .key_in (key_in),\n        .led    (led)\n    );\n\n    always @(led) trans = trans + 1;\n\n    initial begin\n        clk    = 1&#x27;b0;\n        rst_n  = 1&#x27;b0;\n        key_in = 1&#x27;b1;\n        trans  = 0;\n        err    = 0;\n\n        #25 rst_n = 1&#x27;b1;\n\n        // 抖动按下\n        key_in = 1&#x27;b0; #20;\n        key_in = 1&#x27;b1; #20;\n        key_in = 1&#x27;b0; #20;\n        // 稳定按下 30 拍\n        key_in = 1&#x27;b0; #600;\n        // 松开（带抖动）\n        key_in = 1&#x27;b1; #20;\n        key_in = 1&#x27;b0; #20;\n        key_in = 1&#x27;b1;\n        // 稳定松开\n        #600;\n\n        $display(&quot;[TB] led=%b, 翻转次数=%0d&quot;, led, trans);\n        if (trans != 1) begin\n            err = err + 1;\n            $display(&quot;[TB] FAIL: led 应翻转 1 次，实际 %0d 次&quot;, trans);\n        end\n        if (led != 1&#x27;b1) begin\n            err = err + 1;\n            $display(&quot;[TB] FAIL: 一次按下后 led 应为 1，实际 %b&quot;, led);\n        end\n\n        if (err == 0) $display(&quot;[TB] PASS: 按一下切换一次 LED&quot;);\n        else          $display(&quot;[TB] FAIL: 共 %0d 处错误&quot;, err);\n\n        $finish;\n    end\n\nendmodule\n\n`default_nettype wire\n"}], "diagrams": [{"file": "assets/phase2/key-jitter.svg", "title": "按键抖动波形", "caption": "按下/松开瞬间弹跳 5~20ms，直接采样会误判多次。", "svgRaw": "<svg xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"0 0 760 220\" font-family=\"system-ui,sans-serif\" font-size=\"12\">\n  <rect x=\"0\" y=\"0\" width=\"760\" height=\"220\" fill=\"#0d1420\"/>\n  <text x=\"380\" y=\"22\" fill=\"#7dd3fc\" text-anchor=\"middle\" font-size=\"15\" font-weight=\"bold\">机械按键抖动波形：按下/松开瞬间在电平间来回弹跳（约 5~20ms）<\/text>\n\n  <text x=\"30\" y=\"80\" fill=\"#94a3b8\">理想<\/text>\n  <polyline points=\"80,80 260,80 260,110 600,110\" fill=\"none\" stroke=\"#475569\" stroke-width=\"2\"/>\n\n  <text x=\"30\" y=\"150\" fill=\"#94a3b8\">实际<\/text>\n  <polyline points=\"80,150 250,150 258,120 266,150 274,120 282,150 290,120 300,120 600,120\"\n    fill=\"none\" stroke=\"#f87171\" stroke-width=\"2\"/>\n  <text x=\"330\" y=\"115\" fill=\"#fca5a5\" font-size=\"11\">抖动区：短时间多次跳变<\/text>\n  <line x1=\"250\" y1=\"170\" x2=\"300\" y2=\"170\" stroke=\"#f59e0b\" stroke-width=\"1\"/>\n  <text x=\"275\" y=\"185\" fill=\"#fcd34d\" text-anchor=\"middle\" font-size=\"11\">~5-20ms<\/text>\n  <text x=\"380\" y=\"205\" fill=\"#64748b\" text-anchor=\"middle\">若直接采样，一次按下会被误判成多次触发<\/text>\n<\/svg>\n"}, {"file": "assets/phase2/debounce-window.svg", "title": "消抖计数窗口", "caption": "连续稳定保持 HOLD_CNT 才采纳，抖动期间输出不动。", "svgRaw": "<svg xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"0 0 760 230\" font-family=\"system-ui,sans-serif\" font-size=\"12\">\n  <rect x=\"0\" y=\"0\" width=\"760\" height=\"230\" fill=\"#0d1420\"/>\n  <text x=\"380\" y=\"22\" fill=\"#7dd3fc\" text-anchor=\"middle\" font-size=\"15\" font-weight=\"bold\">计数消抖：输入与输出不同且连续保持 HOLD_MS 才采纳（50MHz×20ms=1,000,000 拍）<\/text>\n\n  <text x=\"30\" y=\"70\" fill=\"#94a3b8\">key_in<\/text>\n  <polyline points=\"80,70 200,70 208,45 216,70 224,45 232,70 240,45 560,45\" fill=\"none\" stroke=\"#f87171\" stroke-width=\"2\"/>\n\n  <text x=\"30\" y=\"120\" fill=\"#94a3b8\">cnt<\/text>\n  <polyline points=\"80,120 240,120 240,95 440,95 440,120 560,120\" fill=\"none\" stroke=\"#f59e0b\" stroke-width=\"2\"/>\n  <line x1=\"240\" y1=\"135\" x2=\"440\" y2=\"135\" stroke=\"#f59e0b\" stroke-width=\"1\" stroke-dasharray=\"4 3\"/>\n  <text x=\"340\" y=\"150\" fill=\"#fcd34d\" text-anchor=\"middle\" font-size=\"11\">连续保持窗口 = HOLD_CNT（计到满才更新）<\/text>\n\n  <text x=\"30\" y=\"185\" fill=\"#94a3b8\">key_out<\/text>\n  <polyline points=\"80,185 440,185 440,160 560,160\" fill=\"none\" stroke=\"#34d399\" stroke-width=\"2\"/>\n  <text x=\"460\" y=\"155\" fill=\"#6ee7b7\" font-size=\"11\">窗口满后才翻转，抖动期间不动<\/text>\n<\/svg>\n"}, {"file": "assets/phase2/metastability-2ff.svg", "title": "亚稳态与两级同步", "caption": "FF1 可能亚稳，再打一拍由 FF2 采样，亚稳态不传播。", "svgRaw": "<svg xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"0 0 760 240\" font-family=\"system-ui,sans-serif\" font-size=\"12\">\n  <rect x=\"0\" y=\"0\" width=\"760\" height=\"240\" fill=\"#0d1420\"/>\n  <text x=\"380\" y=\"22\" fill=\"#7dd3fc\" text-anchor=\"middle\" font-size=\"15\" font-weight=\"bold\">亚稳态与两级触发器同步<\/text>\n\n  <!-- async in -->\n  <text x=\"30\" y=\"90\" fill=\"#94a3b8\">async_in<\/text>\n  <line x1=\"90\" y1=\"86\" x2=\"150\" y2=\"86\" stroke=\"#f87171\" stroke-width=\"2\"/>\n\n  <!-- ff1 -->\n  <rect x=\"160\" y=\"60\" width=\"110\" height=\"60\" rx=\"4\" fill=\"#16233a\" stroke=\"#f87171\" stroke-width=\"2\"/>\n  <text x=\"215\" y=\"95\" fill=\"#fca5a5\" text-anchor=\"middle\" font-size=\"12\">FF1<\/text>\n  <text x=\"215\" y=\"112\" fill=\"#94a3b8\" text-anchor=\"middle\" font-size=\"10\">可能亚稳<\/text>\n  <line x1=\"270\" y1=\"90\" x2=\"330\" y2=\"90\" stroke=\"#f87171\" stroke-width=\"2\"/>\n  <text x=\"300\" y=\"80\" fill=\"#fca5a5\" font-size=\"10\">q1(不定)<\/text>\n\n  <!-- ff2 -->\n  <rect x=\"340\" y=\"60\" width=\"110\" height=\"60\" rx=\"4\" fill=\"#16233a\" stroke=\"#34d399\" stroke-width=\"2\"/>\n  <text x=\"395\" y=\"95\" fill=\"#6ee7b7\" text-anchor=\"middle\" font-size=\"12\">FF2<\/text>\n  <text x=\"395\" y=\"112\" fill=\"#94a3b8\" text-anchor=\"middle\" font-size=\"10\">已稳定<\/text>\n  <line x1=\"450\" y1=\"90\" x2=\"520\" y2=\"90\" stroke=\"#34d399\" stroke-width=\"2\"/>\n  <text x=\"530\" y=\"95\" fill=\"#6ee7b7\">sync_out（安全）<\/text>\n\n  <!-- clk -->\n  <line x1=\"215\" y1=\"120\" x2=\"215\" y2=\"140\" stroke=\"#f59e0b\" stroke-width=\"1.5\"/>\n  <line x1=\"395\" y1=\"120\" x2=\"395\" y2=\"140\" stroke=\"#f59e0b\" stroke-width=\"1.5\"/>\n  <text x=\"300\" y=\"155\" fill=\"#fcd34d\" text-anchor=\"middle\" font-size=\"11\">同一 clk 上升沿驱动两级<\/text>\n\n  <g font-size=\"11\" fill=\"#cbd5e1\">\n    <text x=\"30\" y=\"190\">亚稳态：异步输入在建立/保持时间窗内变化，FF1 输出既非 0 也非 1，需时间收敛。<\/text>\n    <text x=\"30\" y=\"212\">两级同步：再打一拍，等 FF1 收敛后才被 FF2 采样，亚稳态不传播到后级逻辑。<\/text>\n  <\/g>\n<\/svg>\n"}], "tools": [{"name": "AMD Vivado ML Edition 下载", "url": "https://www.xilinx.com/support/download.html", "required": true, "note": "免费 ML Standard 版即可；访问日期 2026-10。"}, {"name": "通用引脚约束模板 fpga_common.xdc", "url": "../code/common/fpga_common.xdc", "required": true, "note": "相对本仓库；按开发板官方原理图替换 PACKAGE_PIN。"}], "tasks": [{"id": "task-2-3-1", "text": "编写按键消抖模块"}, {"id": "task-2-3-2", "text": "实现按键控制 LED 开关，按一下切换一次"}], "cards": [{"q": "机械按键抖动持续多久？", "a": "通常约 5~20ms，金属弹片在接通/断开间弹跳数次。", "tags": ["按键", "抖动"]}, {"q": "计数消抖的基本判据？", "a": "输入与当前输出不一致且连续稳定保持 HOLD_MS 才采纳，否则计数清零。", "tags": ["消抖", "算法"]}, {"q": "50MHz、20ms 消抖窗口数多少拍？", "a": "50,000,000×0.02=1,000,000 拍，需 20 bit 计数器。", "tags": ["计算", "消抖"]}, {"q": "什么是亚稳态？", "a": "异步输入在触发器建立/保持窗内变化，输出既非确定 0 也非 1，需时间收敛。", "tags": ["亚稳态", "跨时钟域"]}, {"q": "两级触发器同步怎么解决亚稳态？", "a": "第一级可能亚稳，再打一拍等其收敛，由第二级采样，把亚稳态局限在第一级。", "tags": ["同步", "两级"]}, {"q": "两级同步适用于多 bit 总线吗？", "a": "不适用。多 bit 跨时钟域要用握手或异步 FIFO，否则各路采样时刻不一致会采到错乱数据。", "tags": ["跨时钟域", "总线"]}, {"q": "下降沿检测怎么写？", "a": "把信号打一拍得到 d，wire fell = d & ~sig；消抖后下降沿代表一次有效按下。", "tags": ["边沿检测"]}, {"q": "按一下切换 LED 的完整链路？", "a": "原始按键→debounce 消抖→打一拍检测下降沿→led 翻转。", "tags": ["综合", "按键"]}], "quiz": [{"q": "机械按键抖动一般持续多久？", "options": ["纳秒级", "5~20ms", "几秒", "永远不抖"], "answer": 1, "explain": "机械弹片弹跳约 5~20ms，所以消抖窗口取 20ms 量级。"}, {"q": "50MHz、20ms 消抖窗口计数器位宽？", "options": ["16 位", "20 位", "24 位", "32 位"], "answer": 1, "explain": "1,000,000<2^20=1.05M，故 20 位。"}, {"q": "两级触发器同步主要解决什么？", "options": ["按键抖动", "单 bit 异步输入的亚稳态传播", "数码管亮度", "时钟分频"], "answer": 1, "explain": "再打一拍让第一级亚稳收敛，避免不确定值传播到后级。"}, {"q": "多 bit 总线跨时钟域能否直接打两拍？", "options": ["可以", "不可以，需握手/异步 FIFO", "只需一拍", "无需处理"], "answer": 1, "explain": "多 bit 各位采样时刻不一致会采到拼接错误数据，必须用握手或异步 FIFO。"}], "docHtml": "<h1>2.3 按键消抖与输入处理<\/h1>\n<h2>机械按键为什么会抖<\/h2>\n<p>机械按键按下/松开时，金属弹片不会一次就接通，而是在电平之间<strong>弹跳几次<\/strong>，持续约 <strong>5~20ms<\/strong>。如果直接采样，一次按下会被 FPGA 当成几十次触发——流水灯、计数就会乱跳。<\/p>\n<p><img alt=\"按键抖动波形\" src=\"../../../assets/phase2/key-jitter.svg\" /><\/p>\n<h2>计数消抖算法<\/h2>\n<p>思路：不要一看到电平变化就采纳，而是要求新电平<strong>连续稳定保持一段时间<\/strong>（约 20ms）才算数。<\/p>\n<p><code>debounce.v<\/code> 的核心状态：<\/p>\n<ul>\n<li>若 <code>key_in == key_out<\/code>：输入和当前稳定输出一致，说明抖动回到原态，计数器清零。<\/li>\n<li>若不一致但还没保持够：计数器累加。<\/li>\n<li>若计到满 <code>HOLD_CNT<\/code>：说明输入真的稳定变了，采纳 <code>key_out &lt;= key_in<\/code>。<\/li>\n<\/ul>\n<p>计数窗口：<\/p>\n<ul>\n<li>50MHz、20ms → <code>50,000,000 × 0.02 = 1,000,000<\/code> 个时钟。<\/li>\n<li>位宽 <code>ceil(log2(1,000,000)) = 20 bit<\/code>（2^20=1,048,576）。<\/li>\n<\/ul>\n<p><img alt=\"消抖计数窗口\" src=\"../../../assets/phase2/debounce-window.svg\" /><\/p>\n<p><code>tb_debounce.v<\/code> 故意制造一段快速来回跳变的抖动波形，再稳定保持，断言 <code>key_out<\/code> 在整个按下过程中<strong>只翻转一次<\/strong>。<\/p>\n<h2>亚稳态：比抖动更深的问题<\/h2>\n<p>异步输入（按键、其他时钟域的信号）如果正好在触发器的<strong>建立/保持时间窗<\/strong>内变化，触发器输出会进入<strong>亚稳态<\/strong>——既不是确定的 0 也不是 1，要过一段时间才收敛。若这个不确定值直接传播到后续逻辑，可能让状态机跳错状态、采样出错。<\/p>\n<h2>单 bit 两级触发器同步<\/h2>\n<p>对单 bit 异步输入，标准做法是<strong>两级触发器同步<\/strong>：<\/p>\n<pre><code class=\"language-verilog\">always @(posedge clk or negedge rst_n) begin\n    if (!rst_n) begin q1&lt;=0; q2&lt;=0; end\n    else begin q1&lt;=async_in; q2&lt;=q1; end\nend\nassign sync_out = q2;\n<\/code><\/pre>\n<p>第一级 <code>q1<\/code> 可能亚稳，但我们<strong>等一拍<\/strong>让它收敛，再由第二级 <code>q2<\/code> 采样。这样亚稳态被局限在第一级，传不到后级。<code>tb_sync_2ff.v<\/code> 注入 <code>1'bx<\/code> 模拟亚稳态，验证两拍后输出稳定跟随。<\/p>\n<p><img alt=\"亚稳态与两级同步\" src=\"../../../assets/phase2/metastability-2ff.svg\" /><\/p>\n<blockquote>\n<p>两级同步只适用于<strong>单 bit<\/strong>控制信号；多 bit 总线跨时钟域必须用握手或异步 FIFO，不能简单打两拍（见阶段 4）。<\/p>\n<\/blockquote>\n<h2>综合实例：按一下切换 LED<\/h2>\n<p><code>key_toggle.v<\/code> 把上面两块拼起来：<\/p>\n<pre><code>原始按键 → debounce 消抖 → 打一拍检测下降沿 → led 翻转\n<\/code><\/pre>\n<p>按下一次（消抖后）产生一个下降沿脉冲，<code>led &lt;= ~led<\/code>，实现\"按一下亮、再按一下灭\"。<code>tb_key_toggle.v<\/code> 模拟带抖动的一次按下，断言 led 恰好翻转一次。<\/p>\n<h2>关键计算小结<\/h2>\n<ul>\n<li>消抖窗口 = <code>CLK_FREQ_HZ × HOLD_MS / 1000<\/code>，50MHz×20ms=1,000,000。<\/li>\n<li>计数器位宽 20 bit。<\/li>\n<li>两级同步针对单 bit；异步总线需专用跨域方案。<\/li>\n<\/ul>\n<blockquote>\n<p>本仓库环境无 Vivado 工程，代码均通过结构校验；实际消抖手感与上板效果需在 Vivado ML Standard（Artix-7/Zynq）中下载验证。<\/p>\n<\/blockquote>"}, {"chapterId": "2.4", "phase": 2, "slug": "fsm", "title": "有限状态机 FSM", "summary": "Moore 与 Mealy 区别、三段式状态机标准写法（状态寄存器/次态/输出）、状态编码（二进制/独热）与优化；交通灯与售货机实例。", "doc": "docs/phase2/ch4-fsm.md", "code": [{"file": "code/phase2/traffic_light.v", "type": "verilog", "role": "synthesizable", "title": "traffic_light.v — 交通灯（南北/东西，含黄灯，参数化时长）", "codeHtml": "//==============================================================================\n// traffic_light.v  —  可综合：十字路口交通灯（南北/东西，含黄灯）\n// 目标器件：通用 Xilinx Artix-7 / Zynq（7 系列）\n//\n// 状态机（Moore，输出只由当前状态决定）：\n//   S_NS_G  : 南北绿、东西红\n//   S_NS_Y  : 南北黄、东西红\n//   S_EW_G  : 东西绿、南北红\n//   S_EW_Y  : 东西黄、南北红\n// 顺序循环：NS_G -&gt; NS_Y -&gt; EW_G -&gt; EW_Y -&gt; NS_G ...\n// 每个状态维持 T_GREEN / T_YELLOW 个时钟后切换。\n//==============================================================================\n`default_nettype none\n\nmodule traffic_light #(\n    parameter integer T_GREEN  = 25_000_000,   // 绿灯时长(时钟拍)\n    parameter integer T_YELLOW = 5_000_000      // 黄灯时长(时钟拍)\n)(\n    input  wire clk,\n    input  wire rst_n,\n    output reg  red_ns,\n    output reg  yellow_ns,\n    output reg  green_ns,\n    output reg  red_ew,\n    output reg  yellow_ew,\n    output reg  green_ew\n);\n\n    localparam S_NS_G = 2&#x27;d0;\n    localparam S_NS_Y = 2&#x27;d1;\n    localparam S_EW_G = 2&#x27;d2;\n    localparam S_EW_Y = 2&#x27;d3;\n\n    reg [1:0]  state;\n    reg [31:0] cnt;\n\n    // 节拍计数与状态跳转\n    always @(posedge clk or negedge rst_n) begin\n        if (!rst_n) begin\n            state &lt;= S_NS_G;\n            cnt   &lt;= 32&#x27;d0;\n        end else begin\n            case (state)\n                S_NS_G: if (cnt &gt;= T_GREEN-1) begin cnt &lt;= 32&#x27;d0; state &lt;= S_NS_Y; end\n                        else cnt &lt;= cnt + 1&#x27;b1;\n                S_NS_Y: if (cnt &gt;= T_YELLOW-1) begin cnt &lt;= 32&#x27;d0; state &lt;= S_EW_G; end\n                        else cnt &lt;= cnt + 1&#x27;b1;\n                S_EW_G: if (cnt &gt;= T_GREEN-1) begin cnt &lt;= 32&#x27;d0; state &lt;= S_EW_Y; end\n                        else cnt &lt;= cnt + 1&#x27;b1;\n                S_EW_Y: if (cnt &gt;= T_YELLOW-1) begin cnt &lt;= 32&#x27;d0; state &lt;= S_NS_G; end\n                        else cnt &lt;= cnt + 1&#x27;b1;\n                default: state &lt;= S_NS_G;\n            endcase\n        end\n    end\n\n    // Moore 输出：互锁——任一方向同一时刻只亮一种灯，且必有红灯\n    always @(*) begin\n        red_ns    = 1&#x27;b0;\n        yellow_ns = 1&#x27;b0;\n        green_ns  = 1&#x27;b0;\n        red_ew    = 1&#x27;b0;\n        yellow_ew = 1&#x27;b0;\n        green_ew  = 1&#x27;b0;\n        case (state)\n            S_NS_G: begin green_ns = 1&#x27;b1; red_ew   = 1&#x27;b1; end\n            S_NS_Y: begin yellow_ns = 1&#x27;b1; red_ew = 1&#x27;b1; end\n            S_EW_G: begin green_ew = 1&#x27;b1; red_ns   = 1&#x27;b1; end\n            S_EW_Y: begin yellow_ew = 1&#x27;b1; red_ns = 1&#x27;b1; end\n            default: red_ew = 1&#x27;b1;\n        endcase\n    end\n\nendmodule\n\n`default_nettype wire\n"}, {"file": "code/phase2/tb_traffic_light.v", "type": "verilog", "role": "testbench", "title": "tb_traffic_light.v — 周期与互锁自检", "codeHtml": "//==============================================================================\n// tb_traffic_light.v  —  Testbench：交通灯状态周期与互锁自检\n//   * 提速：T_GREEN=5, T_YELLOW=2 拍。\n//   * 跑完整一个循环，逐状态检查：南北/东西同一时刻只亮一种灯，且另一方向为红。\n//==============================================================================\n`timescale 1ns/1ps\n`default_nettype none\n\nmodule tb_traffic_light;\n\n    reg      clk;\n    reg      rst_n;\n    wire     red_ns, yellow_ns, green_ns;\n    wire     red_ew, yellow_ew, green_ew;\n    integer  err;\n\n    always #10 clk = ~clk;\n\n    traffic_light #(\n        .T_GREEN(5),\n        .T_YELLOW(2)\n    ) u_dut (\n        .clk(clk), .rst_n(rst_n),\n        .red_ns(red_ns), .yellow_ns(yellow_ns), .green_ns(green_ns),\n        .red_ew(red_ew), .yellow_ew(yellow_ew), .green_ew(green_ew)\n    );\n\n    initial begin\n        clk   = 1&#x27;b0;\n        rst_n = 1&#x27;b0;\n        err   = 0;\n        #25 rst_n = 1&#x27;b1;\n\n        // 每方向互锁：恰好一种灯亮\n        #40;\n        if (red_ns + yellow_ns + green_ns != 1) begin err=err+1; $display(&quot;[TB] FAIL 互锁NS&quot;); end\n        if (red_ew + yellow_ew + green_ew != 1) begin err=err+1; $display(&quot;[TB] FAIL 互锁EW&quot;); end\n        if (!(green_ns &amp;&amp; red_ew)) begin err=err+1; $display(&quot;[TB] FAIL 应为 NS绿/EW红&quot;); end\n        $display(&quot;[TB] NS_G: NS g=%b  EW r=%b&quot;, green_ns, red_ew);\n\n        #20;\n        if (red_ns + yellow_ns + green_ns != 1) begin err=err+1; $display(&quot;[TB] FAIL 互锁NS&quot;); end\n        if (!(yellow_ns &amp;&amp; red_ew)) begin err=err+1; $display(&quot;[TB] FAIL 应为 NS黄/EW红&quot;); end\n        $display(&quot;[TB] NS_Y: NS y=%b  EW r=%b&quot;, yellow_ns, red_ew);\n\n        #60;\n        if (red_ns + yellow_ns + green_ns != 1) begin err=err+1; $display(&quot;[TB] FAIL 互锁NS&quot;); end\n        if (!(green_ew &amp;&amp; red_ns)) begin err=err+1; $display(&quot;[TB] FAIL 应为 EW绿/NS红&quot;); end\n        $display(&quot;[TB] EW_G: EW g=%b  NS r=%b&quot;, green_ew, red_ns);\n\n        #20;\n        if (!(yellow_ew &amp;&amp; red_ns)) begin err=err+1; $display(&quot;[TB] FAIL 应为 EW黄/NS红&quot;); end\n        $display(&quot;[TB] EW_Y: EW y=%b  NS r=%b&quot;, yellow_ew, red_ns);\n\n        #20;\n        if (!(green_ns &amp;&amp; red_ew)) begin err=err+1; $display(&quot;[TB] FAIL 循环后应回到 NS绿/EW红&quot;); end\n\n        if (err == 0) $display(&quot;[TB] PASS: 交通灯周期完整且双向互锁&quot;);\n        else          $display(&quot;[TB] FAIL: 共 %0d 处错误&quot;, err);\n\n        $finish;\n    end\n\nendmodule\n\n`default_nettype wire\n"}, {"file": "code/phase2/vending_machine.v", "type": "verilog", "role": "synthesizable", "title": "vending_machine.v — 三段式售货机（0.5/1 元，1.5 出货找零）", "codeHtml": "//==============================================================================\n// vending_machine.v  —  可综合：自动售货机（三段式 FSM，Mealy）\n// 目标器件：通用 Xilinx Artix-7 / Zynq（7 系列）\n//\n// 简化模型：商品 1.5 元，只接受 0.5 元 / 1 元投币脉冲。\n//   金额状态：A0=0元, A05=0.5元, A10=1.0元\n//   规则：\n//     A0  +0.5 -&gt; A05 ; +1.0 -&gt; A10\n//     A05 +0.5 -&gt; A10 ; +1.0 -&gt; 出货(0.5+1.0=1.5)，回 A0\n//     A10 +0.5 -&gt; 出货(1.0+0.5=1.5)，回 A0\n//     A10 +1.0 -&gt; 出货且找零0.5(1.0+1.0=2.0)，回 A0\n//   输出 dispense / change_05 与当前输入有关 =&gt; Mealy 型。\n//==============================================================================\n`default_nettype none\n\nmodule vending_machine (\n    input  wire clk,\n    input  wire rst_n,\n    input  wire coin_05,    // 投入 0.5 元脉冲\n    input  wire coin_10,    // 投入 1.0 元脉冲\n    output reg  dispense,   // 出货\n    output reg  change_05   // 找零 0.5 元\n);\n\n    localparam A0  = 2&#x27;d0;\n    localparam A05 = 2&#x27;d1;\n    localparam A10 = 2&#x27;d2;\n\n    reg [1:0] state;\n    reg [1:0] next;\n\n    // 第一段：时序状态寄存器\n    always @(posedge clk or negedge rst_n) begin\n        if (!rst_n) state &lt;= A0;\n        else        state &lt;= next;\n    end\n\n    // 第二段：组合次态逻辑\n    always @(*) begin\n        next = state;\n        case (state)\n            A0:  if (coin_10)      next = A10;\n                 else if (coin_05) next = A05;\n            A05: if (coin_10)      next = A0;   // 1.5 出货\n                 else if (coin_05) next = A10;\n            A10:                     next = A0;   // 1.5 或 2.0 出货\n            default: next = A0;\n        endcase\n    end\n\n    // 第三段：组合输出（Mealy）\n    always @(*) begin\n        dispense  = 1&#x27;b0;\n        change_05 = 1&#x27;b0;\n        case (state)\n            A05: if (coin_10) dispense = 1&#x27;b1;          // 0.5+1.0=1.5\n            A10: if (coin_05) dispense = 1&#x27;b1;        // 1.0+0.5=1.5\n                 else if (coin_10) begin\n                     dispense  = 1&#x27;b1;                  // 2.0\n                     change_05 = 1&#x27;b1;                  // 找零 0.5\n                 end\n            default: ;\n        endcase\n    end\n\nendmodule\n\n`default_nettype wire\n"}, {"file": "code/phase2/tb_vending_machine.v", "type": "verilog", "role": "testbench", "title": "tb_vending_machine.v — 投币/出货/找零/复位", "codeHtml": "//==============================================================================\n// tb_vending_machine.v  —  Testbench：售货机投币/出货/找零/复位自检\n//   * 场景A：0.5+0.5+0.5=1.5 -&gt; 出货一次。\n//   * 复位后场景B：1.0+0.5=1.5 -&gt; 出货一次，无找零。\n//   * 复位后场景C：1.0+1.0=2.0 -&gt; 出货一次且找零 0.5。\n//==============================================================================\n`timescale 1ns/1ps\n`default_nettype none\n\nmodule tb_vending_machine;\n\n    reg      clk;\n    reg      rst_n;\n    reg      coin_05;\n    reg      coin_10;\n    wire     dispense;\n    wire     change_05;\n    integer  err;\n\n    always #10 clk = ~clk;\n\n    vending_machine u_dut (\n        .clk(clk), .rst_n(rst_n),\n        .coin_05(coin_05), .coin_10(coin_10),\n        .dispense(dispense), .change_05(change_05)\n    );\n\n    initial begin\n        clk=1&#x27;b0; rst_n=1&#x27;b0; coin_05=1&#x27;b0; coin_10=1&#x27;b0; err=0;\n        #25 rst_n=1&#x27;b1;\n\n        // 场景A：三次 0.5（每次脉冲：保持 20ns 高，再 20ns 低）\n        coin_05=1&#x27;b1; #20; coin_05=1&#x27;b0; #20;\n        coin_05=1&#x27;b1; #20; coin_05=1&#x27;b0; #20;\n        coin_05=1&#x27;b1; #20; coin_05=1&#x27;b0; #20;\n        #20;\n        if (!dispense) begin err=err+1; $display(&quot;[TB] FAIL A: 1.5 应出货&quot;); end\n        if (change_05) begin err=err+1; $display(&quot;[TB] FAIL A: 不应找零&quot;); end\n        $display(&quot;[TB] 场景A(0.5*3): dispense=%b change=%b&quot;, dispense, change_05);\n\n        // 复位 -&gt; 场景B：1.0 + 0.5\n        rst_n=1&#x27;b0; #20; rst_n=1&#x27;b1; #20;\n        coin_10=1&#x27;b1; #20; coin_10=1&#x27;b0; #20;\n        coin_05=1&#x27;b1; #20; coin_05=1&#x27;b0; #20;\n        #20;\n        if (!dispense) begin err=err+1; $display(&quot;[TB] FAIL B: 应出货&quot;); end\n        if (change_05) begin err=err+1; $display(&quot;[TB] FAIL B: 不应找零&quot;); end\n        $display(&quot;[TB] 场景B(1.0+0.5): dispense=%b change=%b&quot;, dispense, change_05);\n\n        // 复位 -&gt; 场景C：1.0 + 1.0 = 2.0 找零 0.5\n        rst_n=1&#x27;b0; #20; rst_n=1&#x27;b1; #20;\n        coin_10=1&#x27;b1; #20; coin_10=1&#x27;b0; #20;\n        coin_10=1&#x27;b1; #20; coin_10=1&#x27;b0; #20;\n        #20;\n        if (!dispense) begin err=err+1; $display(&quot;[TB] FAIL C: 应出货&quot;); end\n        if (!change_05) begin err=err+1; $display(&quot;[TB] FAIL C: 应找零0.5&quot;); end\n        $display(&quot;[TB] 场景C(1.0*2): dispense=%b change=%b&quot;, dispense, change_05);\n\n        if (err==0) $display(&quot;[TB] PASS: 售货机投币/出货/找零/复位全部正确&quot;);\n        else         $display(&quot;[TB] FAIL: 共 %0d 处错误&quot;, err);\n\n        $finish;\n    end\n\nendmodule\n\n`default_nettype wire\n"}], "diagrams": [{"file": "assets/phase2/moore-vs-mealy.svg", "title": "Moore vs Mealy 对比", "caption": "Moore 输出只看状态；Mealy 输出看状态+当前输入。", "svgRaw": "<svg xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"0 0 760 240\" font-family=\"system-ui,sans-serif\" font-size=\"12\">\n  <rect x=\"0\" y=\"0\" width=\"760\" height=\"240\" fill=\"#0d1420\"/>\n  <text x=\"380\" y=\"22\" fill=\"#7dd3fc\" text-anchor=\"middle\" font-size=\"15\" font-weight=\"bold\">Moore vs Mealy 状态机<\/text>\n\n  <!-- Moore -->\n  <text x=\"180\" y=\"55\" fill=\"#34d399\" text-anchor=\"middle\" font-size=\"13\" font-weight=\"bold\">Moore：输出只由当前状态决定<\/text>\n  <ellipse cx=\"120\" cy=\"110\" rx=\"55\" ry=\"30\" fill=\"#16233a\" stroke=\"#34d399\" stroke-width=\"2\"/>\n  <text x=\"120\" y=\"115\" fill=\"#e2e8f0\" text-anchor=\"middle\">S0 / 输出=0<\/text>\n  <ellipse cx=\"260\" cy=\"110\" rx=\"55\" ry=\"30\" fill=\"#16233a\" stroke=\"#34d399\" stroke-width=\"2\"/>\n  <text x=\"260\" y=\"115\" fill=\"#e2e8f0\" text-anchor=\"middle\">S1 / 输出=1<\/text>\n  <line x1=\"175\" y1=\"110\" x2=\"205\" y2=\"110\" stroke=\"#34d399\" stroke-width=\"2\"/>\n  <text x=\"190\" y=\"100\" fill=\"#6ee7b7\" text-anchor=\"middle\" font-size=\"10\">输入<\/text>\n  <text x=\"180\" y=\"170\" fill=\"#94a3b8\" text-anchor=\"middle\" font-size=\"11\">输出画在状态里，更稳定、打拍延迟一拍<\/text>\n\n  <!-- Mealy -->\n  <text x=\"540\" y=\"55\" fill=\"#f59e0b\" text-anchor=\"middle\" font-size=\"13\" font-weight=\"bold\">Mealy：输出取决于状态+当前输入<\/text>\n  <ellipse cx=\"480\" cy=\"110\" rx=\"55\" ry=\"30\" fill=\"#16233a\" stroke=\"#f59e0b\" stroke-width=\"2\"/>\n  <text x=\"480\" y=\"115\" fill=\"#e2e8f0\" text-anchor=\"middle\">S0<\/text>\n  <ellipse cx=\"620\" cy=\"110\" rx=\"55\" ry=\"30\" fill=\"#16233a\" stroke=\"#f59e0b\" stroke-width=\"2\"/>\n  <text x=\"620\" y=\"115\" fill=\"#e2e8f0\" text-anchor=\"middle\">S1<\/text>\n  <line x1=\"535\" y1=\"110\" x2=\"565\" y2=\"110\" stroke=\"#f59e0b\" stroke-width=\"2\"/>\n  <text x=\"550\" y=\"100\" fill=\"#fcd34d\" text-anchor=\"middle\" font-size=\"10\">输入/输出<\/text>\n  <text x=\"540\" y=\"170\" fill=\"#94a3b8\" text-anchor=\"middle\" font-size=\"11\">输出画在转移边上，响应更快、状态数更少<\/text>\n<\/svg>\n"}, {"file": "assets/phase2/traffic-fsm.svg", "title": "交通灯状态转移图", "caption": "南北绿黄→东西绿黄循环，双向互锁必有红灯。", "svgRaw": "<svg xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"0 0 760 280\" font-family=\"system-ui,sans-serif\" font-size=\"12\">\n  <rect x=\"0\" y=\"0\" width=\"760\" height=\"280\" fill=\"#0d1420\"/>\n  <text x=\"380\" y=\"22\" fill=\"#7dd3fc\" text-anchor=\"middle\" font-size=\"15\" font-weight=\"bold\">交通灯状态转移图（Moore，南北/东西循环）<\/text>\n\n  <ellipse cx=\"150\" cy=\"90\" rx=\"90\" ry=\"40\" fill=\"#16233a\" stroke=\"#34d399\" stroke-width=\"2\"/>\n  <text x=\"150\" y=\"86\" fill=\"#6ee7b7\" text-anchor=\"middle\" font-weight=\"bold\">S_NS_G<\/text>\n  <text x=\"150\" y=\"104\" fill=\"#94a3b8\" text-anchor=\"middle\" font-size=\"10\">南北绿 / 东西红<\/text>\n\n  <ellipse cx=\"380\" cy=\"90\" rx=\"90\" ry=\"40\" fill=\"#16233a\" stroke=\"#f59e0b\" stroke-width=\"2\"/>\n  <text x=\"380\" y=\"86\" fill=\"#fcd34d\" text-anchor=\"middle\" font-weight=\"bold\">S_NS_Y<\/text>\n  <text x=\"380\" y=\"104\" fill=\"#94a3b8\" text-anchor=\"middle\" font-size=\"10\">南北黄 / 东西红<\/text>\n\n  <ellipse cx=\"610\" cy=\"90\" rx=\"90\" ry=\"40\" fill=\"#16233a\" stroke=\"#34d399\" stroke-width=\"2\"/>\n  <text x=\"610\" y=\"86\" fill=\"#6ee7b7\" text-anchor=\"middle\" font-weight=\"bold\">S_EW_G<\/text>\n  <text x=\"610\" y=\"104\" fill=\"#94a3b8\" text-anchor=\"middle\" font-size=\"10\">东西绿 / 南北红<\/text>\n\n  <ellipse cx=\"380\" cy=\"210\" rx=\"90\" ry=\"40\" fill=\"#16233a\" stroke=\"#f59e0b\" stroke-width=\"2\"/>\n  <text x=\"380\" y=\"206\" fill=\"#fcd34d\" text-anchor=\"middle\" font-weight=\"bold\">S_EW_Y<\/text>\n  <text x=\"380\" y=\"224\" fill=\"#94a3b8\" text-anchor=\"middle\" font-size=\"10\">东西黄 / 南北红<\/text>\n\n  <line x1=\"240\" y1=\"90\" x2=\"290\" y2=\"90\" stroke=\"#7dd3fc\" stroke-width=\"2\"/>\n  <text x=\"265\" y=\"80\" fill=\"#7dd3fc\" text-anchor=\"middle\" font-size=\"10\">T_GREEN<\/text>\n  <line x1=\"470\" y1=\"90\" x2=\"520\" y2=\"90\" stroke=\"#7dd3fc\" stroke-width=\"2\"/>\n  <text x=\"495\" y=\"80\" fill=\"#7dd3fc\" text-anchor=\"middle\" font-size=\"10\">T_YELLOW<\/text>\n  <path d=\"M610 130 Q610 210 470 210\" fill=\"none\" stroke=\"#7dd3fc\" stroke-width=\"2\"/>\n  <text x=\"600\" y=\"175\" fill=\"#7dd3fc\" font-size=\"10\">T_GREEN<\/text>\n  <path d=\"M290 210 Q150 210 150 130\" fill=\"none\" stroke=\"#7dd3fc\" stroke-width=\"2\"/>\n  <text x=\"150\" y=\"175\" fill=\"#7dd3fc\" font-size=\"10\">T_YELLOW<\/text>\n  <text x=\"380\" y=\"265\" fill=\"#64748b\" text-anchor=\"middle\" font-size=\"11\">互锁：任一方向同一时刻只亮一种灯，另一方向保持红<\/text>\n<\/svg>\n"}, {"file": "assets/phase2/vending-fsm.svg", "title": "售货机状态转移图", "caption": "金额状态 A0/A05/A10，投币触发出货与找零。", "svgRaw": "<svg xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"0 0 760 260\" font-family=\"system-ui,sans-serif\" font-size=\"12\">\n  <rect x=\"0\" y=\"0\" width=\"760\" height=\"260\" fill=\"#0d1420\"/>\n  <text x=\"380\" y=\"22\" fill=\"#7dd3fc\" text-anchor=\"middle\" font-size=\"15\" font-weight=\"bold\">自动售货机状态转移图（Mealy，商品 1.5 元）<\/text>\n\n  <ellipse cx=\"120\" cy=\"130\" rx=\"80\" ry=\"45\" fill=\"#16233a\" stroke=\"#38bdf8\" stroke-width=\"2\"/>\n  <text x=\"120\" y=\"126\" fill=\"#7dd3fc\" text-anchor=\"middle\" font-weight=\"bold\">A0<\/text>\n  <text x=\"120\" y=\"144\" fill=\"#94a3b8\" text-anchor=\"middle\" font-size=\"10\">金额 0 元<\/text>\n\n  <ellipse cx=\"380\" cy=\"130\" rx=\"80\" ry=\"45\" fill=\"#16233a\" stroke=\"#38bdf8\" stroke-width=\"2\"/>\n  <text x=\"380\" y=\"126\" fill=\"#7dd3fc\" text-anchor=\"middle\" font-weight=\"bold\">A05<\/text>\n  <text x=\"380\" y=\"144\" fill=\"#94a3b8\" text-anchor=\"middle\" font-size=\"10\">金额 0.5 元<\/text>\n\n  <ellipse cx=\"640\" cy=\"130\" rx=\"80\" ry=\"45\" fill=\"#16233a\" stroke=\"#38bdf8\" stroke-width=\"2\"/>\n  <text x=\"640\" y=\"126\" fill=\"#7dd3fc\" text-anchor=\"middle\" font-weight=\"bold\">A10<\/text>\n  <text x=\"640\" y=\"144\" fill=\"#94a3b8\" text-anchor=\"middle\" font-size=\"10\">金额 1.0 元<\/text>\n\n  <line x1=\"200\" y1=\"130\" x2=\"300\" y2=\"130\" stroke=\"#34d399\" stroke-width=\"2\"/>\n  <text x=\"250\" y=\"120\" fill=\"#6ee7b7\" text-anchor=\"middle\" font-size=\"10\">投0.5<\/text>\n  <line x1=\"460\" y1=\"130\" x2=\"560\" y2=\"130\" stroke=\"#34d399\" stroke-width=\"2\"/>\n  <text x=\"510\" y=\"120\" fill=\"#6ee7b7\" text-anchor=\"middle\" font-size=\"10\">投0.5<\/text>\n\n  <path d=\"M640 85 Q40 40 120 85\" fill=\"none\" stroke=\"#f59e0b\" stroke-width=\"2\"/>\n  <text x=\"380\" y=\"45\" fill=\"#fcd34d\" text-anchor=\"middle\" font-size=\"10\">A05+投1.0 / A10+投0.5 → 出货，回 A0<\/text>\n\n  <path d=\"M640 175 Q40 225 120 175\" fill=\"none\" stroke=\"#f87171\" stroke-width=\"2\"/>\n  <text x=\"380\" y=\"220\" fill=\"#fca5a5\" text-anchor=\"middle\" font-size=\"10\">A10+投1.0=2.0 → 出货+找零0.5，回 A0<\/text>\n\n  <path d=\"M150 95 Q250 60 350 95\" fill=\"none\" stroke=\"#475569\" stroke-width=\"1.5\" stroke-dasharray=\"4 3\"/>\n  <text x=\"250\" y=\"70\" fill=\"#94a3b8\" text-anchor=\"middle\" font-size=\"10\">A0+投1.0 → A10<\/text>\n<\/svg>\n"}], "tools": [{"name": "AMD Vivado ML Edition 下载", "url": "https://www.xilinx.com/support/download.html", "required": true, "note": "免费 ML Standard 版即可；访问日期 2026-10。"}, {"name": "通用引脚约束模板 fpga_common.xdc", "url": "../code/common/fpga_common.xdc", "required": true, "note": "相对本仓库；按开发板官方原理图替换 PACKAGE_PIN。"}], "tasks": [{"id": "task-2-4-1", "text": "用状态机实现交通信号灯控制器"}, {"id": "task-2-4-2", "text": "实现按键控制的自动售货机状态机"}], "cards": [{"q": "Moore 与 Mealy 的区别？", "a": "Moore 输出只由当前状态决定；Mealy 输出由当前状态+当前输入共同决定。", "tags": ["Moore", "Mealy"]}, {"q": "三段式状态机是哪三段？", "a": "①时序状态寄存器(state<=next)；②组合次态逻辑(case算next)；③组合/时序输出。", "tags": ["三段式", "写法"]}, {"q": "为什么 FPGA 常用独热编码？", "a": "FPGA 触发器充裕而 LUT 紧张，独热每个状态一位，译码逻辑简单、速度快、毛刺少。", "tags": ["独热", "编码"]}, {"q": "交通灯为什么是 Moore？", "a": "灯色只取决于当前相位状态，与输入无关，输出画在状态里。", "tags": ["Moore", "交通灯"]}, {"q": "售货机为什么是 Mealy？", "a": "出货/找零不仅取决于金额状态，还取决于刚投入哪种币，输出在转移边上。", "tags": ["Mealy", "售货机"]}, {"q": "状态参数为什么用 localparam？", "a": "避免裸数字、便于维护与综合；状态名一目了然。", "tags": ["localparam"]}, {"q": "交通灯的互锁指什么？", "a": "任一方向同一时刻只亮一种灯，且另一方向保持红灯，防止路口冲突。", "tags": ["互锁", "交通灯"]}, {"q": "状态机次态组合块的敏感表怎么写？", "a": "用 always @(*) 全覆盖，避免锁存；并写好 default 分支。", "tags": ["组合逻辑", "latch"]}], "quiz": [{"q": "Moore 状态机的输出取决于？", "options": ["仅当前状态", "当前输入", "时钟频率", "复位"], "answer": 0, "explain": "Moore 输出只由当前状态决定。"}, {"q": "三段式状态机第一段做什么？", "options": ["算 next", "state<=next 时序更新现态", "算输出", "产生时钟"], "answer": 1, "explain": "第一段是时序状态寄存器，时钟沿把 next 打入 state。"}, {"q": "FPGA 中状态编码常优先选？", "options": ["二进制", "独热 one-hot", "格雷码", "随意"], "answer": 1, "explain": "FPGA 触发器充裕，独热译码简单快速毛刺少。"}, {"q": "售货机在 A10 状态再投 1.0 元应？", "options": ["不出货", "出货且找零 0.5", "退回所有币", "进入错误态"], "answer": 1, "explain": "1.0+1.0=2.0，商品 1.5 元，出货并找零 0.5 元。"}], "docHtml": "<h1>2.4 有限状态机 FSM<\/h1>\n<h2>什么是状态机<\/h2>\n<p><strong>有限状态机(FSM)<\/strong> 把一个时序系统拆成有限个<strong>状态<\/strong>，根据当前状态和输入决定<strong>下一个状态<\/strong>和<strong>输出<\/strong>。凡是\"按步骤流转、有先后顺序\"的控制逻辑（交通灯、售货机、串口收发、协议握手）都该用状态机写，而不是一堆嵌套 if。<\/p>\n<h2>Moore 与 Mealy<\/h2>\n<ul>\n<li><strong>Moore 型<\/strong>：输出<strong>只由当前状态<\/strong>决定。输出画在状态里，更稳定（不会因输入毛刺立刻变），但输出比输入晚一拍。<\/li>\n<li><strong>Mealy 型<\/strong>：输出由<strong>当前状态 + 当前输入<\/strong>共同决定。输出画在转移边上，响应更快、状态数更少，但对输入毛刺更敏感。<\/li>\n<\/ul>\n<p><img alt=\"Moore vs Mealy\" src=\"../../../assets/phase2/moore-vs-mealy.svg\" /><\/p>\n<p>交通灯是典型 Moore（灯色只取决于当前是哪个相位）；售货机的\"出货/找零\"取决于当前金额状态<strong>和<\/strong>刚投的币，是 Mealy。<\/p>\n<h2>三段式状态机标准写法<\/h2>\n<p>推荐把状态机拆成三段，清晰、易维护、易约束：<\/p>\n<ol>\n<li><strong>第一段·时序状态寄存器<\/strong>：<code>state &lt;= next;<\/code>（时钟沿更新现态）。<\/li>\n<li><strong>第二段·组合次态逻辑<\/strong>：<code>always @(*) case(state)<\/code> 算 <code>next<\/code>。<\/li>\n<li><strong>第三段·组合（或时序）输出<\/strong>：根据 <code>state<\/code>（和输入）算输出。<\/li>\n<\/ol>\n<pre><code class=\"language-verilog\">// 第一段\nalways @(posedge clk or negedge rst_n)\n  if (!rst_n) state &lt;= S0; else state &lt;= next;\n// 第二段\nalways @(*) begin\n  next = state;\n  case (state) ... endcase\nend\n// 第三段\nalways @(*) begin\n  dispense = 1'b0; ...\nend\n<\/code><\/pre>\n<h2>状态编码与优化<\/h2>\n<ul>\n<li><strong>二进制编码<\/strong>：用最少触发器（n 状态需 log2(n) 位），但译码组合逻辑复杂。<\/li>\n<li><strong>独热编码(one-hot)<\/strong>：每个状态一位，n 状态用 n 个触发器。FPGA 触发器资源充裕而 LUT 紧张，独热编码译码简单、速度快、毛刺少，是 FPGA 常用选择。<\/li>\n<li>状态用 <code>localparam<\/code> 定义，不要用裸数字。<\/li>\n<\/ul>\n<h2>实例一：交通灯<\/h2>\n<p><code>traffic_light.v<\/code> 是 Moore 状态机，4 个状态循环：<\/p>\n<pre><code>NS_G(南北绿/东西红) → NS_Y(南北黄/东西红)\n→ EW_G(东西绿/南北红) → EW_Y(东西黄/南北红) → NS_G\n<\/code><\/pre>\n<p>每个状态维持 <code>T_GREEN<\/code> / <code>T_YELLOW<\/code> 拍后切换。输出做<strong>互锁<\/strong>：任一方向同一时刻只亮一种灯，另一方向必为红。<\/p>\n<p><img alt=\"交通灯状态转移图\" src=\"../../../assets/phase2/traffic-fsm.svg\" /><\/p>\n<p><code>tb_traffic_light.v<\/code> 跑完整周期并逐状态断言互锁。<\/p>\n<h2>实例二：自动售货机<\/h2>\n<p><code>vending_machine.v<\/code> 是三段式 Mealy 状态机。商品 1.5 元，只收 0.5/1 元：<\/p>\n<ul>\n<li>金额状态：<code>A0 / A05 / A10<\/code>。<\/li>\n<li><code>A05 + 投1.0<\/code> = 1.5 → 出货；<code>A10 + 投0.5<\/code> = 1.5 → 出货；<code>A10 + 投1.0<\/code> = 2.0 → 出货并找零 0.5。<\/li>\n<\/ul>\n<p><img alt=\"售货机状态转移图\" src=\"../../../assets/phase2/vending-fsm.svg\" /><\/p>\n<p><code>tb_vending_machine.v<\/code> 覆盖三种投币组合与复位。<\/p>\n<h2>关键小结<\/h2>\n<ul>\n<li>三段式：状态寄存器 / 次态组合 / 输出组合。<\/li>\n<li>Moore 输出只看状态；Mealy 输出看状态+输入。<\/li>\n<li>FPGA 优先独热编码；状态用 localparam。<\/li>\n<\/ul>\n<blockquote>\n<p>本仓库环境无 Vivado 工程，代码均通过结构校验；实际综合与上板看到交通灯/售货机效果需在 Vivado ML Standard（Artix-7/Zynq）中完成。<\/p>\n<\/blockquote>"}, {"chapterId": "3.1", "phase": 3, "slug": "uart", "title": "UART 串口通信", "summary": "8N1 帧格式、115200 波特率分频（50M 下 BIT_DIV=434、16 倍过采样 OV_DIV=27）、移位发送 FSM 与中点采样多数表决接收，实现串口回显。", "doc": "docs/phase3/ch1-uart.md", "code": [{"file": "code/phase3/uart_tx.v", "type": "verilog", "role": "synthesizable", "title": "uart_tx.v — 移位发送 FSM（8N1）", "codeHtml": "//==============================================================================\n// uart_tx.v  —  可综合：UART 发送模块（8N1：1 起始位 + 8 数据位 + 1 停止位）\n// 波特率分频：每 BIT_DIV 个系统时钟发 1 个比特。\n//   BIT_DIV = CLK_FREQ_HZ / BAUD_RATE\n//   例：50MHz / 115200 ≈ 434（即每位约 434 个时钟，实测波特率略低 ~115193）。\n// 状态机：IDLE -&gt; START(发0) -&gt; DATA(LSB 先出，共8位) -&gt; STOP(发1) -&gt; IDLE。\n//==============================================================================\n`default_nettype none\n\nmodule uart_tx #(\n    parameter integer CLK_FREQ_HZ = 50_000_000,\n    parameter integer BAUD_RATE    = 115200\n)(\n    input  wire       clk,\n    input  wire       rst_n,\n    input  wire [7:0] tx_data,    // 待发送字节（上升沿被锁存）\n    input  wire       tx_valid,    // 置高请求发送一字节（需 tx_ready=1）\n    output wire       tx_ready,   // 空闲，可接收新字节\n    output reg        tx_out       // 串行发送线，空闲为高电平\n);\n\n    // 每位所需的系统时钟数（整数分频）\n    localparam integer BIT_DIV = CLK_FREQ_HZ / BAUD_RATE;\n\n    localparam S_IDLE  = 0;\n    localparam S_START = 1;\n    localparam S_DATA  = 2;\n    localparam S_STOP  = 3;\n\n    reg [15:0] baud_cnt;\n    reg        baud_tick;\n    reg [1:0]  state;\n    reg [2:0]  bit_cnt;\n    reg [7:0]  shift;\n    reg        ready_q;\n\n    // ---- 波特率 tick：仅在发送期间计数，每 BIT_DIV 个时钟产生一拍 tick ----\n    always @(posedge clk or negedge rst_n) begin\n        if (!rst_n) begin\n            baud_cnt  &lt;= 16&#x27;d0;\n            baud_tick &lt;= 1&#x27;b0;\n        end else if (state == S_IDLE) begin\n            baud_cnt  &lt;= 16&#x27;d0;\n            baud_tick &lt;= 1&#x27;b0;\n        end else if (baud_cnt &gt;= BIT_DIV[15:0] - 1) begin\n            baud_cnt  &lt;= 16&#x27;d0;\n            baud_tick &lt;= 1&#x27;b1;\n        end else begin\n            baud_cnt  &lt;= baud_cnt + 1&#x27;b1;\n            baud_tick &lt;= 1&#x27;b0;\n        end\n    end\n\n    // ---- 发送 FSM ----\n    always @(posedge clk or negedge rst_n) begin\n        if (!rst_n) begin\n            state   &lt;= S_IDLE;\n            bit_cnt &lt;= 3&#x27;d0;\n            shift   &lt;= 8&#x27;d0;\n            tx_out  &lt;= 1&#x27;b1;      // 空闲高电平\n            ready_q &lt;= 1&#x27;b1;\n        end else begin\n            case (state)\n            S_IDLE: begin\n                tx_out  &lt;= 1&#x27;b1;\n                ready_q &lt;= 1&#x27;b1;\n                bit_cnt &lt;= 3&#x27;d0;\n                if (tx_valid) begin\n                    shift   &lt;= tx_data;\n                    ready_q &lt;= 1&#x27;b0;\n                    state   &lt;= S_START;\n                end\n            end\n            S_START: begin\n                tx_out &lt;= 1&#x27;b0;            // 起始位：拉低\n                if (baud_tick) state &lt;= S_DATA;\n            end\n            S_DATA: begin\n                tx_out &lt;= shift[0];        // LSB 先发\n                if (baud_tick) begin\n                    shift   &lt;= {1&#x27;b0, shift[7:1]};\n                    bit_cnt &lt;= bit_cnt + 1&#x27;b1;\n                    if (bit_cnt == 3&#x27;d7) state &lt;= S_STOP;\n                end\n            end\n            S_STOP: begin\n                tx_out &lt;= 1&#x27;b1;            // 停止位：拉高\n                if (baud_tick) begin\n                    state   &lt;= S_IDLE;\n                    ready_q &lt;= 1&#x27;b1;\n                end\n            end\n            default: state &lt;= S_IDLE;\n            endcase\n        end\n    end\n\n    assign tx_ready = ready_q;\n\nendmodule\n\n`default_nettype wire\n"}, {"file": "code/phase3/tb_uart_tx.v", "type": "verilog", "role": "testbench", "title": "tb_uart_tx.v — 自检比特序列与波特率", "codeHtml": "//==============================================================================\n// tb_uart_tx.v  —  Testbench：UART 发送自检\n// 1) 检测起始位下降沿后，逐位在每位中点采样；\n// 2) 校验序列 = 起始0 + 8&#x27;hA5(LSB先出) + 停止1；\n// 3) 相邻两位中点时间间隔应约等于 BIT_DIV=434 个系统时钟。\n//==============================================================================\n`timescale 1ns/1ps\n`default_nettype none\n\nmodule tb_uart_tx;\n\n    localparam integer BIT_DIV = 434;\n\n    reg        clk   = 1&#x27;b0;\n    reg        rst_n = 1&#x27;b0;\n    reg  [7:0] tx_data  = 8&#x27;h00;\n    reg        tx_valid  = 1&#x27;b0;\n    wire       tx_ready;\n    wire       tx_out;\n\n    integer    i;\n    integer    k;\n    reg [7:0]  recv;\n    integer    pass_cnt;\n    integer    fail_cnt;\n    integer    t_last_sample;\n    integer    period;\n\n    always #10 clk = ~clk;   // 50MHz\n\n    uart_tx #(\n        .CLK_FREQ_HZ(50_000_000),\n        .BAUD_RATE  (115200)\n    ) u_dut (\n        .clk      (clk),\n        .rst_n    (rst_n),\n        .tx_data  (tx_data),\n        .tx_valid (tx_valid),\n        .tx_ready (tx_ready),\n        .tx_out   (tx_out)\n    );\n\n    initial begin\n        pass_cnt = 0; fail_cnt = 0;\n\n        rst_n = 1&#x27;b0;\n        for (k = 0; k &lt; 20; k = k + 1) @(posedge clk);\n        rst_n = 1&#x27;b1;\n        for (k = 0; k &lt; 20; k = k + 1) @(posedge clk);\n\n        // 发起发送 8&#x27;hA5\n        @(posedge clk);\n        tx_data  = 8&#x27;hA5;\n        tx_valid = 1&#x27;b1;\n        @(posedge clk);\n        tx_valid = 1&#x27;b0;\n\n        // 等待起始位出现（tx_out 拉低）\n        i = 0;\n        while (tx_out === 1&#x27;b1 &amp;&amp; i &lt; 2000) begin\n            @(posedge clk);\n            i = i + 1;\n        end\n\n        // 到起始位中点\n        for (k = 0; k &lt; BIT_DIV/2; k = k + 1) @(posedge clk);\n        t_last_sample = $time;\n        if (tx_out === 1&#x27;b0) begin\n            pass_cnt = pass_cnt + 1;\n            $display(&quot;[CHK] start bit = 0  OK&quot;);\n        end else begin\n            fail_cnt = fail_cnt + 1;\n            $display(&quot;[CHK] start bit != 0  FAIL, got %b&quot;, tx_out);\n        end\n\n        // 依次采样 8 个数据位（LSB 先出）\n        recv = 8&#x27;h00;\n        for (i = 0; i &lt; 8; i = i + 1) begin\n            for (k = 0; k &lt; BIT_DIV; k = k + 1) @(posedge clk);\n            period = $time - t_last_sample;\n            t_last_sample = $time;\n            recv[i] = tx_out;\n            $display(&quot;[CHK] bit[%0d] = %b  (period=%0d ns)&quot;, i, tx_out, period);\n        end\n        if (recv == 8&#x27;hA5) begin\n            pass_cnt = pass_cnt + 1;\n            $display(&quot;[CHK] data byte = 8&#x27;hA5  OK&quot;);\n        end else begin\n            fail_cnt = fail_cnt + 1;\n            $display(&quot;[CHK] data byte = 8&#x27;h%0h (expect A5)  FAIL&quot;, recv);\n        end\n\n        // 采样停止位\n        for (k = 0; k &lt; BIT_DIV; k = k + 1) @(posedge clk);\n        if (tx_out === 1&#x27;b1) begin\n            pass_cnt = pass_cnt + 1;\n            $display(&quot;[CHK] stop bit = 1  OK&quot;);\n        end else begin\n            fail_cnt = fail_cnt + 1;\n            $display(&quot;[CHK] stop bit != 1  FAIL&quot;);\n        end\n\n        $display(&quot;========================================&quot;);\n        $display(&quot;tb_uart_tx: PASS=%0d FAIL=%0d&quot;, pass_cnt, fail_cnt);\n        $display(&quot;========================================&quot;);\n        #1000;\n        $finish;\n    end\n\nendmodule\n\n`default_nettype wire\n"}, {"file": "code/phase3/uart_rx.v", "type": "verilog", "role": "synthesizable", "title": "uart_rx.v — 16 倍过采样+中点采样+多数表决", "codeHtml": "//==============================================================================\n// uart_rx.v  —  可综合：UART 接收模块（8N1）\n// 关键技术：\n//   1) 两级寄存器同步 rx_in，防止亚稳态；\n//   2) 16 倍过采样：OV_DIV = CLK/(BAUD*16)，例 50M/(115200*16) ≈ 27；\n//   3) 检测起始位下降沿后，把过采样计数器复位，在每位中点(过采样计数=7)采样；\n//   4) 中点附近连续 3 个过采样样本做&quot;多数表决&quot;，抗毛刺；\n//   5) 停止位中点采到 0 -&gt; frame_err=1（帧错误）。\n//==============================================================================\n`default_nettype none\n\nmodule uart_rx #(\n    parameter integer CLK_FREQ_HZ = 50_000_000,\n    parameter integer BAUD_RATE    = 115200\n)(\n    input  wire       clk,\n    input  wire       rst_n,\n    input  wire       rx_in,        // 串行接收线（空闲高电平）\n    output reg  [7:0] rx_data,      // 并行收到的字节\n    output reg        rx_valid,     // 收完一字节，拉高 1 拍\n    output reg        frame_err     // 停止位不是高电平 -&gt; 帧错误\n);\n\n    // 16 倍过采样分频\n    localparam integer OV_DIV = CLK_FREQ_HZ / (BAUD_RATE * 16);\n\n    // ---- 输入同步（防亚稳态）----\n    reg rx_meta, rx_sync;\n    always @(posedge clk or negedge rst_n) begin\n        if (!rst_n) begin\n            rx_meta &lt;= 1&#x27;b1;\n            rx_sync &lt;= 1&#x27;b1;\n        end else begin\n            rx_meta &lt;= rx_in;\n            rx_sync &lt;= rx_meta;\n        end\n    end\n\n    // ---- 16x 过采样 tick 发生器 ----\n    reg [15:0] ov_cnt;      // 计数到 OV_DIV-1 产生 samp_tick\n    reg        samp_tick;\n    always @(posedge clk or negedge rst_n) begin\n        if (!rst_n) begin\n            ov_cnt    &lt;= 16&#x27;d0;\n            samp_tick &lt;= 1&#x27;b0;\n        end else if (!active_q) begin\n            ov_cnt    &lt;= 16&#x27;d0;\n            samp_tick &lt;= 1&#x27;b0;\n        end else if (ov_cnt &gt;= OV_DIV[15:0] - 1) begin\n            ov_cnt    &lt;= 16&#x27;d0;\n            samp_tick &lt;= 1&#x27;b1;\n        end else begin\n            ov_cnt    &lt;= ov_cnt + 1&#x27;b1;\n            samp_tick &lt;= 1&#x27;b0;\n        end\n    end\n\n    // ---- 接收状态 ----\n    reg        active_q;     // 正在接收一帧\n    reg [3:0]  bit_phase;    // 过采样相位 0..15\n    reg [3:0]  bit_idx;      // 0=起始位, 1..8=数据位, 9=停止位\n    reg [2:0]  samp_sh;      // 最近 3 个过采样样本（用于多数表决）\n\n    // 多数表决：3 取 2\n    wire bit_vote = (samp_sh[2] &amp; samp_sh[1]) |\n                    (samp_sh[2] &amp; samp_sh[0]) |\n                    (samp_sh[1] &amp; samp_sh[0]);\n\n    always @(posedge clk or negedge rst_n) begin\n        if (!rst_n) begin\n            active_q  &lt;= 1&#x27;b0;\n            bit_phase &lt;= 4&#x27;d0;\n            bit_idx   &lt;= 4&#x27;d0;\n            samp_sh   &lt;= 3&#x27;b111;\n            rx_data   &lt;= 8&#x27;d0;\n            rx_valid  &lt;= 1&#x27;b0;\n            frame_err &lt;= 1&#x27;b0;\n        end else begin\n            rx_valid &lt;= 1&#x27;b0;\n            if (!active_q) begin\n                // 空闲：检测起始位下降沿（rx_sync 由 1-&gt;0）\n                bit_phase &lt;= 4&#x27;d0;\n                bit_idx   &lt;= 4&#x27;d0;\n                samp_sh   &lt;= 3&#x27;b111;\n                if (rx_sync == 1&#x27;b0) begin\n                    active_q &lt;= 1&#x27;b1;\n                end\n            end else if (samp_tick) begin\n                // 移位记录最近 3 个样本\n                samp_sh   &lt;= {samp_sh[1:0], rx_sync};\n                bit_phase &lt;= bit_phase + 1&#x27;b1;\n                if (bit_phase == 4&#x27;d15) begin\n                    bit_phase &lt;= 4&#x27;d0;\n                    bit_idx   &lt;= bit_idx + 1&#x27;b1;\n                end\n                // 每位中点 = bit_phase==7，用多数表决采样\n                if (bit_phase == 4&#x27;d7) begin\n                    case (bit_idx)\n                    4&#x27;d0: begin                       // 起始位中点\n                        if (bit_vote == 1&#x27;b1) begin   // 起点不是低 -&gt; 错误，放弃\n                            active_q  &lt;= 1&#x27;b0;\n                            frame_err &lt;= 1&#x27;b1;\n                        end\n                    end\n                    4&#x27;d1,4&#x27;d2,4&#x27;d3,4&#x27;d4,4&#x27;d5,4&#x27;d6,4&#x27;d7,4&#x27;d8: begin\n                        rx_data[bit_idx - 4&#x27;d1] &lt;= bit_vote;  // LSB 先收\n                    end\n                    4&#x27;d9: begin                       // 停止位中点\n                        if (bit_vote == 1&#x27;b0)\n                            frame_err &lt;= 1&#x27;b1;\n                        rx_valid &lt;= 1&#x27;b1;\n                        active_q &lt;= 1&#x27;b0;\n                    end\n                    default: active_q &lt;= 1&#x27;b0;\n                    endcase\n                end\n            end\n        end\n    end\n\nendmodule\n\n`default_nettype wire\n"}, {"file": "code/phase3/tb_uart_rx.v", "type": "verilog", "role": "testbench", "title": "tb_uart_rx.v — 喂标准帧验证并行数据与帧错误", "codeHtml": "//==============================================================================\n// tb_uart_rx.v  —  Testbench：UART 接收自检（不使用 task，全部内联）\n// 1) 在 rx_in 喂入 8N1 帧 8&#x27;hA5（LSB 先出），断言 rx_data==8&#x27;hA5、frame_err==0；\n// 2) 再喂一帧&quot;停止位=0&quot;的坏帧，断言 frame_err==1。\n//==============================================================================\n`timescale 1ns/1ps\n`default_nettype none\n\nmodule tb_uart_rx;\n\n    localparam integer BIT_DIV = 434;\n\n    reg        clk     = 1&#x27;b0;\n    reg        rst_n   = 1&#x27;b0;\n    reg        rx_in   = 1&#x27;b1;\n    wire [7:0] rx_data;\n    wire       rx_valid;\n    wire       frame_err;\n\n    integer    k;\n    integer    j;\n    reg [7:0]  dbus;\n    reg [7:0]  expected;\n    integer    pass_cnt;\n    integer    fail_cnt;\n\n    always #10 clk = ~clk;\n\n    uart_rx #(\n        .CLK_FREQ_HZ(50_000_000),\n        .BAUD_RATE  (115200)\n    ) u_dut (\n        .clk       (clk),\n        .rst_n     (rst_n),\n        .rx_in     (rx_in),\n        .rx_data   (rx_data),\n        .rx_valid  (rx_valid),\n        .frame_err (frame_err)\n    );\n\n    initial begin\n        pass_cnt = 0; fail_cnt = 0;\n        rst_n = 1&#x27;b0;\n        for (k = 0; k &lt; 20; k = k + 1) @(posedge clk);\n        rst_n = 1&#x27;b1;\n        for (k = 0; k &lt; 20; k = k + 1) @(posedge clk);\n\n        // ---- 正常帧：8&#x27;hA5，正常停止位 ----\n        dbus = 8&#x27;hA5;\n        rx_in = 1&#x27;b0;                                  // 起始位\n        for (k = 0; k &lt; BIT_DIV; k = k + 1) @(posedge clk);\n        for (j = 0; j &lt; 8; j = j + 1) begin           // 数据位 LSB 先出\n            rx_in = dbus[j];\n            for (k = 0; k &lt; BIT_DIV; k = k + 1) @(posedge clk);\n        end\n        rx_in = 1&#x27;b1;                                  // 停止位\n        for (k = 0; k &lt; BIT_DIV; k = k + 1) @(posedge clk);\n        rx_in = 1&#x27;b1;\n\n        k = 0;\n        while (rx_valid !== 1&#x27;b1 &amp;&amp; k &lt; 3000) begin\n            @(posedge clk); k = k + 1;\n        end\n        expected = 8&#x27;hA5;\n        if (rx_data === expected &amp;&amp; frame_err === 1&#x27;b0) begin\n            pass_cnt = pass_cnt + 1;\n            $display(&quot;[CHK] good frame: rx_data=8&#x27;h%0h frame_err=0  OK&quot;, rx_data);\n        end else begin\n            fail_cnt = fail_cnt + 1;\n            $display(&quot;[CHK] good frame: rx_data=8&#x27;h%0h frame_err=%b  FAIL&quot;,\n                     rx_data, frame_err);\n        end\n        for (k = 0; k &lt; 500; k = k + 1) @(posedge clk);\n\n        // ---- 坏帧：停止位为 0 ----\n        dbus = 8&#x27;h55;\n        rx_in = 1&#x27;b0;\n        for (k = 0; k &lt; BIT_DIV; k = k + 1) @(posedge clk);\n        for (j = 0; j &lt; 8; j = j + 1) begin\n            rx_in = dbus[j];\n            for (k = 0; k &lt; BIT_DIV; k = k + 1) @(posedge clk);\n        end\n        rx_in = 1&#x27;b0;                                  // 错误停止位\n        for (k = 0; k &lt; BIT_DIV; k = k + 1) @(posedge clk);\n        rx_in = 1&#x27;b1;\n\n        k = 0;\n        while (rx_valid !== 1&#x27;b1 &amp;&amp; k &lt; 3000) begin\n            @(posedge clk); k = k + 1;\n        end\n        if (frame_err === 1&#x27;b1) begin\n            pass_cnt = pass_cnt + 1;\n            $display(&quot;[CHK] bad frame: frame_err=1  OK&quot;);\n        end else begin\n            fail_cnt = fail_cnt + 1;\n            $display(&quot;[CHK] bad frame: frame_err=0  FAIL&quot;);\n        end\n\n        $display(&quot;========================================&quot;);\n        $display(&quot;tb_uart_rx: PASS=%0d FAIL=%0d&quot;, pass_cnt, fail_cnt);\n        $display(&quot;========================================&quot;);\n        #1000;\n        $finish;\n    end\n\nendmodule\n\n`default_nettype wire\n"}, {"file": "code/phase3/uart_echo_top.v", "type": "verilog", "role": "synthesizable", "title": "uart_echo_top.v — 收到即回显顶层", "codeHtml": "//==============================================================================\n// uart_echo_top.v  —  可综合：串口回显顶层\n//   FPGA 收到一字节 -&gt; 锁存 -&gt; 通过 tx 原样发回电脑。\n//   用 echo_req 锁存请求，避免 tx 忙时丢失 rx_valid 脉冲。\n//==============================================================================\n`default_nettype none\n\nmodule uart_echo_top #(\n    parameter integer CLK_FREQ_HZ = 50_000_000,\n    parameter integer BAUD_RATE    = 115200\n)(\n    input  wire clk,\n    input  wire rst_n,\n    input  wire rx_in,     // 接 USB-UART 的 RX\n    output wire tx_out      // 接 USB-UART 的 TX\n);\n\n    wire [7:0] rx_data;\n    wire       rx_valid;\n    wire       frame_err;\n    wire       tx_ready;\n\n    reg [7:0] echo_data;\n    reg       echo_req;\n\n    // 收到字节 -&gt; 锁存并请求回发\n    always @(posedge clk or negedge rst_n) begin\n        if (!rst_n) begin\n            echo_data &lt;= 8&#x27;d0;\n            echo_req  &lt;= 1&#x27;b0;\n        end else if (rx_valid) begin\n            echo_data &lt;= rx_data;\n            echo_req  &lt;= 1&#x27;b1;\n        end else if (tx_ready &amp;&amp; echo_req) begin\n            echo_req  &lt;= 1&#x27;b0;\n        end\n    end\n\n    uart_rx #(\n        .CLK_FREQ_HZ(CLK_FREQ_HZ),\n        .BAUD_RATE  (BAUD_RATE)\n    ) u_rx (\n        .clk       (clk),\n        .rst_n     (rst_n),\n        .rx_in     (rx_in),\n        .rx_data   (rx_data),\n        .rx_valid  (rx_valid),\n        .frame_err (frame_err)\n    );\n\n    uart_tx #(\n        .CLK_FREQ_HZ(CLK_FREQ_HZ),\n        .BAUD_RATE  (BAUD_RATE)\n    ) u_tx (\n        .clk      (clk),\n        .rst_n    (rst_n),\n        .tx_data  (echo_data),\n        .tx_valid (echo_req),\n        .tx_ready (tx_ready),\n        .tx_out   (tx_out)\n    );\n\nendmodule\n\n`default_nettype wire\n"}, {"file": "code/phase3/tb_uart_echo_top.v", "type": "verilog", "role": "testbench", "title": "tb_uart_echo_top.v — 回显环回自检", "codeHtml": "//==============================================================================\n// tb_uart_echo_top.v  —  Testbench：串口回显自检（内联，无 task）\n//   在 rx_in 发一帧 8&#x27;hA5，等待 tx_out 出现回显帧，逐位比对应相同。\n//==============================================================================\n`timescale 1ns/1ps\n`default_nettype none\n\nmodule tb_uart_echo_top;\n\n    localparam integer BIT_DIV = 434;\n\n    reg        clk   = 1&#x27;b0;\n    reg        rst_n = 1&#x27;b0;\n    reg        rx_in = 1&#x27;b1;\n    wire       tx_out;\n\n    integer    k, j;\n    reg [7:0]  dbus;\n    reg [7:0]  echo;\n    integer    pass_cnt, fail_cnt;\n\n    always #10 clk = ~clk;\n\n    uart_echo_top #(\n        .CLK_FREQ_HZ(50_000_000),\n        .BAUD_RATE  (115200)\n    ) u_dut (\n        .clk   (clk),\n        .rst_n (rst_n),\n        .rx_in (rx_in),\n        .tx_out(tx_out)\n    );\n\n    initial begin\n        pass_cnt = 0; fail_cnt = 0;\n        rst_n = 1&#x27;b0;\n        for (k = 0; k &lt; 20; k = k + 1) @(posedge clk);\n        rst_n = 1&#x27;b1;\n        for (k = 0; k &lt; 20; k = k + 1) @(posedge clk);\n\n        // 1) 在 rx_in 发一帧 8&#x27;hA5\n        dbus = 8&#x27;hA5;\n        rx_in = 1&#x27;b0;\n        for (k = 0; k &lt; BIT_DIV; k = k + 1) @(posedge clk);\n        for (j = 0; j &lt; 8; j = j + 1) begin\n            rx_in = dbus[j];\n            for (k = 0; k &lt; BIT_DIV; k = k + 1) @(posedge clk);\n        end\n        rx_in = 1&#x27;b1;\n        for (k = 0; k &lt; BIT_DIV; k = k + 1) @(posedge clk);\n\n        // 2) 等待 tx_out 出现起始位（下降沿）\n        k = 0;\n        while (tx_out === 1&#x27;b1 &amp;&amp; k &lt; 20000) begin\n            @(posedge clk); k = k + 1;\n        end\n\n        // 3) 在 tx_out 上采样回显帧\n        for (k = 0; k &lt; BIT_DIV/2; k = k + 1) @(posedge clk);\n        if (tx_out === 1&#x27;b0)\n            pass_cnt = pass_cnt + 1;\n        else begin\n            fail_cnt = fail_cnt + 1;\n            $display(&quot;[CHK] echo start bit FAIL&quot;);\n        end\n\n        echo = 8&#x27;h00;\n        for (j = 0; j &lt; 8; j = j + 1) begin\n            for (k = 0; k &lt; BIT_DIV; k = k + 1) @(posedge clk);\n            echo[j] = tx_out;\n        end\n        if (echo == 8&#x27;hA5) begin\n            pass_cnt = pass_cnt + 1;\n            $display(&quot;[CHK] echo byte = 8&#x27;hA5  OK&quot;);\n        end else begin\n            fail_cnt = fail_cnt + 1;\n            $display(&quot;[CHK] echo byte = 8&#x27;h%0h (expect A5) FAIL&quot;, echo);\n        end\n\n        $display(&quot;========================================&quot;);\n        $display(&quot;tb_uart_echo_top: PASS=%0d FAIL=%0d&quot;, pass_cnt, fail_cnt);\n        $display(&quot;========================================&quot;);\n        #1000;\n        $finish;\n    end\n\nendmodule\n\n`default_nettype wire\n"}], "diagrams": [{"file": "assets/phase3/uart-frame-timing.svg", "title": "UART 8N1 帧时序", "caption": "起始位0 + 8数据位(LSB先出) + 停止位1，空闲为高。", "svgRaw": "<svg xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"0 0 820 260\" font-family=\"system-ui,sans-serif\" font-size=\"12\">\n  <rect x=\"0\" y=\"0\" width=\"820\" height=\"260\" fill=\"#0d1420\"/>\n  <text x=\"410\" y=\"22\" fill=\"#7dd3fc\" text-anchor=\"middle\" font-size=\"15\" font-weight=\"bold\">UART 8N1 帧时序（一位宽 = BIT_DIV = 50M/115200 ≈ 434 个时钟）<\/text>\n\n  <!-- idle high -->\n  <text x=\"30\" y=\"80\" fill=\"#94a3b8\">TX/RX<\/text>\n  <!-- waveform: idle high, start low, data bits 1,0,1,0,0,1,0,1 (0xA5 LSB first), stop high -->\n  <polyline points=\"70,70 110,70 110,120 170,120 170,70 230,70 230,120 290,120 290,70 350,70 350,120 410,120 410,120 470,120 470,70 530,70 530,120 590,120 590,70 650,70 650,70 760,70\"\n    fill=\"none\" stroke=\"#22d3ee\" stroke-width=\"2.5\"/>\n\n  <!-- cell labels -->\n  <text x=\"90\"  y=\"55\" fill=\"#64748b\" text-anchor=\"middle\">idle<\/text>\n  <text x=\"140\" y=\"140\" fill=\"#fca5a5\" text-anchor=\"middle\">起始位0<\/text>\n  <text x=\"200\" y=\"55\" fill=\"#a5f3fc\" text-anchor=\"middle\">b0=1<\/text>\n  <text x=\"260\" y=\"140\" fill=\"#a5f3fc\" text-anchor=\"middle\">b1=0<\/text>\n  <text x=\"320\" y=\"140\" fill=\"#a5f3fc\" text-anchor=\"middle\">b2=1<\/text>\n  <text x=\"380\" y=\"140\" fill=\"#a5f3fc\" text-anchor=\"middle\">b3=0<\/text>\n  <text x=\"440\" y=\"55\" fill=\"#a5f3fc\" text-anchor=\"middle\">b4=0<\/text>\n  <text x=\"500\" y=\"140\" fill=\"#a5f3fc\" text-anchor=\"middle\">b5=1<\/text>\n  <text x=\"560\" y=\"55\" fill=\"#a5f3fc\" text-anchor=\"middle\">b6=0<\/text>\n  <text x=\"620\" y=\"55\" fill=\"#a5f3fc\" text-anchor=\"middle\">b7=1<\/text>\n  <text x=\"705\" y=\"55\" fill=\"#86efac\" text-anchor=\"middle\">停止位1<\/text>\n\n  <!-- bit cell bracket -->\n  <line x1=\"110\" y1=\"170\" x2=\"170\" y2=\"170\" stroke=\"#64748b\"/>\n  <line x1=\"110\" y1=\"165\" x2=\"110\" y2=\"175\" stroke=\"#64748b\"/>\n  <line x1=\"170\" y1=\"165\" x2=\"170\" y2=\"175\" stroke=\"#64748b\"/>\n  <text x=\"140\" y=\"188\" fill=\"#94a3b8\" text-anchor=\"middle\">1 bit 宽<\/text>\n\n  <text x=\"410\" y=\"220\" fill=\"#fcd34d\" text-anchor=\"middle\">一帧 = 1(起始) + 8(数据, LSB先出) + 1(停止) = 10 bit；空闲线为高电平<\/text>\n  <text x=\"410\" y=\"242\" fill=\"#94a3b8\" text-anchor=\"middle\">例：发送 0xA5 = 1010_0101，线上依次为 1,0,1,0,0,1,0,1<\/text>\n<\/svg>\n"}, {"file": "assets/phase3/uart-oversample.svg", "title": "16 倍过采样", "caption": "每位 16 个采样点，在中点采样并做 3 点多数表决。", "svgRaw": "<svg xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"0 0 820 260\" font-family=\"system-ui,sans-serif\" font-size=\"12\">\n  <rect x=\"0\" y=\"0\" width=\"820\" height=\"260\" fill=\"#0d1420\"/>\n  <text x=\"410\" y=\"22\" fill=\"#7dd3fc\" text-anchor=\"middle\" font-size=\"15\" font-weight=\"bold\">接收端 16 倍过采样：在每位中点采样 + 3 点多数表决<\/text>\n\n  <!-- bit cell: start bit low then data high -->\n  <text x=\"30\" y=\"90\" fill=\"#94a3b8\">rx_sync<\/text>\n  <polyline points=\"90,80 150,80 150,120 300,120 300,80 450,80\" fill=\"none\" stroke=\"#22d3ee\" stroke-width=\"2.5\"/>\n  <text x=\"225\" y=\"140\" fill=\"#fca5a5\" text-anchor=\"middle\">起始位（低）<\/text>\n  <text x=\"375\" y=\"70\" fill=\"#a5f3fc\" text-anchor=\"middle\">数据位（高）<\/text>\n\n  <!-- 16 sample ticks across start bit: x150..300 = 150 wide, 16 ticks -->\n  <!-- ticks at 150,159.4,...,300. mark sample points as small vertical ticks -->\n  <g stroke=\"#64748b\" stroke-width=\"1\">\n    <line x1=\"159\" y1=\"115\" x2=\"159\" y2=\"125\"/>\n    <line x1=\"168\" y1=\"115\" x2=\"168\" y2=\"125\"/>\n    <line x1=\"178\" y1=\"115\" x2=\"178\" y2=\"125\"/>\n    <line x1=\"187\" y1=\"115\" x2=\"187\" y2=\"125\"/>\n    <line x1=\"196\" y1=\"115\" x2=\"196\" y2=\"125\"/>\n    <line x1=\"206\" y1=\"115\" x2=\"206\" y2=\"125\"/>\n    <line x1=\"215\" y1=\"115\" x2=\"215\" y2=\"125\"/>\n    <line x1=\"224\" y1=\"112\" x2=\"224\" y2=\"128\"/>\n    <line x1=\"234\" y1=\"112\" x2=\"234\" y2=\"128\"/>\n    <line x1=\"243\" y1=\"112\" x2=\"243\" y2=\"128\"/>\n    <line x1=\"252\" y1=\"115\" x2=\"252\" y2=\"125\"/>\n    <line x1=\"262\" y1=\"115\" x2=\"262\" y2=\"125\"/>\n    <line x1=\"271\" y1=\"115\" x2=\"271\" y2=\"125\"/>\n    <line x1=\"280\" y1=\"115\" x2=\"280\" y2=\"125\"/>\n    <line x1=\"290\" y1=\"115\" x2=\"290\" y2=\"125\"/>\n  <\/g>\n  <text x=\"224\" y=\"160\" fill=\"#fcd34d\" text-anchor=\"middle\" font-size=\"11\">中点采样（相位=7/8）<\/text>\n  <text x=\"238\" y=\"175\" fill=\"#fcd34d\" text-anchor=\"middle\" font-size=\"11\">三点表决: samp_sh[2:0]<\/text>\n\n  <!-- OV_DIV note -->\n  <text x=\"410\" y=\"210\" fill=\"#94a3b8\" text-anchor=\"middle\">过采样分频 OV_DIV = CLK/(BAUD×16)；50MHz/115200/16 ≈ 27 个系统时钟采一个样本点<\/text>\n  <text x=\"410\" y=\"232\" fill=\"#94a3b8\" text-anchor=\"middle\">检测到下降沿后复位相位计数器，使后续采样对齐到每位中央，避开跳变沿毛刺<\/text>\n<\/svg>\n"}, {"file": "assets/phase3/uart-fs
