<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 280" font-family="system-ui,sans-serif" font-size="12">
  <rect x="0" y="0" width="760" height="280" fill="#0d1420"/>
  <text x="380" y="22" fill="#7dd3fc" text-anchor="middle" font-size="15" font-weight="bold">交通灯状态转移图（Moore，南北/东西循环）</text>

  <ellipse cx="150" cy="90" rx="90" ry="40" fill="#16233a" stroke="#34d399" stroke-width="2"/>
  <text x="150" y="86" fill="#6ee7b7" text-anchor="middle" font-weight="bold">S_NS_G</text>
  <text x="150" y="104" fill="#94a3b8" text-anchor="middle" font-size="10">南北绿 / 东西红</text>

  <ellipse cx="380" cy="90" rx="90" ry="40" fill="#16233a" stroke="#f59e0b" stroke-width="2"/>
  <text x="380" y="86" fill="#fcd34d" text-anchor="middle" font-weight="bold">S_NS_Y</text>
  <text x="380" y="104" fill="#94a3b8" text-anchor="middle" font-size="10">南北黄 / 东西红</text>

  <ellipse cx="610" cy="90" rx="90" ry="40" fill="#16233a" stroke="#34d399" stroke-width="2"/>
  <text x="610" y="86" fill="#6ee7b7" text-anchor="middle" font-weight="bold">S_EW_G</text>
  <text x="610" y="104" fill="#94a3b8" text-anchor="middle" font-size="10">东西绿 / 南北红</text>

  <ellipse cx="380" cy="210" rx="90" ry="40" fill="#16233a" stroke="#f59e0b" stroke-width="2"/>
  <text x="380" y="206" fill="#fcd34d" text-anchor="middle" font-weight="bold">S_EW_Y</text>
  <text x="380" y="224" fill="#94a3b8" text-anchor="middle" font-size="10">东西黄 / 南北红</text>

  <line x1="240" y1="90" x2="290" y2="90" stroke="#7dd3fc" stroke-width="2"/>
  <text x="265" y="80" fill="#7dd3fc" text-anchor="middle" font-size="10">T_GREEN</text>
  <line x1="470" y1="90" x2="520" y2="90" stroke="#7dd3fc" stroke-width="2"/>
  <text x="495" y="80" fill="#7dd3fc" text-anchor="middle" font-size="10">T_YELLOW</text>
  <path d="M610 130 Q610 210 470 210" fill="none" stroke="#7dd3fc" stroke-width="2"/>
  <text x="600" y="175" fill="#7dd3fc" font-size="10">T_GREEN</text>
  <path d="M290 210 Q150 210 150 130" fill="none" stroke="#7dd3fc" stroke-width="2"/>
  <text x="150" y="175" fill="#7dd3fc" font-size="10">T_YELLOW</text>
  <text x="380" y="265" fill="#64748b" text-anchor="middle" font-size="11">互锁：任一方向同一时刻只亮一种灯，另一方向保持红</text>
</svg>
