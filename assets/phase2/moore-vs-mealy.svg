<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 240" font-family="system-ui,sans-serif" font-size="12">
  <rect x="0" y="0" width="760" height="240" fill="#0d1420"/>
  <text x="380" y="22" fill="#7dd3fc" text-anchor="middle" font-size="15" font-weight="bold">Moore vs Mealy 状态机</text>

  <!-- Moore -->
  <text x="180" y="55" fill="#34d399" text-anchor="middle" font-size="13" font-weight="bold">Moore：输出只由当前状态决定</text>
  <ellipse cx="120" cy="110" rx="55" ry="30" fill="#16233a" stroke="#34d399" stroke-width="2"/>
  <text x="120" y="115" fill="#e2e8f0" text-anchor="middle">S0 / 输出=0</text>
  <ellipse cx="260" cy="110" rx="55" ry="30" fill="#16233a" stroke="#34d399" stroke-width="2"/>
  <text x="260" y="115" fill="#e2e8f0" text-anchor="middle">S1 / 输出=1</text>
  <line x1="175" y1="110" x2="205" y2="110" stroke="#34d399" stroke-width="2"/>
  <text x="190" y="100" fill="#6ee7b7" text-anchor="middle" font-size="10">输入</text>
  <text x="180" y="170" fill="#94a3b8" text-anchor="middle" font-size="11">输出画在状态里，更稳定、打拍延迟一拍</text>

  <!-- Mealy -->
  <text x="540" y="55" fill="#f59e0b" text-anchor="middle" font-size="13" font-weight="bold">Mealy：输出取决于状态+当前输入</text>
  <ellipse cx="480" cy="110" rx="55" ry="30" fill="#16233a" stroke="#f59e0b" stroke-width="2"/>
  <text x="480" y="115" fill="#e2e8f0" text-anchor="middle">S0</text>
  <ellipse cx="620" cy="110" rx="55" ry="30" fill="#16233a" stroke="#f59e0b" stroke-width="2"/>
  <text x="620" y="115" fill="#e2e8f0" text-anchor="middle">S1</text>
  <line x1="535" y1="110" x2="565" y2="110" stroke="#f59e0b" stroke-width="2"/>
  <text x="550" y="100" fill="#fcd34d" text-anchor="middle" font-size="10">输入/输出</text>
  <text x="540" y="170" fill="#94a3b8" text-anchor="middle" font-size="11">输出画在转移边上，响应更快、状态数更少</text>
</svg>
