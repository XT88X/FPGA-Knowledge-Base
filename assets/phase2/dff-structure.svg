<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 260" font-family="system-ui,sans-serif" font-size="12">
  <rect x="0" y="0" width="760" height="260" fill="#0d1420"/>
  <text x="380" y="22" fill="#7dd3fc" text-anchor="middle" font-size="15" font-weight="bold">D 触发器结构：时钟沿把 D 锁存到 Q</text>

  <!-- DFF block -->
  <rect x="280" y="70" width="160" height="110" rx="6" fill="#16233a" stroke="#38bdf8" stroke-width="2"/>
  <text x="360" y="125" fill="#e2e8f0" text-anchor="middle" font-size="14" font-weight="bold">DFF</text>
  <text x="360" y="145" fill="#94a3b8" text-anchor="middle" font-size="11">always @(posedge clk)</text>

  <text x="240" y="100" fill="#22d3ee" text-anchor="end">D</text>
  <line x1="245" y1="96" x2="280" y2="96" stroke="#22d3ee" stroke-width="2"/>
  <text x="240" y="150" fill="#f59e0b" text-anchor="end">clk</text>
  <line x1="245" y1="146" x2="280" y2="146" stroke="#f59e0b" stroke-width="2"/>
  <text x="450" y="100" fill="#34d399">Q</text>
  <line x1="440" y1="96" x2="480" y2="96" stroke="#34d399" stroke-width="2"/>
  <text x="488" y="100" fill="#6ee7b7">&lt;= D （仅上升沿）</text>

  <!-- timing -->
  <text x="30" y="210" fill="#94a3b8">clk</text>
  <polyline points="70,214 150,214 150,194 230,194 230,214 310,214 310,194 390,194 390,214 470,214 470,194 550,194 550,214"
    fill="none" stroke="#f59e0b" stroke-width="2"/>
  <text x="30" y="245" fill="#94a3b8">Q</text>
  <polyline points="70,249 230,249 230,234 390,234 390,249 550,249" fill="none" stroke="#34d399" stroke-width="2"/>
  <text x="250" y="240" fill="#6ee7b7" font-size="11">每个 clk 上升沿，Q 更新为当时的 D</text>
</svg>
