<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 420" font-family="Consolas,Menlo,monospace">
  <rect width="900" height="420" fill="#0d1420"/>
  <text x="20" y="30" fill="#22d3ee" font-size="18" font-weight="bold">异步 FIFO：格雷码指针跨时钟域</text>

  <!-- write domain -->
  <rect x="20" y="70" width="250" height="280" rx="8" fill="#10233a" stroke="#22d3ee" stroke-width="1.5"/>
  <text x="40" y="98" fill="#22d3ee" font-size="13" font-weight="bold">写时钟域 wr_clk</text>
  <rect x="45" y="115" width="200" height="40" rx="4" fill="#16233a" stroke="#475569"/>
  <text x="70" y="140" fill="#e2e8f0" font-size="12">写指针 bin->gray</text>
  <rect x="45" y="170" width="200" height="40" rx="4" fill="#16233a" stroke="#475569"/>
  <text x="70" y="195" fill="#e2e8f0" font-size="12">写 RAM</text>
  <text x="45" y="240" fill="#94a3b8" font-size="11">full 由同步过来的</text>
  <text x="45" y="258" fill="#94a3b8" font-size="11">读格雷码判断</text>

  <!-- dual port ram -->
  <rect x="330" y="150" width="240" height="100" rx="8" fill="#1a2310" stroke="#a3e635" stroke-width="1.5"/>
  <text x="380" y="195" fill="#e2e8f0" font-size="13">双口 RAM</text>
  <text x="360" y="220" fill="#94a3b8" font-size="11">A口写 / B口读</text>

  <!-- read domain -->
  <rect x="630" y="70" width="250" height="280" rx="8" fill="#102a1a" stroke="#34d399" stroke-width="1.5"/>
  <text x="650" y="98" fill="#34d399" font-size="13" font-weight="bold">读时钟域 rd_clk</text>
  <rect x="655" y="115" width="200" height="40" rx="4" fill="#16233a" stroke="#475569"/>
  <text x="680" y="140" fill="#e2e8f0" font-size="12">读指针 bin->gray</text>
  <rect x="655" y="170" width="200" height="40" rx="4" fill="#16233a" stroke="#475569"/>
  <text x="680" y="195" fill="#e2e8f0" font-size="12">读 RAM</text>
  <text x="655" y="240" fill="#94a3b8" font-size="11">empty 由同步过来的</text>
  <text x="655" y="258" fill="#94a3b8" font-size="11">写格雷码判断</text>

  <!-- arrows ram -->
  <line x1="270" y1="190" x2="330" y2="190" stroke="#a3e635" stroke-width="1.5" marker-end="url(#g)"/>
  <line x1="570" y1="190" x2="630" y2="190" stroke="#a3e635" stroke-width="1.5" marker-end="url(#g)"/>

  <!-- gray sync path write->read -->
  <path d="M145 280 L145 330 L755 330 L755 280" fill="none" stroke="#fbbf24" stroke-width="1.8" stroke-dasharray="6,4" marker-end="url(#g)"/>
  <rect x="400" y="312" width="120" height="30" rx="4" fill="#2a1a10" stroke="#fbbf24"/>
  <text x="410" y="332" fill="#fbbf24" font-size="11">两级同步器</text>
  <text x="330" y="380" fill="#94a3b8" font-size="11">写格雷码 -> 打两拍进读域 -> 算 empty</text>

  <!-- gray sync path read->write -->
  <path d="M755 280 L755 395 L145 395 L145 300" fill="none" stroke="#fbbf24" stroke-width="1.8" stroke-dasharray="2,4"/>
  <text x="330" y="410" fill="#94a3b8" font-size="11">读格雷码 -> 打两拍进写域 -> 算 full</text>

  <defs>
    <marker id="g" markerWidth="9" markerHeight="9" refX="6" refY="3" orient="auto">
      <path d="M0,0 L6,3 L0,6 Z" fill="#cbd5e1"/>
    </marker>
  </defs>
</svg>
