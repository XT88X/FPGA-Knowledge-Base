<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 360" font-family="Consolas,Menlo,monospace">
  <rect width="900" height="360" fill="#0d1420"/>
  <text x="20" y="30" fill="#22d3ee" font-size="18" font-weight="bold">reg-to-reg 路径与 slack 计算</text>

  <!-- launch flop -->
  <rect x="40" y="120" width="150" height="80" rx="6" fill="#10233a" stroke="#22d3ee" stroke-width="1.5"/>
  <text x="70" y="150" fill="#e2e8f0" font-size="13">发送触发器</text>
  <text x="60" y="175" fill="#94a3b8" font-size="11">launch 沿发出数据</text>

  <!-- comb logic -->
  <rect x="260" y="130" width="280" height="60" rx="6" fill="#16233a" stroke="#fbbf24" stroke-width="1.5"/>
  <text x="300" y="165" fill="#e2e8f0" font-size="13">组合逻辑（延迟 t_logic）</text>

  <!-- capture flop -->
  <rect x="610" y="120" width="150" height="80" rx="6" fill="#102a1a" stroke="#34d399" stroke-width="1.5"/>
  <text x="640" y="150" fill="#e2e8f0" font-size="13">捕获触发器</text>
  <text x="630" y="175" fill="#94a3b8" font-size="11">capture 沿采样</text>

  <line x1="190" y1="160" x2="260" y2="160" stroke="#cbd5e1" stroke-width="1.5" marker-end="url(#r)"/>
  <line x1="540" y1="160" x2="610" y2="160" stroke="#cbd5e1" stroke-width="1.5" marker-end="url(#r)"/>

  <!-- formula box -->
  <rect x="40" y="230" width="820" height="110" rx="6" fill="#16233a" stroke="#475569"/>
  <text x="60" y="258" fill="#e2e8f0" font-size="13">建立时间 slack：</text>
  <text x="60" y="282" fill="#34d399" font-size="13">  slack_setup = T周期 - ( t_logic + t_net + t_setup + 时钟抖动 )</text>
  <text x="60" y="308" fill="#e2e8f0" font-size="13">slack ≥ 0：时序收敛；slack &lt; 0（WNS 为负）：该路径太快到达或太慢，需优化。</text>
  <text x="60" y="328" fill="#94a3b8" font-size="11">launch 沿 = 发出数据的时钟沿；capture 沿 = 下一个采样沿，两者间隔就是一个时钟周期 T。</text>

  <defs>
    <marker id="r" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
      <path d="M0,0 L6,3 L0,6 Z" fill="#cbd5e1"/>
    </marker>
  </defs>
</svg>
