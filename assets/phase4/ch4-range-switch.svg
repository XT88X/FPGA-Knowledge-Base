<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 360" font-family="Consolas,Menlo,monospace">
  <rect width="880" height="360" fill="#0d1420"/>
  <text x="20" y="30" fill="#4fc3f7" font-size="18" font-weight="bold">量程与单位自动切换逻辑</text>

  <!-- decision diamond chain -->
  <polygon points="200,80 320,130 200,180 80,130" fill="#16263c" stroke="#4fc3f7"/>
  <text x="150" y="125" fill="#4fc3f7" font-size="12">count ≥ 1,000,000 ?</text>
  <text x="150" y="145" fill="#9fb3d1" font-size="11">（1s闸门下=MHz）</text>

  <polygon points="520,80 640,130 520,180 400,130" fill="#16263c" stroke="#81c784"/>
  <text x="470" y="125" fill="#81c784" font-size="12">count ≥ 1,000 ?</text>
  <text x="475" y="145" fill="#9fb3d1" font-size="11">（kHz）</text>

  <!-- yes branches -->
  <line x1="320" y1="130" x2="400" y2="130" stroke="#3a4a63"/>
  <text x="345" y="122" fill="#9fb3d1" font-size="11">否</text>

  <rect x="60" y="230" width="180" height="60" rx="6" fill="#2a1f16" stroke="#ffb74d"/>
  <text x="80" y="255" fill="#ffb74d" font-size="12">unit=MHz</text>
  <text x="80" y="275" fill="#9fb3d1" font-size="11">显示值 = count/1e6</text>
  <line x1="200" y1="180" x2="150" y2="230" stroke="#ffb74d" marker-end="url(#b)"/>
  <text x="150" y="205" fill="#ffb74d" font-size="11">是</text>

  <rect x="370" y="230" width="180" height="60" rx="6" fill="#16263c" stroke="#81c784"/>
  <text x="390" y="255" fill="#81c784" font-size="12">unit=kHz</text>
  <text x="390" y="275" fill="#9fb3d1" font-size="11">显示值 = count/1e3</text>
  <line x1="520" y1="180" x2="460" y2="230" stroke="#81c784" marker-end="url(#b)"/>
  <text x="470" y="205" fill="#81c784" font-size="11">是</text>

  <rect x="640" y="230" width="180" height="60" rx="6" fill="#16263c" stroke="#4fc3f7"/>
  <text x="660" y="255" fill="#4fc3f7" font-size="12">unit=Hz</text>
  <text x="660" y="275" fill="#9fb3d1" font-size="11">显示值 = count</text>
  <line x1="640" y1="130" x2="720" y2="230" stroke="#4fc3f7" marker-end="url(#b)"/>
  <text x="660" y="205" fill="#4fc3f7" font-size="11">否</text>

  <defs><marker id="b" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
    <path d="M0,0 L6,3 L0,6 Z" fill="#9fb3d1"/></marker></defs>
  <text x="20" y="330" fill="#7c8db0" font-size="12">判定在 ch4_freq_fsm 组合逻辑内完成；缩放后整数经 double-dabble 转 6 位 BCD 送数码管。</text>
</svg>
