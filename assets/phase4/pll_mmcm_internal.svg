<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 460" font-family="Consolas,Menlo,monospace">
  <rect width="900" height="460" fill="#0d1420"/>
  <text x="20" y="30" fill="#22d3ee" font-size="18" font-weight="bold">PLL / MMCM 内部结构（Artix-7）</text>

  <!-- feedback loop -->
  <!-- blocks -->
  <rect x="40"  y="120" width="110" height="60" rx="6" fill="#16233a" stroke="#22d3ee" stroke-width="1.5"/>
  <text x="55" y="145" fill="#e2e8f0" font-size="13">PFD</text>
  <text x="48" y="165" fill="#94a3b8" font-size="10">鉴频鉴相</text>

  <rect x="190" y="120" width="110" height="60" rx="6" fill="#16233a" stroke="#22d3ee" stroke-width="1.5"/>
  <text x="205" y="145" fill="#e2e8f0" font-size="13">CP</text>
  <text x="200" y="165" fill="#94a3b8" font-size="10">电荷泵</text>

  <rect x="340" y="120" width="110" height="60" rx="6" fill="#16233a" stroke="#22d3ee" stroke-width="1.5"/>
  <text x="352" y="145" fill="#e2e8f0" font-size="13">LPF</text>
  <text x="350" y="165" fill="#94a3b8" font-size="10">环路滤波</text>

  <rect x="490" y="120" width="110" height="60" rx="6" fill="#16233a" stroke="#a78bfa" stroke-width="1.5"/>
  <text x="508" y="145" fill="#e2e8f0" font-size="13">VCO</text>
  <text x="500" y="165" fill="#94a3b8" font-size="10">压控振荡</text>

  <!-- arrows chain -->
  <line x1="150" y1="150" x2="190" y2="150" stroke="#22d3ee" stroke-width="1.5" marker-end="url(#a)"/>
  <line x1="300" y1="150" x2="340" y2="150" stroke="#22d3ee" stroke-width="1.5" marker-end="url(#a)"/>
  <line x1="450" y1="150" x2="490" y2="150" stroke="#22d3ee" stroke-width="1.5" marker-end="url(#a)"/>

  <!-- input clk -->
  <text x="20" y="110" fill="#fbbf24" font-size="12">clk_in（晶振）</text>
  <line x1="20" y1="150" x2="40" y2="150" stroke="#fbbf24" stroke-width="1.5" marker-end="url(#a)"/>

  <!-- VCO outputs dividers -->
  <rect x="650" y="70"  width="120" height="40" rx="6" fill="#16233a" stroke="#34d399" stroke-width="1.5"/>
  <text x="665" y="95" fill="#e2e8f0" font-size="12">输出分频 M</text>
  <rect x="650" y="130" width="120" height="40" rx="6" fill="#16233a" stroke="#34d399" stroke-width="1.5"/>
  <text x="665" y="155" fill="#e2e8f0" font-size="12">输出分频 D0</text>
  <rect x="650" y="190" width="120" height="40" rx="6" fill="#16233a" stroke="#34d399" stroke-width="1.5"/>
  <text x="665" y="215" fill="#e2e8f0" font-size="12">输出分频 D1..D5</text>

  <line x1="600" y1="150" x2="650" y2="90"  stroke="#34d399" stroke-width="1.5" marker-end="url(#a)"/>
  <line x1="600" y1="150" x2="650" y2="150" stroke="#34d399" stroke-width="1.5" marker-end="url(#a)"/>
  <line x1="600" y1="150" x2="650" y2="210" stroke="#34d399" stroke-width="1.5" marker-end="url(#a)"/>

  <text x="790" y="95"  fill="#34d399" font-size="12">clk_out0</text>
  <text x="790" y="155" fill="#34d399" font-size="12">clk_out1</text>
  <text x="790" y="215" fill="#34d399" font-size="12">...</text>

  <!-- feedback divider -->
  <rect x="340" y="300" width="120" height="44" rx="6" fill="#16233a" stroke="#fbbf24" stroke-width="1.5"/>
  <text x="352" y="326" fill="#e2e8f0" font-size="12">反馈分频 N</text>
  <path d="M545 180 L545 230 L400 230 L400 300" fill="none" stroke="#fbbf24" stroke-width="1.5" marker-end="url(#a)"/>
  <path d="M340 322 L100 322 L100 180" fill="none" stroke="#fbbf24" stroke-width="1.5" marker-end="url(#a)"/>
  <text x="180" y="315" fill="#fbbf24" font-size="11">反馈：f_vco/N 与 f_in 比较，锁定后相等</text>

  <!-- MMCM extra -->
  <rect x="40" y="380" width="820" height="60" rx="6" fill="#1a1430" stroke="#a78bfa" stroke-width="1.2"/>
  <text x="55" y="405" fill="#a78bfa" font-size="13" font-weight="bold">MMCM 比 PLL 多出：相位微调（Phase Adjust）+ 可动态/细粒度分频</text>
  <text x="55" y="428" fill="#94a3b8" font-size="11">可对每路输出做 ±相位移动、占空比校正，用于补偿布线延迟、对齐多路时钟；PLL 只能倍/分频。</text>

  <defs>
    <marker id="a" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
      <path d="M0,0 L6,3 L0,6 Z" fill="#cbd5e1"/>
    </marker>
  </defs>
</svg>
