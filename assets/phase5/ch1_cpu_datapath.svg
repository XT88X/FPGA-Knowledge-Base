<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 420" font-family="Consolas,monospace">
  <rect width="900" height="420" fill="#0f1420"/>
  <text x="450" y="28" fill="#60a5fa" font-size="16" text-anchor="middle" font-weight="bold">单周期 RV32I 数据通路（取指→译码→执行→访存→写回）</text>

  <!-- PC -->
  <rect x="20" y="60" width="90" height="44" rx="6" fill="#1e3a5f" stroke="#60a5fa" stroke-width="1.5"/>
  <text x="65" y="87" fill="#e5e7eb" font-size="13" text-anchor="middle">PC</text>

  <!-- IMEM -->
  <rect x="150" y="60" width="110" height="44" rx="6" fill="#1e3a5f" stroke="#22d3ee" stroke-width="1.5"/>
  <text x="205" y="80" fill="#e5e7eb" font-size="12" text-anchor="middle">指令 RAM</text>
  <text x="205" y="96" fill="#9ca3af" font-size="10" text-anchor="middle">(组合读)</text>

  <!-- 指令字段 -->
  <rect x="300" y="60" width="150" height="44" rx="6" fill="#1e293b" stroke="#a855f7" stroke-width="1.5"/>
  <text x="375" y="80" fill="#e5e7eb" font-size="12" text-anchor="middle">译码/立即数生成</text>
  <text x="375" y="96" fill="#9ca3af" font-size="10" text-anchor="middle">opcode/rd/rs1/rs2/imm</text>

  <!-- Regfile -->
  <rect x="150" y="170" width="120" height="50" rx="6" fill="#1e3a5f" stroke="#fbbf24" stroke-width="1.5"/>
  <text x="210" y="192" fill="#e5e7eb" font-size="12" text-anchor="middle">寄存器堆</text>
  <text x="210" y="208" fill="#9ca3af" font-size="10" text-anchor="middle">32×32, x0=0</text>

  <!-- ALU -->
  <rect x="330" y="170" width="110" height="50" rx="6" fill="#1e3a5f" stroke="#22c55e" stroke-width="1.5"/>
  <text x="385" y="192" fill="#e5e7eb" font-size="12" text-anchor="middle">ALU</text>
  <text x="385" y="208" fill="#9ca3af" font-size="10" text-anchor="middle">ADD/SUB/CMP</text>

  <!-- DataMem -->
  <rect x="490" y="170" width="120" height="50" rx="6" fill="#1e3a5f" stroke="#fb923c" stroke-width="1.5"/>
  <text x="550" y="192" fill="#e5e7eb" font-size="12" text-anchor="middle">数据 RAM</text>
  <text x="550" y="208" fill="#9ca3af" font-size="10" text-anchor="middle">LW/SW</text>

  <!-- 写回 mux -->
  <rect x="660" y="170" width="120" height="50" rx="6" fill="#3b1d4f" stroke="#a855f7" stroke-width="1.5"/>
  <text x="720" y="192" fill="#e5e7eb" font-size="12" text-anchor="middle">写回选择</text>
  <text x="720" y="208" fill="#9ca3af" font-size="10" text-anchor="middle">ALU/MEM/PC+4/imm</text>

  <!-- arrows -->
  <line x1="110" y1="82" x2="150" y2="82" stroke="#60a5fa" stroke-width="1.5" marker-end="url(#ab)"/>
  <line x1="260" y1="82" x2="300" y2="82" stroke="#22d3ee" stroke-width="1.5" marker-end="url(#ab)"/>
  <line x1="375" y1="104" x2="250" y2="170" stroke="#a855f7" stroke-width="1.5" marker-end="url(#ab)"/>
  <line x1="270" y1="195" x2="330" y2="195" stroke="#fbbf24" stroke-width="1.5" marker-end="url(#ab)"/>
  <line x1="440" y1="195" x2="490" y2="195" stroke="#22c55e" stroke-width="1.5" marker-end="url(#ab)"/>
  <line x1="610" y1="195" x2="660" y2="195" stroke="#fb923c" stroke-width="1.5" marker-end="url(#ab)"/>

  <!-- 写回到 regfile -->
  <path d="M720,220 L720,290 L210,290 L210,220" fill="none" stroke="#a855f7" stroke-width="1.5" marker-end="url(#ab)"/>
  <text x="430" y="283" fill="#a855f7" font-size="11" text-anchor="middle">写回 rd</text>

  <!-- PC +4 / branch -->
  <path d="M65,104 L65,340 L800,340 L800,100 L110,82" fill="none" stroke="#60a5fa" stroke-width="1.5" stroke-dasharray="5,4" marker-end="url(#ab)"/>
  <text x="430" y="358" fill="#60a5fa" font-size="11" text-anchor="middle">PC+4 / 分支跳转改写 PC</text>

  <defs>
    <marker id="ab" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
      <path d="M0,0 L0,6 L9,3 z" fill="#60a5fa"/>
    </marker>
  </defs>
</svg>
