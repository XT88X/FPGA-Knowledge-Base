<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 420" font-family="Consolas,monospace">
  <rect width="900" height="420" fill="#0f1420"/>
  <text x="450" y="26" fill="#60a5fa" font-size="16" text-anchor="middle" font-weight="bold">自制 SoC 单片机顶层架构（ch4_soc_top）</text>

  <!-- CPU -->
  <rect x="330" y="150" width="240" height="90" rx="8" fill="#1e3a5f" stroke="#60a5fa" stroke-width="2"/>
  <text x="450" y="180" fill="#e5e7eb" font-size="14" text-anchor="middle">RV32I 教学核</text>
  <text x="450" y="200" fill="#9ca3af" font-size="11" text-anchor="middle">PC/Regfile/ALU/控制器</text>
  <text x="450" y="218" fill="#9ca3af" font-size="11" text-anchor="middle">ch4_rv_core.v (+简化中断)</text>

  <!-- RAM -->
  <rect x="60" y="150" width="180" height="90" rx="8" fill="#1a2e1a" stroke="#22c55e" stroke-width="2"/>
  <text x="150" y="180" fill="#e5e7eb" font-size="13" text-anchor="middle">片上 RAM 4KB</text>
  <text x="150" y="200" fill="#9ca3af" font-size="11" text-anchor="middle">0x0000_0000</text>
  <text x="150" y="218" fill="#9ca3af" font-size="11" text-anchor="middle">$readmemh 加载固件</text>

  <!-- Bus mux -->
  <rect x="330" y="290" width="240" height="50" rx="8" fill="#1e293b" stroke="#fbbf24" stroke-width="1.5"/>
  <text x="450" y="320" fill="#e5e7eb" font-size="12" text-anchor="middle">地址译码 / 读数据 mux (ch4_bus_mux)</text>

  <!-- Peripherals -->
  <rect x="620" y="80" width="120" height="50" rx="6" fill="#3b1d4f" stroke="#a855f7" stroke-width="1.5"/>
  <text x="680" y="105" fill="#e5e7eb" font-size="12" text-anchor="middle">UART</text>
  <text x="680" y="122" fill="#9ca3af" font-size="10" text-anchor="middle">0x2000_0000</text>

  <rect x="620" y="150" width="120" height="50" rx="6" fill="#3b1d1d" stroke="#fb923c" stroke-width="1.5"/>
  <text x="680" y="175" fill="#e5e7eb" font-size="12" text-anchor="middle">GPIO</text>
  <text x="680" y="192" fill="#9ca3af" font-size="10" text-anchor="middle">0x2000_0010</text>

  <rect x="620" y="220" width="120" height="50" rx="6" fill="#1a2e1a" stroke="#22c55e" stroke-width="1.5"/>
  <text x="680" y="245" fill="#e5e7eb" font-size="12" text-anchor="middle">TIMER</text>
  <text x="680" y="262" fill="#9ca3af" font-size="10" text-anchor="middle">0x2000_0020</text>

  <rect x="620" y="290" width="120" height="50" rx="6" fill="#1e3a5f" stroke="#22d3ee" stroke-width="1.5"/>
  <text x="680" y="315" fill="#e5e7eb" font-size="12" text-anchor="middle">INTE/INTF</text>
  <text x="680" y="332" fill="#9ca3af" font-size="10" text-anchor="middle">0x2000_0030</text>

  <!-- IRQ line -->
  <line x1="680" y1="270" x2="680" y2="290" stroke="#fbbf24" stroke-width="1.5"/>
  <path d="M680 290 L560 290 L560 240 L570 240" fill="none" stroke="#fbbf24" stroke-width="1.5" marker-end="url(#ab)"/>
  <text x="600" y="285" fill="#fbbf24" font-size="10">timer irq</text>

  <!-- arrows CPU<->RAM, CPU<->bus -->
  <line x1="240" y1="195" x2="330" y2="195" stroke="#22c55e" stroke-width="2"/>
  <line x1="330" y1="210" x2="240" y2="210" stroke="#22c55e" stroke-width="2"/>
  <line x1="450" y1="240" x2="450" y2="290" stroke="#fbbf24" stroke-width="1.5"/>

  <text x="60" y="390" fill="#9ca3af" font-size="12">von Neumann：取指与 LW/SW 共用 RAM；外设全部内存映射；timer 中断汇总后送 CPU irq_i。</text>
</svg>
