<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 420" font-family="Consolas,monospace">
  <rect width="900" height="420" fill="#0f1420"/>
  <text x="450" y="26" fill="#60a5fa" font-size="16" text-anchor="middle" font-weight="bold">AXI4-Lite 单次写 / 读 VALID-READY 握手时序</text>

  <!-- Write waveform -->
  <text x="40" y="60" fill="#a855f7" font-size="13" font-weight="bold">写传输</text>
  <g font-size="11" fill="#e5e7eb">
    <text x="40" y="90">AWVALID</text>
    <text x="40" y="120">AWREADY</text>
    <text x="40" y="150">WVALID</text>
    <text x="40" y="180">WREADY</text>
    <text x="40" y="210">BVALID</text>
    <text x="40" y="240">BREADY</text>
  </g>

  <!-- wave lines (high/low bars) -->
  <!-- AWVALID high from x=180 to 360 -->
  <line x1="180" y1="84" x2="360" y2="84" stroke="#a855f7" stroke-width="2"/>
  <line x1="180" y1="96" x2="180" y2="84" stroke="#a855f7" stroke-width="2"/>
  <line x1="360" y1="96" x2="360" y2="84" stroke="#a855f7" stroke-width="2"/>
  <!-- AWREADY high from 280 to 420 -->
  <line x1="280" y1="114" x2="420" y2="114" stroke="#22d3ee" stroke-width="2"/>
  <line x1="280" y1="126" x2="280" y2="114" stroke="#22d3ee" stroke-width="2"/>
  <!-- handshake point at ~300 -->
  <circle cx="300" cy="99" r="4" fill="#fbbf24"/>
  <text x="310" y="103" fill="#fbbf24" font-size="10">握手拍</text>

  <!-- WVALID 240..400 -->
  <line x1="240" y1="144" x2="400" y2="144" stroke="#a855f7" stroke-width="2"/>
  <line x1="240" y1="156" x2="240" y2="144" stroke="#a855f7" stroke-width="2"/>
  <!-- WREADY 320..440 -->
  <line x1="320" y1="174" x2="440" y2="174" stroke="#22d3ee" stroke-width="2"/>
  <line x1="320" y1="186" x2="320" y2="174" stroke="#22d3ee" stroke-width="2"/>
  <circle cx="360" cy="159" r="4" fill="#fbbf24"/>

  <!-- BVALID 460..560 -->
  <line x1="460" y1="204" x2="560" y2="204" stroke="#22c55e" stroke-width="2"/>
  <line x1="460" y1="216" x2="460" y2="204" stroke="#22c55e" stroke-width="2"/>
  <!-- BREADY 500..600 -->
  <line x1="500" y1="234" x2="600" y2="234" stroke="#fb923c" stroke-width="2"/>
  <line x1="500" y1="246" x2="500" y2="234" stroke="#fb923c" stroke-width="2"/>
  <circle cx="530" cy="219" r="4" fill="#fbbf24"/>

  <!-- Read waveform -->
  <text x="40" y="290" fill="#22d3ee" font-size="13" font-weight="bold">读传输</text>
  <g font-size="11" fill="#e5e7eb">
    <text x="40" y="320">ARVALID</text>
    <text x="40" y="350">ARREADY</text>
    <text x="40" y="380">RVALID</text>
    <text x="40" y="405">RREADY</text>
  </g>
  <line x1="180" y1="314" x2="340" y2="314" stroke="#22d3ee" stroke-width="2"/>
  <line x1="180" y1="326" x2="180" y2="314" stroke="#22d3ee" stroke-width="2"/>
  <line x1="260" y1="344" x2="400" y2="344" stroke="#a855f7" stroke-width="2"/>
  <line x1="260" y1="356" x2="260" y2="344" stroke="#a855f7" stroke-width="2"/>
  <circle cx="290" cy="329" r="4" fill="#fbbf24"/>
  <line x1="420" y1="374" x2="540" y2="374" stroke="#22c55e" stroke-width="2"/>
  <line x1="420" y1="386" x2="420" y2="374" stroke="#22c55e" stroke-width="2"/>
  <line x1="460" y1="399" x2="560" y2="399" stroke="#fb923c" stroke-width="2"/>
  <circle cx="490" cy="389" r="4" fill="#fbbf24"/>

  <text x="620" y="320" fill="#9ca3af" font-size="11">要点：VALID 保持到握手；</text>
  <text x="620" y="340" fill="#9ca3af" font-size="11">READY 可组合；握手拍</text>
  <text x="620" y="360" fill="#9ca3af" font-size="11">= 两信号同时为高。</text>
</svg>
