<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 400" font-family="Consolas,monospace">
  <rect width="900" height="400" fill="#0f1420"/>
  <text x="450" y="26" fill="#60a5fa" font-size="16" text-anchor="middle" font-weight="bold">AXI4-Lite 五个独立通道（主机 Master ⇄ 从机 Slave）</text>

  <!-- Master -->
  <rect x="40" y="150" width="160" height="100" rx="8" fill="#1e3a5f" stroke="#60a5fa" stroke-width="2"/>
  <text x="120" y="195" fill="#e5e7eb" font-size="14" text-anchor="middle">主机 Master</text>
  <text x="120" y="215" fill="#9ca3af" font-size="11" text-anchor="middle">(CPU/PS/自建核)</text>

  <!-- Slave -->
  <rect x="700" y="150" width="160" height="100" rx="8" fill="#1a2e1a" stroke="#22c55e" stroke-width="2"/>
  <text x="780" y="195" fill="#e5e7eb" font-size="14" text-anchor="middle">从机 Slave</text>
  <text x="780" y="215" fill="#9ca3af" font-size="11" text-anchor="middle">(GPIO/UART 外设)</text>

  <!-- channels -->
  <g font-size="12" text-anchor="middle">
    <rect x="260" y="60" width="120" height="34" rx="5" fill="#3b1d4f" stroke="#a855f7"/>
    <text x="320" y="82" fill="#e5e7eb">AW 写地址</text>
    <rect x="400" y="60" width="120" height="34" rx="5" fill="#3b1d4f" stroke="#a855f7"/>
    <text x="460" y="82" fill="#e5e7eb">W 写数据</text>
    <rect x="540" y="60" width="120" height="34" rx="5" fill="#1a2e1a" stroke="#22c55e"/>
    <text x="600" y="82" fill="#e5e7eb">B 写响应</text>

    <rect x="330" y="180" width="120" height="34" rx="5" fill="#1e3a5f" stroke="#22d3ee"/>
    <text x="390" y="202" fill="#e5e7eb">AR 读地址</text>
    <rect x="470" y="180" width="120" height="34" rx="5" fill="#1e3a5f" stroke="#22d3ee"/>
    <text x="530" y="202" fill="#e5e7eb">R 读数据</text>
  </g>

  <!-- arrows master->slave for AW/W/AR -->
  <line x1="200" y1="77" x2="260" y2="77" stroke="#a855f7" stroke-width="1.5" marker-end="url(#ab3)"/>
  <line x1="200" y1="197" x2="330" y2="197" stroke="#22d3ee" stroke-width="1.5" marker-end="url(#ab3)"/>
  <!-- arrows slave->master for B/R -->
  <line x1="660" y1="77" x2="700" y2="77" stroke="#22c55e" stroke-width="1.5" marker-end="url(#ab3)"/>
  <line x1="590" y1="197" x2="700" y2="197" stroke="#22c55e" stroke-width="1.5" marker-end="url(#ab3)"/>

  <text x="450" y="300" fill="#9ca3af" font-size="12" text-anchor="middle">写：AW + W 由主机发，B 由从机回；读：AR 由主机发，R 由从机回。</text>
  <text x="450" y="322" fill="#9ca3af" font-size="12" text-anchor="middle">每个通道都用 VALID/READY 握手；各通道独立、可并行。</text>
  <text x="450" y="350" fill="#fbbf24" font-size="12" text-anchor="middle">VALID 由驱动方拉高并保持，直到 READY 同时为高才完成一拍传输</text>

  <defs>
    <marker id="ab3" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
      <path d="M0,0 L0,6 L9,3 z" fill="#60a5fa"/>
    </marker>
  </defs>
</svg>
