<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 260" font-family="system-ui,sans-serif" font-size="12">
  <rect x="0" y="0" width="820" height="260" fill="#0d1420"/>
  <text x="410" y="22" fill="#7dd3fc" text-anchor="middle" font-size="15" font-weight="bold">UART 8N1 帧时序（一位宽 = BIT_DIV = 50M/115200 ≈ 434 个时钟）</text>

  <!-- idle high -->
  <text x="30" y="80" fill="#94a3b8">TX/RX</text>
  <!-- waveform: idle high, start low, data bits 1,0,1,0,0,1,0,1 (0xA5 LSB first), stop high -->
  <polyline points="70,70 110,70 110,120 170,120 170,70 230,70 230,120 290,120 290,70 350,70 350,120 410,120 410,120 470,120 470,70 530,70 530,120 590,120 590,70 650,70 650,70 760,70"
    fill="none" stroke="#22d3ee" stroke-width="2.5"/>

  <!-- cell labels -->
  <text x="90"  y="55" fill="#64748b" text-anchor="middle">idle</text>
  <text x="140" y="140" fill="#fca5a5" text-anchor="middle">起始位0</text>
  <text x="200" y="55" fill="#a5f3fc" text-anchor="middle">b0=1</text>
  <text x="260" y="140" fill="#a5f3fc" text-anchor="middle">b1=0</text>
  <text x="320" y="140" fill="#a5f3fc" text-anchor="middle">b2=1</text>
  <text x="380" y="140" fill="#a5f3fc" text-anchor="middle">b3=0</text>
  <text x="440" y="55" fill="#a5f3fc" text-anchor="middle">b4=0</text>
  <text x="500" y="140" fill="#a5f3fc" text-anchor="middle">b5=1</text>
  <text x="560" y="55" fill="#a5f3fc" text-anchor="middle">b6=0</text>
  <text x="620" y="55" fill="#a5f3fc" text-anchor="middle">b7=1</text>
  <text x="705" y="55" fill="#86efac" text-anchor="middle">停止位1</text>

  <!-- bit cell bracket -->
  <line x1="110" y1="170" x2="170" y2="170" stroke="#64748b"/>
  <line x1="110" y1="165" x2="110" y2="175" stroke="#64748b"/>
  <line x1="170" y1="165" x2="170" y2="175" stroke="#64748b"/>
  <text x="140" y="188" fill="#94a3b8" text-anchor="middle">1 bit 宽</text>

  <text x="410" y="220" fill="#fcd34d" text-anchor="middle">一帧 = 1(起始) + 8(数据, LSB先出) + 1(停止) = 10 bit；空闲线为高电平</text>
  <text x="410" y="242" fill="#94a3b8" text-anchor="middle">例：发送 0xA5 = 1010_0101，线上依次为 1,0,1,0,0,1,0,1</text>
</svg>
