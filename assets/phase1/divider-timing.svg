<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 220" font-family="system-ui,sans-serif" font-size="12">
  <rect x="0" y="0" width="760" height="220" fill="#0d1420"/>
  <text x="380" y="20" fill="#7dd3fc" text-anchor="middle" font-size="14" font-weight="bold">计数器分频时序（clk 上升沿 cnt+1，计满翻转 led）</text>
  <!-- labels -->
  <text x="40" y="55" fill="#94a3b8">clk</text>
  <text x="40" y="115" fill="#94a3b8">cnt</text>
  <text x="40" y="185" fill="#94a3b8">led</text>
  <!-- clk wave: 8 cycles -->
  <polyline points="80,60 120,60 120,40 160,40 160,60 200,60 200,40 240,40 240,60 280,60 280,40 320,40 320,60 360,60 360,40 400,40 400,60 440,60 440,40 480,40 480,60 520,60 520,40 560,40 560,60 600,60 600,40 640,40 640,60 700,60"
    fill="none" stroke="#22d3ee" stroke-width="2"/>
  <!-- cnt staircase rising -->
  <polyline points="80,150 120,150 120,140 160,140 160,130 200,130 200,120 240,120 240,110 280,110 280,100 320,100 320,90 360,90 360,80 400,80 400,150"
    fill="none" stroke="#f59e0b" stroke-width="2"/>
  <text x="410" y="120" fill="#fcd34d" font-size="11">cnt=HALF_COUNT-1 时清零</text>
  <!-- led toggles -->
  <polyline points="80,190 400,190 400,175 700,175" fill="none" stroke="#34d399" stroke-width="2"/>
  <text x="520" y="168" fill="#6ee7b7" font-size="11">led 在 cnt 计满处翻转</text>
  <!-- half period bracket -->
  <line x1="80" y1="205" x2="400" y2="205" stroke="#64748b" stroke-width="1"/>
  <text x="240" y="218" fill="#94a3b8" text-anchor="middle">半周期 = CLK_FREQ_HZ/(2*BLINK_HZ) = 25,000,000 个时钟</text>
</svg>
