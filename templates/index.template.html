<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>FPGA 知识系统 · 从点灯到造处理器</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='6' fill='%230b1220'/%3E%3Crect x='7' y='7' width='8' height='8' fill='%2322d3ee'/%3E%3Crect x='17' y='7' width='8' height='8' fill='%233b82f6'/%3E%3Crect x='7' y='17' width='8' height='8' fill='%233b82f6'/%3E%3Crect x='17' y='17' width='8' height='8' fill='%2322d3ee'/%3E%3C/svg%3E">
<style>
:root{
  --bg:#0b1220; --card:#111a2e; --card2:#0e1730; --line:#1e2c4a;
  --txt:#e6edf7; --muted:#93a4c0; --cyan:#22d3ee; --blue:#3b82f6;
  --green:#34d399; --amber:#fbbf24; --red:#f87171;
}
*{box-sizing:border-box;}
html,body{margin:0;padding:0;}
body{
  background:radial-gradient(1200px 600px at 50% -10%,#14224a 0%,var(--bg) 60%);
  color:var(--txt);
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Microsoft YaHei",Roboto,system-ui,sans-serif;
  line-height:1.65; min-height:100vh;
}
.wrap{max-width:1080px; margin:0 auto; padding:24px 16px 80px;}
header.hero{text-align:center; padding:18px 0 8px;}
header.hero h1{
  font-size:30px; margin:0 0 6px; font-weight:800;
  background:linear-gradient(90deg,#7dd3fc,#22d3ee 50%,#60a5fa);
  -webkit-background-clip:text; background-clip:text; color:transparent;
}
header.hero p{color:var(--muted); margin:0; font-size:14px;}
.card{background:var(--card); border:1px solid var(--line); border-radius:14px; padding:18px; margin:16px 0;
  box-shadow:0 6px 24px rgba(0,0,0,.25);}
.row{display:flex; justify-content:space-between; align-items:center; gap:12px; flex-wrap:wrap;}
.bar{height:14px; background:#0a1122; border-radius:999px; overflow:hidden; border:1px solid var(--line);}
.bar > i{display:block; height:100%; width:0; border-radius:999px;
  background:linear-gradient(90deg,var(--blue),var(--cyan)); transition:width .4s;}
.big{font-size:22px; font-weight:800; color:var(--cyan);}
.badges{display:grid; grid-template-columns:repeat(5,1fr); gap:10px;}
.badge{text-align:center; padding:10px 4px; border-radius:10px; background:var(--card2); border:1px solid var(--line);
  filter:grayscale(1); opacity:.45; transition:all .3s;}
.badge .emo{font-size:26px;}
.badge .nm{font-size:12px; margin-top:2px;}
.badge .ds{font-size:11px; color:var(--muted);}
.badge.unlocked{filter:grayscale(0); opacity:1; box-shadow:0 0 16px rgba(34,211,238,.35); border-color:var(--cyan);}
.controls{display:flex; gap:10px; flex-wrap:wrap; justify-content:center; margin:10px 0;}
button.btn{background:#16223e; color:var(--txt); border:1px solid var(--line); border-radius:9px;
  padding:8px 14px; cursor:pointer; font-size:14px; transition:.15s;}
button.btn:hover{background:#1d2c4d; border-color:var(--blue);}
button.btn.danger:hover{background:#3a1722; border-color:var(--red); color:#fecaca;}
button.btn.primary{background:linear-gradient(90deg,var(--blue),var(--cyan)); border:none; color:#06121f; font-weight:700;}
/* phase */
.phase{background:var(--card); border:1px solid var(--line); border-radius:14px; margin:14px 0; overflow:hidden;}
.phase-head{display:flex; justify-content:space-between; align-items:center; padding:16px 18px; cursor:pointer; user-select:none;}
.phase-head:hover{background:#13203c;}
.phase-head .t{font-size:18px; font-weight:700;}
.phase-head .d{font-size:12px; color:var(--muted);}
.phase-head .arrow{color:var(--muted); transition:transform .3s;}
.phase.open .phase-head .arrow{transform:rotate(180deg);}
.phase-body{display:none;}
.phase.open .phase-body{display:block;}
.phase.locked .phase-head{cursor:not-allowed; opacity:.75;}
.phase.locked .arrow{color:var(--red);}
.lockic{width:14px;height:14px;vertical-align:-2px;margin-right:4px;fill:var(--amber);}
.chapter{background:var(--card2); border:1px solid var(--line); border-radius:12px; margin:12px 14px; padding:16px;}
.chapter h4{margin:0 0 4px; font-size:17px; color:#7dd3fc;}
.chapter .sum{color:var(--muted); font-size:13px; margin:0 0 10px;}
.doc p{margin:8px 0;} .doc pre{background:#081020; border:1px solid var(--line); border-radius:8px; padding:10px; overflow:auto;}
.doc code{font-family:ui-monospace,"Cascadia Code",Consolas,monospace; font-size:13px;}
.table-wrap{overflow-x:auto; -webkit-overflow-scrolling:touch; margin:8px 0;}
.doc table{border-collapse:collapse; width:100%; font-size:13px; margin:0; min-width:480px;}
.doc th,.doc td{border:1px solid var(--line); padding:6px 8px; text-align:left; white-space:nowrap;}
.doc a{color:#7dd3fc;}
/* code tabs */
.codeblock{margin:10px 0;}
.tabs{display:flex; gap:6px; flex-wrap:wrap; margin-bottom:-1px;}
.tab{font-size:12px; padding:5px 10px; border:1px solid var(--line); border-bottom:none; border-radius:8px 8px 0 0;
  background:#0c1630; color:var(--muted); cursor:pointer;}
.tab.active{background:#081020; color:var(--cyan); border-color:var(--cyan);}
pre.code{background:#081020; border:1px solid var(--cyan); border-radius:0 8px 8px 8px; padding:12px;
  font-family:ui-monospace,"Cascadia Code",Consolas,monospace; font-size:13px; line-height:1.5; margin:0;
  max-height:70vh; overflow:auto; white-space:pre; -webkit-overflow-scrolling:touch;}
.tok-k{color:#7dd3fc;} .tok-s{color:#fbbf24;} .tok-c{color:#5b6b8c; font-style:italic;} .tok-n{color:#f0abfc;}
/* diagrams */
.diagram{margin:10px 0; text-align:center; overflow-x:auto; padding-bottom:4px;}
.diagram svg{max-width:100%; height:auto; border:1px solid var(--line); border-radius:10px; background:#0d1420; margin:0 auto;}
.diagram .cap{font-size:12px; color:var(--muted); margin-top:4px;}
/* phase nav */
.phase-nav{display:flex; gap:8px; overflow-x:auto; padding-bottom:6px; -webkit-overflow-scrolling:touch;}
.pn-item{flex:1; min-width:128px; border:1px solid var(--line); border-radius:10px; padding:10px; background:var(--card2); cursor:pointer; text-align:center;}
.pn-item:hover{border-color:var(--blue);}
.pn-item .pn-n{font-size:15px; font-weight:700; color:#7dd3fc;}
.pn-item .pn-s{font-size:11px; color:var(--muted); margin-top:2px;}
.pn-item.locked{opacity:.55; cursor:not-allowed;}
.pn-item.passed{border-color:var(--green);}
.pn-item .pn-best{font-size:11px; color:var(--green); margin-top:2px;}
/* exam */
.exam-card{border:1px solid var(--amber); border-radius:12px; padding:14px; margin:14px; background:#151a30;}
.exam-card h5{margin:0 0 6px; color:var(--amber); font-size:15px;}
.exam-q{border:1px solid var(--line); border-radius:10px; padding:10px; margin:10px 0; background:#0b1530;}
.exam-q .eq-type{font-size:10px; padding:2px 6px; border-radius:6px; background:#1e2c4a; color:#9fd8ff; margin-right:6px;}
.exam-q .opt{display:flex; gap:8px; align-items:center; padding:6px 8px; border:1px solid var(--line); border-radius:8px; margin:5px 0; cursor:pointer;}
.exam-q .opt.right{background:rgba(52,211,153,.15); border-color:var(--green);}
.exam-q .opt.wrong{background:rgba(248,113,113,.15); border-color:var(--red);}
.exam-q .your{font-size:12px; color:var(--amber); margin-top:4px;}
.exam-fill{width:100%; background:#0a1226; border:1px solid var(--line); color:var(--txt); border-radius:8px; padding:8px; margin-top:6px;}
.exam-progress{font-size:13px; color:var(--muted); margin:6px 0;}
.score-big{font-size:30px; font-weight:800;}
.toast{position:fixed; left:50%; bottom:30px; transform:translateX(-50%); background:#1d2c4d; border:1px solid var(--cyan);
  color:var(--txt); padding:10px 18px; border-radius:10px; z-index:99; font-size:14px; display:none;}
.toast.show{display:block;}
.tools{display:flex; flex-wrap:wrap; gap:8px; margin:10px 0;}
.tools a{font-size:12px; background:#10203f; border:1px solid var(--line); color:#9fd8ff; text-decoration:none;
  padding:5px 10px; border-radius:8px;}
.tools a:hover{border-color:var(--cyan);}
.tools .req{font-size:10px; color:var(--amber); margin-left:4px;}
/* tasks */
.task{display:flex; align-items:center; gap:10px; padding:6px 8px; border-radius:8px; cursor:pointer;}
.task:hover{background:#152242;}
.task input{width:18px; height:18px; accent-color:var(--cyan);}
.task.done label{text-decoration:line-through; color:var(--green);}
/* quiz */
.quiz{border:1px dashed var(--line); border-radius:10px; padding:10px; margin:10px 0; background:#0b1530;}
.quiz .q{font-weight:600; margin-bottom:8px;}
.quiz .opt{display:block; padding:6px 10px; border:1px solid var(--line); border-radius:8px; margin:5px 0; cursor:pointer; font-size:14px;}
.quiz .opt:hover{border-color:var(--blue);}
.quiz .opt.right{background:rgba(52,211,153,.15); border-color:var(--green);}
.quiz .opt.wrong{background:rgba(248,113,113,.15); border-color:var(--red);}
.quiz .exp{font-size:13px; color:var(--amber); margin-top:6px; display:none;}
.quid{font-size:11px; color:var(--muted);}
/* AI assistant */
#aiFab{position:fixed; right:20px; bottom:20px; width:58px; height:58px; border-radius:50%; border:none; cursor:pointer;
  background:linear-gradient(135deg,var(--blue),var(--cyan)); color:#06121f; font-size:22px; box-shadow:0 8px 24px rgba(34,211,238,.4);}
#aiPanel{position:fixed; right:20px; bottom:90px; width:min(380px,92vw); height:480px; max-height:70vh;
  background:#0e1830; border:1px solid var(--line); border-radius:14px; display:none; flex-direction:column; overflow:hidden;
  box-shadow:0 12px 40px rgba(0,0,0,.5); z-index:50;}
#aiPanel.open{display:flex;}
#aiPanel .ph{padding:10px 12px; background:#16223e; display:flex; justify-content:space-between; align-items:center;}
#aiMsgs{flex:1; overflow-y:auto; padding:10px; font-size:13px;}
.msg{margin:6px 0; padding:8px 10px; border-radius:10px; max-width:92%; white-space:pre-wrap;}
.msg.ai{background:#132244;} .msg.me{background:#1d3358; margin-left:auto;}
.msg .src{display:block; font-size:11px; color:var(--cyan); margin-top:4px;}
#aiInputRow{display:flex; gap:6px; padding:8px; border-top:1px solid var(--line);}
#aiInput{flex:1; background:#0a1226; border:1px solid var(--line); color:var(--txt); border-radius:8px; padding:8px;}
#aiSettings{position:fixed; right:20px; bottom:90px; width:min(360px,92vw); background:#0e1830; border:1px solid var(--line);
  border-radius:14px; padding:14px; display:none; z-index:60;}
#aiSettings.open{display:block;}
#aiSettings label{font-size:12px; color:var(--muted); display:block; margin:8px 0 3px;}
#aiSettings input{width:100%; background:#0a1226; border:1px solid var(--line); color:var(--txt); border-radius:8px; padding:7px;}
.presets{display:flex; gap:6px; flex-wrap:wrap; margin-top:8px;}
footer{text-align:center; color:var(--muted); font-size:12px; margin-top:30px;}
/* ===== 科目一刷题面板 ===== */
#drillOverlay{position:fixed; inset:0; background:rgba(4,8,18,.96); z-index:80; display:none; flex-direction:column;}
#drillOverlay.open{display:flex;}
#drillPanel{flex:1; display:flex; flex-direction:column; max-width:1000px; width:100%; margin:0 auto;
  background:var(--card); border:1px solid var(--line); border-radius:14px; overflow:hidden; margin-top:10px; margin-bottom:10px;}
#drillTop{display:flex; justify-content:space-between; align-items:center; padding:12px 16px; background:#16223e; border-bottom:1px solid var(--line);}
#drillBody{flex:1; overflow-y:auto; padding:16px; -webkit-overflow-scrolling:touch;}
.drill-tabs{display:flex; gap:8px; flex-wrap:wrap; margin:8px 0 14px;}
.drill-stat{display:flex; gap:14px; flex-wrap:wrap; background:var(--card2); border:1px solid var(--line); border-radius:10px; padding:10px 14px; margin:8px 0;}
.drill-stat b{color:var(--cyan);}
.drill-mode{display:flex; gap:8px; flex-wrap:wrap; margin:8px 0;}
.drill-qbox{border:1px solid var(--line); border-radius:12px; padding:16px; background:#0b1530; margin:12px 0;}
.drill-qbox .meta{font-size:11px; color:var(--muted); margin-bottom:6px;}
.drill-qbox .meta .tag{display:inline-block; background:#1e2c4a; color:#9fd8ff; border-radius:6px; padding:2px 7px; margin-right:6px;}
.drill-qbox .qt{font-size:16px; font-weight:600; margin:6px 0 10px;}
.drill-opt{display:flex; gap:8px; align-items:center; padding:9px 11px; border:1px solid var(--line); border-radius:9px; margin:6px 0; cursor:pointer;}
.drill-opt:hover{border-color:var(--blue);}
.drill-opt.right{background:rgba(52,211,153,.16); border-color:var(--green);}
.drill-opt.wrong{background:rgba(248,113,113,.16); border-color:var(--red);}
.drill-exp{font-size:13px; color:var(--amber); margin-top:8px; display:none; border-top:1px dashed var(--line); padding-top:8px;}
.drill-exp.show{display:block;}
.drill-nav{display:flex; justify-content:space-between; align-items:center; gap:10px; margin-top:14px; flex-wrap:wrap;}
.drill-grid{flex:0 0 100%; width:100%; display:grid; grid-template-columns:repeat(auto-fill,minmax(36px,1fr)); gap:4px; margin:8px 0; max-height:132px; overflow-y:auto; -webkit-overflow-scrolling:touch;}
.drill-cell{font-size:11px; text-align:center; padding:4px 1px; border-radius:6px; background:#0a1226; border:1px solid var(--line); cursor:pointer;}
.drill-cell.cur{border-color:var(--cyan); color:var(--cyan);}
.drill-cell.ok{background:rgba(52,211,153,.2); color:var(--green);}
.drill-cell.bad{background:rgba(248,113,113,.2); color:var(--red);}
.drill-card{border:1px solid var(--line); border-radius:10px; padding:12px; margin:8px 0; background:var(--card2);}
.drill-card .sub{font-size:11px; color:var(--cyan);}
.drill-card h6{margin:4px 0; font-size:14px;}
.drill-card .body{font-size:13px; color:var(--txt); white-space:pre-wrap;}
.drill-card .src{font-size:11px; color:var(--muted); margin-top:4px;}
#drillTimer{font-size:18px; font-weight:800; color:var(--amber);}
.moc-result{margin:10px 0;}
@media (max-width:640px){
  #drillPanel{margin:0; border-radius:0; height:100%; max-width:100%;}
  #drillOverlay{padding:0;}
}
@media (max-width:640px){
  .badges{grid-template-columns:repeat(2,1fr);}
  header.hero h1{font-size:23px;}
  .wrap{padding:14px 10px 90px;}
  .chapter{margin:10px 6px; padding:12px;}
  .pn-item{min-width:112px;}
  .tools a{font-size:11px;}
}
</style>
</head>
<body>
<div class="wrap">
  <header class="hero">
    <h1>FPGA 知识系统</h1>
    <p>从点灯到造处理器 · Xilinx/AMD Vivado · 离线自包含 · 项目驱动</p>
  </header>

  <div class="card">
    <div class="row">
      <span style="font-weight:700;">总学习进度</span>
      <span id="total-progress-text" class="big">0%</span>
    </div>
    <div class="bar" style="margin-top:8px;"><i id="total-progress-bar"></i></div>
  </div>

  <div class="card">
    <div style="font-weight:700; margin-bottom:10px;">成就徽章</div>
    <div class="badges" id="badges"></div>
  </div>

  <div class="card">
    <div style="font-weight:700; margin-bottom:10px;">阶段导航</div>
    <div class="phase-nav" id="phaseNav"></div>
  </div>

  <div class="controls">
    <button class="btn" id="btnDrill">📚 科目一刷题</button>
    <button class="btn primary" id="btnExpandAll">展开全部</button>
    <button class="btn" id="btnCollapseAll">折叠全部</button>
    <button class="btn danger" id="btnReset">重置进度</button>
  </div>

  <main id="app"></main>

  <footer>
    <p>FPGA 知识系统 · 双击 index.html 即可使用，无需服务器、无需联网</p>
    <p>进度保存在浏览器本地（localStorage）· AI 助教默认离线检索，可在设置里填 API Key 在线增强</p>
  </footer>
</div>

<button id="aiFab" title="AI 助教">🤖</button>
<div class="toast" id="toast"></div>
<div id="aiPanel">
  <div class="ph">
    <strong>AI 助教</strong>
    <span>
      <button class="btn" id="btnQuiz" style="padding:4px 8px;font-size:12px;">抽一题</button>
      <button class="btn" id="btnSetting" style="padding:4px 8px;font-size:12px;">设置</button>
    </span>
  </div>
  <div id="aiMsgs"></div>
  <div id="aiInputRow">
    <input id="aiInput" placeholder="问我 FPGA 问题，如：计数器位宽怎么算？">
    <button class="btn primary" id="aiSend">发送</button>
  </div>
</div>
<div id="aiSettings">
  <strong>在线增强设置（OpenAI 兼容）</strong>
  <label>Base URL</label><input id="cfgBase" placeholder="https://api.deepseek.com">
  <label>API Key（仅存本机浏览器）</label><input id="cfgKey" type="password" placeholder="sk-...">
  <label>Model</label><input id="cfgModel" placeholder="deepseek-chat">
  <div class="presets">
    <button class="btn" data-base="https://api.deepseek.com" data-model="deepseek-chat">DeepSeek</button>
    <button class="btn" data-base="https://ark.cn-beijing.volces.com/api/v3" data-model="doubao-pro">豆包(方舟)</button>
    <button class="btn" data-base="https://api.openai.com/v1" data-model="gpt-4o-mini">OpenAI</button>
  </div>
  <div class="controls" style="margin:12px 0 0;">
    <button class="btn primary" id="cfgSave">保存</button>
    <button class="btn" id="cfgClose">关闭</button>
  </div>
</div>

<div id="drillOverlay">
  <div id="drillPanel">
    <div id="drillTop">
      <strong style="color:var(--cyan);">📚 科目一 · FPGA 刷题</strong>
      <span style="display:flex;gap:10px;align-items:center;">
        <span id="drillTimer"></span>
        <button class="btn" id="drillClose" style="padding:5px 12px;font-size:13px;">关闭 ✕</button>
      </span>
    </div>
    <div id="drillBody"></div>
  </div>
</div>

<script>
/*__KB_DATA__*/

/* ================= 常量与状态 ================= */
var PHASES = [
  {id:1, emo:"1️⃣", name:"启蒙入门", d:"预计1-3天 · 点亮第一盏灯，跑通全流程"},
  {id:2, emo:"2️⃣", name:"基础逻辑设计", d:"预计1周 · 玩转数字逻辑，掌控电路"},
  {id:3, emo:"3️⃣", name:"接口与通信", d:"预计2周 · 让 FPGA 和世界对话"},
  {id:4, emo:"4️⃣", name:"系统级开发", d:"预计2-4周 · 搭建完整数字系统"},
  {id:5, emo:"5️⃣", name:"高阶进阶", d:"长期 · 亲手打造一个处理器"}
];
var BADGES = [
  {emo:"💡", nm:"点灯入门", ds:"完成阶段1"},
  {emo:"⚡", nm:"逻辑大师", ds:"完成阶段2"},
  {emo:"📡", nm:"通信达人", ds:"完成阶段3"},
  {emo:"🖥️", nm:"系统架构师", ds:"完成阶段4"},
  {emo:"🚀", nm:"FPGA大神", ds:"完成阶段5"}
];
var PROGRESS_KEY = "fpga-learning-progress";
var CFG_KEY = "fpga-ai-config";
var EXAM_KEY = "fpga-exam-state";
var LOCK_SVG = '<svg class="lockic" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 2a5 5 0 0 0-5 5v3H6a2 2 0 0 0-2 2v8a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2v-8a2 2 0 0 0-2-2h-1V7a5 5 0 0 0-5-5zm-3 8V7a3 3 0 1 1 6 0v3H9z"/></svg>';
var UNLOCK_SVG = '<svg class="lockic" style="fill:var(--green)" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 2a5 5 0 0 0-5 5v3H6a2 2 0 0 0-2 2v8a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2v-8a2 2 0 0 0-2-2h-1V7a5 5 0 0 0-9.9-1H8.1A3 3 0 0 1 12 5zm-3 8V7a3 3 0 1 1 6 0v3H9z"/></svg>';

/* ================= 工具 ================= */
function esc(s){return String(s).replace(/[&<>"]/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c];});}
function uniq(a){return Array.prototype.filter.call(a,function(v,i){return a.indexOf(v)===i;});}
function toast(msg){var t=document.getElementById('toast'); t.textContent=msg; t.classList.add('show');
  clearTimeout(toast._t); toast._t=setTimeout(function(){t.classList.remove('show');},2200);}
function shuffled(arr){var a=arr.slice(); for(var i=a.length-1;i>0;i--){var j=Math.floor(Math.random()*(i+1)); var t=a[i];a[i]=a[j];a[j]=t;} return a;}

/* ================= 考试引擎（纯函数，挂 window 便于确定性自测） ================= */
var FPGAExam = {
  PASS_RATE: 85,
  PER_Q: 5,
  PAPER_SIZE: 20,
  // 归一化填空答案：去空白/标点/大小写
  _normFill: function(s){return String(s).toLowerCase().replace(/[\s,，.。_\-]/g,'');},
  // 组卷：按章节 round-robin 均衡 + 章内随机
  compose: function(pool, count){
    count = count || FPGAExam.PAPER_SIZE;
    var byCh = {};
    pool.forEach(function(q){ (byCh[q.ch]=byCh[q.ch]||[]).push(q); });
    Object.keys(byCh).forEach(function(k){ byCh[k]=shuffled(byCh[k]); });
    var chs = Object.keys(byCh);
    var paper = [], idx = {};
    chs.forEach(function(c){ idx[c]=0; });
    var guard = 0;
    while(paper.length < count && guard < count*chs.length+10){
      var progressed = false;
      for(var i=0;i<chs.length;i++){
        var c=chs[i];
        if(idx[c] < byCh[c].length){ paper.push(byCh[c][idx[c]]); idx[c]++; progressed=true; if(paper.length>=count) break; }
      }
      if(!progressed) break;
      guard++;
    }
    return shuffled(paper).slice(0,count);
  },
  // 乱序选项并按原正确项重映射 answer；返回新题目数组
  shufflePaper: function(questions){
    return questions.map(function(q){
      var n = {id:q.id, ch:q.ch, type:q.type, pts:q.pts||FPGAExam.PER_Q, q:q.q, explain:q.explain};
      if(q.type==='single' || q.type==='multi'){
        var order = shuffled(q.options.map(function(_,i){return i;}));
        n.options = order.map(function(oi){ return q.options[oi]; });
        if(q.type==='single'){ n.answer = order.indexOf(q.answer); }
        else { n.answer = q.answer.slice().sort().map(function(a){return order.indexOf(a);}).sort(function(a,b){return a-b;}); }
      } else if(q.type==='judge'){
        // 固定 正确/错误 两项，answer 为下标
        n.options = ['正确','错误'];
        n.answer = q.answer===true ? 0 : 1;
      } else if(q.type==='fill'){
        n.options = null;
        n.answer = q.answer.slice(); // 可接受写法数组
      }
      return n;
    });
  },
  // 判分：answers 为数组，下标对应 paper 顺序；single=下标, multi=下标数组, judge=bool下标, fill=字符串
  gradePaper: function(paper, answers){
    var self=this, score=0, detail=[];
    paper.forEach(function(q,i){
      var ua = answers[i], ok=false, got='';
      if(q.type==='single'){ ok = (ua===q.answer); got = (ua==null||ua==='')?'(未答)':q.options[ua]; }
      else if(q.type==='multi'){
        ua = Array.isArray(ua)?ua:[];
        ok = ua.length===q.answer.length && ua.slice().sort().join()===q.answer.slice().sort().join();
        got = ua.length? ua.map(function(x){return q.options[x];}).join(', ') : '(未答)';
      }
      else if(q.type==='judge'){ ok = (ua===q.answer); got = (ua==null||ua==='')?'(未答)':q.options[ua]; }
      else if(q.type==='fill'){
        if(typeof ua==='string' && ua.trim()){
          ok = q.answer.some(function(acc){ return self._normFill(acc)===self._normFill(ua); });
        }
        got = (typeof ua==='string'&&ua.trim())?ua : '(未答)';
      }
      if(ok) score += (q.pts||self.PER_Q);
      detail.push({id:q.id, ch:q.ch, type:q.type, q:q.q, your:got,
                   correct: q.type==='fill'? q.answer.join(' / ') : (q.type==='judge'? q.options[q.answer] : q.options[q.answer]),
                   ok:ok, explain:q.explain, options:q.options});
    });
    return {score:score, passed: score>=self.PASS_RATE, detail:detail};
  },
  // 由存档推导解锁/通过状态
  unlockState: function(state){
    state = state || {};
    var passed = state.passed || {};
    var unlocked = {1:true};
    [2,3,4,5].forEach(function(n){ unlocked[n] = !!passed[n-1]; });
    return {unlocked:unlocked, passed:passed, best:state.best||{}};
  }
};

/* ================= 刷题引擎（纯函数，挂 window.FPGADrill） ================= */
var DRILL_KEY = "fpga-drill-state";
var MOCK_KEY = "fpga-mock-state";
var FPGADrill = {
  _normFill: FPGAExam._normFill,
  // 顺序：按 catName -> sub -> id
  practiceSeq: function(pool){
    return pool.slice().sort(function(a,b){
      if((a.catName||'')!==(b.catName||'')) return (a.catName||'')<(b.catName||'')?-1:1;
      if((a.sub||'')!==(b.sub||'')) return (a.sub||'')<(b.sub||'')?-1:1;
      return (a.id||'')<(b.id||'')?-1:1;
    });
  },
  practiceRandom: function(pool){ return shuffled(pool.slice()); },
  // f={cat,sub,type}
  filterBy: function(pool,f){
    f=f||{};
    return pool.filter(function(q){
      if(f.cat && q.cat!==f.cat) return false;
      if(f.sub && q.sub!==f.sub) return false;
      if(f.type && q.type!==f.type) return false;
      return true;
    });
  },
  // 按 groupKey round-robin 均衡抽 count 题
  composePool: function(pool,count,groupKey){
    count=count||20; groupKey=groupKey||'sub';
    var byG={};
    pool.forEach(function(q){(byG[q[groupKey]||'其他']=byG[q[groupKey]||'其他']||[]).push(q);});
    Object.keys(byG).forEach(function(k){byG[k]=shuffled(byG[k]);});
    var gs=Object.keys(byG), paper=[], idx={};
    gs.forEach(function(g){idx[g]=0;});
    var guard=0;
    while(paper.length<count && guard<count*gs.length+10){
      var prog=false;
      for(var i=0;i<gs.length;i++){
        var g=gs[i];
        if(idx[g]<byG[g].length){paper.push(byG[g][idx[g]]);idx[g]++;prog=true;if(paper.length>=count)break;}
      }
      if(!prog)break; guard++;
    }
    return shuffled(paper).slice(0,count);
  },
  // 判单题正误：ans 与 FPGAExam.gradePaper 入参一致
  isCorrect: function(q,ans){
    var self=this;
    if(q.type==='single') return ans===q.answer;
    if(q.type==='judge'){
      // practice 存下标(0=正确,1=错误)；兼容布尔
      if(typeof ans==='number') ans = (ans===0);
      return ans===q.answer;
    }
    if(q.type==='multi'){ ans=Array.isArray(ans)?ans:[];
      return ans.length===q.answer.length && ans.slice().sort().join()===q.answer.slice().sort().join(); }
    if(q.type==='fill'){ if(typeof ans!=='string'||!ans.trim()) return false;
      return q.answer.some(function(a){return self._normFill(a)===self._normFill(ans);}); }
    return false;
  },
  // 记录一次作答：更新 done/lastCorrect/wrong/fav 不在这里改
  recordAnswer: function(state,qid,correct){
    state.done=state.done||{}; state.lastCorrect=state.lastCorrect||{}; state.wrong=state.wrong||[];
    state.done[qid]=1; state.lastCorrect[qid]=!!correct;
    var k=state.wrong.indexOf(qid);
    if(correct){ if(k>=0) state.wrong.splice(k,1); }
    else if(k<0){ state.wrong.push(qid); }
    return state;
  },
  statsOf: function(state){
    state=state||{}; state.done=state.done||{}; state.lastCorrect=state.lastCorrect||{};
    state.wrong=state.wrong||[]; state.fav=state.fav||[];
    var doneN=Object.keys(state.done).length;
    var rightN=Object.keys(state.lastCorrect).filter(function(k){return state.lastCorrect[k];}).length;
    return {done:doneN, right:rightN,
            acc:doneN?Math.round(rightN/doneN*100):0,
            wrong:state.wrong.length, fav:state.fav.length};
  },
  // 全局综合考水平档（90合格）
  levelGlobal: function(score){
    if(score>=90) return {pass:true, label:'优秀 · 合格'};
    if(score>=80) return {pass:false, label:'良好 · 差一点'};
    if(score>=60) return {pass:false, label:'待加强 · 多刷错题'};
    return {pass:false, label:'需重学 · 回到知识速记'};
  }
};

function startPractice(mode){
  var pool=drillPool();

  var list=[];
  if(mode==='seq'){ list=FPGADrill.practiceSeq(pool); }
  else if(mode==='rand'){ list=FPGADrill.practiceRandom(pool); }
  else if(mode==='wrong'){ var w=(st.wrong||[]); var set={}; w.forEach(function(id){set[id]=1;}); list=pool.filter(function(q){return set[q.id];}); }
  else if(mode==='fav'){ var f=(st.fav||[]); var fset={}; f.forEach(function(id){fset[id]=1;}); list=pool.filter(function(q){return fset[q.id];}); }
  else if(mode==='special'){ drillSpecialPick(pool); return; }
  if(!list.length){ toast('该分类暂无题目'); drillHome(); return; }
  DRILL={mode:'practice', submode:mode, list:list, idx:0, answers:{}};
  renderPracticeQ();

  DRILL.answered=DRILL.answered||{}; DRILL.userAns=DRILL.userAns||{};

  document.querySelectorAll('#dq .drill-opt[data-oi]').forEach(function(op){

      var ok=FPGADrill.isCorrect(q,oi);
      DRILL.answered[q.id]=1;
      var s3=loadDrillState(); FPGADrill.recordAnswer(s3,q.id,ok); saveDrillState(s3);
      renderPracticeQ();
    };
  });

  var mc=document.getElementById('multiConfirm');
  if(mc) mc.onclick=function(){
    if(DRILL.answered[q.id]) return;
    var sel=[]; document.querySelectorAll('#dq input[type=checkbox]:checked').forEach(function(c){sel.push(+c.dataset.oi);});
    var ok=FPGADrill.isCorrect(q,sel);
    DRILL.answered[q.id]=1; DRILL.userAns[q.id]=sel;
    var s3=loadDrillState(); FPGADrill.recordAnswer(s3,q.id,ok); saveDrillState(s3);
    renderPracticeQ();
  };
  var fc=document.getElementById('fillConfirm');
  if(fc) fc.onclick=function(){
    if(DRILL.answered[q.id]) return;
    var v=document.getElementById('fillIn').value; DRILL.userAns[q.id]=v;

    DRILL.answered[q.id]=1;

    renderPracticeQ();
  };
  document.getElementById('prevQ').onclick=function(){ if(i>0){DRILL.idx=i-1; renderPracticeQ();} };
  document.getElementById('nextQ').onclick=function(){ if(i<L.length-1){DRILL.idx=i+1; renderPracticeQ();} else toast('已是最后一题'); };
  document.querySelectorAll('[data-jump]').forEach(function(c){c.onclick=function(){DRILL.idx=+c.dataset.jump; renderPracticeQ();};});
  var cur=document.querySelector('.drill-cell.cur'); if(cur && cur.scrollIntoView) cur.scrollIntoView({block:'nearest'});
}

/* ---- 模拟考（复用 FPGAExam） ---- */
function startMock(kind,cat,seconds){
  var pool=drillPool();
  var paper;
  if(kind==='global'){ paper=FPGADrill.composePool(pool,100,'cat'); }
  else { paper=FPGADrill.composePool(pool.filter(function(q){return q.cat===cat;}),20,'sub'); }
  var scored=paper.map(function(q){ var n=Object.assign({},q); n.pts=(kind==='global'?1:5); return n; });
  DRILL={mode:'mock', kind:kind, cat:cat, paper:FPGAExam.shufflePaper(scored), answers:{}, secondsLeft:seconds||0, submitted:false};
  renderMockQ();
  if(seconds>0) startTimer(seconds);
}
function startTimer(sec){ stopTimer(); DRILL.secondsLeft=sec; tick(); }
function tick(){ var el=document.getElementById('drillTimer');
  if(!DRILL.timerOn) return;
  if(DRILL.secondsLeft<=0){ el.textContent=''; stopTimer(); submitMock(true); return; }
  var m=Math.floor(DRILL.secondsLeft/60), s=DRILL.secondsLeft%60;
  el.textContent='⏱ '+m+':'+(s<10?'0':'')+s;
  DRILL.secondsLeft--; DRILL._t=setTimeout(tick,1000);
}
function stopTimer(){ if(DRILL._t){clearTimeout(DRILL._t);DRILL._t=null;} DRILL.timerOn=false;
  var el=document.getElementById('drillTimer'); if(el) el.textContent=''; }
function renderMockQ(){
  var p=DRILL.paper;
  if(DRILL.submitted){ renderMockResult(); return; }
  DRILL.timerOn=!!DRILL.secondsLeft; if(DRILL.secondsLeft>0) tick();
  var h='<div class="drill-tabs"><button class="btn" data-cancel="1">← 放弃考试</button>'+
    '<span style="color:var(--muted);font-size:13px;margin-left:auto;">作答进度 <b id="mockProg">0</b>/'+p.length+'</span></div>';
  p.forEach(function(q,i){
    h+='<div class="drill-qbox"><div class="meta"><span class="tag">'+typeName(q.type)+'</span><span class="tag">'+esc(q.catName||' · '+(q.sub||''))+'</span></div>';
    h+='<div class="qt">'+(i+1)+'. '+esc(q.q)+'</div>';
    if(q.type==='single'||q.type==='judge'){
      q.options.forEach(function(op,oi){
        var ck=(DRILL.answers[i]===oi)?'checked':'';
        h+='<label class="drill-opt"><input type="radio" name="m'+i+'" data-q="'+i+'" data-oi="'+oi+'" '+ck+'> '+esc(op)+'</label>';
      });
    } else if(q.type==='multi'){
      q.options.forEach(function(op,oi){
        var ck=(DRILL.answers[i]&&DRILL.answers[i].indexOf(oi)>=0)?'checked':'';
        h+='<label class="drill-opt"><input type="checkbox" data-q="'+i+'" data-oi="'+oi+'" '+ck+'> '+String.fromCharCode(65+oi)+'. '+esc(op)+'</label>';
      });
    } else { h+='<input class="exam-fill" data-q="'+i+'" value="'+esc(DRILL.answers[i]||'')+'" placeholder="输入答案">'; }
    h+='</div>';
  });
  h+='<div class="controls" style="justify-content:center;"><button class="btn primary" id="mockSubmit">交卷</button></div>';
  setDrillBody(h);
  document.querySelector('[data-cancel]').onclick=function(){ if(confirm('放弃本次考试？')){stopTimer();drillMockHome();} };
  document.querySelectorAll('input[type=radio]').forEach(function(r){r.onchange=function(){DRILL.answers[+r.dataset.q]=+r.dataset.oi; mockProg();};});
  document.querySelectorAll('input[type=checkbox]').forEach(function(c){c.onchange=function(){
    var i=+c.dataset.q; DRILL.answers[i]=DRILL.answers[i]||[];
    var oi=+c.dataset.oi,k=DRILL.answers[i].indexOf(oi);
    if(c.checked&&k<0)DRILL.answers[i].push(oi); if(!c.checked&&k>=0)DRILL.answers[i].splice(k,1); mockProg();};});
  document.querySelectorAll('input.exam-fill').forEach(function(f){f.oninput=function(){DRILL.answers[+f.dataset.q]=f.value; mockProg();};});
  document.getElementById('mockSubmit').onclick=function(){
    var n=p.filter(function(_,i){var a=DRILL.answers[i];return Array.isArray(a)?a.length>0:(a!==undefined&&a!=='');}).length;
    if(n<p.length && !confirm('还有 '+(p.length-n)+' 题未答，确定交卷？')) return;
    submitMock(false);
  };
  mockProg();
}
function mockProg(){ var p=DRILL.paper,n=0;
  p.forEach(function(_,i){var a=DRILL.answers[i];if(Array.isArray(a)){if(a.length)n++;}else if(a!==undefined&&a!=='')n++;});
  var el=document.getElementById('mockProg'); if(el)el.textContent=n; }
function submitMock(timeup){
  stopTimer();
  var p=DRILL.paper;
  var res=FPGAExam.gradePaper(p,p.map(function(_,i){return DRILL.answers[i];}));
  res.passed = DRILL.kind==='global' ? res.score>=90 : res.score>=85;
  DRILL.submitted=true; DRILL.result=res;
  // 存档
  var ms=loadMockState();
  if(DRILL.kind==='global'){ ms.global=Math.max(ms.global||0,res.score); ms.globalN=(ms.globalN||0)+1; }
  else { ms.specials=ms.specials||{}; ms.specials[DRILL.cat]=Math.max(ms.specials[DRILL.cat]||0,res.score); ms[DRILL.cat+'N']=(ms[DRILL.cat+'N']||0)+1; }
  saveMockState(ms);
  renderMockResult();
}
function renderMockResult(){
  var res=DRILL.result;
  var lv = DRILL.kind==='global' ? FPGADrill.levelGlobal(res.score) : (res.passed?{pass:true,label:'合格通过'}:{pass:false,label:'未达85，再刷一刷'});
  var h='<div class="drill-tabs"><button class="btn" data-back="home">← 首页</button></div>';
  h+='<div class="moc-result" style="text-align:center;"><div class="score-big" style="color:'+(res.passed?'var(--green)':'var(--red)')+'">'+res.score+'</div>';
  h+='<div>'+(res.passed?'<span style="color:var(--green);">✔ 合格</span>':'<span style="color:var(--red);">✘ 未合格</span>')+' — '+esc(lv.label)+'</div></div>';
  h+='<div class="controls" style="justify-content:center;"><button class="btn primary" id="mockAgain">再来一套</button></div>';
  res.detail.forEach(function(d,i){
    h+='<div class="drill-qbox" style="border-color:'+(d.ok?'var(--green)':'var(--red)')+'">'+
      '<b>'+(i+1)+'. '+esc(d.q)+'</b> <span style="color:'+(d.ok?'var(--green)':'var(--red)')+'">['+(d.ok?'✓':'✗')+']</span>'+
      '<div style="font-size:13px;color:var(--amber);">你的作答：'+esc(d.your)+'</div>'+
      '<div style="font-size:13px;color:var(--green);">正确：'+esc(d.correct)+'</div>'+
      '<div style="font-size:12px;color:var(--muted);">解析：'+esc(d.explain)+'</div></div>';
  });
  setDrillBody(h);

  document.getElementById('mockAgain').onclick=function(){ startMock(DRILL.kind,DRILL.cat, DRILL.kind==='global'?2700:900); };
}

/* 轻量 Verilog 高亮：codeHtml 已由 build.py 做过 HTML 转义，这里直接包注释/关键字/数字，不再 esc */
function hlVerilog(code){
  var e = code || '';
  e = e.replace(/(\/\/[^\n]*)/g,'<span class="tok-c">$1</span>');
  e = e.replace(/\b(module|endmodule|input|output|inout|wire|reg|logic|always|assign|begin|end|if|else|posedge|negedge|parameter|localparam|integer|genvar|default|nettype)\b/g,'<span class="tok-k">$1</span>');
  e = e.replace(/\b(\d+'[bhd]?[0-9a-fA-F_]+|\d+)\b/g,'<span class="tok-n">$1</span>');
  return e;
}

function chapterHtml(f){
  var h = '';
  h += '<div class="chapter" id="ch-'+esc(f.chapterId)+'">';
  h += '<h4>'+esc(f.chapterId)+' '+esc(f.title)+'</h4>';
  h += '<p class="sum">'+esc(f.summary)+'</p>';
  if(f.docHtml){
    var dh = f.docHtml.replace(/<table>/g,'<div class="table-wrap"><table>').replace(/<\/table>/g,'</table></div>');
    h += '<div class="doc">'+dh+'</div>';
  }

  // code tabs
  if(f.code && f.code.length){
    h += '<div class="codeblock"><div class="tabs">';
    f.code.forEach(function(c,i){
      h += '<div class="tab'+(i===0?' active':'')+'" data-i="'+i+'">'+esc(c.title||c.file)+'</div>';
    });
    h += '</div>';
    f.code.forEach(function(c,i){
      h += '<pre class="code" data-i="'+i+'" style="display:'+(i===0?'block':'none')+'">'+hlVerilog(c.codeHtml||'')+'</pre>';
    });
    h += '</div>';
  }

  // diagrams (svg raw)
  if(f.diagrams && f.diagrams.length){
    f.diagrams.forEach(function(d){
      h += '<div class="diagram">'+(d.svgRaw||'')+'<div class="cap">'+esc(d.title||'')+'：'+esc(d.caption||'')+'</div></div>';
    });
  }

  // tools
  if(f.tools && f.tools.length){
    h += '<div class="tools">';
    f.tools.forEach(function(t){
      h += '<a href="'+esc(t.url)+'" target="_blank" rel="noopener">'+esc(t.name)+(t.required?'<span class="req">必装</span>':'<span class="req" style="color:#7d8aa5">可选</span>')+'</a>';
    });
    h += '</div>';
  }

  // tasks
  if(f.tasks && f.tasks.length){
    h += '<div style="margin-top:10px;"><div style="font-size:13px;color:var(--muted);">实践任务</div>';
    f.tasks.forEach(function(t){
      h += '<label class="task"><input type="checkbox" class="task-checkbox" id="'+esc(t.id)+'"><label for="'+esc(t.id)+'">'+esc(t.text)+'</label></label>';
    });
    h += '</div>';
  }

  // quiz
  if(f.quiz && f.quiz.length){
    h += '<div style="margin-top:12px;"><div style="font-size:13px;color:var(--muted);">章末小测</div>';
    f.quiz.forEach(function(q,qi){
      h += '<div class="quiz" data-ch="'+esc(f.chapterId)+'" data-qi="'+qi+'">';
      h += '<div class="quid">'+esc(f.chapterId)+' 题'+(qi+1)+'</div>';
      h += '<div class="q">'+esc(q.q)+'</div>';
      q.options.forEach(function(o,oi){
        h += '<div class="opt" data-oi="'+oi+'">'+String.fromCharCode(65+oi)+'. '+esc(o)+'</div>';
      });
      h += '<div class="exp">解析：'+esc(q.explain)+'</div>';
      h += '</div>';
    });
    h += '</div>';
  }
  h += '</div>';
  return h;
}

      return a!==undefined && a!=='';
    }).length;
    if(ansCount<run.paper.length && !confirm('还有 '+(run.paper.length-ansCount)+' 题未答，确定交卷？')) return;
    submitExam(pid);
  });
  box.querySelector('[data-exam-redo]').addEventListener('click',function(){ startExam(pid); });
  updProg(pid);
}
function updProg(pid){
  var run=EXAM_RUN[pid]; var n=0;
  run.paper.forEach(function(_,i){ var a=run.answers[i];
    if(Array.isArray(a)){ if(a.length) n++; } else if(a!==undefined&&a!=='') n++; });
  var el=document.getElementById('exprog-'+pid); if(el) el.textContent=n;
}
function submitExam(pid){
  var run=EXAM_RUN[pid];
  var res=FPGAExam.gradePaper(run.paper, run.paper.map(function(_,i){return run.answers[i];}));
  run.submitted=true; run.result=res;
  // 更新存档
  var st=loadExamState(); st.best=st.best||{}; st.passed=st.passed||{};
  if(res.score > (st.best[pid]||0)) st.best[pid]=res.score;
  var newlyPassed=false;
  if(res.passed && !st.passed[pid]){ st.passed[pid]=true; newlyPassed=true; }
  else if(res.passed){ st.passed[pid]=true; }
  saveExamState(st);
  renderExamResult(pid);
  renderPhaseNav(); renderAppLockState();
  if(newlyPassed){ toast('恭喜通过阶段'+pid+'考卷！已解锁阶段'+(+pid+1)); }
}
function renderExamResult(pid){
  var run=EXAM_RUN[pid]; var res=run.result; var box=document.getElementById('exam-run-'+pid);
  var h='<div style="margin:8px 0;">总分 <span class="score-big" style="color:'+(res.passed?'var(--green)':'var(--red)')+'">'+res.score+'</span> 分 — '+
    (res.passed?'<span style="color:var(--green);">及格通过</span>':'<span style="color:var(--red);">未达 85，可重新抽题再考</span>')+'</div>';
  res.detail.forEach(function(d,i){
    h+='<div class="exam-q" style="border-color:'+(d.ok?'var(--green)':'var(--red)')+'">'+
      '<b>'+(i+1)+'. '+esc(d.q)+'</b> '+
      '<span style="color:'+(d.ok?'var(--green)':'var(--red)')+'">['+(d.ok?'✓':'✗')+']</span>'+
      '<div class="your">你的作答：'+esc(d.your)+'</div>'+
      '<div class="your" style="color:var(--green);">正确答案：'+esc(d.correct)+'</div>'+
      '<div style="font-size:12px;color:var(--amber);margin-top:4px;">解析：'+esc(d.explain)+'</div></div>';
  });
  h+='<div class="controls" style="justify-content:flex-start;"><button class="btn primary" data-exam-redo="'+pid+'">重新抽题再考</button></div>';
  box.innerHTML=h;
  box.querySelector('[data-exam-redo]').addEventListener('click',function(){ startExam(pid); });
}
function renderAppLockState(){
  var d=examDerive();
  PHASES.forEach(function(p){
    var el=document.getElementById('phase-'+p.id); if(!el) return;
    el.classList.toggle('locked', !d.unlocked[p.id]);
  });
  renderPhaseNav();
}

/* ================= 进度 / 徽章 ================= */
function allCheckboxes(){return document.querySelectorAll('.task-checkbox');}
function loadProgress(){
  var saved=null; try{saved=JSON.parse(localStorage.getItem(PROGRESS_KEY)||'null');}catch(e){}
  allCheckboxes().forEach(function(cb){
    if(saved && saved[cb.id]!==undefined) cb.checked=saved[cb.id];
    cb.addEventListener('change',updateProgress);
  });
}
function saveProgress(){
  var p={}; allCheckboxes().forEach(function(cb){p[cb.id]=cb.checked;});
  try{localStorage.setItem(PROGRESS_KEY,JSON.stringify(p));}catch(e){}
}
function updateProgress(){
  var cbs=allCheckboxes(); var total=cbs.length, done=0;
  cbs.forEach(function(cb){ if(cb.checked) done++; if(cb.closest('.task')) cb.closest('.task').classList.toggle('done',cb.checked); });
  var pct = total? Math.round(done/total*100):0;
  document.getElementById('total-progress-bar').style.width=pct+'%';
  document.getElementById('total-progress-text').textContent=pct+'%';
  saveProgress();
  // badges
  PHASES.forEach(function(p){
    var list=document.querySelectorAll('.task-checkbox[id^="task-'+p.id+'-"]');
    var all = list.length>0;
    list.forEach(function(cb){ if(!cb.checked) all=false; });
    document.getElementById('badge-'+p.id).classList.toggle('unlocked',all);
  });
}

/* ================= AI 助教（离线检索 + 可选在线） ================= */
function buildCorpus(){
  var corpus=[];
  (KB.chapters||[]).forEach(function(c){
    var plain = (c.docHtml||'').replace(/<[^>]+>/g,' ');
    (c.cards||[]).forEach(function(card){
      corpus.push({ch:c.chapterId, title:c.title, kind:'card', q:card.q, a:card.a, tags:(card.tags||[]).join(' '), text:card.q+' '+card.a+' '+plain});
    });
    corpus.push({ch:c.chapterId, title:c.title, kind:'chapter', q:c.title, a:c.summary, text:c.title+' '+plain});
  });
  return corpus;
}
var CORPUS = [];
function tokens(s){
  s=String(s).toLowerCase();
  var arr=s.split(/[^a-z0-9\u4e00-\u9fa5]+/).filter(Boolean);
  // 中文 bigram
  var zh=s.match(/[\u4e00-\u9fa5]{2,}/g)||[];
  zh.forEach(function(w){ for(var i=0;i<w.length-1;i++) arr.push(w.substr(i,2)); });
  return uniq(arr);
}
function searchKB(query){
  var ts=tokens(query);
  var best=null,bestScore=0;
  CORPUS.forEach(function(item){
    var text=item.text.toLowerCase(); var sc=0;
    ts.forEach(function(t){ if(text.indexOf(t)>=0) sc+= (t.length>=2?2:1); });
    if(sc>bestScore){bestScore=sc;best=item;}
  });
  return {item:best, score:bestScore};
}
function aiSay(role,text,src){
  var box=document.getElementById('aiMsgs');
  var d=document.createElement('div'); d.className='msg '+role;
  d.textContent=text;
  if(src){var s=document.createElement('span');s.className='src';s.textContent='来源：'+src;d.appendChild(s);}
  box.appendChild(d); box.scrollTop=box.scrollHeight;
}
function offlineAnswer(q){
  var r=searchKB(q);
  if(!r.item || r.score<2){
    aiSay('ai','知识库没有直接命中「'+q+'」。你可以换个问法，或点“抽一题”做练习。我只根据本知识库作答，不会编造。');
    return;
  }
  var it=r.item;
  if(it.kind==='card'){ aiSay('ai', it.q+'\n\n'+it.a, '阶段1 第'+it.ch+'章 · '+it.title); }
  else { aiSay('ai','关于「'+it.q+'」：'+it.a+'（详见该章节讲解）', '第'+it.ch+'章 · '+it.title); }
}
function randomQuiz(){
  var pool=[];
  (KB.chapters||[]).forEach(function(c){ (c.quiz||[]).forEach(function(q){pool.push({ch:c.chapterId,title:c.title,q:q});}); });
  if(!pool.length){aiSay('ai','暂无题库。');return;}
  var pick=pool[Math.floor(Math.random()*pool.length)];
  var opts=pick.q.options.map(function(o,i){return String.fromCharCode(65+i)+'. '+o;}).join('\n');
  aiSay('ai','【'+pick.ch+' · '+pick.title+'】\n'+pick.q.q+'\n\n'+opts+'\n\n（答对与否请到对应章节小测里点选，这里只出题）\n答案：'+String.fromCharCode(65+pick.q.answer)+'。'+pick.q.explain);
}
function loadCfg(){ try{return JSON.parse(localStorage.getItem(CFG_KEY)||'{}');}catch(e){return{};} }
async function onlineAnswer(q){
  var cfg=loadCfg();
  if(!cfg.key || !cfg.base){ offlineAnswer(q); return; }
  var ctx=(KB.chapters||[]).map(function(c){return c.chapterId+' '+c.title+'：'+c.summary;}).join('\n');
  try{
    var base=cfg.base.replace(/\/$/,'');
    var r=await fetch(base+'/chat/completions',{method:'POST',
      headers:{'Content-Type':'application/json','Authorization':'Bearer '+cfg.key},
      body:JSON.stringify({model:cfg.model||'deepseek-chat',
        messages:[{role:'system',content:'你是 FPGA 学习助教，只依据以下知识库大纲作答，不知道就说不知道。\n'+ctx},
                  {role:'user',content:q}], temperature:0.3})});
    if(!r.ok) throw new Error('http '+r.status);
    var j=await r.json();
    aiSay('ai', j.choices[0].message.content.trim(), '在线模型:'+(cfg.model||''));
  }catch(e){ offlineAnswer(q); }
}

/* ================= 启动 ================= */
document.addEventListener('DOMContentLoaded',function(){
  renderBadges();
  renderApp();
  renderPhaseNav();
  CORPUS=buildCorpus();
  loadProgress();
  updateProgress();
  document.getElementById('phase-1').classList.add('open');

  document.getElementById('btnExpandAll').onclick=function(){
    var d=examDerive();
    PHASES.forEach(function(p){ if(d.unlocked[p.id]) document.getElementById('phase-'+p.id).classList.add('open'); });
  };
  document.getElementById('btnCollapseAll').onclick=function(){document.querySelectorAll('.phase').forEach(function(p){p.classList.remove('open');});};
  document.getElementById('btnReset').onclick=function(){
    if(confirm('确定要重置所有学习进度、考试存档与刷题/模考记录吗（含勾选/通关/错题本/收藏/模考最高分）？此操作不可撤销！')){
      localStorage.removeItem(PROGRESS_KEY);
      localStorage.removeItem(EXAM_KEY);
      localStorage.removeItem(DRILL_KEY);
      localStorage.removeItem(MOCK_KEY);
      allCheckboxes().forEach(function(cb){cb.checked=false;});
      renderApp(); renderPhaseNav();
      updateProgress();
    }
  };

  // AI panel
  var panel=document.getElementById('aiPanel');
  // drill
  document.getElementById('btnDrill').onclick=drillOpen;
  document.getElementById('drillClose').onclick=drillClosePanel;
  document.getElementById('aiFab').onclick=function(){panel.classList.toggle('open');
    if(panel.classList.contains('open') && !document.getElementById('aiMsgs').children.length)
      aiSay('ai','你好，我是 FPGA 助教。默认离线检索本知识库作答；点“设置”可填 OpenAI 兼容 Key 在线增强。');};
  document.getElementById('btnQuiz').onclick=randomQuiz;
  document.getElementById('btnSetting').onclick=function(){document.getElementById('aiSettings').classList.add('open');
    var c=loadCfg(); document.getElementById('cfgBase').value=c.base||''; document.getElementById('cfgKey').value=c.key||''; document.getElementById('cfgModel').value=c.model||'';};
  document.getElementById('cfgClose').onclick=function(){document.getElementById('aiSettings').classList.remove('open');};
  document.querySelectorAll('.presets .btn').forEach(function(b){
    b.onclick=function(){document.getElementById('cfgBase').value=b.dataset.base; document.getElementById('cfgModel').value=b.dataset.model;};
  });
  document.getElementById('cfgSave').onclick=function(){
    var c={base:document.getElementById('cfgBase').value.trim(), key:document.getElementById('cfgKey').value.trim(), model:document.getElementById('cfgModel').value.trim()};
    try{localStorage.setItem(CFG_KEY,JSON.stringify(c));}catch(e){}
    document.getElementById('aiSettings').classList.remove('open');
    aiSay('ai','设置已保存到本机浏览器。');
  };
  function send(){var v=document.getElementById('aiInput').value.trim(); if(!v)return;
    aiSay('me',v); document.getElementById('aiInput').value=''; onlineAnswer(v);}
  document.getElementById('aiSend').onclick=send;
  document.getElementById('aiInput').addEventListener('keydown',function(e){if(e.key==='Enter')send();});
});
</script>
